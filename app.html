<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SEEKVERA App — One Global Marketplace</title>
<meta name="description" content="SEEKVERA in one app: global search, AI, marketplace ads, free ad posting, promotions, business plans and payments.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f5;color:#17253a}body{overflow:hidden}.app{height:100%;display:grid;grid-template-rows:auto auto 1fr}.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid #e1e6ec;box-shadow:0 2px 12px rgba(20,32,51,.06);z-index:5}.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.07em}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#30d08b,#5fa5ff);color:#07111f}.title small{display:block;color:#7b8798;font-size:.69rem;font-weight:700;letter-spacing:0}.status{margin-left:auto;display:flex;gap:7px;align-items:center;color:#087a4f;font-size:.76rem;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:#20ad74}.nav{display:flex;gap:7px;padding:8px 10px;background:#f7f9fb;border-bottom:1px solid #e1e6ec;overflow:auto;scrollbar-width:none;z-index:4}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;border:1px solid #d9e0e7;background:#fff;color:#344054;border-radius:11px;padding:9px 13px;font-weight:800;cursor:pointer}.nav button.active{background:#17324f;color:#fff;border-color:#17324f}.nav button.post{background:#20ad74;color:#fff;border-color:#20ad74}.framewrap{position:relative;min-height:0}.view{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#f4f6f8;color:#667085;font-weight:800;z-index:2}.loading.hide{display:none}.bottom{display:none}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;background:#edf8f3;border-radius:999px;color:#087a4f;font-size:.7rem;font-weight:900}.voice-float{position:fixed;right:16px;bottom:84px;z-index:9999;width:54px;height:54px;border:0;border-radius:50%;background:#17324f;color:#fff;font-size:1.45rem;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.26);cursor:pointer}.voice-float.listening{background:#d92d20;animation:voicePulse 1s infinite}@keyframes voicePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media(max-width:700px){.app{grid-template-rows:auto 1fr auto}.top{padding:8px 10px}.title{font-size:.95rem}.title small{font-size:.63rem}.status{display:none}.nav{display:none}.bottom{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));background:#fff;border-top:1px solid #dde3ea;z-index:6}.bottom button{border:0;background:transparent;color:#667085;padding:6px 3px;font-size:.68rem;font-weight:800;cursor:pointer;border-radius:10px}.bottom button span{display:block;font-size:1.18rem;margin-bottom:1px}.bottom button.active{background:#edf7f2;color:#087a4f}.voice-float{right:12px;bottom:76px;width:52px;height:52px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><span class="mark">S</span><div class="title">SEEKVERA<small>Worldwide • One App</small></div></div>
  <span class="badge">AI + Marketplace</span>
  <div class="status"><span class="dot"></span>Unified Web App</div>
</header>
<nav class="nav" aria-label="SEEKVERA app navigation">
  <button class="active" data-page="index.html">🏠 Home & AI</button>
  <button data-page="marketplace.html">🛒 Marketplace</button>
  <button class="post" data-page="post-ad.html">＋ Post an Ad</button>
  <button data-page="seller-plans.html">🚀 Promote / Business / Pay</button>
</nav>
<div class="framewrap">
  <div class="loading" id="loading">Opening SEEKVERA…</div>
  <iframe class="view" id="view" title="SEEKVERA" src="index.html?v=voice2" allow="microphone"></iframe>
</div>
<nav class="bottom" aria-label="Mobile navigation">
  <button class="active" data-page="index.html"><span>🏠</span>Home</button>
  <button data-page="marketplace.html"><span>🛒</span>Market</button>
  <button data-page="post-ad.html"><span>＋</span>Post Ad</button>
  <button data-page="seller-plans.html"><span>🚀</span>Promote</button>
</nav>
<button class="voice-float" id="voiceFloat" type="button" aria-label="Voice input" title="Speak to SEEKVERA">🎤</button>
</div>
<script>
const labels={
 en:['Worldwide • One App','AI + Marketplace','Unified Web App','Home & AI','Marketplace','Post an Ad','Promote / Business / Pay','Home','Market','Post Ad','Promote','Opening SEEKVERA…'],
 ar:['عالمي • تطبيق واحد','الذكاء الاصطناعي + السوق','تطبيق عالمي','الرئيسية والذكاء الاصطناعي','السوق','أضف إعلاناً','الترويج والأعمال والدفع','الرئيسية','السوق','إعلان','الترويج','جارٍ فتح التطبيق…'],
 zh:['全球 • 一个应用','AI + 市场','全球应用','首页与 AI','市场','发布广告','推广 / 商务 / 支付','首页','市场','发布','推广','正在打开应用…'],
 ja:['世界中 • ひとつのアプリ','AI とマーケット','グローバルアプリ','ホームと AI','マーケット','広告を掲載','宣伝 / ビジネス / 支払い','ホーム','市場','掲載','宣伝','アプリを開いています…'],
 fr:['Monde entier • Une appli','IA + Marché','Application mondiale','Accueil et IA','Marché','Publier une annonce','Promotion / Entreprises / Paiement','Accueil','Marché','Publier','Promouvoir','Ouverture de l’application…'],
 es:['Mundo • Una aplicación','IA + Mercado','Aplicación global','Inicio e IA','Mercado','Publicar anuncio','Promoción / Negocios / Pago','Inicio','Mercado','Publicar','Promocionar','Abriendo la aplicación…'],
 hi:['दुनिया भर में • एक ऐप','AI + बाज़ार','वैश्विक ऐप','होम और AI','बाज़ार','विज्ञापन डालें','प्रचार / व्यवसाय / भुगतान','होम','बाज़ार','पोस्ट','प्रचार','ऐप खुल रहा है…']
};
function appLanguage(){
 const saved=localStorage.getItem('seekvera_lang');
 const available=new Set(Object.keys(labels));
 if(saved && available.has(saved)) return saved;
 const preferred=navigator.languages?.length?navigator.languages:[navigator.language||'en'];
 for(const locale of preferred){const code=locale.toLowerCase().split('-')[0];if(available.has(code))return code}
 return 'en';
}
function translateApp(){
 const code=appLanguage(), t=labels[code];
 document.documentElement.lang=code;document.documentElement.dir=code==='ar'?'rtl':'ltr';
 document.querySelector('.title small').textContent=t[0];document.querySelector('.badge').textContent=t[1];
 document.querySelector('.status').lastChild.textContent=t[2];document.getElementById('loading').textContent=t[11];
 document.querySelectorAll('.nav button').forEach((b,i)=>b.textContent=['🏠 ','🛒 ','＋ ','🚀 '][i]+t[3+i]);
 document.querySelectorAll('.bottom button').forEach((b,i)=>b.lastChild.textContent=t[7+i]);
}
translateApp();window.addEventListener('storage',e=>{if(e.key==='seekvera_lang')translateApp()});

const view=document.getElementById('view'),loading=document.getElementById('loading'),voiceFloat=document.getElementById('voiceFloat');
const buttons=[...document.querySelectorAll('[data-page]')];
const buildTag='20260921-voice2';
function versioned(page){return page+(page.includes('?')?'&':'?')+'v='+buildTag}
function openPage(page,push=true){
  loading.classList.remove('hide');
  view.src=versioned(page);
  buttons.forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  voiceFloat.style.display=page==='index.html'?'grid':'none';
  if(push) history.replaceState(null,'','#'+page.replace('.html',''));
}
buttons.forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));

const voiceLangMap={en:'en-US',ar:'ar-SA',fr:'fr-FR',zh:'zh-CN',es:'es-ES',hi:'hi-IN',pt:'pt-BR',de:'de-DE',ja:'ja-JP',ko:'ko-KR',id:'id-ID',tr:'tr-TR',ru:'ru-RU',ur:'ur-PK',bn:'bn-BD',vi:'vi-VN',it:'it-IT',sw:'sw-KE',th:'th-TH'};
function injectVoice(){
  try{
    const doc=view.contentDocument,win=view.contentWindow;
    if(!doc||!win)return;
    const form=doc.getElementById('aiForm'),input=doc.getElementById('aiInput');
    if(!form||!input||doc.getElementById('seekveraVoiceBtn'))return;
    if(!doc.getElementById('seekveraVoiceStyle')){
      const style=doc.createElement('style');style.id='seekveraVoiceStyle';
      style.textContent='#seekveraVoiceBtn{width:46px;min-width:46px;padding:0!important;background:#17324f!important;color:#fff!important;font-size:1.15rem!important;border-radius:11px!important;display:grid!important;place-items:center!important}#seekveraVoiceBtn.listening{background:#d92d20!important;animation:seekveraPulse 1s infinite}@keyframes seekveraPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}';
      doc.head.appendChild(style);
    }
    const btn=doc.createElement('button');btn.type='button';btn.id='seekveraVoiceBtn';btn.textContent='🎤';btn.title='Speak / Voice input';btn.setAttribute('aria-label','Speak to SEEKVERA AI');
    const send=form.querySelector('button[type="submit"]');if(send)form.insertBefore(btn,send);else form.appendChild(btn);
    btn.addEventListener('click',()=>startVoice(btn));
  }catch(e){console.warn('SEEKVERA voice injection unavailable',e)}
}
let activeRecognition=null;
function startVoice(sourceBtn=voiceFloat){
  if(activeRecognition){try{activeRecognition.stop()}catch(e){}return}
  let doc,win,input;
  try{doc=view.contentDocument;win=view.contentWindow;if(!doc||!win)throw new Error('frame');
    const launch=doc.getElementById('aiLaunch');if(launch&&!doc.getElementById('aiChat')?.classList.contains('open'))launch.click();
    input=doc.getElementById('aiInput');if(!input)throw new Error('input');
  }catch(e){alert('SEEKVERA AI is still loading. Please try the microphone again in a moment.');return}
  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition||win.SpeechRecognition||win.webkitSpeechRecognition;
  if(!Recognition){alert('Voice input is not supported here. Please open SEEKVERA in Google Chrome on Android or desktop.');return}
  const recognition=new Recognition();activeRecognition=recognition;
  const selected=doc.getElementById('lang')?.value||localStorage.getItem('seekvera_lang')||'en';
  recognition.lang=voiceLangMap[selected]||navigator.language||'en-US';recognition.interimResults=true;recognition.continuous=false;recognition.maxAlternatives=1;
  let finalText='';
  const setListening=on=>{[voiceFloat,sourceBtn,doc.getElementById('seekveraVoiceBtn')].filter(Boolean).forEach(b=>{b.classList.toggle('listening',on);b.textContent=on?'⏹':'🎤'})};
  recognition.onstart=()=>{setListening(true);input.focus()};
  recognition.onresult=e=>{let speech='';for(let i=0;i<e.results.length;i++){speech+=e.results[i][0].transcript+' ';if(e.results[i].isFinal)finalText+=e.results[i][0].transcript+' '}input.value=speech.trim();input.dispatchEvent(new Event('input',{bubbles:true}))};
  recognition.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')alert('Microphone permission is blocked. Allow microphone access for SEEKVERA in Chrome, then tap 🎤 again.');else if(e.error!=='aborted'&&e.error!=='no-speech')alert('Voice input could not start. Please try again.')};
  recognition.onend=()=>{setListening(false);activeRecognition=null;if((finalText.trim()||input.value.trim())&&doc.getElementById('aiForm')){setTimeout(()=>doc.getElementById('aiForm').requestSubmit(),120)}};
  try{recognition.start()}catch(e){setListening(false);activeRecognition=null;alert('Voice input could not start. Please try again.')}
}
voiceFloat.addEventListener('click',()=>startVoice(voiceFloat));
view.addEventListener('load',()=>{loading.classList.add('hide');injectVoice();setTimeout(injectVoice,350);setTimeout(injectVoice,1200)});
const hash=location.hash.replace('#','');
const map={home:'index.html',index:'index.html',marketplace:'marketplace.html','post-ad':'post-ad.html','seller-plans':'seller-plans.html',promote:'seller-plans.html'};
if(hash&&map[hash]) openPage(map[hash],false);
</script>
</body>
</html>
