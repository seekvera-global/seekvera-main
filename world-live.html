const text={en:{title:'Watch the world live',intro:'Explore public webcam networks. Country coverage and camera availability vary.',country:'Country or territory',place:'City or area (optional)',world:'Worldwide',external:'These links open the provider’s webcam directory. Your selected location is not yet passed to the provider. Playback and availability are managed by the provider.',safety:'Safety and live status',notice:'A camera shows only its field of view. A quiet image does not confirm that an area is safe. Check official local alerts for earthquakes, weather and conflict. SEEKVERA does not yet monitor stream status or provide emergency alerts on this page.',selection:'Selected location: '},ar:{title:'شاهد العالم لايف',intro:'استكشف شبكات الكاميرات العامة. التغطية وتوفر الكاميرات يختلفان حسب المكان.',country:'الدولة أو الإقليم',place:'المدينة أو المنطقة (اختياري)',world:'العالم',external:'تفتح هذه الروابط دليل الكاميرات لدى المصدر. لا يتم إرسال المكان الذي اخترته إلى المصدر بعد. تشغيل البث وتوفره مسؤولية المصدر.',safety:'الأمان وحالة البث',notice:'الكاميرا تعرض المكان المقابل لها فقط. هدوء الصورة لا يؤكد أمان المنطقة. راجع التنبيهات المحلية الرسمية عن الزلازل والطقس والنزاعات. هذه الصفحة لا تراقب حالة البث ولا توفر تنبيهات طوارئ بعد.',selection:'المكان المختار: '}};
const country=document.getElementById('country'),language=document.getElementById('language'),place=document.getElementById('place');
const stored=localStorage.getItem('seekvera_lang')||navigator.language;
language.value=stored.startsWith('ar')?'ar':'en';
let selected=localStorage.getItem('seekvera_country')||'';
function render(){const l=language.value,t=text[l];document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.querySelectorAll('[data-key]').forEach(e=>e.textContent=t[e.dataset.key]);const names=new Intl.DisplayNames([l],{type:'region'});country.replaceChildren(new Option(t.world,''));codes.map(c=>[c,names.of(c)]).sort((a,b)=>a[1].localeCompare(b[1],l)).forEach(([c,n])=>country.add(new Option(n,c)));country.value=codes.includes(selected)?selected:'';summary()}
function summary(){const t=text[language.value];document.getElementById('selection').textContent=t.selection+country.selectedOptions[0].textContent+(place.value.trim()?' · '+place.value.trim():'')}
country.addEventListener('change',()=>{selected=country.value;summary()});place.addEventListener('input',summary);language.addEventListener('change',render);render();
