name: SEEKVERA IndexNow

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - '15ae2ee9fb6577fed951a6a9cee172bc.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for published ownership key
        shell: bash
        run: |
          set -euo pipefail
          key_url='https://seekvera-global.github.io/seekvera-main/15ae2ee9fb6577fed951a6a9cee172bc.txt'
          for i in $(seq 1 48); do
            if curl -fsS --max-time 15 "$key_url" | grep -q '15ae2ee9fb6577fed951a6a9cee172bc'; then
              exit 0
            fi
            sleep 5
          done
          echo 'IndexNow key is not live yet'
          exit 1
      - name: Submit changed URLs to IndexNow
        shell: python
        run: |
          import json, subprocess, urllib.request
          from pathlib import Path
          base='https://seekvera-global.github.io/seekvera-main'
          key='15ae2ee9fb6577fed951a6a9cee172bc'
          if '${{ github.event_name }}' == 'workflow_dispatch':
              import re
              text=Path('sitemap.xml').read_text(encoding='utf-8')
              urls=re.findall(r'<loc>(.*?)</loc>', text)
          else:
              try:
                  changed=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'], text=True).splitlines()
              except Exception:
                  changed=[]
              urls=[]
              for path in changed:
                  if path=='index.html':
                      urls.append(base+'/')
                  elif path.endswith('.html') and '/' not in path:
                      urls.append(base+'/'+path)
                  elif path in ('sitemap.xml','robots.txt','15ae2ee9fb6577fed951a6a9cee172bc.txt'):
                      urls.append(base+'/')
          urls=list(dict.fromkeys(urls))
          if not urls:
              print('No public URL changed; nothing to submit.')
              raise SystemExit(0)
          payload=json.dumps({
              'host':'seekvera-global.github.io',
              'key':key,
              'keyLocation':base+'/'+key+'.txt',
              'urlList':urls
          }).encode()
          req=urllib.request.Request('https://api.indexnow.org/indexnow',data=payload,headers={'Content-Type':'application/json; charset=utf-8'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r:
              print('IndexNow status:',r.status,'URLs:',len(urls))
