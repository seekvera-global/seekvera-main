name: R125 hourly candidate resume
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/r125-hourly-candidate-resume.yml]
permissions:
  contents: write
concurrency:
  group: r125-locale-candidate-resume
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/r125-locale-candidates-20261008
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Babel==2.18.0 beautifulsoup4==4.15.0
      - name: Use current audited resume tools
        run: |
          git fetch origin main
          git show origin/main:worker.js > /tmp/seekvera-validation-worker.js
          for file in tools/build_current_locale_delta.py tools/audit_locale_candidates.py tools/audit-candidate-scripts.cjs; do
            git show "origin/main:$file" > "$file"
          done
      - name: Resume public UI candidates
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=15s 40m python tools/build_current_locale_delta.py --stage docs/locale-candidates-20261008 2>&1 | tee docs/locale-candidates-20261008/resume-latest.log
          code=${PIPESTATUS[0]}
          echo "$code" > docs/locale-candidates-20261008/resume-exit-code.txt
          exit 0
      - name: Audit all saved candidates
        if: always()
        env:
          WORKER_VALIDATOR_SOURCE: /tmp/seekvera-validation-worker.js
        run: |
          PYTHONPATH=. python tools/audit_locale_candidates.py --stage docs/locale-candidates-20261008
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r125-resumable-candidates
          path: docs/locale-candidates-20261008/
          retention-days: 30
      - name: Save progress without publishing
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/locale-candidates-20261008/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Checkpoint resumed locale candidates [skip ci]'
          git push origin HEAD:work/r125-locale-candidates-20261008
