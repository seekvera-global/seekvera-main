name: Connect SEEKVERA Request Anything to Supabase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-supabase-requests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect request form to Supabase
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          text=text.replace(
            "connect-src 'self' https://seekvera-main.seekvera-global.workers.dev https://text.pollinations.ai;",
            "connect-src 'self' https://seekvera-main.seekvera-global.workers.dev https://text.pollinations.ai https://nrdpyydfrpmqedtzmbyw.supabase.co;"
          )

          old='''document.getElementById("requestForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const request={country:requestCountry.value.trim(),city:requestCity.value.trim(),type:requestType.value,budget:requestBudget.value.trim(),date:requestDate.value,contact:requestContact.value.trim(),description:requestDescription.value.trim(),website:"",created:new Date().toISOString()};
 localStorage.setItem("seekvera_last_request",JSON.stringify(request));
 const success=document.getElementById("requestSuccess");
 const submit=e.currentTarget.querySelector("button[type=submit],button.primary");
 const oldLabel=submit.textContent;submit.disabled=true;submit.textContent="Saving...";
 try{
  const apiBase=location.hostname.endsWith("workers.dev")?"":"https://seekvera-main.seekvera-global.workers.dev";
  const res=await fetch(`${apiBase}/api/request`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(request)});
  const data=await res.json().catch(()=>({}));
  if(!res.ok||!data.ok||!data.id)throw new Error(data.error||"Storage unavailable");
  success.textContent=`Request saved securely. Reference: ${data.id}`;
  success.classList.add("show");
  e.currentTarget.reset();
 }catch(err){
  console.warn("SEEKVERA request storage unavailable; using email fallback",err);
  success.textContent="Secure storage is not connected yet. Your email app will open so the request is not lost.";
  success.classList.add("show");
  const subject=encodeURIComponent(`SEEKVERA request: ${request.type} - ${request.country}`);
  const body=encodeURIComponent(`Country: ${request.country}\\nCity/Area: ${request.city}\\nType: ${request.type}\\nBudget: ${request.budget}\\nDate: ${request.date}\\nContact: ${request.contact}\\n\\nRequest:\\n${request.description}`);
  window.location.href=`mailto:seekvera.global@gmail.com?subject=${subject}&body=${body}`;
 }finally{
  submit.disabled=false;submit.textContent=oldLabel;
 }
});'''

          new='''document.getElementById("requestForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const reference=`SV-${new Date().toISOString().slice(0,10).replaceAll("-","")}-${crypto.getRandomValues(new Uint32Array(1))[0].toString(16).toUpperCase().padStart(8,"0")}`;
 const request={
  reference,
  country:requestCountry.value.trim(),
  city:requestCity.value.trim(),
  request_type:requestType.value,
  budget:requestBudget.value.trim(),
  needed_date:requestDate.value||null,
  contact:requestContact.value.trim(),
  description:requestDescription.value.trim(),
  source:"seekvera-web"
 };
 localStorage.setItem("seekvera_last_request",JSON.stringify(request));
 const success=document.getElementById("requestSuccess");
 const submit=e.currentTarget.querySelector("button[type=submit],button.primary");
 const oldLabel=submit.textContent;submit.disabled=true;submit.textContent="Saving...";
 try{
  const endpoint="https://nrdpyydfrpmqedtzmbyw.supabase.co/rest/v1/seekvera_requests";
  const key="sb_publishable_tqqPQxqdNowIsSlJz4bW5w_kHOC905o";
  const res=await fetch(endpoint,{method:"POST",headers:{"content-type":"application/json","apikey":key,"Authorization":`Bearer ${key}`,"Prefer":"return=minimal"},body:JSON.stringify(request)});
  if(!res.ok){const detail=await res.text();throw new Error(detail||`HTTP ${res.status}`)}
  success.textContent=`Request saved securely. Reference: ${reference}`;
  success.classList.add("show");
  e.currentTarget.reset();
 }catch(err){
  console.error("SEEKVERA request save failed",err);
  success.textContent="We could not save this request right now. Please try again.";
  success.classList.add("show");
 }finally{
  submit.disabled=false;submit.textContent=oldLabel;
 }
});'''

          if old not in text:
            raise SystemExit('Current Request Anything handler not found; refusing unsafe replacement')
          text=text.replace(old,new,1)
          text=text.replace(
            'No payment is required. SEEKVERA will save the request when secure storage is connected; email fallback remains available.',
            'No payment is required. Your request is saved securely and receives a reference number.'
          )
          p.write_text(text,encoding='utf-8')

      - name: Validate Supabase request integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'nrdpyydfrpmqedtzmbyw.supabase.co/rest/v1/seekvera_requests' index.html
          grep -q 'sb_publishable_' index.html
          grep -q 'Request saved securely. Reference:' index.html
          grep -q 'https://nrdpyydfrpmqedtzmbyw.supabase.co' index.html
          ! grep -q 'using email fallback' index.html
          echo 'Supabase Request Anything integration validated.'

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add index.html
          git commit -m 'Connect Request Anything to secure Supabase storage'
          git push
