name: Connect SEEKVERA requests to Supabase

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/connect-supabase-requests.yml'
      - 'scripts/connect_supabase_requests.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage
        run: python3 scripts/connect_supabase_requests.py
      - name: Validate
        run: |
          grep -q 'nrdpyydfrpmqedtzmbyw.supabase.co/rest/v1/seekvera_requests' index.html
          grep -q 'sb_publishable_' index.html
          grep -q 'Request saved securely. Reference:' index.html
          grep -q 'https://nrdpyydfrpmqedtzmbyw.supabase.co' index.html
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add index.html
          git commit -m 'Connect Request Anything to Supabase'
          git push
