name: Compact SEEKVERA Marketplace Home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-home-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make homepage compact and marketplace-first
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'SEEKVERA compact-home-v6'
          if marker in text:
              raise SystemExit(0)
          css = r'''
          <style>
          /* SEEKVERA compact-home-v6: keep the marketplace in the first screen instead of a long landing page */
          #common-searches,#everything,#request-anything,main.market-main>section.section:not(#results),footer.foot{display:none!important}
          .country-feature,.market-center>.note{display:none!important}
          .market-shell{padding-top:10px!important;gap:12px!important}
          .market-hero{padding:13px!important}
          .market-hero h1{font-size:clamp(1.45rem,2.7vw,2.5rem)!important;margin:5px 0 2px!important}
          .market-hero .lead{font-size:.88rem!important}
          .search.market-search{margin-top:10px!important}
          .market-chips{padding-top:8px!important}
          .market-section{margin-top:10px!important;padding:11px!important}
          .section-head{margin-bottom:8px!important}.section-head h2{font-size:1.05rem!important}
          .market-grid{gap:8px!important}.market-thumb{height:86px!important}.market-card-body{padding:7px 9px 8px!important}
          .market-card h3{font-size:.86rem!important}.market-card p{font-size:.68rem!important}.market-meta{margin-top:5px!important;font-size:.62rem!important}
          .market-left,.market-right{top:70px!important;padding:10px!important}.category-list a{padding:7px!important;font-size:.82rem!important}.cat-ico{width:24px!important;height:24px!important}
          .ai-market{padding:12px!important;margin-bottom:8px!important}.quick-box a{padding:7px 3px!important}
          #results.results.show{display:block!important;margin:10px auto 0!important;max-width:980px!important;padding:10px!important}
          @media(min-width:781px){
            .market-shell{grid-template-columns:205px minmax(0,1fr) 255px!important}
            .market-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important}
          }
          @media(max-width:780px){
            main.market-main{padding:0 8px 10px!important}
            .top{padding:8px 10px!important}
            .market-shell{padding-top:7px!important;gap:7px!important}
            .market-left{padding:6px!important;border-radius:12px!important}
            .category-list a{padding:6px 8px!important;font-size:.75rem!important}
            .market-hero{padding:10px!important;border-radius:14px!important}
            .market-kicker{font-size:.58rem!important}.market-hero h1{font-size:1.45rem!important}.market-hero .lead{font-size:.76rem!important}
            .search.market-search{margin-top:8px!important}.search.market-search input{padding:10px!important;font-size:.86rem!important}.search.market-search button[type=submit]{padding:0 10px!important}
            .market-chips{padding-top:6px!important}.market-chips a{padding:5px 8px!important;font-size:.68rem!important}
            .market-section{margin-top:7px!important;padding:8px!important;border-radius:14px!important}
            .section-head h2{font-size:.94rem!important}.section-head span{display:none!important}
            .market-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important}
            .market-thumb{height:66px!important}.market-card-body{padding:5px 7px 6px!important}.market-card h3{font-size:.77rem!important}.market-card p{display:none!important}.market-meta{font-size:.56rem!important;margin-top:3px!important}
          }
          </style>
          '''
          text = text.replace('</head>', css + '\n</head>', 1)
          text = text.replace('data-build="seekvera-marketplace-v5"','data-build="seekvera-marketplace-v6"')
          p.write_text(text, encoding='utf-8')
      - name: Commit compact homepage
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "seekvera-global"
          git config user.email "seekvera.global@gmail.com"
          git add index.html
          git commit -m "Compact SEEKVERA homepage into marketplace dashboard"
          git push
