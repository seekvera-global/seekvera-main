name: R56 persist final global AI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r56-persist-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-audit-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce R56 release
        shell: bash
        run: |
          set -euo pipefail
          python tools/r56_global_ai_core.py
          python tools/r56b_worker_context.py
          python tools/r56c_immediate_controls.py
          python tools/r56d_language_parser_fix.py
          python tools/r56e_explicit_code_parser_fix.py
          node --check r31-ui-polish.js
          node --check voice-ai.js
          node --check worker-r31.js
          node --check r24-ai-controller.js
          node --check sw.js
          echo 'R56 REPRODUCED'

      - name: Deploy R56 final
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Final browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > final.mjs <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage();
          await p.goto('https://seekveraglobal.com/?r56persist='+Date.now(),{waitUntil:'networkidle',timeout:60000});
          await p.waitForFunction(()=>window.SEEKVERA_R31&&window.SEEKVERA_VOICE_AI&&window.SEEKVERA_R24_CONTROLLER&&window.SEEKVERA_LOCALE_R15&&document.querySelector('#aiChatForm'),null,{timeout:30000});
          const coverage=await p.evaluate(()=>({languages:SEEKVERA_R24_CONTROLLER.languages.length,countries:Object.keys(SEEKVERA_LOCALE_R15.profiles||{}).length}));
          assert.ok(coverage.languages>=98,JSON.stringify(coverage));assert.ok(coverage.countries>=248,JSON.stringify(coverage));
          const d=await p.evaluate(()=>({fr:SEEKVERA_R24_CONTROLLER.detectControls('change language to French'),ar:SEEKVERA_R24_CONTROLLER.detectControls('غير اللغة إلى الفرنسية'),ja:SEEKVERA_R24_CONTROLLER.detectControls('change language to Japanese'),to:SEEKVERA_R24_CONTROLLER.detectControls('change language to Tongan')}));
          assert.equal(d.fr.language,'fr');assert.equal(d.ar.language,'fr');assert.equal(d.ja.language,'ja');assert.equal(d.to.language,'to');
          const mic=await p.evaluate(()=>{let n=0;const old=SEEKVERA_VOICE_AI.start;SEEKVERA_VOICE_AI.start=()=>n++;document.querySelector('#aiChatMic').click();SEEKVERA_VOICE_AI.start=old;return n});assert.equal(mic,1);
          await p.fill('#aiChatInput','change country to France');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p.waitForFunction(()=>document.querySelector('#country')?.value==='FR',null,{timeout:3000});
          await p.fill('#aiChatInput','change language to French');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p.waitForFunction(()=>document.querySelector('#lang')?.value==='fr'&&localStorage.getItem('seekvera_lang')==='fr',null,{timeout:3000});
          await p.fill('#aiChatInput','change country to Nigeria');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p.waitForFunction(()=>document.querySelector('#country')?.value==='NG',null,{timeout:3000});
          const voice=await p.evaluate(()=>{let fired=0;try{speechSynthesis.speak=()=>fired++}catch{}SEEKVERA_VOICE_AI.markVoiceReply();window.dispatchEvent(new CustomEvent('seekvera:ai-response',{detail:{text:'Réponse vocale de test',language:'fr'}}));return fired});assert.ok(voice>=1,'TTS did not fire');
          await p.fill('#aiChatInput','I am looking for a hotel manager job in Nigeria');const t=Date.now();await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p.waitForURL(/\/jobs(?:\.html)?\?/,{timeout:10000});const navMs=Date.now()-t,u=new URL(p.url());assert.ok(['/jobs','/jobs.html'].includes(u.pathname),p.url());assert.equal(u.searchParams.get('country'),'NG');assert.ok((u.searchParams.get('q')||'').toLowerCase().includes('hotel manager'));assert.equal(await p.evaluate(()=>sessionStorage.getItem('seekvera_ai_intent')),'jobs');
          console.log('R56 FINAL ACCEPTANCE PASS',JSON.stringify({coverage,d,mic,voice,navMs,url:p.url()}));await b.close();
          JS
          node final.mjs

      - name: Persist R56 source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add -- r31-ui-polish.js voice-ai.js worker-r31.js r24-ai-controller.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Persist R56 global AI auto-routing voice and locale controls'
            git push origin HEAD:main
          fi
          echo 'R56 FINAL RELEASE PERSISTED'
