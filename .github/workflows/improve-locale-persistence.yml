name: Improve locale persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-locale-persistence.yml'

permissions:
  contents: write

jobs:
  improve-locale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Improve country and language defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = dedent('''
          document.getElementById("lang").addEventListener("change",e=>applyLang(e.target.value));
          document.getElementById("country").addEventListener("change",renderCountryPopular);
          const saved=localStorage.getItem("seekvera_lang")||"en";document.getElementById("lang").value=saved;applyLang(saved);
          ''').strip()

          new = dedent('''
          const langEl=document.getElementById("lang"),countryEl=document.getElementById("country"),requestCountryEl=document.getElementById("requestCountry");
          function detectLocaleCountry(){
           const tag=(navigator.language||"").replace("_","-").split("-");
           const region=(tag.length>1?tag[tag.length-1]:"").toUpperCase();
           return region&&countryEl.querySelector(`option[value="${region}"]`)?region:"NG";
          }
          const savedCountry=localStorage.getItem("seekvera_country")||detectLocaleCountry();
          if(countryEl.querySelector(`option[value="${savedCountry}"]`))countryEl.value=savedCountry;
          if(requestCountryEl)requestCountryEl.value=countryEl.options[countryEl.selectedIndex].text;
          langEl.addEventListener("change",e=>applyLang(e.target.value));
          countryEl.addEventListener("change",()=>{
           localStorage.setItem("seekvera_country",countryEl.value);
           if(requestCountryEl)requestCountryEl.value=countryEl.options[countryEl.selectedIndex].text;
           renderCountryPopular();
          });
          const supportedLangs=[...langEl.options].map(o=>o.value),browserLang=(navigator.language||"en").toLowerCase().split("-")[0],storedLang=localStorage.getItem("seekvera_lang");
          const saved=(storedLang&&supportedLangs.includes(storedLang))?storedLang:(supportedLangs.includes(browserLang)?browserLang:"en");
          langEl.value=saved;applyLang(saved);
          ''').strip()

          if old not in text:
              raise SystemExit('Expected locale block not found; refusing unsafe patch')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit locale improvement
        shell: bash
        run: |
          git config user.name "seekvera-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-detect and remember country and language"
          git push
