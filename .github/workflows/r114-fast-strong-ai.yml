name: R115 production certification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r114-fast-strong-ai.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy latest production source
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
      - name: Verify live R115 voice asset
        run: |
          for i in $(seq 1 20); do
            H=$(curl -fsS --max-time 8 "https://seekveraglobal.com/?r115=$(date +%s)" || true)
            if echo "$H" | grep -q 'voice-ai.js?v=20260929-r115-fast-voice'; then
              V=$(curl -fsS --max-time 8 "https://seekveraglobal.com/voice-ai.js?v=20260929-r115-fast-voice")
              echo "$V" | grep -F "window.__seekveraVoiceMode='20260929-r115-fast-voice'"
              echo "$V" | grep -F "to=setTimeout(()=>ctl.abort(),7000)"
              echo "$V" | grep -F "engine:'native-shadow-fast-fallback'"
              echo "$V" | grep -F "seekvera:tts-request"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify live AI response speed
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          for msg in ['مرحبا كيفك؟','I need a hotel in Paris']:
              body=json.dumps({'message':msg,'country':'Worldwide','language':'auto','fast':True}).encode()
              req=urllib.request.Request('https://seekveraglobal.com/api/ai',data=body,headers={'content-type':'application/json'},method='POST')
              t=time.monotonic()
              with urllib.request.urlopen(req,timeout=9) as r: d=json.loads(r.read())
              sec=time.monotonic()-t
              assert d.get('ok') and str(d.get('response','')).strip(),d
              assert sec<8.5,(sec,d)
              print('AI_PASS',round(sec,2),d.get('model'),str(d.get('response'))[:120])
          PY
      - name: Browser chat and voice response path
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > live.mjs <<'JS'
          import{chromium}from'playwright';import assert from'node:assert/strict';
          const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844},locale:'ar-LB',userAgent:'Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'});
          await p.goto('https://seekveraglobal.com/?r115='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForFunction(()=>window.SEEKVERA_VOICE_AI&&window.SEEKVERA_R31?.submitAI&&document.querySelector('#aiChatInput'),null,{timeout:20000});
          const st=await p.evaluate(()=>({mode:window.__seekveraVoiceMode,speaker:!!document.querySelector('#aiChatSpeaker')}));assert(st.mode.includes('r115')&&st.speaker,JSON.stringify(st));
          await p.evaluate(()=>{window.__tts=[];window.addEventListener('seekvera:tts-request',e=>window.__tts.push(e.detail));localStorage.setItem('seekvera_voice_mode','1');localStorage.setItem('seekvera_voice_muted','0')});
          const n=await p.locator('#aiMessages .ai-msg.bot:not(.thinking)').count(),t=Date.now();await p.fill('#aiChatInput','مرحبا كيفك؟');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());
          await p.waitForFunction(x=>document.querySelectorAll('#aiMessages .ai-msg.bot:not(.thinking)').length>x,n,{timeout:9000});const ms=Date.now()-t,text=await p.locator('#aiMessages .ai-msg.bot:not(.thinking)').last().innerText();
          await p.waitForFunction(()=>window.__tts?.length>0,null,{timeout:4000});const q=await p.evaluate(()=>window.__tts.at(-1));assert(ms<9000&&text.trim()&&q?.text,JSON.stringify({ms,text,q}));console.log('BROWSER_PASS',JSON.stringify({ms,text,q,st}));await b.close();
          JS
          node live.mjs
