name: R76 Cloudflare 429 diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-cloudflare-429-diagnostic.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect custom domain and Worker responses
        shell: bash
        run: |
          set +e
          for u in 'https://seekveraglobal.com/' 'https://seekveraglobal.com/api/health' 'https://seekvera-main.seekvera-global.workers.dev/' 'https://seekvera-main.seekvera-global.workers.dev/api/health'; do
            echo "===== $u ====="
            curl -sS --max-time 15 -A 'Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' -D /tmp/h -o /tmp/b "$u?diag=${GITHUB_RUN_ID}"
            echo '--- HEADERS ---'; cat /tmp/h
            echo '--- BODY ---'; head -c 1500 /tmp/b; echo
          done
