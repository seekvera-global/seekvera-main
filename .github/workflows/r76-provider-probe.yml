name: R76 translation provider probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-provider-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe guarded Cloudflare AI bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request
          U='https://seekveraglobal.com/api/__r76_translate_builder'
          for lang in ['sr','kl','rm']:
              body=json.dumps({'target':lang,'text':'Find jobs and hotels near me'}).encode()
              req=urllib.request.Request(U,data=body,headers={'content-type':'application/json','user-agent':'SEEKVERA-R76-HYBRID'},method='POST')
              with urllib.request.urlopen(req,timeout=50) as r:d=json.loads(r.read().decode())
              print('BRIDGE',lang,d,flush=True)
              t=str(d.get('translation') or '').strip()
              assert d.get('ok') and t and t.lower()!='find jobs and hotels near me'
          print('R76_BRIDGE_3_LANG_PASS')
          PY
