name: R76 translation provider probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-provider-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe live AI while Cloudflare AI quota is exhausted
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request,time
          U='https://seekveraglobal.com/api/ai'
          def post(msg):
              body=json.dumps({'message':msg,'country':'Worldwide','language':'auto','scope':'worldwide','fast':True},ensure_ascii=False).encode()
              req=urllib.request.Request(U,data=body,headers={'content-type':'application/json','user-agent':'SEEKVERA-R76-DEGRADED-PROBE'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode('utf-8','replace'))
          cases=[
            ('بدي وظيفة مبيعات بفرنسا','ar','jobs'),
            ('شو فيك تساعدني اليوم؟','ar','general'),
            ('Türkiye’de satış işi arıyorum','tr','jobs'),
            ('Je cherche un emploi commercial en Allemagne','fr','jobs'),
            ('I need a sales job in Germany','en','jobs'),
          ]
          bad=[]
          for msg,lang,cat in cases:
              d=post(msg);print('AI',msg,json.dumps(d,ensure_ascii=False)[:1200],flush=True)
              if not d.get('response') or d.get('category')!=cat or not str(d.get('language','')).lower().startswith(lang):bad.append((msg,d))
          controls=[
            ('حطني تركيا','TR',None),
            ('غيّر الأب على لبنان','LB',None),
            ('change the app to France','FR',None),
            ('حوّلني ورلد وايد','WW',None),
            ('غير لغة التطبيق للتركي',None,'tr'),
          ]
          for msg,cc,ll in controls:
              d=post(msg);print('CONTROL',msg,json.dumps(d,ensure_ascii=False)[:1200],flush=True)
              if not d.get('response'):bad.append((msg,d))
              if cc and (d.get('countryAction') or {}).get('code')!=cc:bad.append((msg,d))
              if ll and (d.get('languageAction') or {}).get('code')!=ll:bad.append((msg,d))
          d=post('بدي فندق بفرنسا');print('SEARCH_NOT_CONTROL',json.dumps(d,ensure_ascii=False)[:1200],flush=True)
          if d.get('countryAction') or d.get('category') not in ('travel','tourism'):bad.append(('بدي فندق بفرنسا',d))
          if bad:
              print('R76_DEGRADED_AI_BAD',json.dumps(bad,ensure_ascii=False)[:6000],flush=True)
              raise SystemExit(1)
          print('R76_DEGRADED_AI_PASS')
          PY
