name: R76 translation provider probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-provider-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe LibreTranslate mirrors
        shell: bash
        run: |
          set -u
          for base in \
            https://libretranslate.de \
            https://translate.mentality.rip \
            https://translate.argosopentech.com \
            https://translate.api.skitzen.com \
            https://trans.zillyhuhn.com \
            https://translate.terraprint.co \
            https://lt.psf.lt \
            https://translate.flossboxin.org.in \
            https://lt.blitzw.in
          do
            echo "=== $base ==="
            code=$(curl -L -sS --max-time 12 -o /tmp/out -w '%{http_code}' -H 'content-type: application/json' \
              --data '{"q":"Hello world","source":"en","target":"fr","format":"text"}' "$base/translate" || true)
            echo "HTTP=$code BODY=$(head -c 500 /tmp/out 2>/dev/null || true)"
          done
