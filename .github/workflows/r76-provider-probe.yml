name: R76 translation provider probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-provider-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Google translation through Cloudflare edge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request,urllib.error
          U='https://seekveraglobal.com/api/__r76_google_translate'
          src='Find jobs and hotels near me'
          bad=[]
          for lang in ['sr','kl','rm']:
              body=json.dumps({'target':lang,'text':src}).encode()
              req=urllib.request.Request(U,data=body,headers={'content-type':'application/json','user-agent':'SEEKVERA-R76-HYBRID'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:d=json.loads(r.read().decode('utf-8','replace'))
                  t=str(d.get('translation') or '').strip();print('EDGE',lang,'=>',t,d.get('provider'),flush=True)
                  if not d.get('ok') or not t or t.lower()==src.lower():bad.append((lang,d))
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace');print('EDGE_HTTP',lang,e.code,raw,flush=True);bad.append((lang,raw))
              except Exception as e:
                  print('EDGE_ERROR',lang,repr(e),flush=True);bad.append((lang,repr(e)))
          assert not bad,'edge bridge failures '+repr(bad)
          print('R76_EDGE_ALL_3_PASS')
          PY
