name: R76 translation provider probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-provider-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect TranslateAPI anonymous translator page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,urllib.request
          for url in ['https://translateapi.ai/translate/romansh/','https://translateapi.ai/']:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'})
              html=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','replace')
              print('PAGE',url,'LEN',len(html))
              for pat in [r'https?://[^"\'<> ]+',r'/api/[^"\'<> ]+',r'<script[^>]+src=["\']([^"\']+)']:
                  vals=[]
                  for m in re.finditer(pat,html,re.I):
                      v=m.group(1) if m.lastindex else m.group(0)
                      if v not in vals: vals.append(v)
                  print('MATCHES',pat,vals[:100])
              for line in html.splitlines():
                  low=line.lower()
                  if 'translate' in low and ('fetch(' in low or 'axios' in low or '/api/' in low or 'endpoint' in low):
                      print('INLINE',line[:1500])
          PY
