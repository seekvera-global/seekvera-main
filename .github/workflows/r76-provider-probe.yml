name: R76 translation provider probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-provider-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe MyMemory for sr kl rm
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.parse,urllib.request
          text='Find jobs and hotels near me'
          bad=[]
          for lang in ['sr','kl','rm']:
              u='https://api.mymemory.translated.net/get?'+urllib.parse.urlencode({'q':text,'langpair':'en|'+lang})
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 SEEKVERA-R76'})
                  with urllib.request.urlopen(req,timeout=25) as r:d=json.loads(r.read().decode('utf-8','replace'))
                  t=str((d.get('responseData') or {}).get('translatedText') or '').strip()
                  print('MYMEMORY',lang,'=>',t,'STATUS',d.get('responseStatus'),flush=True)
                  if not t or t.lower()==text.lower() or str(d.get('responseStatus')) not in ('200',''):bad.append((lang,t,d.get('responseStatus')))
              except Exception as e:
                  print('MYMEMORY_ERROR',lang,repr(e),flush=True);bad.append((lang,repr(e),None))
          assert not bad,'MyMemory failed '+repr(bad)
          print('MYMEMORY_ALL_3_PASS')
          PY
