name: R76 translation provider probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-provider-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe private Pollinations structured multilingual replies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.parse,urllib.request
          system='''You are SEEKVERA AI. Understand any language or dialect. Return ONLY JSON with keys reply,languageCode,category,countryAction,languageAction. Reply in the same language/script as the latest message. Categories include general,jobs,travel,property,cars,shopping,services. countryAction only for an explicit app-country change, never a search.'''
          cases=[
            ('بدي وظيفة مبيعات بفرنسا','ar','jobs'),
            ('حطني تركيا','ar','general'),
            ('Türkiye’de satış işi arıyorum','tr','jobs'),
          ]
          for msg,lang,cat in cases:
              prompt=system+'\nLatest user message: '+msg
              url='https://text.pollinations.ai/'+urllib.parse.quote(prompt,safe='')+'?model=openai&private=true&seed=76'
              req=urllib.request.Request(url,headers={'accept':'text/plain','user-agent':'SEEKVERA-R76-PROBE/1.0'})
              with urllib.request.urlopen(req,timeout=35) as r:raw=r.read().decode('utf-8','replace').strip()
              print('RAW',msg,raw[:1200],flush=True)
              raw=raw.removeprefix('```json').removeprefix('```').removesuffix('```').strip()
              a=raw.find('{');b=raw.rfind('}');assert a>=0 and b>a,raw
              d=json.loads(raw[a:b+1]);assert d.get('reply');assert str(d.get('languageCode','')).startswith(lang),(msg,d);assert d.get('category')==cat,(msg,d)
          print('R76_PUBLIC_STRUCTURED_AI_PASS')
          PY
