name: R76 translation provider probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-provider-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect TranslateAPI web POST payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          u='https://translateapi.ai/translate/romansh/'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'})
          h=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','replace')
          needle="fetch('/translate/'"
          i=h.find(needle)
          print('INDEX',i,'LEN',len(h))
          assert i>=0
          print(h[max(0,i-5000):i+8000])
          PY
