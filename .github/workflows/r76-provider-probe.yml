name: R76 translation provider probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-provider-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect guarded Cloudflare AI bridge
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          U='https://seekveraglobal.com/api/__r76_translate_builder'
          body=json.dumps({'target':'sr','text':'Find jobs and hotels near me'}).encode()
          req=urllib.request.Request(U,data=body,headers={'content-type':'application/json','user-agent':'SEEKVERA-R76-HYBRID'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=50) as r:
                  raw=r.read().decode();print('STATUS',r.status,'BODY',raw);d=json.loads(raw);assert d.get('ok')
          except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace');print('STATUS',e.code,'BODY',raw);raise
          PY
