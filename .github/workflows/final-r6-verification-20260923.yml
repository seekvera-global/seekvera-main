name: Definitive SEEKVERA R6 Live Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-r6-verification-20260923.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify live UI routes and News Media
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://seekveraglobal.com'
          ok=0
          for i in $(seq 1 25); do
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$SITE/?verify-r6=$i" -o /tmp/home.html || true
            if grep -q '20260923-final-market-r6' /tmp/home.html 2>/dev/null && grep -q 'News & Media' /tmp/home.html 2>/dev/null; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          for p in marketplace.html travel.html property.html cars-auto.html jobs.html shopping.html import-export.html restaurants-food.html local-services.html media.html games.html connectivity.html deal-agent.html post-ad.html hub.html app.html; do
            code=$(curl -L -sS -o /tmp/page -w '%{http_code}' --max-time 20 "$SITE/$p?verify-r6=1")
            echo "$p $code"
            test "$code" = 200
          done
          curl -fsSL "$SITE/media.html?verify-r6=1" -o /tmp/media.html
          grep -q 'Al Jazeera' /tmp/media.html
          grep -q 'Al Arabiya' /tmp/media.html
          grep -q 'CNN' /tmp/media.html
          grep -q 'BBC News' /tmp/media.html
          grep -q 'Reuters' /tmp/media.html
          curl -fsSL "$SITE/app.html?verify-r6=1" -o /tmp/app.html
          grep -q 'location.replace' /tmp/app.html
          if grep -q '<iframe' /tmp/app.html; then exit 1; fi
          echo 'LIVE UI ROUTES NEWS APP PASS'

      - name: Verify all 28 selected AI languages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, concurrent.futures
          URL='https://seekvera-main.seekvera-global.workers.dev/api/ai'
          cases=[('English','Nigeria','Hello.'),('Arabic','Lebanon','مرحبا'),('French','France','Bonjour'),('Chinese','China','你好'),('Spanish','Spain','Hola'),('Hindi','India','नमस्ते'),('Portuguese','Brazil','Olá'),('German','Germany','Hallo'),('Japanese','Japan','こんにちは'),('Korean','South Korea','안녕하세요'),('Indonesian','Indonesia','Halo'),('Turkish','Turkey','Merhaba'),('Russian','Russia','Привет'),('Urdu','Pakistan','سلام'),('Bengali','Bangladesh','নমস্কার'),('Vietnamese','Vietnam','Xin chào'),('Italian','Italy','Ciao'),('Swahili','Kenya','Habari'),('Thai','Thailand','สวัสดี'),('Persian','Iran','سلام'),('Polish','Poland','Cześć'),('Dutch','Netherlands','Hallo'),('Malay','Malaysia','Hai'),('Filipino','Philippines','Kumusta'),('Hausa','Nigeria','Sannu'),('Yoruba','Nigeria','Pẹlẹ o'),('Igbo','Nigeria','Ndewo'),('Amharic','Ethiopia','ሰላም')]
          def one(c):
            lang,country,target=c
            data=json.dumps({'message':f'Reply only with exactly this text: {target}','country':country,'language':lang,'scope':'worldwide','fast':True}).encode()
            req=urllib.request.Request(URL,data=data,headers={'content-type':'application/json'})
            with urllib.request.urlopen(req,timeout=90) as r: d=json.load(r)
            ans=str(d.get('response','')).strip(); got=str(d.get('language',''))
            if not d.get('ok') or lang.lower() not in got.lower() or target not in ans:
                raise RuntimeError(f'{lang}/{country}: language={got} answer={ans[:120]}')
            return f'{lang}/{country} PASS'
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            futs=[ex.submit(one,c) for c in cases]
            for f in concurrent.futures.as_completed(futs): print(f.result())
          print('ALL 28 SELECTED LANGUAGES PASS')
          PY

      - name: Verify voice visual and Safety
        shell: bash
        run: |
          set -euo pipefail
          W='https://seekvera-main.seekvera-global.workers.dev'
          curl -fsSL "$W/api/health?verify-r6=1" -o /tmp/h.json
          grep -q '20260923-final-market-r6' /tmp/h.json
          grep -q '"centralSafetyGate":"enabled"' /tmp/h.json
          grep -q '"voiceInputFallback":"server-asr-v1"' /tmp/h.json
          grep -q '"asrModel":"@cf/openai/whisper-large-v3-turbo"' /tmp/h.json
          code=$(curl -sS -o /tmp/stt -w '%{http_code}' -X POST "$W/api/transcribe" -H 'content-type: application/json' --data '{"audio":"invalid","language":"English"}')
          test "$code" = 400
          grep -q 'serverVoice' voice-ai.js
          grep -q 'MediaRecorder' voice-ai.js
          grep -q "pt:'pt-BR'" voice-ai.js
          grep -q "ar:'ar-SA'" voice-ai.js
          grep -q "ur:'ur-PK'" voice-ai.js
          grep -q "am:'am-ET'" voice-ai.js
          grep -q 'VISION' worker.js
          grep -q '/api/visual-search' worker.js
          echo 'VOICE VISUAL SAFETY PASS'

      - name: Cross-device live browser audit
        shell: bash
        run: |
          set -euo pipefail
          npm i --no-save playwright@1.58.2 >/dev/null 2>&1
          npx playwright install chromium webkit firefox >/dev/null 2>&1
          cat > /tmp/audit.cjs <<'JS'
          const {chromium,webkit,firefox}=require('playwright');
          const profiles=[
            ['Android Chrome',chromium,{viewport:{width:360,height:800}}],
            ['iPhone Safari',webkit,{viewport:{width:390,height:844}}],
            ['iPad Safari',webkit,{viewport:{width:820,height:1180}}],
            ['Desktop Chrome Edge engine',chromium,{viewport:{width:1366,height:768}}],
            ['Desktop Firefox',firefox,{viewport:{width:1366,height:768}}]
          ];
          for(const [name,engine,opt] of profiles){
            const b=await engine.launch({headless:true}),c=await b.newContext(opt),p=await c.newPage();
            await p.goto('https://seekveraglobal.com/?browser-r6=1',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(1800);
            const base=await p.evaluate(()=>({release:document.body.dataset.release||'',countries:document.querySelector('#country')?.options.length||0,languages:document.querySelector('#lang')?.options.length||0,tiles:document.querySelectorAll('.r5-tile').length,media:!!document.querySelector('a[href="media.html"]'),chat:!!document.querySelector('#aiChat'),mic:!!document.querySelector('#aiChatMic'),camera:!!document.querySelector('#aiChatCamera'),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
            if(base.release!=='20260923-final-market-r6'||base.countries<249||base.languages!==29||base.tiles<16||!base.media||!base.chat||!base.mic||!base.camera||base.overflow>4) throw Error(name+' '+JSON.stringify(base));
            await p.selectOption('#lang','pt'); await p.waitForTimeout(4200);
            const pt=await p.evaluate(()=>({intro:document.querySelector('#aiMessages .ai-msg.bot')?.textContent||'',toggle:document.querySelector('.sv-request-toggle')?.textContent||'',dir:document.documentElement.dir}));
            if(!/assistente/i.test(pt.intro)||/[\u0600-\u06ff]/.test(pt.toggle)) throw Error(name+' PT MIX '+JSON.stringify(pt));
            await p.selectOption('#lang','en'); await p.waitForTimeout(800);
            const en=await p.evaluate(()=>document.querySelector('.sv-request-toggle')?.textContent||'');
            if(/[\u0600-\u06ff]/.test(en)) throw Error(name+' EN ARABIC '+en);
            await p.selectOption('#lang','ar'); await p.waitForTimeout(800);
            const ar=await p.evaluate(()=>({dir:document.documentElement.dir,intro:document.querySelector('#aiMessages .ai-msg.bot')?.textContent||''}));
            if(ar.dir!=='rtl'||!/[\u0600-\u06ff]/.test(ar.intro)) throw Error(name+' AR FAIL '+JSON.stringify(ar));
            console.log(name,'PASS'); await b.close();
          }
          console.log('ALL DEVICE PROFILES PASS');
          JS
          node /tmp/audit.cjs

      - name: Final pass
        run: echo 'DEFINITIVE SEEKVERA R6 PASS'
