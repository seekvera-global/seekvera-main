name: SEEKVERA Android RTL visual audit

on:
  push:
    branches: [main]
    paths:
      - 'i18n-ui.js'
      - 'i18n-premium.css'
      - '*.html'
      - '.github/workflows/mobile-rtl-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test Arabic Android layout and full UI translation
        shell: bash
        run: |
          cat > seekvera-mobile-audit.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:360,height:800},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'});
            await context.addInitScript(()=>{localStorage.setItem('seekvera_lang','ar');localStorage.setItem('seekvera_country','WW');});
            const page=await context.newPage();
            await page.goto('https://seekveraglobal.com/?visual-rtl-audit=3',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('script[src*="i18n-ui.js?v=20260922-i18n-premium1"]'),null,{timeout:60000});
            await page.waitForFunction(()=>document.documentElement.dir==='rtl' && /كل ما تحتاجه/.test(document.querySelector('.sv-hero h1')?.textContent||''),null,{timeout:60000});
            await page.waitForTimeout(1500);
            const state=await page.evaluate(()=>{
              const caption=[...document.querySelectorAll('.sv-control-caption,.sv-control-field small')].find(x=>(x.textContent||'').includes('الدولة'));
              const language=[...document.querySelectorAll('.sv-control-caption,.sv-control-field small')].find(x=>(x.textContent||'').includes('اللغة'));
              const country=document.querySelector('#country');
              const h1=document.querySelector('.sv-hero h1');
              const post=[...document.querySelectorAll('a,button')].find(x=>(x.textContent||'').includes('أضف إعلان'));
              const greeting=document.querySelector('#aiMessages .ai-msg.bot');
              const r=caption?.getBoundingClientRect();
              const lr=language?.getBoundingClientRect();
              return {
                dir:document.documentElement.dir,
                h1:h1?.textContent?.trim(),
                caption:caption?.textContent?.trim(),
                language:language?.textContent?.trim(),
                country:country?.options?.[country.selectedIndex]?.textContent?.trim(),
                post:post?.textContent?.trim(),
                greeting:greeting?.textContent?.trim(),
                overflow:document.documentElement.scrollWidth-window.innerWidth,
                captionRect:r&&{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height},
                languageRect:lr&&{left:lr.left,right:lr.right,top:lr.top,bottom:lr.bottom,width:lr.width,height:lr.height},
                vw:window.innerWidth
              };
            });
            console.log(JSON.stringify(state,null,2));
            if(state.dir!=='rtl')throw Error('Arabic page is not RTL');
            if(!state.h1?.includes('كل ما تحتاجه'))throw Error('Homepage headline did not translate to Arabic');
            if(!state.caption?.includes('الدولة / المنطقة'))throw Error('Country / Region label is not fully translated');
            if(!state.language?.includes('اللغة'))throw Error('Language label is not Arabic');
            if(!state.country?.includes('العالم كله'))throw Error('Worldwide country option is not Arabic');
            if(!state.post?.includes('أضف إعلان'))throw Error('Post Ad is not Arabic');
            if(!state.greeting?.includes('مرحب'))throw Error('AI greeting is not Arabic');
            if(state.overflow>2)throw Error('Mobile page has horizontal overflow: '+state.overflow);
            for(const [name,r] of [['country caption',state.captionRect],['language caption',state.languageRect]]){
              if(!r||r.height<11||r.top<0||r.left<0||r.right>state.vw+1)throw Error(name+' is clipped: '+JSON.stringify(r));
            }
            await page.screenshot({path:'seekvera-arabic-mobile.png',fullPage:false});
            await page.selectOption('#lang','en');
            await page.dispatchEvent('#lang','change');
            await page.waitForFunction(()=>document.documentElement.dir==='ltr' && /Everything you need/.test(document.querySelector('.sv-hero h1')?.textContent||''),null,{timeout:30000});
            const english=await page.evaluate(()=>({dir:document.documentElement.dir,h1:document.querySelector('.sv-hero h1')?.textContent?.trim(),post:[...document.querySelectorAll('a,button')].find(x=>(x.textContent||'').includes('Post Ad'))?.textContent?.trim()}));
            console.log('English restore',english);
            if(english.dir!=='ltr'||!english.h1?.includes('Everything you need')||!english.post)throw Error('English restore failed');
            await browser.close();
            console.log('ANDROID RTL + FULL ARABIC UI + MOBILE CLIPPING AUDIT PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node seekvera-mobile-audit.js
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: seekvera-arabic-mobile-proof
          path: seekvera-arabic-mobile.png
          if-no-files-found: error
