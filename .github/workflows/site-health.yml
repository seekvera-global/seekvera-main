name: SEEKVERA live site health
# Health validation target: current zero-cost Universal Global release

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'wrangler.jsonc'
      - '.github/workflows/site-health.yml'

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check homepage and wait for latest deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://seekvera-global.github.io/seekvera-main'
          markers=('SEEKVERA' 'Ask SEEKVERA' 'Request anything' 'id="country"' 'id="lang"' 'cars-auto.html' 'restaurants-food.html' 'shipping-logistics.html' 'local-services.html' 'money-insurance.html')
          ready=0
          for attempt in $(seq 1 12); do
            echo "Homepage check attempt $attempt/12"
            if curl --fail --location --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
              "$base/" -o /tmp/home.html; then
              missing=0
              for marker in "${markers[@]}"; do
                if grep -Fq "$marker" /tmp/home.html; then
                  echo "OK: $marker"
                else
                  echo "WAITING: $marker"
                  missing=1
                fi
              done
              if [ "$missing" -eq 0 ]; then
                ready=1
                break
              fi
            fi
            sleep 15
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Live homepage did not reach the expected current version.'
            grep -Eo '<title>[^<]*</title>' /tmp/home.html || true
            exit 1
          fi

      - name: Check public pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://seekvera-global.github.io/seekvera-main'
          pages=(
            travel.html shopping.html property.html business-software.html education.html
            solar.html health.html web-hosting.html jobs.html import-export.html
            cars-auto.html restaurants-food.html shipping-logistics.html local-services.html money-insurance.html
            about.html contact.html privacy.html terms.html disclosure.html robots.txt sitemap.xml
          )
          for page in "${pages[@]}"; do
            echo "Checking $page"
            curl --fail --location --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors \
              "$base/$page" -o "/tmp/${page//\//_}"
          done

      - name: Verify official zero-cost SEO signals
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://seekvera-global.github.io/seekvera-main/sitemap.xml' /tmp/robots.txt
          grep -q 'https://seekvera-global.github.io/seekvera-main/' /tmp/sitemap.xml
          grep -q 'cars-auto.html' /tmp/sitemap.xml
          grep -q 'restaurants-food.html' /tmp/sitemap.xml
          grep -q 'shipping-logistics.html' /tmp/sitemap.xml
          grep -q 'local-services.html' /tmp/sitemap.xml
          grep -q 'money-insurance.html' /tmp/sitemap.xml
          grep -q '<link rel="canonical" href="https://seekvera-global.github.io/seekvera-main/">' /tmp/home.html
          grep -q '<meta property="og:url" content="https://seekvera-global.github.io/seekvera-main/">' /tmp/home.html
          echo 'Official zero-cost GitHub Pages SEO signals and all Universal Global guide pages are correct.'

      - name: Check repository page references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          html = list(root.glob('*.html'))
          existing = {p.name for p in html}
          missing = []
          for p in html:
              text = p.read_text(encoding='utf-8', errors='ignore')
              for href in re.findall(r'href=["\']([^"\']+)["\']', text):
                  if href.startswith(('http://','https://','mailto:','#','/')):
                      continue
                  target = href.split('?',1)[0].split('#',1)[0]
                  if target.endswith('.html') and target not in existing:
                      missing.append((p.name, target))
          if missing:
              raise SystemExit('Missing local page links: ' + repr(missing))
          print(f'Checked {len(html)} HTML files; local page links are present.')
          PY
