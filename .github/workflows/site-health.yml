name: SEEKVERA live site health

on:
  schedule:
    - cron: '31 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'r20-final-guard.js'
      - 'r22-category-lock.js'
      - 'sw.js'
      - 'worker.js'
      - '.github/workflows/site-health.yml'
permissions:
  contents: read
jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check official production and wait for R23
        shell: bash
        run: |
          set -euo pipefail
          S='https://seekveraglobal.com'; ok=0
          for i in $(seq 1 72); do
            curl -LfsS --max-time 25 -H 'Cache-Control: no-cache' "$S/?health-r23=$i" -o /tmp/home || true
            curl -LfsS --max-time 25 -H 'Cache-Control: no-cache' "$S/r20-final-guard.js?health-r23=$i" -o /tmp/g || true
            if grep -q 'SEEKVERA' /tmp/home 2>/dev/null && grep -q '20260925-r23-stable' /tmp/g 2>/dev/null; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          for m in 'SEEKVERA' 'Request anything' 'id="country"' 'id="lang"' 'cars-auto.html' 'restaurants-food.html' 'shipping-logistics.html' 'local-services.html' 'money-insurance.html'; do grep -Fq "$m" /tmp/home; done
          ! grep -q 'r8-department-strip' /tmp/home
          test "$(grep -o 'id=\"categories\"' /tmp/home | wc -l)" = 1
      - name: Check API and public pages
        shell: bash
        run: |
          set -euo pipefail
          S='https://seekveraglobal.com'
          curl -LfsS --max-time 25 "$S/api/health?health-r23=1" -o /tmp/health
          grep -q '"ok":true' /tmp/health
          for p in marketplace.html travel.html tourism.html property.html cars-auto.html jobs.html shopping.html restaurants-food.html local-services.html import-export.html shipping-logistics.html health.html games.html connectivity.html wifi.html deal-agent.html privacy.html terms.html; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 25 "$S/$p?health-r23=1"); test "$code" = 200 || { echo "$p -> $code"; exit 1; }
          done
          echo 'SEEKVERA OFFICIAL PRODUCTION HEALTH PASS'
