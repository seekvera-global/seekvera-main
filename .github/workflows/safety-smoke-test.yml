name: SEEKVERA safety smoke test

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'post-ad.html'
      - 'terms.html'
      - '.github/workflows/safety-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for live deployment
        run: sleep 20

      - name: Verify live safety API
        shell: bash
        run: |
          set -euo pipefail
          worker='https://seekvera-main.seekvera-global.workers.dev'
          health="$(curl -fsS --retry 5 --retry-delay 5 --max-time 40 "$worker/api/health")"
          echo "$health" | grep -q '"moderation":"enabled"'

          blocked="$(curl -fsS --retry 4 --retry-delay 4 --max-time 75 -H 'content-type: application/json' -d '{"text":"AK-47 rifle for sale"}' "$worker/api/moderate")"
          echo "$blocked" | grep -q '"allowed":false'
          echo "$blocked" | grep -q 'weapons_or_explosives'

          clean="$(curl -fsS --retry 4 --retry-delay 4 --max-time 90 -H 'content-type: application/json' -d '{"text":"1000 sqm land for sale in Abuja with valid documents"}' "$worker/api/moderate")"
          echo "$clean" | grep -q '"allowed":true'

      - name: Verify live marketplace safety UI
        shell: bash
        run: |
          set -euo pipefail
          base='https://seekvera-global.github.io/seekvera-main'
          post="$(curl -fsS --retry 5 --retry-delay 5 --max-time 40 "$base/post-ad.html")"
          echo "$post" | grep -q 'SEEKVERA Safety Gate'
          echo "$post" | grep -q 'id="ownership"'
          echo "$post" | grep -q 'Prohibited on SEEKVERA'
          terms="$(curl -fsS --retry 5 --retry-delay 5 --max-time 40 "$base/terms.html")"
          echo "$terms" | grep -q 'Prohibited marketplace content'
          echo "$terms" | grep -q 'Ownership, authority and consent'
          echo "$terms" | grep -q 'Safety review and removal'

      - name: Verify repository safety markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/moderate' worker.js
          grep -q 'prohibitedReason' worker.js
          grep -q 'pending safety review' post-ad.html
          grep -q 'SEEKVERA Terms and Prohibited Content Rules' post-ad.html
