name: SEEKVERA safety smoke test

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'post-ad.html'
      - 'terms.html'
      - '.github/workflows/safety-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages deployment
        run: sleep 20

      - name: Verify live Supabase safety API
        shell: bash
        run: |
          set -euo pipefail
          edge='https://nrdpyydfrpmqedtzmbyw.supabase.co/functions/v1/marketplace-moderate'
          key='sb_publishable_tqqPQxqdNowIsSlJz4bW5w_kHOC905o'
          check_block(){
            text="$1"; expected="$2"
            body=$(python3 -c 'import json,sys; print(json.dumps({"text":sys.argv[1]}))' "$text")
            out=$(curl -fsS --retry 4 --retry-delay 3 --max-time 40 "$edge" -H 'content-type: application/json' -H "apikey: $key" -H "Authorization: Bearer $key" --data "$body")
            echo "$out"
            python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("allowed") is False, d; assert d.get("reason")==sys.argv[2], d' "$out" "$expected"
          }
          check_block 'AK-47 rifle for sale' 'weapons_or_explosives'
          check_block 'nude escort services' 'explicit_sexual_content'
          check_block 'fake passport for sale' 'stolen_counterfeit_or_fake_documents'
          check_block 'this house is not mine and I have no permission from owner' 'ownership_or_consent_problem'
          clean=$(curl -fsS --retry 4 --retry-delay 3 --max-time 40 "$edge" -H 'content-type: application/json' -H "apikey: $key" -H "Authorization: Bearer $key" --data '{"text":"1000 sqm land for sale in Abuja with valid documents"}')
          echo "$clean"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("allowed") is True, d; assert d.get("reviewRequired") is True, d' "$clean"

      - name: Verify live marketplace safety UI and fail-closed path
        shell: bash
        run: |
          set -euo pipefail
          base='https://seekvera-global.github.io/seekvera-main'
          post="$(curl -fsS --retry 6 --retry-delay 5 --max-time 50 "$base/post-ad.html?v=safety-live")"
          echo "$post" | grep -q 'SEEKVERA Safety Gate'
          echo "$post" | grep -q 'id="ownership"'
          echo "$post" | grep -q 'Prohibited on SEEKVERA'
          echo "$post" | grep -q 'marketplace-moderate'
          echo "$post" | grep -q 'fail-closed'
          echo "$post" | grep -q 'marketplace-pending-images'
          terms="$(curl -fsS --retry 6 --retry-delay 5 --max-time 50 "$base/terms.html?v=safety-live")"
          echo "$terms" | grep -q 'Prohibited marketplace content'
          echo "$terms" | grep -q 'Ownership, authority and consent'
          echo "$terms" | grep -q 'Safety review and removal'

      - name: Verify repository safety markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'marketplace-moderate' post-ad.html
          grep -q 'fail-closed' post-ad.html
          grep -q 'pending safety review' post-ad.html
          grep -q 'SEEKVERA Terms and Prohibited Content Rules' post-ad.html
          grep -q '/api/moderate' worker.js
          grep -q 'prohibitedReason' worker.js
