name: R28 category locales retry
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r28-category-locales-retry.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply locale rows from source workflow
        shell: python
        run: |
          from pathlib import Path
          import ast,re,textwrap
          wf=Path('.github/workflows/r28-complete-category-locales.yml').read_text(encoding='utf-8')
          m=re.search(r'\n\s*rows=(\{.*?\})\n\s*assert all',wf,re.S)
          assert m,'rows dictionary not found'
          rows=ast.literal_eval(m.group(1)); assert len(rows)==18 and all(len(v)==31 for v in rows.values())
          p=Path('locale-r14-categories.js'); s=p.read_text(encoding='utf-8')
          start=s.index('const C={'); end=s.index('\n};',start); block=s[start:end]
          import json
          add=[]; added=[]
          for code,vals in rows.items():
              if ('\n'+code+':[') in block: continue
              js='['+','.join(json.dumps(x,ensure_ascii=False) for x in vals)+']'
              add.append(',\n'+code+':'+js); added.append(code)
          if add:
              s=s[:end]+''.join(add)+s[end:]; p.write_text(s,encoding='utf-8')
          print('added',added)
      - name: Validate 98 languages
        shell: bash
        run: |
          node --check locale-r14-categories.js
          python - <<'PY'
          from pathlib import Path
          import re
          n=Path('navigation.js').read_text(encoding='utf-8'); c=Path('locale-r14-categories.js').read_text(encoding='utf-8')
          m=re.search(r'const WORLD_LANGS=\[([^\]]+)\]',n,re.S); langs=re.findall(r"'([^']+)'",m.group(1))
          keys=set(re.findall(r'^\s*([a-z]{2,3}):\[',c,re.M)); keys.add('en') if 'en:S' in c else None
          missing=[x for x in langs if x not in keys]
          assert len(langs)==98,(len(langs)); assert not missing,missing
          print('CATEGORY LOCALE PASS 98/98')
          PY
      - name: Commit and push
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add locale-r14-categories.js
          git commit -m 'R28: complete category localization for all 98 languages'
          git push origin HEAD:main
