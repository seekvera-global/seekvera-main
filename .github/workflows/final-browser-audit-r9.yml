name: SEEKVERA R9e final live browser audit

on:
  push:
    paths:
      - '.github/workflows/final-browser-audit-r9.yml'
      - 'app.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run final live R9e country, locale, race, pages, AI and voice audit
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import assert from 'node:assert';

          const BASE='https://seekveraglobal.com';
          const src=fs.readFileSync('global-ui.js','utf8');
          const m=src.match(/const COUNTRY_PROFILE=Object\.fromEntries\(`([^`]+)`\.split/s);
          assert(m,'COUNTRY_PROFILE not found');
          const profiles=Object.fromEntries(m[1].split(';').filter(Boolean).map(x=>{
            const [cc,v]=x.split(':');
            const [language,currency]=v.split(',');
            return [cc,{language,currency}];
          }));
          assert.equal(Object.keys(profiles).length,248,'expected 248 country/territory profiles');

          const browser=await chromium.launch({headless:true});
          try {
            // 1) Select all 248 configured countries/territories one-by-one in the real live UI.
            const c1=await browser.newContext({locale:'en-US'});
            const p1=await c1.newPage();
            await p1.route('**/api/locale',r=>r.abort());
            await p1.route('**/api/ui-translate',r=>r.abort());
            await p1.goto(BASE+'/?audit=r9e-country-'+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await p1.waitForFunction(()=>document.querySelectorAll('#country option').length>=249,null,{timeout:15000});
            const liveCodes=await p1.locator('#country option').evaluateAll(opts=>opts.map(o=>o.value));
            for(const cc of Object.keys(profiles)) assert(liveCodes.includes(cc),`country option missing ${cc}`);
            let checked=0;
            for(const [cc,prof] of Object.entries(profiles)){
              await p1.selectOption('#country',cc);
              const state=await p1.evaluate(()=>({
                country:document.querySelector('#country')?.value,
                lang:document.querySelector('#lang')?.value,
                currency:document.querySelector('#currency')?.value,
                docLang:document.documentElement.lang,
                dir:document.documentElement.dir,
                explicit:localStorage.getItem('seekvera_country_explicit'),
                lsCountry:localStorage.getItem('seekvera_country'),
                lsLang:localStorage.getItem('seekvera_lang'),
                lsCurrency:localStorage.getItem('seekvera_currency')
              }));
              assert.equal(state.country,cc,`${cc} country select`);
              assert.equal(state.lang,prof.language,`${cc} language`);
              assert.equal(state.currency,prof.currency,`${cc} currency`);
              assert.equal(state.docLang,prof.language,`${cc} document language`);
              assert.equal(state.explicit,'1',`${cc} explicit choice`);
              assert.equal(state.lsCountry,cc,`${cc} stored country`);
              assert.equal(state.lsLang,prof.language,`${cc} stored language`);
              assert.equal(state.lsCurrency,prof.currency,`${cc} stored currency`);
              const rtl=['ar','fa','ur','he','ps'].includes(prof.language);
              assert.equal(state.dir,rtl?'rtl':'ltr',`${cc} direction`);
              checked++;
            }
            assert.equal(checked,248);
            console.log('COUNTRY UI PASS:',checked,'profiles selected and verified one-by-one');
            await c1.close();

            // 2) Critical R9e race test: a late US auto-detect response must NOT override manual Morocco.
            const cRace=await browser.newContext({locale:'en-US'});
            const pRace=await cRace.newPage();
            await pRace.route('**/api/locale',async route=>{
              await new Promise(r=>setTimeout(r,1400));
              await route.fulfill({
                status:200,
                contentType:'application/json',
                body:JSON.stringify({ok:true,country:'US',language:'en',currency:'USD'})
              });
            });
            await pRace.goto(BASE+'/?audit=r9e-race-ma-'+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await pRace.waitForFunction(()=>document.querySelectorAll('#country option').length>=249,null,{timeout:15000});
            await pRace.selectOption('#country','MA');
            await pRace.waitForFunction(()=>document.querySelector('#country')?.value==='MA'&&document.querySelector('#lang')?.value==='ar'&&document.querySelector('#currency')?.value==='MAD',null,{timeout:5000});
            await pRace.waitForTimeout(2200);
            const raceState=await pRace.evaluate(()=>({
              country:document.querySelector('#country')?.value,
              lang:document.querySelector('#lang')?.value,
              currency:document.querySelector('#currency')?.value,
              explicit:localStorage.getItem('seekvera_country_explicit'),
              stored:localStorage.getItem('seekvera_country'),
              body:document.body.innerText
            }));
            assert.equal(raceState.country,'MA','late auto-detect overrode Morocco country');
            assert.equal(raceState.lang,'ar','late auto-detect overrode Morocco language');
            assert.equal(raceState.currency,'MAD','late auto-detect overrode Morocco currency');
            assert.equal(raceState.explicit,'1','Morocco manual choice not marked explicit');
            assert.equal(raceState.stored,'MA','Morocco manual choice not stored');
            assert(raceState.body.includes('الذكاء والبحث'),'Morocco Arabic AI & Search missing after delayed auto-detect');
            assert(raceState.body.includes('الرحلات الجوية'),'Morocco Arabic Flights missing after delayed auto-detect');
            console.log('MANUAL COUNTRY PRIORITY PASS: MA survives delayed US auto-detect');
            await cRace.close();

            // 2b) Deliberate Worldwide must also survive a delayed location response.
            const cWW=await browser.newContext({locale:'en-US'});
            const pWW=await cWW.newPage();
            await pWW.route('**/api/locale',async route=>{
              await new Promise(r=>setTimeout(r,1400));
              await route.fulfill({
                status:200,
                contentType:'application/json',
                body:JSON.stringify({ok:true,country:'US',language:'en',currency:'USD'})
              });
            });
            await pWW.goto(BASE+'/?audit=r9e-race-ww-'+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await pWW.waitForFunction(()=>document.querySelectorAll('#country option').length>=249,null,{timeout:15000});
            await pWW.selectOption('#country','WW');
            await pWW.waitForTimeout(2200);
            const wwState=await pWW.evaluate(()=>({
              country:document.querySelector('#country')?.value,
              explicit:localStorage.getItem('seekvera_country_explicit'),
              stored:localStorage.getItem('seekvera_country')
            }));
            assert.equal(wwState.country,'WW','late auto-detect overrode Worldwide');
            assert.equal(wwState.explicit,'1','Worldwide manual choice not marked explicit');
            assert.equal(wwState.stored,'WW','Worldwide manual choice not stored');
            console.log('MANUAL WORLDWIDE PRIORITY PASS');
            await cWW.close();

            // 3) Visible translations must be present and remain stable after the locale settles.
            const c2=await browser.newContext({locale:'en-US'});
            const p2=await c2.newPage();
            await p2.route('**/api/locale',r=>r.abort());
            await p2.goto(BASE+'/?audit=r9e-visible-'+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await p2.waitForFunction(()=>document.querySelectorAll('#country option').length>=249,null,{timeout:15000});
            const visible=[
              ['MA','ar',['الذكاء والبحث','الرحلات الجوية']],
              ['FR','fr',['IA et recherche','Vols']],
              ['IN','hi',['एआई और खोज','उड़ानें']],
              ['CN','zh',['AI 与搜索','航班']]
            ];
            for(const [cc,lang,need] of visible){
              await p2.selectOption('#country',cc);
              await p2.waitForFunction(({lang,need})=>document.documentElement.lang===lang&&need.every(t=>document.body.innerText.includes(t)),{lang,need},{timeout:30000});
              await p2.waitForTimeout(900);
              const settled=await p2.evaluate(()=>({lang:document.documentElement.lang,body:document.body.innerText}));
              assert.equal(settled.lang,lang,`${cc} document language changed after settling`);
              for(const t of need) assert(settled.body.includes(t),`${cc} visible translation did not stay stable: ${t}`);
              console.log('VISIBLE LOCALE PASS:',cc,lang);
            }
            await c2.close();

            // 4) Every localized public page must serve the final R9e runtimes.
            const pages=fs.readdirSync('.')
              .filter(f=>f.endsWith('.html')&&!f.toLowerCase().startsWith('google'))
              .filter(f=>fs.readFileSync(f,'utf8').includes('i18n-ui.js'));
            assert(pages.length>=44,`expected >=44 localized pages, got ${pages.length}`);
            const c3=await browser.newContext();
            for(const f of pages){
              const resp=await c3.request.get(BASE+'/'+f+'?audit=r9e-page-'+Date.now(),{timeout:30000,failOnStatusCode:false});
              assert(resp.ok(),`${f} HTTP ${resp.status()}`);
              const html=await resp.text();
              assert(html.includes('global-ui.js?v=20260924-final-r9e'),`${f} missing final R9e global runtime`);
              assert(html.includes('i18n-ui.js?v=20260924-final-r9e'),`${f} missing final R9e i18n runtime`);
              assert(html.includes('voice-ai.js?v=20260924-final-r9e'),`${f} missing final R9e voice runtime`);
            }
            console.log('ALL LOCALIZED PAGES PASS:',pages.length);
            await c3.close();

            // 5) AI conversation continuity: known country/context must not be re-asked.
            const c4=await browser.newContext();
            const started=Date.now();
            const ai=await c4.request.post(BASE+'/api/ai',{
              data:{
                message:'mechanic',
                country:'France',
                language:'English',
                scope:'country',
                fast:true,
                history:[
                  {role:'user',content:'I need a job in France'},
                  {role:'assistant',content:'What kind of job are you looking for?'}
                ]
              },
              timeout:60000
            });
            const ms=Date.now()-started;
            assert(ai.ok(),`AI HTTP ${ai.status()}`);
            const data=await ai.json();
            assert.equal(data.ok,true,'AI ok');
            assert.equal(data.category,'jobs','AI category');
            assert.equal(data.route,'jobs.html','AI route');
            console.log('AI CONVERSATION PASS:',ms+'ms');
            await c4.close();

            // 6) Voice/PWA final source checks.
            const globalLive=await (await fetch(BASE+'/global-ui.js?v=20260924-final-r9e',{cache:'no-store'})).text();
            assert(globalLive.includes("localStorage.getItem('seekvera_country_explicit')==='1')return"),'manual locale priority guard missing live');
            const voice=await (await fetch(BASE+'/voice-ai.js?v=20260924-final-r9e',{cache:'no-store'})).text();
            assert(voice.includes('VOICE_SILENCE_MS=3200'),'voice silence must be 3200ms');
            assert(voice.includes('Android|iPhone|iPad|iPod'),'mobile recorder branch missing');
            const i18n=await (await fetch(BASE+'/i18n-ui.js?v=20260924-final-r9e',{cache:'no-store'})).text();
            assert(i18n.includes("const VERSION='20260924-final-r9e'"),'R9e i18n version missing live');
            assert(i18n.includes('characterData:true'),'translation persistence observer missing live');
            assert(i18n.includes("serviceWorker.register('sw.js?v=20260924-final-r9e')"),'R9e service-worker registration missing live');
            assert(i18n.includes('window.__SEEKVERA_R9_QUICK=QUICK'),'primary translation unification missing live');
            const sw=await (await fetch(BASE+'/sw.js?v=20260924-final-r9e',{cache:'no-store'})).text();
            assert(sw.includes('seekvera-final-r9e-20260924'),'final R9e service-worker cache missing live');
            console.log('VOICE + PWA CACHE PASS');
          } finally {
            await browser.close();
          }
          console.log('FINAL R9E LIVE BROWSER AUDIT PASS');
          NODE
