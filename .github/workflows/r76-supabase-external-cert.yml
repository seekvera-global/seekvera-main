name: R76 Supabase external certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-supabase-external-cert.yml']

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Single cooled external probe
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 'https://nrdpyydfrpmqedtzmbyw.supabase.co/functions/v1/r76-external-cert' -o /tmp/r76.json
          python3 -m json.tool /tmp/r76.json
          python3 - <<'PY'
          import json,re
          d=json.load(open('/tmp/r76.json'))
          print('ROOT_STATUS',d['root']['status'],'RETRY_AFTER',d['root'].get('retryAfter'),'RAY',d['root'].get('cfRay'))
          print('HEALTH_STATUS',d['health']['status'],'RETRY_AFTER',d['health'].get('retryAfter'),'RAY',d['health'].get('cfRay'))
          for k in ('root','health'):
              b=d[k].get('body','')
              m=re.search(r'Error\s+(\d{4})|error[_ -]?code[^0-9]*(\d{4})',b,re.I)
              print('ERROR_CODE',k,(m.group(1) or m.group(2)) if m else 'none')
          if d['root']['status']==200 and d['health']['status']==200:
              h=json.loads(d['health']['body'])
              assert h.get('r76') is True and h.get('r76Runtime')=='single-structured-multilingual-ai'
              print('R76_COOLED_EXTERNAL_PASS')
          else:
              print('R76_COOLED_EXTERNAL_RATE_LIMITED')
              raise SystemExit(2)
          PY
