name: Audio authority production verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'voice-ai.js'
      - 'r24-ai-controller.js'
      - 'r31-ui-polish.js'
      - 'worker-r76.js'
      - 'worker-r31.js'
      - 'tools/test-tts-envelope.cjs'
      - 'tools/test-audio-authority.cjs'
      - 'r32-i18n.js'
      - 'i18n-ui.js'
      - 'i18n-r32/ar.json'
      - 'jobs.html'
      - 'r22-category-lock.js'
      - 'global-ui.js'
      - 'locale-r15.js'
      - 'tools/test-locale-cognates.cjs'
      - 'tools/test-voice-placeholders.mjs'
      - '.github/workflows/r123-production-cert.yml'
permissions:
  contents: read
concurrency:
  group: seekvera-audio-authority-production
  cancel-in-progress: false
jobs:
  deploy-certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate audio authority
        run: |
          node --check worker-r31.js
          node --check worker-r76.js
          node tools/test-tts-envelope.cjs
          node --check r24-ai-controller.js
          node --check r31-ui-polish.js
          node --check voice-ai.js
          node tools/test-audio-authority.cjs
          node --check i18n-ui.js
          node --check r32-i18n.js
          node --check r22-category-lock.js
          node tools/test-locale-cognates.cjs
          node tools/test-dialect-voice.cjs
          node tools/test-direct-voice.cjs
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
      - name: Verify production asset and multilingual audio
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,base64,re,time
          B='https://seekveraglobal.com'
          def get(path):
              return urllib.request.urlopen(urllib.request.Request(B+path,headers={'cache-control':'no-cache','user-agent':'Mozilla/5.0'}),timeout=20).read()
          for i in range(12):
              js=get('/voice-ai.js?audio_authority='+str(time.time())).decode()
              if "recording=true;nativeShadowText=''" in js: break
              time.sleep(5)
          else: raise AssertionError('Production voice asset did not update')
          def post(path,payload):
              req=urllib.request.Request(B+path,data=json.dumps(payload,ensure_ascii=False).encode(),headers={'content-type':'application/json','user-agent':'Mozilla/5.0'},method='POST')
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:return r.read()
                  except urllib.error.HTTPError as e:
                      detail=e.read().decode()
                      print('SERVICE_ERROR',path,e.code,detail[:500])
                      if e.code not in (429,502,503,504) or attempt==2:raise
                      time.sleep(3*(attempt+1))
          cases=[('ar','مرحبا أنا عم بحكي معك بالعربي، دوريني على شغل في بيروت'),
                 ('fr','Bonjour, je voudrais chercher un hôtel à Paris pour demain.'),
                 ('en','Hello, I would like to find a hotel in London for tomorrow.')]
          for lang,phrase in cases:
              audio=post('/api/tts',{'text':phrase,'language':lang})
              print('AUDIO_FORMAT',lang,len(audio),audio[:24].hex())
              assert len(audio)>500,(lang,len(audio))
              d=json.loads(post('/api/transcribe',{'audio':'data:audio/mpeg;base64,'+base64.b64encode(audio).decode(),'language':'auto','conversationLanguage':'ar','uiLanguage':'ar','nativeText':'Halið á að leita að vinnu','nativeConfidence':.99}))
              assert d.get('ok') and d.get('text') and not d.get('nativeRescue'),d
              assert d.get('language')==lang,(lang,d)
              print('LIVE_AUDIO_PASS',lang,d.get('model'))
          chat_cases=[
              ('fr','Bonjour, peux-tu me répondre en français et m’aider à chercher un emploi ?','jobs'),
              ('ar','دوريني على شغل ببيروت','jobs'),
              ('es','Quiero encontrar un hotel en Madrid','travel'),
              ('ja','東京で仕事を探してください','jobs')]
          for lang,phrase,category in chat_cases:
              d=json.loads(post('/api/ai',{'message':phrase,'language':'auto','country':'Worldwide','history':[]}))
              assert d.get('language')==lang and d.get('category')==category and not d.get('countryAction') and not d.get('languageAction'),(phrase,d)
              print('LIVE_CHAT_PASS',lang,category)
          PY
      - name: Verify live category translations
        if: ${{ !cancelled() }}
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try {
              const page=await browser.newPage();
              await page.route('**/*',r=>{const u=new URL(r.request().url());if(['seekveraglobal.com','www.seekveraglobal.com','seekvera-main.seekvera-global.workers.dev'].includes(u.hostname))return r.continue();return r.abort()});
              await page.goto('https://seekveraglobal.com/?audio_authority=20260930');
              await page.locator('#country').selectOption('LB');
              await page.waitForFunction(()=>document.documentElement.dataset.seekveraPackReady==='ar');
              await page.waitForFunction(()=>/[\u0600-\u06ff]/.test(document.querySelector('.r5-hero > p')?.textContent||'')&&!document.querySelector('.r5-hero > p')?.textContent.includes('Hotels, homes'),{timeout:15000});
              await page.waitForFunction(()=>[...document.querySelectorAll('.r5-tile small')].every(el=>/[\u0600-\u06ff]/.test(el.textContent||'')),{timeout:15000});
              const lead=await page.locator('.r5-hero > p').first().innerText();
              assert(!lead.includes('Hotels, homes'),lead);
              const desc=await page.locator('.r5-tile small').allTextContents();
              assert.equal(desc.length,31);
              assert(desc.every(x=>/[\u0600-\u06ff]/.test(x)),desc);
              console.log('LIVE_ARABIC_HOME_AND_ALL_31_DESCRIPTIONS_PASS');
          } finally {await browser.close();}
          JS

      - name: Verify complete voice acknowledgement before navigation
        run: node tools/r124_browser.mjs

      - name: Verify dynamic voice placeholder localization
        run: node tools/test-voice-placeholders.mjs
