name: R97 real multilingual voice certification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r97-real-multilingual-voice-cert.yml'
      - 'tools/r97_voice_cert.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-voice-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install voice and browser tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng >/dev/null
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Generate real English and Arabic WAV fixtures
        shell: bash
        run: |
          set -euo pipefail
          espeak-ng -v en-us -s 125 -w /tmp/r97-en.wav 'hello seekvera how are you today I need a hotel in Beirut'
          espeak-ng -v ar -s 120 -w /tmp/r97-ar.wav 'مرحبا كيف حالك اليوم انا اتكلم معك بالعربي واريد فندق في بيروت'
          test -s /tmp/r97-en.wav
          test -s /tmp/r97-ar.wav

      - name: Run real live multilingual voice certification
        run: node tools/r97_voice_cert.mjs
