name: R32 static final audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r32-static-final-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seekvera-r32-static-final
  cancel-in-progress: true

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build complete static language packs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet beautifulsoup4
          python tools/r32_build_static_packs.py
          test "$(find i18n-r32 -maxdepth 1 -name '*.json' | wc -l)" -eq 99
          python - <<'PY'
          import json
          m=json.load(open('i18n-r32/manifest.json',encoding='utf-8'))
          assert m['packs']==98 and len(m['languages'])==98 and m['sourceCount']>100,m
          src=json.load(open('i18n-r32-source.json',encoding='utf-8'))
          assert src['count']==m['sourceCount']
          for l in m['languages']:
              d=json.load(open(f'i18n-r32/{l}.json',encoding='utf-8'))
              assert d['count']==m['sourceCount'] and len(d['translations'])==m['sourceCount'],(l,d.get('count'))
          ar=json.load(open('i18n-r32/ar.json',encoding='utf-8'))['translations']
          q='No approved live marketplace listings are available right now. SEEKVERA does not generate fake listings.'
          assert q in ar and ar[q]!=q and 'No approved' not in ar[q]
          print('STATIC PACK SOURCE PASS',m)
          PY

      - name: Apply R32 static runtime and resilient AI failover
        shell: bash
        run: |
          set -euo pipefail
          python tools/r32_pack_runtime_patch.py
          python tools/r32_global_final.py
          python tools/r32_ai_failover_patch.py
          python tools/r32_translation_backend_fix.py
          node --check r32-i18n.js
          node --check i18n-ui.js
          node --check worker-r31.js
          node --check worker.js
          grep -q 'loadPack' i18n-ui.js
          grep -q 'r32-static-v1' i18n-ui.js
          grep -q 'r32Runtime' worker-r31.js
          grep -q 'i18n-ui.js?v=20260925-r32-global-final' index.html

      - name: Deploy audited candidate to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Wait for candidate production
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            b="$(curl -LfsS --max-time 15 "https://seekveraglobal.com/api/health?r32static=$i" || true)"
            if echo "$b" | grep -q '248-country-full-ui-language-lock-global-final'; then echo "$b"; exit 0; fi
            sleep 3
          done
          exit 1

      - name: Final live audit without remote translation
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > final-audit.mjs <<'JS'
          import {chromium} from 'playwright';import assert from 'node:assert/strict';
          const B='https://seekveraglobal.com';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:390,height:844},locale:'en-US',serviceWorkers:'block'});
          const page=await ctx.newPage();const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
          await page.route('**/api/ui-translate',r=>r.abort());
          await page.route('https://text.pollinations.ai/**',r=>r.abort());
          await page.goto(B+'/?r32static='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForFunction(()=>window.SEEKVERA_I18N_R32&&window.SEEKVERA_LOCALE_R15&&window.SEEKVERA_LOCALE_R14&&window.SEEKVERA_R14_CATEGORIES&&window.SEEKVERA_R22_CATEGORY_LOCK,{timeout:20000});
          const manifest=await (await ctx.request.get(B+'/i18n-r32/manifest.json?v='+Date.now())).json();
          const source=await (await ctx.request.get(B+'/i18n-r32-source.json?v='+Date.now())).json();
          assert.equal(manifest.packs,98);assert.equal(manifest.languages.length,98);assert(source.count>100);
          const meta=await page.evaluate(()=>({profiles:SEEKVERA_LOCALE_R15.profiles,langs:Object.keys(SEEKVERA_R14_CATEGORIES.data)}));
          assert.equal(Object.keys(meta.profiles).length,248);assert.equal(meta.langs.length,98);
          assert.equal(new Set(manifest.languages).size,98);

          // Every pack is live, complete, and matches the same source set.
          const packCache={};
          for(let i=0;i<manifest.languages.length;i+=12){await Promise.all(manifest.languages.slice(i,i+12).map(async l=>{const r=await ctx.request.get(B+'/i18n-r32/'+l+'.json?v='+manifest.sourceHash,{timeout:20000});assert.equal(r.status(),200,l+' pack HTTP');const d=await r.json();assert.equal(d.count,source.count,l+' pack count');assert.equal(Object.keys(d.translations).length,source.count,l+' pack map');packCache[l]=d.translations}))}

          // Exact screenshot case: Iraq must be Arabic/IQD and remain Arabic after delayed dynamic marketplace updates.
          await page.evaluate(()=>SEEKVERA_LOCALE_R15.setCountry('IQ'));
          await page.evaluate(async()=>{await SEEKVERA_I18N_R32.loadPack('ar');SEEKVERA_I18N_R32.schedule(0);SEEKVERA_R22_CATEGORY_LOCK.lock()});
          await page.waitForFunction(()=>document.documentElement.dataset.seekveraPackReady==='ar'&&document.documentElement.dataset.seekveraI18nReady==='ar'&&document.documentElement.dir==='rtl',{timeout:12000});
          const screenshotLeaks=['No approved live marketplace listings are available right now','SEEKVERA does not generate fake listings','Find, compare, choose — worldwide','Popular categories','Live marketplace','Request anything'];
          async function iraq(label){const x=await page.evaluate(()=>({body:document.body.innerText,live:document.querySelector('#liveListings')?.innerText||'',cc:country.value,l:lang.value,c:currency.value,cards:document.querySelectorAll('#categories .r5-tile').length,thumb:[...document.querySelectorAll('#categories .r5-thumb')].map(n=>(n.textContent||'').trim()),overflow:document.documentElement.scrollWidth-innerWidth,mic:!!document.querySelector('#aiChatMic'),speaker:!!document.querySelector('#aiChatSpeaker')}));assert.deepEqual([x.cc,x.l,x.c],['IQ','ar','IQD'],label);for(const q of screenshotLeaks)assert(!x.body.includes(q),label+' English leak '+q);assert.equal(x.cards,31,label+' cards');assert(!x.thumb.some(t=>/[A-Za-z.]|seekvera/i.test(t)),label+' broken category icon '+JSON.stringify(x.thumb));assert(x.overflow<=4,label+' overflow '+x.overflow);assert(x.mic&&x.speaker,label+' voice controls');return x}
          await page.waitForTimeout(500);await iraq('0.5s');await page.waitForTimeout(2500);await iraq('3s');await page.waitForTimeout(3000);await iraq('6s');

          // 248/248 countries must atomically drive their configured default language and currency.
          const badCountries=[];
          for(const [cc,pr] of Object.entries(meta.profiles)){await page.evaluate(cc=>SEEKVERA_LOCALE_R15.setCountry(cc),cc);await page.waitForTimeout(5);const g=await page.evaluate(()=>({cc:country.value,l:lang.value,c:currency.value}));if(g.cc!==cc||g.l!==pr.language||g.c!==pr.currency)badCountries.push({cc,pr,g})}
          assert.equal(badCountries.length,0,'country mapping failures '+JSON.stringify(badCountries.slice(0,5)));

          // All 98 languages on the real homepage, with both remote translators deliberately blocked.
          const knownCritical=['No approved live marketplace listings are available right now.','SEEKVERA does not generate fake listings.','Find, compare, choose — worldwide.','Popular categories','Live marketplace','Request anything','Privacy','Terms','Contact','Disclosure'];
          for(const l of manifest.languages){
            await page.evaluate(l=>SEEKVERA_LOCALE_R15.setLanguage(l),l);
            await page.evaluate(async l=>{await SEEKVERA_I18N_R32.loadPack(l);SEEKVERA_I18N_R32.schedule(0);SEEKVERA_R22_CATEGORY_LOCK.lock()},l);
            if(l!=='en')await page.waitForFunction(l=>document.documentElement.dataset.seekveraPackReady===l&&document.documentElement.dataset.seekveraI18nReady===l,l,{timeout:10000});
            await page.waitForTimeout(60);await page.evaluate(()=>SEEKVERA_R22_CATEGORY_LOCK.lock());
            const x=await page.evaluate(()=>({body:document.body.innerText,live:document.querySelector('#liveListings')?.innerText||'',l:lang.value,tiles:[...document.querySelectorAll('#categories .r5-tile-body b')].slice(0,31).map(x=>x.textContent.trim()),small:[...document.querySelectorAll('#categories .r5-tile-body small')].filter(x=>!x.hidden).map(x=>x.textContent.trim()),overflow:document.documentElement.scrollWidth-innerWidth,foot:[...document.querySelectorAll('.r5-foot a')].map(x=>x.textContent.trim())}));
            assert.equal(x.l,l,l+' selected language');assert(x.overflow<=4,l+' overflow '+x.overflow);assert.equal(x.tiles.length,31,l+' category count');
            const expected=await page.evaluate(l=>SEEKVERA_R14_CATEGORIES.data[l],l);assert.deepEqual(x.tiles,expected,l+' category titles');if(l!=='en')assert.equal(x.small.length,0,l+' English category descriptions');
            if(l!=='en'){
              for(const q of knownCritical){const tr=packCache[l][q];if(tr&&tr!==q)assert(!x.body.includes(q),l+' raw English leak: '+q)}
              assert(!/No approved live marketplace listings are available right now/i.test(x.live),l+' dynamic marketplace leak');
              assert(!x.foot.some(t=>['About','Privacy','Terms','Contact','Disclosure'].includes(t)),l+' footer leak '+JSON.stringify(x.foot));
            }
          }

          // All 31 category routes exist and are non-blank.
          await page.evaluate(()=>SEEKVERA_LOCALE_R15.setLanguage('ar'));await page.evaluate(async()=>{await SEEKVERA_I18N_R32.loadPack('ar');SEEKVERA_I18N_R32.schedule(0)});await page.waitForTimeout(100);
          const hrefs=await page.evaluate(()=>[...new Set([...document.querySelectorAll('#categories .r5-tile')].map(a=>a.getAttribute('href')).filter(Boolean))]);assert.equal(hrefs.length,31,'category href count');
          const routeBad=[];for(let i=0;i<hrefs.length;i+=8){await Promise.all(hrefs.slice(i,i+8).map(async h=>{try{const r=await ctx.request.get(new URL(h,B).href,{timeout:15000});const t=await r.text();if(r.status()>=400||t.length<180)routeBad.push({h,s:r.status(),n:t.length})}catch(e){routeBad.push({h,e:String(e)})}}))}assert.equal(routeBad.length,0,'bad category routes '+JSON.stringify(routeBad));

          // Every category page must localize its visible static Arabic text from the committed pack without remote translation.
          const arPack=packCache.ar;const arCheck=source.strings.filter(s=>s.length>=8&&arPack[s]&&arPack[s]!==s&&!/^SEEKVERA\b/.test(s));
          const deepBad=[];
          for(const h of hrefs){
            const p=await ctx.newPage();const e=[];p.on('pageerror',x=>e.push(String(x)));await p.route('**/api/ui-translate',r=>r.abort());await p.route('https://text.pollinations.ai/**',r=>r.abort());
            try{await p.goto(new URL(h,B).href+'?r32deep='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await p.waitForFunction(()=>window.SEEKVERA_I18N_R32&&window.SEEKVERA_LOCALE_R15,{timeout:15000});await p.evaluate(()=>SEEKVERA_LOCALE_R15.setLanguage('ar'));await p.evaluate(async()=>{await SEEKVERA_I18N_R32.loadPack('ar');SEEKVERA_I18N_R32.schedule(0)});await p.waitForFunction(()=>document.documentElement.dataset.seekveraI18nReady==='ar',{timeout:10000});await p.waitForTimeout(120);const body=await p.evaluate(()=>document.body.innerText);const leaks=arCheck.filter(s=>body.includes(s)).slice(0,8);if(leaks.length||e.length)deepBad.push({h,leaks,errors:e.slice(0,3)})}catch(err){deepBad.push({h,error:String(err)})}finally{await p.close()}
          }
          assert.equal(deepBad.length,0,'deep page localization failures '+JSON.stringify(deepBad.slice(0,5)));

          assert.equal(pageErrors.length,0,'homepage page errors '+pageErrors.join(' | '));
          console.log('R32 STATIC UI PASS',JSON.stringify({countries:248,languages:98,categories:31,sourceStrings:source.count,iraq:'Arabic/IQD/no-English',deepPages:hrefs.length,remoteTranslation:'blocked during audit'}));

          // AI: real production endpoint, multiple scripts/languages, not an empty/ellipsis fallback.
          const dn=new Intl.DisplayNames(['en'],{type:'language'});const aiCases=[['IQ','ar','مرحبا'],['US','en','Hello'],['FR','fr','Bonjour'],['DE','de','Hallo'],['CN','zh','你好'],['IN','hi','नमस्ते'],['TR','tr','Merhaba']];
          const aiBad=[];
          for(const [cc,l,msg] of aiCases){try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);const r=await fetch(B+'/api/ai',{method:'POST',headers:{'content-type':'application/json','Origin':B},body:JSON.stringify({message:msg,country:cc,language:l,fast:true}),signal:ctl.signal});clearTimeout(to);const d=await r.json();const text=String(d?.response||'').trim();if(!r.ok||!d?.ok||text.length<2||text==='…')aiBad.push({cc,l,status:r.status,body:d})}catch(e){aiBad.push({cc,l,error:String(e)})}}
          assert.equal(aiBad.length,0,'AI locale failures '+JSON.stringify(aiBad));
          console.log('R32 AI PASS',JSON.stringify({cases:aiCases.length}));
          await browser.close();
          JS
          node final-audit.mjs

      - name: Commit only the fully audited release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SEEKVERA R32 Final'
          git config user.email 'actions@users.noreply.github.com'
          git add i18n-r32 i18n-r32-source.json r32-i18n.js i18n-ui.js locale-r15.js worker-r31.js worker.js sw.js '*.html'
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'R32: ship audited local 98-language packs for every country and category'
            git push origin main
          fi
