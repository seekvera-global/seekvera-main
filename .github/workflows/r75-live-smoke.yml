name: R75 targeted live reply route smoke
on:
  push:
    branches: [fix/r75-global-country-section-sync]
    paths: ['.github/workflows/r75-live-smoke.yml']
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > smoke.mjs <<'JS'
          import {chromium} from 'playwright';import assert from 'node:assert/strict';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({locale:'ar-LB',viewport:{width:390,height:844},userAgent:'Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'});
          await p.goto('https://seekveraglobal.com/?r75smoke='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForFunction(()=>window.SEEKVERA_R31?.version?.includes('r75')&&window.SEEKVERA_R66_FINAL?.version?.includes('r75')&&window.SEEKVERA_CHAT,null,{timeout:30000});
          await p.evaluate(()=>{localStorage.removeItem('seekvera_ai_chat_v1');SEEKVERA_LOCALE_R15.setCountry('LB')});
          await p.fill('#aiChatInput','بدي وظيفة بالمبيعات');const t=Date.now();await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());
          await p.waitForFunction(()=>{const x=[...document.querySelectorAll('#aiMessages .ai-msg.bot')].at(-1);return x&&!x.classList.contains('thinking')&&x.textContent.trim().length>1},null,{timeout:15000});
          const replyMs=Date.now()-t, before=p.url();await p.waitForTimeout(250);assert.equal(p.url(),before,'route happened before reply was visible');
          await p.waitForFunction(()=>location.pathname==='/jobs'||location.pathname==='/jobs.html',null,{timeout:10000});await p.waitForTimeout(800);
          await p.waitForFunction(()=>window.SEEKVERA_CHAT&&document.querySelector('#aiMessages'),null,{timeout:15000});
          const state=await p.evaluate(()=>({url:location.href,chat:document.querySelector('#aiMessages')?.innerText||'',saved:localStorage.getItem('seekvera_ai_chat_v1')||''}));
          assert.ok(state.chat.includes('بدي وظيفة بالمبيعات'),state.chat);assert.ok(state.saved.includes('بدي وظيفة بالمبيعات'),state.saved);
          const p2=await b.newPage({locale:'ar-LB',viewport:{width:390,height:844}});await p2.goto('https://seekveraglobal.com/?r75control='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});await p2.waitForFunction(()=>window.SEEKVERA_R66_FINAL?.version?.includes('r75')&&window.SEEKVERA_LOCALE_R15,null,{timeout:30000});await p2.evaluate(()=>SEEKVERA_LOCALE_R15.setCountry('NG'));await p2.fill('#aiChatInput','حوّليني على ورلد وايد');const c=Date.now();await p2.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p2.waitForFunction(()=>[...document.querySelectorAll('#aiMessages .ai-msg.bot')].some(x=>/حوّل|العالمي|Worldwide|🌐/.test(x.textContent)),null,{timeout:1500});const controlReplyMs=Date.now()-c;assert.equal(await p2.evaluate(()=>country.value),'NG');await p2.waitForFunction(()=>country.value==='WW',null,{timeout:3000});
          console.log('R75 TARGETED LIVE PASS',{replyMs,controlReplyMs,url:state.url,chatSaved:true});await b.close();
          JS
          node smoke.mjs
