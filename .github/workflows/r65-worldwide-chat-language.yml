name: R65 worldwide multilingual chat
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r65-worldwide-chat-language.yml']
permissions:
  contents: write
jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build R65
        shell: bash
        run: |
          set -euo pipefail
          python tools/r65_worldwide_chat_language.py
          node --check r24-ai-controller.js
          node --check r31-ui-polish.js
          node --check voice-ai.js
          node --check worker-r31.js
          node --check superapp.js
          grep -F "WW:['worldwide'" r24-ai-controller.js >/dev/null
          grep -F "country!=='WW'" r24-ai-controller.js >/dev/null
          grep -F "c.country==='WW'?'✓ 🌐 Worldwide'" r31-ui-polish.js >/dev/null
          grep -F "seekvera_chat_voice_lang" voice-ai.js >/dev/null
          grep -F "navigator.languages" voice-ai.js >/dev/null
          grep -F "selected market must NEVER decide the reply language" worker-r31.js >/dev/null
          grep -F "20260926-r65-worldwide-chat-language" r24-ai-controller.js >/dev/null
      - name: Deploy R65
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Wait for live R65
        shell: bash
        run: |
          set -euo pipefail
          S='https://seekveraglobal.com'
          for i in $(seq 1 35); do
            c="$(curl -LfsS --max-time 15 -H 'Cache-Control: no-cache' "$S/r24-ai-controller.js?r65=$i" || true)"
            v="$(curl -LfsS --max-time 15 -H 'Cache-Control: no-cache' "$S/voice-ai.js?r65=$i" || true)"
            w="$(curl -LfsS --max-time 15 -H 'Cache-Control: no-cache' "$S/worker-r31.js?r65=$i" || true)"
            if [[ "$c" == *"20260926-r65-worldwide-chat-language"* && "$c" == *"WW:['worldwide'"* && "$v" == *"seekvera_chat_voice_lang"* && "$w" == *"selected market must NEVER decide the reply language"* ]]; then echo 'R65 LIVE ASSETS PASS'; break; fi
            sleep 2
            [ "$i" != 35 ] || exit 1
          done
      - name: Live message-language API audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, json, time
          S='https://seekveraglobal.com';H={'User-Agent':'Mozilla/5.0 SEEKVERA-R65-Audit','content-type':'application/json'}
          def post(obj):
              r=urllib.request.Request(S+'/api/ai',data=json.dumps(obj,ensure_ascii=False).encode(),headers=H,method='POST')
              try:
                  with urllib.request.urlopen(r,timeout=35) as x:return x.status,x.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:return e.code,e.read().decode('utf-8','replace')
          cases=[
            ('ar','NG','شو فيك تساعدني اليوم؟'),
            ('fr','NG','Bonjour, peux-tu m’aider aujourd’hui ?'),
            ('zh','US','你好，你今天可以怎么帮助我？'),
            ('hi','FR','नमस्ते, आज आप मेरी कैसे मदद कर सकते हैं?')]
          for code,country,msg in cases:
              st,tx=post({'message':msg,'country':country,'language':'auto','fast':True});print(code,country,st,tx[:1200]);assert st==200,(code,st,tx);d=json.loads(tx);assert d.get('ok') and str(d.get('response','')).strip(),d
              r=d['response']
              if code=='ar':assert any('\u0600'<=x<='\u06ff' for x in r),d
              if code=='zh':assert any('\u4e00'<=x<='\u9fff' for x in r),d
              if code=='hi':assert any('\u0900'<=x<='\u097f' for x in r),d
              if code=='fr':assert any(x in r.lower() for x in ('je ','vous','bonjour','aide','pouvez','besoin','assistant')),d
          print('R65 MESSAGE LANGUAGE PASS')
          PY
      - name: Browser Worldwide control and country-independent voice audit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > r65-test.mjs <<'JS'
          import {chromium} from 'playwright';import assert from 'node:assert/strict';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({userAgent:'Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'});
          await p.goto('https://seekveraglobal.com/?r65='+Date.now(),{waitUntil:'networkidle',timeout:60000});
          await p.waitForFunction(()=>window.SEEKVERA_R24_CONTROLLER&&window.SEEKVERA_LOCALE_R15&&document.querySelector('#aiChatForm'),null,{timeout:30000});
          const controls=await p.evaluate(()=>{const c=SEEKVERA_R24_CONTROLLER;return{ww:c.detectControls('Change the app to Worldwide'),wwAr:c.detectControls('غير التطبيق للعالمي'),tr:c.detectControls('حطني تركيا'),lang:c.detectControls('حطلي تركي')}});
          assert.equal(controls.ww.country,'WW',JSON.stringify(controls));assert.equal(controls.wwAr.country,'WW',JSON.stringify(controls));assert.equal(controls.tr.country,'TR',JSON.stringify(controls));assert.equal(controls.lang.language,'tr',JSON.stringify(controls));
          await p.evaluate(()=>{SEEKVERA_LOCALE_R15.setCountry('NG');sessionStorage.setItem('seekvera_ai_intent','jobs')});
          await p.waitForFunction(()=>document.querySelector('#country')?.value==='NG');
          await p.fill('#aiChatInput','Change the app to Worldwide');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());
          await p.waitForFunction(()=>document.querySelector('#country')?.value==='WW',null,{timeout:5000});
          const snap=await p.evaluate(()=>({country:country.value,currency:currency.value,intent:sessionStorage.getItem('seekvera_ai_intent'),text:aiMessages.innerText}));
          assert.equal(snap.country,'WW');assert.equal(snap.currency,'USD');assert.equal(snap.intent,null);assert.ok(snap.text.includes('✓ 🌐 Worldwide'),snap.text);assert.ok(!/taking you directly to Jobs/i.test(snap.text.split('Change the app to Worldwide').at(-1)||''),snap.text);
          await p.evaluate(()=>SEEKVERA_LOCALE_R15.setCountry('NG'));await p.fill('#aiChatInput','شو فيك تساعدني اليوم؟');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());
          await p.waitForFunction(()=>{const t=document.querySelector('#aiMessages')?.innerText||'';return /[\u0600-\u06ff]/u.test(t.split('شو فيك تساعدني اليوم؟').at(-1)||'')},null,{timeout:25000});
          console.log('R65 CONTROL CHAT PASS',JSON.stringify({controls,snap}));

          const ctx=await b.newContext({locale:'ar-LB',userAgent:'Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'});
          await ctx.addInitScript(()=>{
            localStorage.setItem('seekvera_country','NG');localStorage.setItem('seekvera_country_explicit','1');localStorage.removeItem('seekvera_language_explicit');localStorage.removeItem('seekvera_chat_voice_lang');
            class SR{constructor(){window.__lastSR=this;this.lang='';this.interimResults=false;this.continuous=false;this.maxAlternatives=1}start(){window.__srLang=this.lang;this.onstart?.()}stop(){this.onend?.()}abort(){this.onend?.()}}
            window.SpeechRecognition=SR;window.webkitSpeechRecognition=SR;
          });
          const vp=await ctx.newPage();await vp.goto('https://seekveraglobal.com/?r65voice='+Date.now(),{waitUntil:'networkidle',timeout:60000});
          await vp.waitForFunction(()=>window.SEEKVERA_VOICE_AI&&document.querySelector('#aiChatMic')&&document.querySelector('#country')?.value==='NG',null,{timeout:30000});
          await vp.click('#aiChatMic');await vp.waitForFunction(()=>window.__srLang,null,{timeout:5000});
          const voiceState=await vp.evaluate(()=>({sr:window.__srLang,country:country.value,ui:lang.value,explicit:localStorage.getItem('seekvera_language_explicit')}));
          assert.ok(/^ar(?:-|$)/i.test(voiceState.sr),JSON.stringify(voiceState));assert.equal(voiceState.country,'NG');assert.equal(voiceState.ui,'en');
          console.log('R65 VOICE COUNTRY-INDEPENDENT PASS',JSON.stringify(voiceState));await ctx.close();await b.close();
          JS
          node r65-test.mjs
          rm -f r65-test.mjs
      - name: Persist R65 safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add ./*.html r24-ai-controller.js r31-ui-polish.js voice-ai.js worker-r31.js superapp.js r60-runtime-guard.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Persist R65 worldwide multilingual chat'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo 'R65 FINAL PERSISTED'
