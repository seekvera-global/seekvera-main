name: R47 Xhosa runtime diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r47-xh-runtime-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Inspect Xhosa timing
        run: node tools/r47_xh_diag.mjs
