name: R90 local ASR browser certification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r90-local-asr-cert.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and speech fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng >/dev/null
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Generate multilingual audio fixtures
        run: |
          espeak-ng -v en-us -s 125 -w /tmp/en.wav 'hello seekvera how are you today I am looking for a hotel and I want to speak naturally with you'
          espeak-ng -v ar -s 120 -w /tmp/ar.wav 'مرحبا كيف حالك اليوم انا اتكلم معك بالعربي واريد ان تفهم كلامي وترد علي بالعربي'
      - name: Test stronger browser-side multilingual Whisper base
        shell: bash
        run: |
          cat > r90-test.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          page.on('console',m=>console.log('BROWSER',m.type(),m.text()));
          page.on('pageerror',e=>console.log('PAGEERROR',e.message));
          await page.goto('https://seekveraglobal.com/?r90=base-cert',{waitUntil:'domcontentloaded',timeout:60000});
          const en=fs.readFileSync('/tmp/en.wav').toString('base64');
          const ar=fs.readFileSync('/tmp/ar.wav').toString('base64');
          const result=await page.evaluate(async({en,ar})=>{
            const mod=await import('/patched-transformers.js?v=r90-base-cert');
            mod.env.allowRemoteModels=true;
            mod.env.remoteHost='https://huggingface.co/';
            mod.env.remotePathTemplate='{model}/resolve/{revision}/';
            mod.env.useBrowserCache=true;
            mod.env.backends.onnx.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.25.0-dev.20260212-1a71a5f46e/dist/';
            const pipe=await mod.pipeline('automatic-speech-recognition','Xenova/whisper-base',{dtype:'q8',device:'wasm'});
            const mk=b64=>{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:'audio/wav'})};
            const url1=URL.createObjectURL(mk(en)),url2=URL.createObjectURL(mk(ar));
            try{
              const a=await pipe(url1,{task:'transcribe'});
              const b=await pipe(url2,{task:'transcribe'});
              return {en:a,ar:b};
            } finally {URL.revokeObjectURL(url1);URL.revokeObjectURL(url2)}
          },{en,ar});
          console.log(JSON.stringify(result));
          const et=String(result.en?.text||''),at=String(result.ar?.text||'');
          if(!/hello|hotel|speak/i.test(et))throw new Error('English base transcription failed: '+et);
          if(!/[\u0600-\u06ff]/.test(at))throw new Error('Arabic base auto-detection failed: '+at);
          await browser.close();
          JS
          node r90-test.mjs
