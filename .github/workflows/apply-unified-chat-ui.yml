name: Apply unified premium AI chat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-unified-chat-ui.yml'
      - '.github/scripts/apply_unified_chat.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply unified AI chat UI
        run: python .github/scripts/apply_unified_chat.py
      - name: Validate unified runtime
        shell: bash
        run: |
          node --check superapp.js
          node --check voice-ai.js
          node --check global-ui.js
          grep -q 'id="aiChatAttach"' index.html
          grep -q 'id="aiChatCamera"' index.html
          grep -q 'id="aiChatMic"' index.html
          grep -q 'id="aiChatFile"' index.html
          if grep -q 'id="heroVoice"' index.html; then exit 1; fi
          if grep -q 'id="heroCamera"' index.html; then exit 1; fi
          if grep -q 'svVoiceFab' voice-ai.js; then exit 1; fi
          if grep -q 'svVoicePanel' voice-ai.js; then exit 1; fi
          grep -q 'SpeechRecognition' voice-ai.js
          grep -q 'FEMALE_HINTS' voice-ai.js
          grep -q 'QUALITY_HINTS' voice-ai.js
      - name: Commit unified premium chat
        run: |
          git config user.name "seekvera-global"
          git config user.email "seekvera.global@gmail.com"
          git add index.html superapp.js voice-ai.js global-ui.js global-ui.css '*.html' .github/workflows/premium-worldwide-live-a-z-final.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Unify chat voice camera and uploads in one premium composer"
          git push
