name: Add SEEKVERA R5 cross-device voice fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-r5-cross-device-voice-fallback.yml'
      - '.github/scripts/add_r5_stt.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Workers AI speech-to-text fallback and browser recorder
        shell: bash
        run: python .github/scripts/add_r5_stt.py
      - name: Validate patched runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          node --check voice-ai.js
          node --check superapp.js
          grep -q "@cf/openai/whisper-large-v3-turbo" worker.js
          grep -q "/api/transcribe" worker.js
          grep -q "serverVoice" voice-ai.js
          grep -q "navigator.mediaDevices" voice-ai.js
          grep -q "MediaRecorder" voice-ai.js
          grep -q "2026-09-23-market-r5" superapp.js
      - name: Commit cross-device voice fallback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "seekvera-global"
          git config user.email "seekvera.global@gmail.com"
          git add worker.js voice-ai.js superapp.js
          git diff --cached --quiet && exit 0
          git commit -m "Add server ASR fallback for cross-device SEEKVERA voice"
          git push origin HEAD:main
