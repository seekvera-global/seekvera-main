name: R96 authoritative language AI voice repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r96-authoritative-language-ai-voice-fix.yml'
      - 'tools/r96_repair.py'
      - 'tools/r96_locale_cert.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-deploy-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply R96 repair
        run: python3 tools/r96_repair.py

      - name: Static integrity checks
        shell: bash
        run: |
          set -euo pipefail
          node --check voice-ai.js
          node --check r31-ui-polish.js
          node --check superapp.js
          node --check i18n-ui.js
          node --check locale-r14-categories.js
          node --check r22-category-lock.js
          node --check worker-r76.js
          grep -Fq 'local-whisper-auto-first-r96' voice-ai.js
          grep -Fq 'serverVoice(targetId,activeButton,true)' voice-ai.js
          grep -Fq 'if(SRC.has(n)){dirty=true;continue}' i18n-ui.js
          grep -Fq 'disabled-under-r32' r85-visible-i18n.js
          grep -Fq '20260927-r96-authoritative-language-ai-voice' index.html

      - name: Install browser test tools
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Certify six country-language switches locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/r96-http.log 2>&1 &
          HPID=$!
          trap 'kill $HPID || true' EXIT
          sleep 2
          node tools/r96_locale_cert.mjs

      - name: Commit repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add r85-visible-i18n.js locale-r14-categories.js r22-category-lock.js i18n-ui.js voice-ai.js worker-r76.js r31-ui-polish.js superapp.js sw.js '*.html'
          if git diff --cached --quiet; then
            echo 'R96 runtime already committed'
          else
            git commit -m 'R96 authoritative locale AI and multilingual voice repair'
            git push origin HEAD:main
          fi

      - name: Deploy R96 to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live release marker
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 15); do
            stamp="r96-${GITHUB_RUN_ID}-${n}-$(date +%s)"
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://seekveraglobal.com/?$stamp" -o /tmp/home || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://seekveraglobal.com/voice-ai.js?$stamp" -o /tmp/voice || true
            if grep -Fq '20260927-r96-authoritative-language-ai-voice' /tmp/home 2>/dev/null && grep -Fq 'local-whisper-auto-first-r96' /tmp/voice 2>/dev/null; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" = 1
          echo LIVE_R96_RELEASE_PASS

      - name: Certify live country-language switches
        env:
          SEEKVERA_CERT_BASE: https://seekveraglobal.com/
        run: node tools/r96_locale_cert.mjs

      - name: Certify live AI in Arabic and English
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'content-type: application/json' -d '{"message":"مرحبا كيفك اليوم؟","country":"Lebanon","countryCode":"LB","language":"auto","uiLanguage":"ar","history":[]}' 'https://seekveraglobal.com/api/ai?r96=ar' -o /tmp/ai-ar.json
          curl -fsS --max-time 30 -H 'content-type: application/json' -d '{"message":"Hello, how are you today?","country":"United States","countryCode":"US","language":"auto","uiLanguage":"en","history":[]}' 'https://seekveraglobal.com/api/ai?r96=en' -o /tmp/ai-en.json
          jq -e '.response|type=="string" and length>3' /tmp/ai-ar.json >/dev/null
          jq -e '.response|type=="string" and length>3' /tmp/ai-en.json >/dev/null
          jq -e '.language=="ar"' /tmp/ai-ar.json >/dev/null
          echo LIVE_AI_AR_PASS
          echo LIVE_AI_EN_PASS
