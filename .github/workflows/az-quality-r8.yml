name: SEEKVERA A-Z worldwide quality R8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/az-quality-r8.yml'
      - '.github/scripts/az_quality_r8.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply R8 upgrade
        run: python .github/scripts/az_quality_r8.py

      - name: Normalize voice patch boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('voice-ai.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('function toggleMutefunction toggleMute','function toggleMute')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Ensure worldwide runtime on every public page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          VER='20260924-az-r8'
          css=f'<link rel="stylesheet" href="global-ui.css?v={VER}">'
          i18ncss=f'<link rel="stylesheet" href="i18n-premium.css?v={VER}">'
          voice=f'<script src="voice-ai.js?v={VER}" defer></script>'
          gui=f'<script src="global-ui.js?v={VER}" defer></script>'
          i18n=f'<script src="i18n-ui.js?v={VER}" defer></script>'
          nav='<script src="navigation.js?v=20260924-nav-v1" defer></script>'
          updated=[]
          for p in sorted(Path('.').glob('*.html')):
              if p.name.lower().startswith('google'):
                  continue
              s=p.read_text(encoding='utf-8')
              old=s
              s=re.sub(r'<link rel="stylesheet" href="global-ui\.css(?:\?v=[^"]+)?">',css,s)
              s=re.sub(r'<link rel="stylesheet" href="i18n-premium\.css(?:\?v=[^"]+)?">',i18ncss,s)
              if 'global-ui.css' not in s:
                  s=s.replace('</head>',css+'\n'+i18ncss+'\n</head>',1) if '</head>' in s else css+'\n'+i18ncss+'\n'+s
              elif 'i18n-premium.css' not in s:
                  s=s.replace('</head>',i18ncss+'\n</head>',1) if '</head>' in s else i18ncss+'\n'+s
              pairs=[
                  (r'<script src="voice-ai\.js(?:\?v=[^"]+)?" defer></script>',voice,'voice-ai.js'),
                  (r'<script src="global-ui\.js(?:\?v=[^"]+)?" defer></script>',gui,'global-ui.js'),
                  (r'<script src="i18n-ui\.js(?:\?v=[^"]+)?" defer></script>',i18n,'i18n-ui.js'),
                  (r'<script src="navigation\.js(?:\?v=[^"]+)?" defer></script>',nav,'navigation.js'),
              ]
              for pattern,tag,key in pairs:
                  s=re.sub(pattern,tag,s)
                  if key not in s:
                      s=s.replace('</body>',tag+'\n</body>',1) if '</body>' in s else s+'\n'+tag+'\n'
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  updated.append(p.name)
          print('Runtime normalized on',len(updated),'pages')
          PY

      - name: Validate JavaScript
        run: |
          set -euo pipefail
          node --check worker.js
          node --check voice-ai.js
          node --check superapp.js
          node --check global-ui.js
          node --check i18n-ui.js
          grep -q '20260924-az-r8' worker.js
          grep -q 'VOICE_MAX_MS=90000' voice-ai.js
          grep -q 'VOICE_SILENCE_MS=2100' voice-ai.js
          grep -q "u.pathname==='/api/ui-translate'" worker.js
          grep -q 'const hist=Array.isArray(b.history)' worker.js
          grep -q 'function chatHistory()' superapp.js
          grep -q 'function globalHistory' global-ui.js
          grep -q '/api/ui-translate' i18n-ui.js
          grep -q 'sv_i18n_r8_' i18n-ui.js
          echo 'Core R8 validation passed.'

      - name: Audit every country profile and every department page
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          g=Path('global-ui.js').read_text(encoding='utf-8')
          m=re.search(r'const COUNTRY_PROFILE=Object\.fromEntries\(`([^`]+)`\.split',g,re.S)
          assert m, 'COUNTRY_PROFILE missing'
          rows=[x for x in m.group(1).split(';') if x]
          profiles={x.split(':',1)[0]:x.split(':',1)[1] for x in rows}
          assert len(profiles)>=240, f'country profiles too small: {len(profiles)}'
          bad=[cc for cc,v in profiles.items() if ',' not in v or not v.split(',')[0] or not v.split(',')[1]]
          assert not bad, bad
          s=Path('superapp.js').read_text(encoding='utf-8')
          mm=re.search(r"const ISO='([^']+)'\.split",s)
          assert mm, 'ISO list missing'
          iso=set(mm.group(1).split())
          missing=sorted(iso-set(profiles))
          assert not missing, f'missing country profiles: {missing}'
          required=['marketplace.html','travel.html','tourism.html','property.html','cars-auto.html','jobs.html','shopping.html','restaurants-food.html','local-services.html','import-export.html','shipping-logistics.html','business-software.html','software.html','web-hosting.html','solar.html','education.html','health.html','money-insurance.html','entertainment.html','media.html','games.html','connectivity.html','wifi.html','deal-agent.html','everyday.html','scan.html','post-ad.html','seller-plans.html']
          idx=Path('index.html').read_text(encoding='utf-8')
          hub=Path('hub.html').read_text(encoding='utf-8')
          for r in required:
              assert r in idx, f'index missing {r}'
              assert r in hub, f'hub missing {r}'
              assert Path(r.split('?')[0]).exists(), f'route file missing {r}'
          assert 'data-r8-departments="complete"' in idx
          assert 'data-r8-grid="complete"' in idx
          assert 'data-r8-hub-departments="complete"' in hub
          pages=[]
          for p in Path('.').glob('*.html'):
              if p.name.lower().startswith('google'): continue
              t=p.read_text(encoding='utf-8')
              assert 'navigation.js' in t, f'{p.name}: missing navigation'
              assert 'global-ui.js' in t, f'{p.name}: missing global UI'
              assert 'i18n-ui.js' in t, f'{p.name}: missing i18n'
              assert 'voice-ai.js' in t, f'{p.name}: missing voice'
              pages.append(p.name)
          assert len(pages)>=44, len(pages)
          print('COUNTRY_PROFILE_COUNT',len(profiles))
          print('ISO_COUNTRY_TERRITORY_COUNT',len(iso))
          print('PUBLIC_PAGE_COUNT',len(pages))
          print('A-Z SOURCE AUDIT PASS')
          PY

      - name: Commit R8 application
        run: |
          set -euo pipefail
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add worker.js voice-ai.js superapp.js global-ui.js i18n-ui.js index.html hub.html home-marketplace-r5.css sw.js manifest.webmanifest '*.html'
          if git diff --cached --quiet; then
            echo 'No R8 application changes required.'
          else
            git commit -m 'Upgrade voice, translation, AI memory and all departments R8'
            git push origin main
          fi
