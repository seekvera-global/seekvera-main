name: R76 Setswana fast rescue probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-tn-fast-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: '36254130119'
          github-token: ${{ github.token }}
          name: r76-source
          path: .
      - run: |
          python -m pip install --quiet beautifulsoup4 Babel
          python tools/r76_incremental_rescue12.py --lang tn
          python - <<'PY'
          import json
          d=json.load(open('i18n-r76/tn.json',encoding='utf-8'))
          print('TN_PROVIDER',d['provider'],'COUNT',d['count'])
          for k in ['Fixed price','All categories','Wrong category','Food & Restaurants','United Kingdom']:
              print(k,'=>',d['translations'].get(k))
          assert d['count']==1045
          bad=[k for k in ['Fixed price','All categories','Wrong category','Food & Restaurants','United Kingdom'] if d['translations'].get(k)==k]
          assert not bad,bad
          print('R76_TN_FAST_PROBE_PASS')
          PY
