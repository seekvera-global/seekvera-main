name: R35 Polytranslator API shape
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r35-polytranslator-api-shape.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Extract free web translator request contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re
          u='https://www.polytranslator.com/_next/static/chunks/12~7qpnu5jf9f.js'
          t=requests.get(u,timeout=30,headers={'User-Agent':'Mozilla/5.0'}).text
          print('LEN',len(t))
          for needle in ['TRANSLATE_API_PATH','translateText','/api/translate','class TranslateError']:
              print('\n===',needle,'===')
              pos=0;c=0
              while True:
                  i=t.find(needle,pos)
                  if i<0:break
                  print(t[max(0,i-1200):min(len(t),i+1800)].replace('\n',' '))
                  print('\n---')
                  pos=i+len(needle);c+=1
                  if c>=8:break
          PY
