name: R87 live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r87-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/r87_language_brain_fallback.py
      - name: Verify source
        run: |
          set -e
          node --check worker-r76.js
          grep -F '20260927-r87-language-independent-ai-brain' worker-r76.js
          grep -F 'pollinations-private-conversation-fallback' worker-r76.js
          grep -F 'language=messageLanguage(message,d.language)' worker-r76.js
          grep -F 'language=messageLanguage(message,obj.languageCode)' worker-r76.js
      - name: Commit source
        run: |
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add worker-r76.js index.html
          git commit -m 'R87 keep reply language independent and conversational'
          git push origin HEAD:main
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify live
        run: |
          set -e
          for i in $(seq 1 8); do
            t="$(date +%s)-$i"
            curl -LsS --max-time 20 "https://seekveraglobal.com/api/health?r87=$t" -o /tmp/h
            curl -LsS --max-time 25 -H 'content-type: application/json' -d '{"message":"Can you understand me if I switch between English and Arabic while we talk?","country":"Lebanon","language":"Arabic","history":[]}' "https://seekveraglobal.com/api/ai?r87=$t" -o /tmp/en
            curl -LsS --max-time 25 -H 'content-type: application/json' -d '{"message":"هلأ عم بحكي عربي، فهمت علي؟","country":"United States","language":"English","history":[]}' "https://seekveraglobal.com/api/ai?r87=$t" -o /tmp/ar
            curl -LsS --max-time 25 -H 'content-type: application/json' -d '{"message":"I need a hotel in Beirut tonight under 100 dollars","country":"Lebanon","language":"Arabic","history":[]}' "https://seekveraglobal.com/api/ai?r87=$t" -o /tmp/job
            if jq -e '.r87==true and .r86Voice=="whisper-auto-language-independent-of-ui"' /tmp/h >/dev/null && jq -e '.category=="general" and .language=="en" and (.response|length>5)' /tmp/en >/dev/null && jq -e '.category=="general" and .language=="ar" and (.response|length>5)' /tmp/ar >/dev/null && jq -e '.category=="travel" and .language=="en" and (.response|length>5)' /tmp/job >/dev/null; then
              echo R87_LIVE_PASS
              exit 0
            fi
            sleep 3
          done
          cat /tmp/h /tmp/en /tmp/ar /tmp/job || true
          exit 1
