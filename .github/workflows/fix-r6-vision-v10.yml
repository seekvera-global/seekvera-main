name: Fix R6 Vision V10
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-r6-vision-v10.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate
        run: |
          python3 .github/scripts/patch_r6_vision_empty_fallback_v10.py
          node --check worker.js
          grep -q 'top-level-image' worker.js
      - name: Commit
        run: |
          git config user.name seekvera-bot
          git config user.email actions@users.noreply.github.com
          git add worker.js
          if ! git diff --cached --quiet; then
            git commit -m 'Skip empty Vision responses and try native image input'
            git push origin main
          fi
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy
      - name: Test live visual search
        run: |
          python3 - <<'PY'
          import base64,struct,zlib,binascii,json,urllib.request,time
          w=h=96
          raw=b''.join(b'\x00'+b'\x22\x88\xdd\xff'*w for _ in range(h))
          def chunk(t,z): return struct.pack('>I',len(z))+t+z+struct.pack('>I',binascii.crc32(t+z)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          image='data:image/png;base64,'+base64.b64encode(png).decode()
          H={'Content-Type':'application/json','User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 19_0 like Mac OS X) AppleWebKit/605.1.15 Version/19.0 Mobile/15E148 Safari/604.1','Origin':'https://seekveraglobal.com','Referer':'https://seekveraglobal.com/'}
          body=json.dumps({'image':image,'country':'Worldwide','language':'English','context':'Safe ordinary test image'}).encode()
          last={}
          for n in range(5):
              req=urllib.request.Request('https://seekveraglobal.com/api/visual-search',data=body,headers=H,method='POST')
              with urllib.request.urlopen(req,timeout=110) as r: d=json.loads(r.read().decode())
              last=d; print('TRY',n+1,json.dumps(d,ensure_ascii=False)[:1200],flush=True)
              if d.get('ok') and d.get('allowed') is True and d.get('reviewRequired') is False and d.get('summary') and d.get('suggestedQuery'):
                  print('FULL VISUAL SEARCH PASS',d.get('category'),d.get('summary'),flush=True)
                  break
              time.sleep(4)
          else:
              raise SystemExit('Visual Search failed: '+str(last)[:1200])
          PY
      - name: Result
        run: echo 'R6 VISION V10 PASS'
