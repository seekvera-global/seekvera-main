name: Deploy SEEKVERA R23 to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'r20-final-guard.js'
      - 'r22-category-lock.js'
      - 'sw.js'
      - 'worker.js'
      - 'locale-r15.js'
      - 'locale-r14-categories.js'
      - 'r20-extra-categories.js'
      - 'navigation.js'
      - 'global-ui.js'
      - 'i18n-ui.js'
      - '*.html'
      - '.assetsignore'
      - '.github/workflows/deploy-cloudflare-r20b.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: seekvera-cloudflare-production-r23
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate R23 source
        shell: bash
        run: |
          set -euo pipefail
          for f in worker.js voice-ai.js i18n-ui.js global-ui.js sw.js navigation.js r20-final-guard.js r22-category-lock.js locale-r15.js locale-r14-categories.js r20-extra-categories.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re
          g=Path('global-ui.js').read_text(encoding='utf-8')
          n=Path('navigation.js').read_text(encoding='utf-8')
          i=Path('i18n-ui.js').read_text(encoding='utf-8')
          guard=Path('r20-final-guard.js').read_text(encoding='utf-8')
          lock=Path('r22-category-lock.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          pm=re.search(r'const COUNTRY_PROFILE=Object\.fromEntries\(`([^`]+)`\.split',g,re.S)
          lm=re.search(r'const WORLD_LANGS=\[([^\]]+)\]',n,re.S)
          im=re.search(r'const SUPPORTED=\[([^\]]+)\]',i,re.S)
          assert pm and lm and im
          profiles={x.split(':',1)[0]:x.split(':',1)[1] for x in pm.group(1).split(';') if x}
          langs=re.findall(r"'([^']+)'",lm.group(1)); ilangs=re.findall(r"'([^']+)'",im.group(1))
          assert len(profiles)==248,len(profiles); assert len(langs)==98,len(langs); assert len(ilangs)==98,len(ilangs)
          for cc,val in profiles.items(): assert val.split(',',1)[0] in langs,(cc,val)
          assert '20260925-r23-stable' in guard and 'MutationObserver' not in guard
          assert '20260925-r23-category' in lock and 'MutationObserver' not in lock
          assert "const CACHE='seekvera-r23-stable-20260925'" in sw
          assert 'r21-card-cleanup.js' not in sw
          assert "const RELEASE='20260924-ai-r17'" in Path('worker.js').read_text(encoding='utf-8')
          print('R23 SOURCE PASS —',len(profiles),'countries,',len(langs),'languages')
          PY
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-r23-dry
          grep -q '"binding": "AI"' wrangler.jsonc
          rm -rf .wrangler-r23-dry .wrangler
      - name: Check credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify live R23 assets
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          S='https://seekveraglobal.com'; ok=0
          for i in $(seq 1 60); do
            curl -LfsS --max-time 25 -H 'Cache-Control: no-cache' "$S/r20-final-guard.js?r23=$i" -o /tmp/g || true
            curl -LfsS --max-time 25 -H 'Cache-Control: no-cache' "$S/r22-category-lock.js?r23=$i" -o /tmp/l || true
            curl -LfsS --max-time 25 -H 'Cache-Control: no-cache' "$S/sw.js?r23=$i" -o /tmp/sw || true
            if grep -q '20260925-r23-stable' /tmp/g 2>/dev/null && grep -q '20260925-r23-category' /tmp/l 2>/dev/null && grep -q 'seekvera-r23-stable-20260925' /tmp/sw 2>/dev/null; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          ! grep -q 'MutationObserver' /tmp/g
          ! grep -q 'MutationObserver' /tmp/l
          ! grep -q 'r21-card-cleanup.js' /tmp/sw
          curl -LfsS --max-time 25 "$S/api/health?r23=1" -o /tmp/health
          grep -q '"ok":true' /tmp/health
          grep -q '20260924-ai-r17' /tmp/health
          echo 'LIVE R23 DEPLOY PASS'
      - name: Missing credentials
        if: steps.cf.outputs.ready != 'true'
        run: |
          echo 'Cloudflare deployment credentials are missing.' >&2
          exit 1
