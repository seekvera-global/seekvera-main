name: R35 parallel 98-language final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r35-parallel-final.yml'
      - 'tools/r35_build_pack.py'
      - 'tools/r35_finalize.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.meta.outputs.languages }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet beautifulsoup4 Babel
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          python tools/r35_build_pack.py --source-only
          echo "languages=$(cat i18n-r35-languages.json)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          l=json.load(open('i18n-r35-languages.json'))
          s=json.load(open('i18n-r35-source.json'))
          assert len(l)==98 and s['count']>100,(len(l),s['count'])
          print('R35 PREPARE PASS',len(l),'languages',s['count'],'strings',s['sourceHash'])
          PY

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        lang: ${{ fromJSON(needs.prepare.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet beautifulsoup4 Babel
      - name: Build ${{ matrix.lang }} static pack
        run: python tools/r35_build_pack.py --lang '${{ matrix.lang }}'
      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.lang }}
          path: i18n-r35/${{ matrix.lang }}.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  final:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet beautifulsoup4 Babel
      - uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          path: i18n-r35
          merge-multiple: true

      - name: Assemble and validate all 98 local language packs
        shell: bash
        run: |
          set -euo pipefail
          python tools/r35_build_pack.py --source-only
          test "$(find i18n-r35 -maxdepth 1 -name '*.json' ! -name 'manifest.json' | wc -l)" -eq 98
          rm -rf i18n-r32
          mkdir -p i18n-r32
          cp i18n-r35/*.json i18n-r32/
          cp i18n-r35-source.json i18n-r32-source.json
          python - <<'PY'
          import json,re
          src=json.load(open('i18n-r35-source.json',encoding='utf-8'))
          langs=json.load(open('i18n-r35-languages.json',encoding='utf-8'))
          assert len(langs)==98 and src['count']>100
          providers={}; bad=[]
          for l in langs:
              p=f'i18n-r32/{l}.json';d=json.load(open(p,encoding='utf-8'))
              assert d['sourceHash']==src['sourceHash'],(l,d.get('sourceHash'),src['sourceHash'])
              assert d['count']==src['count'] and len(d['translations'])==src['count'],(l,d.get('count'))
              providers[d.get('provider','unknown')]=providers.get(d.get('provider','unknown'),0)+1
              if l!='en':
                  candidates=[s for s in src['strings'] if len(s)>=14 and 'SEEKVERA' not in s and re.search(r'[A-Za-z]',s) and ' ' in s]
                  same=[s for s in candidates if str(d['translations'].get(s,'')).strip()==s.strip()]
                  if len(same)>max(25,int(len(candidates)*.18)):bad.append((l,len(same),same[:6]))
          assert not bad,'too many untranslated static strings '+repr(bad[:8])
          manifest={'version':'20260925-r35-static-v1','sourceHash':src['sourceHash'],'sourceCount':src['count'],'languages':langs,'packs':98,'providers':providers}
          open('i18n-r32/manifest.json','w',encoding='utf-8').write(json.dumps(manifest,ensure_ascii=False,separators=(',',':')))
          print('R35 PACKS PASS',json.dumps(manifest,ensure_ascii=False))
          PY

      - name: Apply deterministic locale runtime, AI failover and R35 release stamp
        shell: bash
        run: |
          set -euo pipefail
          python tools/r32_pack_runtime_patch.py
          python tools/r32_global_final.py
          python tools/r32_ai_failover_patch.py
          python tools/r32_translation_backend_fix.py
          python tools/r35_finalize.py
          node --check r32-i18n.js
          node --check i18n-ui.js
          node --check worker-r31.js
          node --check worker.js
          grep -q 'loadPack' i18n-ui.js
          grep -q 'r35-static-v1' i18n-ui.js
          grep -q 'r35Runtime' worker-r31.js
          grep -q 'i18n-ui.js?v=20260925-r35-global-final' index.html

      - name: Deploy R35 audited candidate to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Wait for R35 production
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            b="$(curl -LfsS --max-time 15 "https://seekveraglobal.com/api/health?r35=$i" || true)"
            if echo "$b" | grep -q 'parallel-static-98-language-country-category-final'; then echo "$b"; exit 0; fi
            sleep 3
          done
          exit 1

      - name: Final live audit - 248 countries, 98 languages, 31 categories, Iraq, AI
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > r35-final-audit.mjs <<'JS'
          import {chromium} from 'playwright';import assert from 'node:assert/strict';
          const B='https://seekveraglobal.com';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:390,height:844},locale:'en-US',serviceWorkers:'block'});
          const page=await ctx.newPage();const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
          await page.route('**/api/ui-translate',r=>r.abort());await page.route('https://text.pollinations.ai/**',r=>r.abort());
          await page.goto(B+'/?r35='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForFunction(()=>window.SEEKVERA_I18N_R32&&window.SEEKVERA_LOCALE_R15&&window.SEEKVERA_LOCALE_R14&&window.SEEKVERA_R14_CATEGORIES&&window.SEEKVERA_R22_CATEGORY_LOCK,{timeout:20000});
          const manifest=await (await ctx.request.get(B+'/i18n-r32/manifest.json?v='+Date.now())).json();
          const source=await (await ctx.request.get(B+'/i18n-r32-source.json?v='+Date.now())).json();
          assert.equal(manifest.packs,98);assert.equal(manifest.languages.length,98);assert(source.count>100);
          const meta=await page.evaluate(()=>({profiles:SEEKVERA_LOCALE_R15.profiles,langs:Object.keys(SEEKVERA_R14_CATEGORIES.data)}));
          assert.equal(Object.keys(meta.profiles).length,248);assert.equal(meta.langs.length,98);
          const packCache={};
          for(let i=0;i<manifest.languages.length;i+=16){await Promise.all(manifest.languages.slice(i,i+16).map(async l=>{const r=await ctx.request.get(B+'/i18n-r32/'+l+'.json?v='+manifest.sourceHash,{timeout:20000});assert.equal(r.status(),200,l+' pack HTTP');const d=await r.json();assert.equal(d.count,source.count,l+' count');assert.equal(Object.keys(d.translations).length,source.count,l+' map');packCache[l]=d.translations}))}

          // User-reported screenshot case: Iraq must become Arabic + IQD everywhere, including delayed marketplace text.
          await page.evaluate(()=>SEEKVERA_LOCALE_R15.setCountry('IQ'));
          await page.evaluate(async()=>{await SEEKVERA_I18N_R32.loadPack('ar');SEEKVERA_I18N_R32.schedule(0);SEEKVERA_R22_CATEGORY_LOCK.lock()});
          await page.waitForFunction(()=>document.documentElement.dataset.seekveraPackReady==='ar'&&document.documentElement.dataset.seekveraI18nReady==='ar'&&document.documentElement.dir==='rtl',{timeout:12000});
          const leaks=['No approved live marketplace listings are available right now','SEEKVERA does not generate fake listings','Find, compare, choose — worldwide','Popular categories','Live marketplace','Request anything'];
          async function checkIraq(label){const x=await page.evaluate(()=>({body:document.body.innerText,cc:country.value,l:lang.value,c:currency.value,cards:document.querySelectorAll('#categories .r5-tile').length,thumb:[...document.querySelectorAll('#categories .r5-thumb')].map(n=>(n.textContent||'').trim()),overflow:document.documentElement.scrollWidth-innerWidth,mic:!!document.querySelector('#aiChatMic'),speaker:!!document.querySelector('#aiChatSpeaker')}));assert.deepEqual([x.cc,x.l,x.c],['IQ','ar','IQD'],label);for(const q of leaks)assert(!x.body.includes(q),label+' English leak '+q);assert.equal(x.cards,31,label+' cards');assert(!x.thumb.some(t=>/[A-Za-z.]|seekvera/i.test(t)),label+' bad icon '+JSON.stringify(x.thumb));assert(x.overflow<=4,label+' overflow');assert(x.mic&&x.speaker,label+' voice controls')}
          await page.waitForTimeout(400);await checkIraq('0.4s');await page.waitForTimeout(2200);await checkIraq('2.6s');await page.waitForTimeout(3000);await checkIraq('5.6s');

          // All 248 countries: one click atomically changes country, default language and currency.
          const badCountries=[];for(const [cc,pr] of Object.entries(meta.profiles)){await page.evaluate(cc=>SEEKVERA_LOCALE_R15.setCountry(cc),cc);const g=await page.evaluate(()=>({cc:country.value,l:lang.value,c:currency.value}));if(g.cc!==cc||g.l!==pr.language||g.c!==pr.currency)badCountries.push({cc,pr,g})}assert.equal(badCountries.length,0,'country mapping '+JSON.stringify(badCountries.slice(0,8)));

          // Every supported language on the real homepage with both remote translators blocked.
          const critical=['No approved live marketplace listings are available right now.','SEEKVERA does not generate fake listings.','Find, compare, choose — worldwide.','Popular categories','Live marketplace','Request anything','Privacy','Terms','Contact','Disclosure'];
          for(const l of manifest.languages){await page.evaluate(l=>SEEKVERA_LOCALE_R15.setLanguage(l),l);await page.evaluate(async l=>{await SEEKVERA_I18N_R32.loadPack(l);SEEKVERA_I18N_R32.schedule(0);SEEKVERA_R22_CATEGORY_LOCK.lock()},l);if(l!=='en')await page.waitForFunction(l=>document.documentElement.dataset.seekveraPackReady===l&&document.documentElement.dataset.seekveraI18nReady===l,l,{timeout:10000});await page.waitForTimeout(35);const x=await page.evaluate(()=>({body:document.body.innerText,l:lang.value,tiles:[...document.querySelectorAll('#categories .r5-tile-body b')].slice(0,31).map(x=>x.textContent.trim()),small:[...document.querySelectorAll('#categories .r5-tile-body small')].filter(x=>!x.hidden).map(x=>x.textContent.trim()),overflow:document.documentElement.scrollWidth-innerWidth,foot:[...document.querySelectorAll('.r5-foot a')].map(x=>x.textContent.trim())}));assert.equal(x.l,l,l+' selected');assert(x.overflow<=4,l+' overflow');assert.equal(x.tiles.length,31,l+' categories');const expected=await page.evaluate(l=>SEEKVERA_R14_CATEGORIES.data[l],l);assert.deepEqual(x.tiles,expected,l+' titles');if(l!=='en'){assert.equal(x.small.length,0,l+' English descriptions');for(const q of critical){const tr=packCache[l][q];if(tr&&tr!==q)assert(!x.body.includes(q),l+' English leak '+q)}assert(!x.foot.some(t=>['About','Privacy','Terms','Contact','Disclosure'].includes(t)),l+' footer leak')}}

          // All 31 category destinations must exist and Arabic must localize each page without translation APIs.
          await page.evaluate(()=>SEEKVERA_LOCALE_R15.setLanguage('ar'));await page.evaluate(async()=>{await SEEKVERA_I18N_R32.loadPack('ar');SEEKVERA_I18N_R32.schedule(0);SEEKVERA_R22_CATEGORY_LOCK.lock()});await page.waitForTimeout(80);
          const hrefs=await page.evaluate(()=>[...new Set([...document.querySelectorAll('#categories .r5-tile')].map(a=>a.getAttribute('href')).filter(Boolean))]);assert.equal(hrefs.length,31,'category href count');
          const routeBad=[];for(let i=0;i<hrefs.length;i+=10){await Promise.all(hrefs.slice(i,i+10).map(async h=>{try{const r=await ctx.request.get(new URL(h,B).href,{timeout:15000});const t=await r.text();if(r.status()>=400||t.length<180)routeBad.push({h,s:r.status(),n:t.length})}catch(e){routeBad.push({h,e:String(e)})}}))}assert.equal(routeBad.length,0,'routes '+JSON.stringify(routeBad));
          const arPack=packCache.ar;const arCheck=source.strings.filter(s=>s.length>=8&&arPack[s]&&arPack[s]!==s&&!/^SEEKVERA\b/.test(s));const deepBad=[];
          for(const h of hrefs){const p=await ctx.newPage();const e=[];p.on('pageerror',x=>e.push(String(x)));await p.route('**/api/ui-translate',r=>r.abort());await p.route('https://text.pollinations.ai/**',r=>r.abort());try{await p.goto(new URL(h,B).href+'?r35deep='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await p.waitForFunction(()=>window.SEEKVERA_I18N_R32&&window.SEEKVERA_LOCALE_R15,{timeout:15000});await p.evaluate(()=>SEEKVERA_LOCALE_R15.setLanguage('ar'));await p.evaluate(async()=>{await SEEKVERA_I18N_R32.loadPack('ar');SEEKVERA_I18N_R32.schedule(0)});await p.waitForFunction(()=>document.documentElement.dataset.seekveraI18nReady==='ar',{timeout:10000});await p.waitForTimeout(80);const body=await p.evaluate(()=>document.body.innerText);const q=arCheck.filter(s=>body.includes(s)).slice(0,8);if(q.length||e.length)deepBad.push({h,leaks:q,errors:e.slice(0,3)})}catch(err){deepBad.push({h,error:String(err)})}finally{await p.close()}}assert.equal(deepBad.length,0,'deep localization '+JSON.stringify(deepBad.slice(0,5)));
          assert.equal(pageErrors.length,0,'page errors '+pageErrors.join(' | '));
          console.log('R35 UI PASS',JSON.stringify({countries:248,languages:98,categories:31,sourceStrings:source.count,iraq:'Arabic/IQD/no-English',remoteTranslation:'blocked'}));

          // Production AI: multiple languages/scripts, non-empty response.
          const aiCases=[['IQ','ar','مرحبا'],['US','en','Hello'],['FR','fr','Bonjour'],['DE','de','Hallo'],['CN','zh','你好'],['IN','hi','नमस्ते'],['TR','tr','Merhaba']];const aiBad=[];
          for(const [cc,l,msg] of aiCases){try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);const r=await fetch(B+'/api/ai',{method:'POST',headers:{'content-type':'application/json','Origin':B},body:JSON.stringify({message:msg,country:cc,language:l,fast:true}),signal:ctl.signal});clearTimeout(to);const d=await r.json();const text=String(d?.response||'').trim();if(!r.ok||!d?.ok||text.length<2||text==='…')aiBad.push({cc,l,status:r.status,body:d})}catch(e){aiBad.push({cc,l,error:String(e)})}}assert.equal(aiBad.length,0,'AI '+JSON.stringify(aiBad));console.log('R35 AI PASS',JSON.stringify({cases:aiCases.length}));
          await browser.close();
          JS
          node r35-final-audit.mjs

      - name: Commit only fully audited R35 production release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SEEKVERA R35 Final'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add i18n-r32 i18n-r32-source.json r32-i18n.js i18n-ui.js locale-r15.js worker-r31.js worker.js sw.js '*.html'
          if git diff --cached --quiet; then echo 'No generated changes'; else git commit -m 'R35: ship audited static 98-language worldwide release'; git push origin main; fi
