name: SEEKVERA mobile UI cleanup 2026-09-23

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ui-hotfix-20260923.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply clean mobile marketplace hotfix
        shell: bash
        env:
          CSS_B64: "--LmFpLW1zZy5ib3Q6Zmlyc3QtY2hpbGQ6OmFmdGVye2NvbnRlbnQ6J0plIHN1aXMgbOKAmUlBIFNFRUtWRVJBLiBEaXRlcy1tb2kgY2UgZG9udCB2b3VzIGF2ZXogYmVzb2luIG91IHBhcmxlei1tb2kuJ30KaHRtbFtsYW5nXj0nemgnXSAucjUtY2hhdCAuc3YtY2hhdC1tZXNzYWdlcz4uYWktbXNnLmJvdDpmaXJzdC1jaGlsZDo6YWZ0ZXJ7Y29udGVudDon5oiR5pivIFNFRUtWRVJBI...TRUNCATED..."
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          css = base64.b64decode(os.environ['CSS_B64']).decode('utf-8')
          p = Path('home-marketplace-r5.css')
          s = p.read_text()
          if 'SEEKVERA MOBILE CLEANUP R5B' not in s:
              p.write_text(s + css)
          q = Path('index.html')
          t = q.read_text()
          t = t.replace('<html lang="en" dir="ltr">','<html lang="en" dir="ltr" translate="no">',1)
          marker = '<meta name="google" content="notranslate">'
          if marker not in t:
              t = t.replace('<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">','<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'+marker,1)
          q.write_text(t)
          PY
          git config user.name 'SEEKVERA automation'
          git config user.email 'actions@users.noreply.github.com'
          git add home-marketplace-r5.css index.html
          if git diff --cached --quiet; then
            echo 'No changes required'
          else
            git commit -m 'Clean mobile homepage layout and language presentation'
            git push
          fi
