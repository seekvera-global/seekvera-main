CSS
          fi

          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<html lang="en" dir="ltr">','<html lang="en" dir="ltr" translate="no">',1)
          marker='<meta name="google" content="notranslate">'
          if marker not in s:
              s=s.replace('<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">','<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'+marker,1)
          p.write_text(s)
          PY

          git config user.name 'SEEKVERA automation'
          git config user.email 'actions@users.noreply.github.com'
          git add home-marketplace-r5.css index.html
          if git diff --cached --quiet; then
            echo 'No changes required'
          else
            git commit -m 'Clean mobile homepage layout and language presentation'
            git push
          fi
