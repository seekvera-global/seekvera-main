name: SEEKVERA mobile UI cleanup 2026-09-23

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ui-hotfix-20260923.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link clean mobile stylesheet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          link='<link rel="stylesheet" href="mobile-r5b.css?v=20260923-r5b">'
          if link not in s:
              anchor='<link rel="stylesheet" href="home-marketplace-r5.css?v=20260923-market-r5">'
              if anchor not in s:
                  raise SystemExit('home stylesheet anchor missing')
              s=s.replace(anchor,anchor+'\n'+link,1)
          p.write_text(s)
          PY
          git config user.name 'SEEKVERA automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes required'
          else
            git commit -m 'Link clean mobile R5B stylesheet'
            git push
          fi
