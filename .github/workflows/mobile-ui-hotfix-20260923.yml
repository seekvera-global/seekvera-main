name: SEEKVERA mobile UI cleanup 2026-09-23

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ui-hotfix-20260923.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link final R5B mobile and language fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          mobile='<link rel="stylesheet" href="mobile-r5b.css?v=20260923-r5b">'
          safety='<link rel="stylesheet" href="r5b-language-fix.css?v=20260923-r5b2">'
          if mobile not in s:
              anchor='<link rel="stylesheet" href="home-marketplace-r5.css?v=20260923-market-r5">'
              if anchor not in s: raise SystemExit('home stylesheet anchor missing')
              s=s.replace(anchor,anchor+'\n'+mobile,1)
          if safety not in s:
              s=s.replace(mobile,mobile+'\n'+safety,1)
          script='<script src="home-r5b-i18n.js?v=20260923-r5b2" defer></script>'
          if script not in s:
              anchor='<script src="i18n-ui.js?v=20260923-market-r5" defer></script>'
              if anchor not in s: raise SystemExit('i18n script anchor missing')
              s=s.replace(anchor,anchor+'\n'+script,1)
          p.write_text(s)
          PY
          git config user.name 'SEEKVERA automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes required'
          else
            git commit -m 'Load final R5B language and mobile rendering fixes'
            git push
          fi
