name: SEEKVERA mobile UI cleanup 2026-09-23

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ui-hotfix-20260923.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply clean mobile marketplace hotfix
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'SEEKVERA MOBILE CLEANUP R5B' home-marketplace-r5.css; then
            cat >> home-marketplace-r5.css <<'CSS'

/* SEEKVERA MOBILE CLEANUP R5B — restores compact marketplace feel */
@media(max-width:780px){
  .r5-top{position:relative!important;top:auto!important;box-shadow:0 1px 7px rgba(20,32,51,.05)!important}
  .r5-top-inner{padding:9px 10px!important;gap:7px!important}
  .r5-brand{font-size:15px!important;letter-spacing:.045em!important}
  .r5-brand small{display:none!important}
  .r5-mark{width:36px!important;height:36px!important;border-radius:11px!important}
  .r5-controls{width:100%!important;margin:0!important;display:grid!important;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) 76px!important;gap:6px!important;align-items:center!important}
  .r5-controls .sv-control-field{display:block!important;min-width:0!important;max-width:none!important;width:auto!important;margin:0!important}
  .r5-controls .sv-control-field small,.r5-controls .sv-control-caption{display:none!important}
  .r5-controls .sv-select{height:42px!important;border-radius:12px!important;font-size:12px!important;padding:6px 8px!important;font-weight:800!important}
  .r5-controls #installBtn,.r5-controls .r5-post{display:none!important}
  .r5-shell{padding:8px 9px 28px!important}
  .r5-market{display:block!important}
  .r5-left{display:none!important}
  .r5-right{display:none!important}
  .r5-hero{padding:13px!important;border-radius:16px!important;box-shadow:0 5px 20px rgba(20,32,51,.055)!important}
  .r5-kicker{gap:5px!important;margin:0 0 4px!important}
  .r5-kicker span:nth-child(1),.r5-kicker span:nth-child(3),.r5-kicker span:nth-child(5){font-size:0!important}
  .r5-kicker span:nth-child(1)::after{content:'🌍';font-size:13px!important}
  .r5-kicker span:nth-child(3)::after{content:'✨ AI';font-size:10px!important}
  .r5-kicker span:nth-child(5)::after{content:'🎙️ + 💬';font-size:10px!important}
  .r5-hero>p{display:none!important}
  .r5-scope{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important;margin-top:9px!important}
  .r5-scope button{min-width:0!important;width:100%!important;padding:8px 5px!important;font-size:10.5px!important;white-space:nowrap!important}
  .r5-chat{margin-top:10px!important;border-radius:14px!important;box-shadow:none!important}
  .r5-chat .sv-chat-head{padding:9px 10px!important;min-height:48px!important}
  .r5-chat .sv-chat-head b{font-size:13px!important}
  .r5-chat .sv-chat-head small{font-size:9px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
  .r5-chat .sv-chat-head>span{font-size:10px!important;white-space:nowrap!important}
  .r5-chat .sv-chat-messages{min-height:54px!important;max-height:105px!important;padding:8px!important}
  .r5-chat .ai-msg{max-width:96%!important;padding:7px 9px!important;line-height:1.35!important}
  .r5-chat .sv-chat-form{grid-template-columns:minmax(0,1fr) 36px 36px 40px!important;gap:5px!important;padding:7px!important}
  .r5-chat .sv-chat-form .attach{display:none!important}
  .r5-chat .sv-chat-form input[type=text],.r5-chat #aiChatInput{height:40px!important;font-size:12px!important;padding:8px 10px!important;min-width:0!important}
  .r5-chat .sv-chat-form button{width:36px!important;height:38px!important;min-width:36px!important}
  .r5-chat .sv-chat-form .send{width:40px!important;min-width:40px!important}
  .r5-ai-note,.r5-chips{display:none!important}
  .r5-section{margin-top:9px!important;padding:10px!important;border-radius:15px!important}
  .r5-section-head{margin-bottom:8px!important;align-items:center!important}
  .r5-section-head p{display:none!important}
  .r5-section-head h2{font-size:15px!important}
  .r5-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
  .r5-tile{border-radius:14px!important;box-shadow:0 2px 8px rgba(20,32,51,.035)!important}
  .r5-thumb{height:74px!important;font-size:30px!important;background:linear-gradient(145deg,#edf8f3,#eef3fb)!important}
  .r5-tile-body{padding:8px 9px!important}
  .r5-tile b{font-size:12px!important;white-space:normal!important;overflow-wrap:anywhere!important}
  .r5-tile small{display:none!important}
  .r5-request{grid-template-columns:1fr!important}
  .r5-request textarea,.r5-request .full{grid-column:auto!important}
  .r5-foot{font-size:10px!important;padding:18px 3px calc(22px + env(safe-area-inset-bottom))!important}
}
@media(max-width:380px){
  .r5-controls{grid-template-columns:minmax(0,1.35fr) minmax(0,.95fr) 68px!important}
  .r5-controls .sv-select{font-size:11px!important;padding:5px 6px!important}
  .r5-scope button{font-size:9.5px!important}
  .r5-chat .sv-chat-form{grid-template-columns:minmax(0,1fr) 34px 34px 38px!important}
  .r5-chat .sv-chat-form button{width:34px!important;min-width:34px!important}
  .r5-chat .sv-chat-form .send{width:38px!important;min-width:38px!important}
}

