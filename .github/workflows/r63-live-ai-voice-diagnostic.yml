name: R63 live production AI voice diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r63-live-ai-voice-diagnostic.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Test live health and real AI exact requests
        shell: bash
        run: |
          set -euo pipefail
          S='https://seekveraglobal.com'
          echo '--- health ---'
          curl -L -sS --max-time 20 -D /tmp/health.h -o /tmp/health.json "$S/api/health"
          head -c 1200 /tmp/health.json; echo
          for spec in \
            'ar|عم دور على شغل بامريكا' \
            'en|I am looking for a job in America' \
            'fr|Je cherche un travail aux États-Unis'; do
            lang="${spec%%|*}"; msg="${spec#*|}"
            echo "--- AI $lang: $msg ---"
            MSG="$msg" python - <<'PY'
          import json, os
          with open('/tmp/payload.json','w',encoding='utf-8') as f:
              json.dump({'message':os.environ['MSG'],'country':'Worldwide','language':'auto','fast':True},f,ensure_ascii=False)
          PY
            start=$(date +%s%3N)
            code=$(curl -L -sS --max-time 30 -D "/tmp/ai-$lang.h" -o "/tmp/ai-$lang.json" -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/payload.json "$S/api/ai")
            end=$(date +%s%3N); echo "AI_${lang}_CODE=$code MS=$((end-start))"
            cat "/tmp/ai-$lang.json"; echo
            test "$code" = 200
          done
          python - <<'PY'
          import json
          for lang in ('ar','en','fr'):
              d=json.load(open(f'/tmp/ai-{lang}.json',encoding='utf-8'))
              assert d.get('ok') is True, d
              text=str(d.get('response','')).strip()
              assert len(text)>3, d
              if lang=='ar': assert any('\u0600' <= c <= '\u06ff' for c in text), d
              if lang=='fr': assert any(x in text.lower() for x in ['travail','emploi','états','je','vous','poste']), d
              print('AI_PASS',lang,d.get('model'),d.get('language'),d.get('category'),d.get('route'))
          PY
      - name: Test live TTS to real transcription roundtrip
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          S='https://seekveraglobal.com'
          code=$(curl -L -sS --max-time 30 -D /tmp/tts.h -o /tmp/voice.mp3 -w '%{http_code}' -H 'content-type: application/json' --data '{"text":"مرحبا، أريد أن أبحث عن عمل في أمريكا","language":"ar"}' "$S/api/tts")
          echo "TTS_CODE=$code BYTES=$(wc -c </tmp/voice.mp3) TYPE=$(grep -i '^content-type:' /tmp/tts.h|tail -1|tr -d '\r')"
          test "$code" = 200
          test "$(wc -c </tmp/voice.mp3)" -gt 500
          python - <<'PY'
          import base64,json
          b=open('/tmp/voice.mp3','rb').read()
          json.dump({'audio':'data:audio/mpeg;base64,'+base64.b64encode(b).decode(),'language':'auto'},open('/tmp/transcribe.json','w'))
          PY
          code=$(curl -L -sS --max-time 45 -D /tmp/stt.h -o /tmp/stt.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/transcribe.json "$S/api/transcribe")
          echo "STT_CODE=$code"
          cat /tmp/stt.json; echo
          test "$code" = 200
