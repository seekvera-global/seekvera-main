name: Fix SEEKVERA custom domain AI once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ai-runtime-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch custom-domain access and voice retries
        shell: python
        run: |
          from pathlib import Path

          p=Path('worker.js')
          s=p.read_text(encoding='utf-8')
          old="const ORIGINS=new Set(['https://seekvera-global.github.io','https://seekvera-main.seekvera-global.workers.dev']);"
          new="const ORIGINS=new Set(['https://seekvera-global.github.io','https://seekvera-main.seekvera-global.workers.dev','https://seekveraglobal.com','https://www.seekveraglobal.com']);"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Expected ORIGINS line not found')
          p.write_text(s,encoding='utf-8')

          v=Path('voice-ai.js')
          t=v.read_text(encoding='utf-8')
          old_fetch="    const res=await fetch(`${API_BASE}/api/ai`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:clean,country:currentCountry(),language:languageName(),voice:true})});\n    const data=await res.json().catch(()=>({}));\n    if(!res.ok||!data?.response)throw new Error(data?.error||'AI unavailable');\n    const answer=String(data.response).trim(); setAnswer(answer);setState('idle','');"
          new_fetch="    let data=null,lastError='AI unavailable';\n    for(let attempt=1;attempt<=3;attempt++){\n      try{\n        const res=await fetch(`${API_BASE}/api/ai`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:clean,country:currentCountry(),language:languageName(),voice:true})});\n        data=await res.json().catch(()=>({}));\n        if(res.ok&&data?.response)break;\n        lastError=data?.error||('AI HTTP '+res.status);\n      }catch(e){lastError=e?.message||'AI unavailable'}\n      if(attempt<3)await new Promise(r=>setTimeout(r,700*attempt));\n    }\n    if(!data?.response)throw new Error(lastError);\n    const answer=String(data.response).trim(); setAnswer(answer);setState('idle','');"
          if old_fetch in t:
              t=t.replace(old_fetch,new_fetch,1)
          elif 'for(let attempt=1;attempt<=3;attempt++)' not in t:
              raise SystemExit('Expected voice fetch block not found')
          v.write_text(t,encoding='utf-8')

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          node --check voice-ai.js
          grep -q "https://seekveraglobal.com" worker.js
          grep -q "https://www.seekveraglobal.com" worker.js
          grep -q "for(let attempt=1;attempt<=3;attempt++)" voice-ai.js

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- worker.js voice-ai.js; then
            echo 'Repair already applied.'
            exit 0
          fi
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add worker.js voice-ai.js
          git commit -m 'Fix custom domain AI access and voice retries'
          git push
