name: Fix SEEKVERA Workers AI runtime once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ai-runtime-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Workers AI resilience
        shell: python
        run: |
          from pathlib import Path

          p=Path('worker.js')
          s=p.read_text(encoding='utf-8')

          old="const PRIMARY='@cf/google/gemma-4-26b-a4b-it',FALLBACK='@cf/zai-org/glm-4.7-flash',VISION='@cf/meta/llama-3.2-11b-vision-instruct';"
          new="const PRIMARY='@cf/google/gemma-4-26b-a4b-it',FALLBACK='@cf/zai-org/glm-4.7-flash',LIGHT='@cf/qwen/qwen3-30b-a3b-fp8',VISION='@cf/meta/llama-3.2-11b-vision-instruct';"
          if old in s:
              s=s.replace(old,new,1)

          old_ai="async function ai(env,messages,max=320,temp=.2){try{const r=await env.AI.run(PRIMARY,{messages,max_completion_tokens:max,temperature:temp},{rejectIfBusy:true}),s=out(r);if(s)return{response:s,model:PRIMARY}}catch(e){console.warn('primary unavailable',e)}const r=await env.AI.run(FALLBACK,{messages,max_completion_tokens:max,temperature:temp}),s=out(r);if(!s)throw Error('empty AI response');return{response:s,model:FALLBACK}}"
          new_ai="async function ai(env,messages,max=320,temp=.2){const errors=[];for(const model of [PRIMARY,FALLBACK,LIGHT]){try{const input={messages,temperature:temp};if(model===LIGHT)input.max_tokens=Math.min(max,360);else input.max_completion_tokens=max;const r=await env.AI.run(model,input),s=out(r);if(s)return{response:s,model};errors.push(model+':empty')}catch(e){errors.push(model+':'+clean(e?.message||e,180));console.warn('AI model unavailable',model,e)}}throw Error(errors.join(' | '))}"
          if old_ai not in s:
              raise SystemExit('Expected ai() function not found; refusing unsafe patch')
          s=s.replace(old_ai,new_ai,1)

          s=s.replace("fallbackModel:FALLBACK,visionModel:VISION,safetyGateVersion:'2026-09-22-v3'","fallbackModel:FALLBACK,lightModel:LIGHT,visionModel:VISION,aiResilience:'queued-three-model-v1',safetyGateVersion:'2026-09-22-v3'",1)

          old_catch="}catch{return j(request,{ok:false,error:'SEEKVERA AI is temporarily unavailable',retryable:true},503)}}"
          new_catch="}catch(e){const m=clean(e?.message||e,700);const reason=/3036|daily free allocation/i.test(m)?'daily_free_ai_limit':/3040|capacity temporarily exceeded/i.test(m)?'capacity_busy':/5035|requires a Workers Paid plan/i.test(m)?'paid_model_required':/5016|model agreement/i.test(m)?'model_agreement_required':'workers_ai_runtime_error';return j(request,{ok:false,error:'SEEKVERA AI is temporarily unavailable',retryable:true,reason},503)}}"
          if old_catch not in s:
              raise SystemExit('Expected /api/ai catch not found; refusing unsafe patch')
          s=s.replace(old_catch,new_catch,1)

          p.write_text(s,encoding='utf-8')

      - name: Validate patched source
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          grep -q "@cf/qwen/qwen3-30b-a3b-fp8" worker.js
          grep -q "aiResilience:'queued-three-model-v1'" worker.js
          grep -q "daily_free_ai_limit" worker.js

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- worker.js; then
            echo 'AI runtime repair already applied.'
            exit 0
          fi
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add worker.js
          git commit -m 'Harden SEEKVERA Workers AI runtime fallbacks'
          git push
