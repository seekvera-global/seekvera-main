name: Apply global multilingual chat and voice v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-global-chat-voice-language-v2.yml'
      - '.github/scripts/fix_global_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply global patch
        run: python .github/scripts/fix_global_v2.py

      - name: Validate JavaScript and coverage
        run: |
          set -euo pipefail
          node --check worker.js
          node --check voice-ai.js
          node --check global-ui.js
          node --check superapp.js
          grep -q "Automatically detect the language of the user's latest message" worker.js
          grep -q 'FEMALE_HINTS' voice-ai.js
          grep -q "Auto · Same as my language" superapp.js
          ! grep -q "if(location.pathname.endsWith('/app.html'))return" voice-ai.js
          for f in *.html; do
            case "$f" in google*) continue;; esac
            grep -q 'global-ui.css?v=20260922-premium-voice2' "$f"
            grep -q 'voice-ai.js?v=20260922-premium-voice2' "$f"
            grep -q 'global-ui.js?v=20260922-premium-voice2' "$f"
          done
          echo 'Multilingual chat/voice validation passed.'

      - name: Commit global fix
        run: |
          set -euo pipefail
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add worker.js voice-ai.js superapp.js '*.html'
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'Enable same-language AI chat and voice in every department'
            git push origin main
          fi
