name: R32 trigger final audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r32-trigger-final.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger R32 final audit on latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run r32-static-final-audit.yml --ref main
