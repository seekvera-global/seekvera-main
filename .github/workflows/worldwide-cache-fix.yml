name: Force worldwide default and fresh browser state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worldwide-cache-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force worldwide default and clear stale country state
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='<meta name="referrer" content="strict-origin-when-cross-origin">'
          cache='<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n<meta http-equiv="Pragma" content="no-cache">\n<meta http-equiv="Expires" content="0">'
          if cache not in text:
              text=text.replace(marker, marker+'\n'+cache, 1)
          text=text.replace('const savedCountry=localStorage.getItem("seekvera_country")||detectLocaleCountry();', 'localStorage.removeItem("seekvera_country");\ncountryEl.value="ZZ";', 1)
          text=text.replace('if(countryEl.querySelector(`option[value="${savedCountry}"]`))countryEl.value=savedCountry;\n', '', 1)
          text=text.replace(' localStorage.setItem("seekvera_country",countryEl.value);\n', '', 1)
          if 'data-build="worldwide-20260920-v2"' not in text:
              text=text.replace('<body>', '<body data-build="worldwide-20260920-v2">', 1)
          p.write_text(text,encoding='utf-8')

      - name: Validate worldwide startup
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'countryEl.value="ZZ"' index.html
          grep -q 'localStorage.removeItem("seekvera_country")' index.html
          grep -q 'data-build="worldwide-20260920-v2"' index.html
          grep -q 'cheap hotel anywhere in the world' index.html
          if grep -q 'const savedCountry=localStorage.getItem("seekvera_country")' index.html; then exit 1; fi
          if grep -q 'localStorage.setItem("seekvera_country"' index.html; then exit 1; fi
          echo 'Fresh worldwide startup validated.'

      - name: Commit worldwide startup fix
        shell: bash
        run: |
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Force worldwide default and clear stale country preference'
          git pull --rebase origin main
          git push
