name: Deploy SEEKVERA R20 to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'r20-final-guard.js'
      - 'i18n-ui.js'
      - 'locale-r14-categories.js'
      - 'navigation.js'
      - 'voice-ai.js'
      - 'global-ui.js'
      - 'worker.js'
      - 'sw.js'
      - '*.html'
      - '.assetsignore'
      - '.github/workflows/deploy-cloudflare-r20.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-cloudflare-production-r20
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate R20 source
        shell: bash
        run: |
          set -euo pipefail
          for f in worker.js voice-ai.js i18n-ui.js global-ui.js sw.js navigation.js r20-final-guard.js locale-r14-categories.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re
          g=Path('global-ui.js').read_text(encoding='utf-8')
          n=Path('navigation.js').read_text(encoding='utf-8')
          i=Path('i18n-ui.js').read_text(encoding='utf-8')
          c=Path('locale-r14-categories.js').read_text(encoding='utf-8')
          guard=Path('r20-final-guard.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          pm=re.search(r'const COUNTRY_PROFILE=Object\.fromEntries\(`([^`]+)`\.split',g,re.S)
          lm=re.search(r'const WORLD_LANGS=\[([^\]]+)\]',n,re.S)
          im=re.search(r'const SUPPORTED=\[([^\]]+)\]',i,re.S)
          assert pm and lm and im
          profiles={x.split(':',1)[0]:x.split(':',1)[1] for x in pm.group(1).split(';') if x}
          langs=re.findall(r"'([^']+)'",lm.group(1))
          i18n_langs=re.findall(r"'([^']+)'",im.group(1))
          assert len(profiles)==248,len(profiles)
          assert len(langs)==98,len(langs)
          assert len(i18n_langs)==98,len(i18n_langs)
          for cc,val in profiles.items(): assert val.split(',',1)[0] in langs,(cc,val)
          assert "const VERSION='20260925-r20'" in guard
          assert 'EN_DESC=new Set' in guard and 'fixCategories' in guard and 'max-height:128px' in guard
          assert "const CACHE='seekvera-r20-final-ui-20260925'" in sw
          assert "'./r20-final-guard.js'" in sw
          assert 'r20-final-guard.js?v=20260925-r20' in idx
          assert 'i18n-ui.js?v=20260925-r20' in idx
          assert '2026-09-25 · R20' in idx
          assert idx.count('id="categories"')==1
          assert 'r8-department-strip' not in idx and 'class="r5-left"' not in idx
          pages=[]
          for p in Path('.').glob('*.html'):
              if p.name.lower().startswith('google'): continue
              t=p.read_text(encoding='utf-8')
              assert 'r20-final-guard.js?v=20260925-r20' in t,p.name
              assert 'i18n-ui.js?v=20260925-r20' in t,p.name
              pages.append(p.name)
          assert len(pages)>=44,len(pages)
          # R14 category table is the static no-English fallback for all 98 UI languages.
          assert 'hi:[' in c and 'ar:[' in c and 'zh:[' in c and 'dv:[' in c and 'tn:[' in c
          print('R20 SOURCE PASS',len(profiles),'countries',len(langs),'languages',len(pages),'pages')
          PY
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-r20-dry
          grep -q '"binding": "AI"' wrangler.jsonc
          rm -rf .wrangler-r20-dry .wrangler

      - name: Detect Cloudflare credentials
        id: cf
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi

      - name: Deploy R20 to Cloudflare Workers
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live R20
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://seekveraglobal.com'
          UA='Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0 Mobile Safari/537.36'
          ok=0
          for i in $(seq 1 30); do
            curl -L -fsS --max-time 25 -A "$UA" -H 'Cache-Control: no-cache' "$SITE/?r20-live=$i" -o /tmp/home.html || true
            curl -L -fsS --max-time 25 -A "$UA" -H 'Cache-Control: no-cache' "$SITE/r20-final-guard.js?r20-live=$i" -o /tmp/guard.js || true
            curl -L -fsS --max-time 25 -A "$UA" -H 'Cache-Control: no-cache' "$SITE/i18n-ui.js?r20-live=$i" -o /tmp/i18n.js || true
            curl -L -fsS --max-time 25 -A "$UA" -H 'Cache-Control: no-cache' "$SITE/locale-r14-categories.js?r20-live=$i" -o /tmp/cats.js || true
            if grep -q 'r20-final-guard.js?v=20260925-r20' /tmp/home.html 2>/dev/null && grep -q '20260925-r20' /tmp/guard.js 2>/dev/null && grep -q '20260925-r19-no-mixed-language' /tmp/i18n.js 2>/dev/null && grep -q "hi:\['मार्केटप्लेस'" /tmp/cats.js 2>/dev/null; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = '1'
          grep -q '2026-09-25 · R20' /tmp/home.html
          grep -q 'EN_DESC=new Set' /tmp/guard.js
          grep -q 'max-height:128px' /tmp/guard.js
          grep -q 'sv-r20-untranslated' /tmp/guard.js
          curl -L -fsS --max-time 25 -A "$UA" "$SITE/api/health?r20=1" -o /tmp/health.json
          grep -q '20260924-ai-r17' /tmp/health.json
          ai_code="$(curl -sS -o /tmp/ai.json -w '%{http_code}' --max-time 70 -X POST "$SITE/api/ai" -A "$UA" -H "Origin: $SITE" -H "Referer: $SITE/" -H 'Content-Type: application/json' --data '{"message":"Hello. I am speaking English while the app may be set to India. Reply briefly in English.","country":"India","language":"auto","scope":"worldwide","fast":true}')"
          test "$ai_code" = '200'
          grep -q '"ok":true' /tmp/ai.json
          grep -q '"response"' /tmp/ai.json
          echo 'LIVE R20 ASSETS + AI PASS'

      - name: Missing deployment credentials
        if: steps.cf.outputs.ready != 'true'
        run: |
          echo 'Cloudflare deployment credentials are unavailable.'
          exit 1
