name: SEEKVERA R22 deterministic category lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r22-category-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-deploy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build R22 category lock and patch every public page
        shell: bash
        run: |
          set -euo pipefail
          cat > r22-category-lock.js <<'JS'
          /* SEEKVERA R22 — deterministic category ownership; no mixed-language card DOM */
          (()=>{'use strict';
          if(window.__SEEKVERA_R22_CATEGORY_LOCK)return;window.__SEEKVERA_R22_CATEGORY_LOCK=true;
          const EN_TITLES=['Marketplace','Travel','Flights','Hotels','Tourism','Property','Cars & Auto','Jobs','Shopping','Restaurants & Food','Local Services','Equipment & Machinery','Boats & Marine','Import & Export','Shipping & Logistics','Business Software','Software','Websites & Hosting','Solar & Energy','Education','Health','Money & Insurance','Entertainment','News & Media','Games','Connectivity','Free Wi‑Fi','AI Deal Agent','Everyday','Scan / QR','Promote / Business'];
          const EN_DESC=['Buy, sell and compare worldwide','Trips, transport and stays','Search flight routes','Search stays worldwide','Places and experiences','Homes, land and rentals','Vehicles, parts and auto','Local and global careers','Products and deals','Food, cafes and dining','Everyday skilled help','Machines and equipment','Boats and marine listings','Factories and suppliers','Freight, cargo and delivery','POS, accounting and SaaS','Apps and digital tools','Domains, hosting and websites','Power and energy solutions','Schools, courses and skills','Clinics, labs and pharmacies','Licensed provider discovery','Movies, music and family','Trusted media and official sources','Play inside SEEKVERA','Internet, SIM and eSIM','Public Wi‑Fi discovery','Sourcing and business missions','Nearby daily needs','Share and install SEEKVERA','Business plans and promotion'];
          function language(){let v=document.getElementById('lang')?.value||document.documentElement.lang||navigator.language||'en';if(v==='auto')v=navigator.language||'en';return String(v).toLowerCase().split('-')[0]||'en'}
          function titles(l){const d=window.SEEKVERA_R14_CATEGORIES?.data?.[l];return Array.isArray(d)&&d.length>=31?d:EN_TITLES}
          let running=false,pending=false;
          function lock(){
            if(running){pending=true;return}running=true;pending=false;
            try{
              const l=language(), list=titles(l), tiles=[...document.querySelectorAll('#categories .r5-tile')];
              document.documentElement.setAttribute('translate','no');document.documentElement.classList.add('notranslate');
              document.body?.setAttribute('translate','no');document.body?.classList.add('notranslate');
              tiles.slice(0,31).forEach((tile,i)=>{
                const body=tile.querySelector('.r5-tile-body');if(!body)return;
                body.setAttribute('data-no-translate','1');body.setAttribute('translate','no');
                const title=String(list[i]||EN_TITLES[i]||'').trim();
                const wantDesc=l==='en'?EN_DESC[i]:'';
                const bs=[...body.children].filter(x=>x.tagName==='B');
                const ss=[...body.children].filter(x=>x.tagName==='SMALL');
                const ok=(l==='en'&&body.children.length===2&&bs.length===1&&ss.length===1&&bs[0].textContent.trim()===title&&ss[0].textContent.trim()===wantDesc)||(l!=='en'&&body.children.length===1&&bs.length===1&&bs[0].textContent.trim()===title);
                if(ok)return;
                const b=document.createElement('b');b.textContent=title;b.setAttribute('data-no-translate','1');
                if(l==='en'){const s=document.createElement('small');s.textContent=wantDesc;s.setAttribute('data-no-translate','1');body.replaceChildren(b,s)}
                else body.replaceChildren(b);
              });
              document.documentElement.dataset.svR22='ready';
            }finally{running=false;if(pending)queueMicrotask(lock)}
          }
          function schedule(){clearTimeout(schedule.t);schedule.t=setTimeout(lock,20)}
          function setup(){
            if(!document.querySelector('meta[name="google"][content="notranslate"]')){const m=document.createElement('meta');m.name='google';m.content='notranslate';document.head?.appendChild(m)}
            const s=document.createElement('style');s.id='svR22Style';s.textContent='#categories .r5-tile-body{min-width:0!important;overflow:hidden!important}#categories .r5-tile-body>b{display:block!important;max-width:100%!important;overflow-wrap:anywhere!important;word-break:normal!important;line-height:1.12!important}html,body{overflow-x:hidden!important}';document.head?.appendChild(s);
            lock();
            const root=document.getElementById('categories')||document.documentElement;new MutationObserver(schedule).observe(root,{subtree:true,childList:true,characterData:true});
            document.addEventListener('change',e=>{if(e.target?.id==='lang'||e.target?.id==='country')schedule()},true);
            window.addEventListener('seekvera:localechange',schedule);
            [100,300,700,1500,3000].forEach(ms=>setTimeout(lock,ms));
          }
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup,{once:true});else setup();
          window.SEEKVERA_R22_CATEGORY_LOCK={lock,EN_TITLES,EN_DESC};
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').glob('*.html'):
              if p.name.lower().startswith('google'): continue
              t=p.read_text(encoding='utf-8')
              if not re.search(r'<meta\s+name=["\']google["\']\s+content=["\']notranslate["\']',t,re.I):
                  t=re.sub(r'(<head[^>]*>)',r'\1\n<meta name="google" content="notranslate">',t,count=1,flags=re.I)
              t=re.sub(r'<html\b([^>]*)>',lambda m:'<html'+m.group(1)+('' if 'translate=' in m.group(0).lower() else ' translate="no"')+('' if 'class=' in m.group(0).lower() else ' class="notranslate"')+'>',t,count=1,flags=re.I)
              if 'r22-category-lock.js' not in t:
                  t=re.sub(r'</body>',r'<script src="r22-category-lock.js?v=20260925-r22" defer></script>\n</body>',t,count=1,flags=re.I)
              p.write_text(t,encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          sw=re.sub(r"const CACHE='[^']+'","const CACHE='seekvera-r22-category-lock-20260925'",sw,count=1)
          if "'./r22-category-lock.js'" not in sw:
              sw=sw.replace("'./r21-card-cleanup.js',","'./r21-card-cleanup.js','./r22-category-lock.js',")
          sw=sw.replace('r21-card-cleanup)\\.js$', 'r21-card-cleanup|r22-category-lock)\\.js$') if 'r21-card-cleanup)\\.js$' in sw else sw
          if 'r22-category-lock' not in sw.split('critical=',1)[-1].split(';',1)[0]:
              sw=sw.replace('r21-card-cleanup)\\.js$', 'r21-card-cleanup|r22-category-lock)\\.js$')
          Path('sw.js').write_text(sw,encoding='utf-8')
          PY
          node --check r22-category-lock.js
          node --check sw.js
          grep -q 'r22-category-lock.js?v=20260925-r22' index.html
          grep -q 'name="google" content="notranslate"' index.html
          grep -q 'translate="no"' index.html

      - name: Commit R22 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add r22-category-lock.js sw.js '*.html'
          if ! git diff --cached --quiet; then
            git commit -m 'R22: lock translated category cards and eliminate mixed language'
            git push origin HEAD:main
          fi

      - name: Deploy R22 to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Install browser
        shell: bash
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Final live 98-language category audit
        shell: bash
        env:
          SITE: https://seekveraglobal.com
        run: |
          cat > r22-audit.mjs <<'JS'
          import {chromium} from 'playwright';import assert from 'node:assert';
          const b=await chromium.launch({headless:true});
          try{const c=await b.newContext({viewport:{width:360,height:800},locale:'en-US'}),p=await c.newPage();
          let ready=false;for(let n=0;n<30;n++){await p.goto(`${process.env.SITE}/?r22=${Date.now()}-${n}`,{waitUntil:'domcontentloaded',timeout:45000});try{await p.waitForFunction(()=>window.SEEKVERA_R22_CATEGORY_LOCK&&window.SEEKVERA_R14_CATEGORIES&&window.SEEKVERA_LOCALE_R15&&Object.keys(SEEKVERA_R14_CATEGORIES.data).length===98,null,{timeout:4000});ready=true;break}catch{}await p.waitForTimeout(1500)}assert(ready,'R22 live not ready');
          const langs=await p.evaluate(()=>Object.keys(SEEKVERA_R14_CATEGORIES.data));assert.equal(langs.length,98);
          for(const l of langs){await p.evaluate(l=>{SEEKVERA_LOCALE_R15.setLanguage(l);SEEKVERA_R22_CATEGORY_LOCK.lock()},l);await p.waitForTimeout(50);await p.evaluate(()=>SEEKVERA_R22_CATEGORY_LOCK.lock());const q=await p.evaluate(()=>({l:SEEKVERA_LOCALE_R15.state().language,expected:SEEKVERA_R14_CATEGORIES.data[SEEKVERA_LOCALE_R15.state().language],cards:[...document.querySelectorAll('#categories .r5-tile-body')].slice(0,31).map(x=>({children:x.children.length,b:[...x.children].filter(y=>y.tagName==='B').map(y=>y.textContent.trim()),s:[...x.children].filter(y=>y.tagName==='SMALL'&&!y.hidden).map(y=>y.textContent.trim()),text:x.innerText.trim(),w:x.scrollWidth,cw:x.clientWidth})),page:document.documentElement.scrollWidth-innerWidth,r22:document.documentElement.dataset.svR22||''}));assert.equal(q.l,l);assert.equal(q.r22,'ready');q.cards.forEach((x,i)=>{assert.equal(x.b.length,1,`${l}/${i} b count`);assert.equal(x.b[0],q.expected[i],`${l}/${i} title`);if(l!=='en'){assert.equal(x.s.length,0,`${l}/${i} non-English description visible`);assert.equal(x.children,1,`${l}/${i} extra card DOM`)}assert(x.w-x.cw<=2,`${l}/${i} overflow`)});assert(q.page<=2,`${l} page overflow`)}
          console.log('R22 FINAL LIVE PASS: 98 languages; deterministic category titles; zero mixed-language descriptions; zero extra category DOM; mobile contained');await c.close()}finally{await b.close()}
          JS
          node r22-audit.mjs
