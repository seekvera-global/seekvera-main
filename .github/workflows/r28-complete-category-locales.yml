          missing=[]
          import json,re
          add=[]
          for code,vals in rows.items():
              if re.search(r'(?m)^\\s*'+re.escape(code)+r':\\[',block): continue
              missing.append(code)
              js='['+','.join(json.dumps(x,ensure_ascii=False) for x in vals)+']'
              add.append(',\n'+code+':'+js)
          if add:
              s=s[:end]+''.join(add)+s[end:]
              p.write_text(s,encoding='utf-8')
          print('added',missing)
      - name: Validate JavaScript and all 98 category rows
        shell: bash
        run: |
          node --check locale-r14-categories.js
          python - <<'PY'
          from pathlib import Path
          import re
          n=Path('navigation.js').read_text(encoding='utf-8'); c=Path('locale-r14-categories.js').read_text(encoding='utf-8')
          m=re.search(r'const WORLD_LANGS=\[([^\]]+)\]',n,re.S); langs=re.findall(r"'([^']+)'",m.group(1))
          keys=set(re.findall(r'^\s*([a-z]{2,3}):\[',c,re.M)); keys.add('en') if 'en:S' in c else None
          missing=[x for x in langs if x not in keys]; assert len(langs)==98; assert not missing,missing
          print('CATEGORY LOCALE PASS 98/98')
          PY
      - name: Commit locale completion
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add locale-r14-categories.js
          git commit -m 'R28: complete category localization for all 98 languages'
          git push origin HEAD:main
