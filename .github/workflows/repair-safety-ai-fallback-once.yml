name: Repair SEEKVERA safety AI fallback once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-safety-ai-fallback-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add reliable fast fallback behind strong safety models
        shell: python
        run: |
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text(encoding='utf-8')
          old="?[PRIMARY,FALLBACK,LIGHT]:[FASTCHAT,FALLBACK,LIGHT,PRIMARY]"
          new="?[PRIMARY,FALLBACK,LIGHT,FASTCHAT]:[FASTCHAT,FALLBACK,LIGHT,PRIMARY]"
          if old in s:
              s=s.replace(old,new,1)
          elif "?[PRIMARY,FALLBACK,LIGHT,FASTCHAT]:[FASTCHAT,FALLBACK,LIGHT,PRIMARY]" not in s:
              raise SystemExit('Safety model order marker not found')
          s=s.replace("safetyGateVersion:'2026-09-22-v3'","safetyGateVersion:'2026-09-22-v4-resilient'",1)
          p.write_text(s,encoding='utf-8')
      - name: Validate safety remains fail closed
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          grep -Fq '[PRIMARY,FALLBACK,LIGHT,FASTCHAT]' worker.js
          grep -q 'failClosed:true' worker.js
          grep -q 'moderation_unavailable_hold' worker.js
          grep -q "safetyGateVersion:'2026-09-22-v4-resilient'" worker.js
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add worker.js
          if git diff --cached --quiet; then echo 'Already repaired'; else git commit -m 'Strengthen safety AI fallback resilience'; git push origin main; fi
