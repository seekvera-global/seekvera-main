name: Deploy SEEKVERA R12 to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'voice-ai.js'
      - '*.html'
      - 'styles.css'
      - 'premium.css'
      - 'global-ui.css'
      - 'global-ui.js'
      - 'i18n-ui.js'
      - 'i18n-premium.css'
      - 'home-marketplace-r5.css'
      - 'navigation.js'
      - 'app.js'
      - 'superapp.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-cloudflare-production-r12
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate R12 worldwide source
        shell: bash
        run: |
          set -euo pipefail
          for f in worker.js voice-ai.js i18n-ui.js global-ui.js superapp.js sw.js navigation.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re
          g=Path('global-ui.js').read_text(encoding='utf-8')
          n=Path('navigation.js').read_text(encoding='utf-8')
          i=Path('i18n-ui.js').read_text(encoding='utf-8')
          v=Path('voice-ai.js').read_text(encoding='utf-8')
          w=Path('worker.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          hub=Path('hub.html').read_text(encoding='utf-8')

          pm=re.search(r'const COUNTRY_PROFILE=Object\.fromEntries\(`([^`]+)`\.split',g,re.S)
          lm=re.search(r'const WORLD_LANGS=\[([^\]]+)\]',n,re.S)
          im=re.search(r'const SUPPORTED=\[([^\]]+)\]',i,re.S)
          assert pm and lm and im
          profiles={x.split(':',1)[0]:x.split(':',1)[1] for x in pm.group(1).split(';') if x}
          langs=re.findall(r"'([^']+)'",lm.group(1))
          i18n_langs=re.findall(r"'([^']+)'",im.group(1))
          assert len(profiles)==248,len(profiles)
          assert len(langs)==98,len(langs)
          assert len(i18n_langs)==98,len(i18n_langs)
          for cc,val in profiles.items(): assert val.split(',',1)[0] in langs,(cc,val)

          assert idx.count('id="categories"')==1
          assert 'r5-chips' not in idx
          assert 'r8-department-strip' not in idx
          assert 'class="r5-left"' not in idx
          assert 'bindAICountryControl' in n and 'COUNTRY_TERMS=' in n and 'hasCountryTerm(text)' in n
          assert 'primeVoiceOnGesture' in n
          assert '/api/transcribe' in v and 'MediaRecorder' in v and 'Android|iPhone|iPad|iPod' in v
          assert 'speechSynthesis' in v and 'function speakerAction' in v
          assert 'if(force)play(0,0);else setTimeout(()=>play(0,0),50)' in v
          assert "TRANSLATE='@cf/meta/llama-3.2-1b-instruct'" in w
          assert "caches.open('seekvera-ui-translate-r12')" in w
          assert 'daily_free_ai_limit' in w
          for endpoint in ["/api/ui-translate","/api/locale","/api/transcribe","/api/visual-search"]: assert endpoint in w,endpoint
          assert 'safetyGateVersion' in w
          assert 'seekvera-r11-worldwide-20260924' in sw

          required=['marketplace.html','travel.html','tourism.html','property.html','cars-auto.html','jobs.html','shopping.html','restaurants-food.html','local-services.html','import-export.html','shipping-logistics.html','business-software.html','software.html','web-hosting.html','solar.html','education.html','health.html','money-insurance.html','entertainment.html','media.html','games.html','connectivity.html','wifi.html','deal-agent.html','everyday.html','scan.html','post-ad.html','seller-plans.html']
          for x in required:
              assert x in idx and x in hub and Path(x).exists(),x
          pages=[]
          for p in Path('.').glob('*.html'):
              if p.name.lower().startswith('google'): continue
              t=p.read_text(encoding='utf-8')
              for asset in ['navigation.js','global-ui.js','i18n-ui.js','voice-ai.js']: assert asset in t,(p.name,asset)
              pages.append(p.name)
          assert len(pages)>=44,len(pages)
          print('R12 SOURCE PASS:',len(profiles),'countries;',len(langs),'languages;',len(pages),'public pages;',len(required),'core department routes')
          PY
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
          grep -q '"binding": "AI"' wrangler.jsonc
          rm -rf .wrangler-dry-run .wrangler

      - name: Detect Cloudflare deployment credentials
        id: cf
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live R12 production
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://seekveraglobal.com'
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'
          ok=0
          for i in $(seq 1 20); do
            curl -L -fsS --max-time 25 -A "$UA" -H 'Cache-Control: no-cache' "$SITE/?r12-live=$i" -o /tmp/home.html || true
            curl -L -fsS --max-time 25 -A "$UA" -H 'Cache-Control: no-cache' "$SITE/navigation.js?r12-live=$i" -o /tmp/nav.js || true
            curl -L -fsS --max-time 25 -A "$UA" -H 'Cache-Control: no-cache' "$SITE/i18n-ui.js?r12-live=$i" -o /tmp/i18n.js || true
            if test "$(grep -o 'id=\"categories\"' /tmp/home.html 2>/dev/null | wc -l)" = '1' && ! grep -q 'r5-chips' /tmp/home.html 2>/dev/null && grep -q 'COUNTRY_TERMS=' /tmp/nav.js 2>/dev/null && grep -q 'nativeTranslator' /tmp/i18n.js 2>/dev/null; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = '1'
          ! grep -q 'r8-department-strip' /tmp/home.html
          ! grep -q 'class="r5-left"' /tmp/home.html
          grep -q 'function speakerAction' <(curl -L -fsS --max-time 25 -A "$UA" -H 'Cache-Control: no-cache' "$SITE/voice-ai.js?v=20260924-r11&r12-live=1")

          pages=(marketplace.html travel.html tourism.html property.html cars-auto.html jobs.html shopping.html restaurants-food.html local-services.html import-export.html shipping-logistics.html business-software.html software.html web-hosting.html solar.html education.html health.html money-insurance.html entertainment.html media.html games.html connectivity.html wifi.html deal-agent.html everyday.html scan.html post-ad.html seller-plans.html hub.html app.html)
          for p in "${pages[@]}"; do
            code="$(curl -L -sS -o /tmp/page.html -w '%{http_code}' --max-time 25 -A "$UA" "$SITE/$p?r12-live=1")"
            test "$code" = '200'
            grep -q 'navigation.js' /tmp/page.html
            grep -q 'global-ui.js' /tmp/page.html
            grep -q 'i18n-ui.js' /tmp/page.html
          done
          echo 'LIVE R12 HOME + DEPARTMENT ROUTES PASS'

          curl -L -fsS --max-time 25 -A "$UA" "$SITE/api/health?r12-live=1" -o /tmp/health.json
          grep -q '"centralSafetyGate":"enabled"' /tmp/health.json
          grep -q '"voiceInputFallback":"server-asr-v1"' /tmp/health.json
          curl -L -fsS --max-time 25 -A "$UA" "$SITE/api/locale?r12-live=1" -o /tmp/locale.json
          grep -q '"ok":true' /tmp/locale.json
          echo 'LIVE R12 HEALTH + LOCALE PASS'

          ai_code="$(curl -sS -o /tmp/ai.json -w '%{http_code}' --max-time 70 -X POST "$SITE/api/ai" -A "$UA" -H "Origin: $SITE" -H "Referer: $SITE/" -H 'Content-Type: application/json' --data '{"message":"Find hotels in Paris","country":"France","language":"English","scope":"country","fast":true}')"
          if [ "$ai_code" = '200' ]; then
            grep -q '"ok":true' /tmp/ai.json
            echo 'LIVE R12 AI PASS'
          elif [ "$ai_code" = '503' ] && grep -q 'daily_free_ai_limit' /tmp/ai.json; then
            echo '::warning::Cloudflare Workers AI daily free allocation is exhausted; deployment is healthy but general AI is quota-degraded until Cloudflare resets the allowance.'
          else
            echo "Unexpected AI HTTP $ai_code"; cat /tmp/ai.json; exit 1
          fi

          tr_code="$(curl -sS -o /tmp/tr.json -w '%{http_code}' --max-time 70 -X POST "$SITE/api/ui-translate" -A "$UA" -H "Origin: $SITE" -H "Referer: $SITE/" -H 'Content-Type: application/json' --data '{"language":"Arabic","strings":["Jobs","Shopping","Health"]}')"
          if [ "$tr_code" = '200' ]; then
            grep -q '"ok":true' /tmp/tr.json
            echo 'LIVE R12 UI TRANSLATION PASS/CACHE HIT'
          elif [ "$tr_code" = '503' ] && grep -q 'daily_free_ai_limit' /tmp/tr.json; then
            echo '::warning::First-time uncached UI translation is temporarily quota-degraded; cached/device translations remain available.'
          else
            echo "Unexpected translation HTTP $tr_code"; cat /tmp/tr.json; exit 1
          fi

      - name: Missing deployment credentials
        if: steps.cf.outputs.ready != 'true'
        run: |
          echo 'Cloudflare deployment credentials are unavailable.'
          exit 1
