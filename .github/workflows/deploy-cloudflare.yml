name: Deploy SEEKVERA to Cloudflare
# Production deployment: latest Safety Gate v2 + AI Vision + global Voice AI

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'voice-ai.js'
      - '*.html'
      - 'styles.css'
      - 'app.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Worker build and bindings
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
          grep -q '"binding": "AI"' wrangler.jsonc
          grep -q '@cf/google/gemma-4-26b-a4b-it' worker.js
          grep -q '@cf/zai-org/glm-4.7-flash' worker.js
          grep -q '@cf/meta/llama-3.2-11b-vision-instruct' worker.js
          grep -q 'safetyGateVersion' worker.js
          grep -q '/api/vision' worker.js
          test -s voice-ai.js
          node --check voice-ai.js
          echo 'SEEKVERA Worker and Voice AI source are valid.'

      - name: Detect Cloudflare deployment credentials
        id: cf
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare credentials found; production deployment will run.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare GitHub secrets are not configured; native Cloudflare Workers Builds remains the deployment path.'
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deployment architecture
        if: steps.cf.outputs.ready != 'true'
        shell: bash
        run: |
          echo 'No GitHub Cloudflare credentials were found.'
          echo 'Production deployment must be completed by the connected Cloudflare Workers Build.'
