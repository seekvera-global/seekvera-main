name: Deploy SEEKVERA to Cloudflare
# Production deployment: R10 worldwide locale + voice hardening + conversational AI

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'voice-ai.js'
      - '*.html'
      - 'styles.css'
      - 'premium.css'
      - 'global-ui.css'
      - 'global-ui.js'
      - 'i18n-ui.js'
      - 'i18n-premium.css'
      - 'home-marketplace-r5.css'
      - 'navigation.js'
      - 'app.js'
      - 'superapp.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-cloudflare-production-r10
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate R10 worldwide source and backend
        shell: bash
        run: |
          set -euxo pipefail
          for f in worker.js voice-ai.js i18n-ui.js global-ui.js superapp.js sw.js navigation.js; do node --check "$f"; done

          # Stable feature checks: verify capabilities, not stale tuning values.
          grep -q 'SEEKVERA_LOCALE_GUARD_R9' i18n-ui.js
          grep -q 'WORLD_LANGS' navigation.js
          grep -q 'bindAICountryControl' navigation.js
          grep -q 'primeVoiceOnGesture' navigation.js
          grep -q "u.pathname==='/api/ui-translate'" worker.js
          grep -q 'VOICE_MAX_MS=' voice-ai.js
          grep -q 'VOICE_SILENCE_MS=' voice-ai.js
          grep -q 'MediaRecorder' voice-ai.js
          grep -q '/api/transcribe' voice-ai.js
          grep -q 'speechSynthesis' voice-ai.js
          grep -q 'COUNTRY_PROFILE' global-ui.js
          grep -q "u.pathname==='/api/locale'" worker.js
          grep -q '@cf/openai/whisper-large-v3-turbo' worker.js
          grep -q '/api/transcribe' worker.js
          grep -q '/api/visual-search' worker.js
          grep -q 'safetyGateVersion' worker.js
          grep -q 'svBackButton' navigation.js
          grep -q 'svHomeButton' navigation.js
          if grep -q '<iframe' app.html; then echo 'app.html must not use iframe'; exit 1; fi
          grep -q 'location.replace' app.html

          python - <<'PY'
          from pathlib import Path
          import re

          g=Path('global-ui.js').read_text(encoding='utf-8')
          s=Path('superapp.js').read_text(encoding='utf-8')
          n=Path('navigation.js').read_text(encoding='utf-8')
          v=Path('voice-ai.js').read_text(encoding='utf-8')

          m=re.search(r'const COUNTRY_PROFILE=Object\.fromEntries\(`([^`]+)`\.split',g,re.S)
          mm=re.search(r"const ISO='([^']+)'\.split",s)
          lm=re.search(r'const WORLD_LANGS=\[([^\]]+)\]',n,re.S)
          silence=re.search(r'VOICE_SILENCE_MS=(\d+)',v)
          maximum=re.search(r'VOICE_MAX_MS=(\d+)',v)
          assert m and mm and lm and silence and maximum

          profiles={x.split(':',1)[0]:x.split(':',1)[1] for x in m.group(1).split(';') if x}
          iso=set(mm.group(1).split())
          langs=set(re.findall(r"'([^']+)'",lm.group(1)))
          assert len(profiles)==len(iso)>=248
          assert not (iso-set(profiles))
          assert len(langs)>=90
          for cc,val in profiles.items():
              language=val.split(',',1)[0]
              assert language in langs,(cc,language)

          # Keep voice timing within usable mobile bounds without pinning a stale exact value.
          assert 1000 <= int(silence.group(1)) <= 6000
          assert 30000 <= int(maximum.group(1)) <= 120000

          required=['marketplace.html','travel.html','tourism.html','property.html','cars-auto.html','jobs.html','shopping.html','restaurants-food.html','local-services.html','import-export.html','shipping-logistics.html','business-software.html','software.html','web-hosting.html','solar.html','education.html','health.html','money-insurance.html','entertainment.html','media.html','games.html','connectivity.html','wifi.html','deal-agent.html','everyday.html','scan.html','post-ad.html','seller-plans.html']
          idx=Path('index.html').read_text(encoding='utf-8')
          hub=Path('hub.html').read_text(encoding='utf-8')
          for x in required:
              assert x in idx and x in hub and Path(x).exists(),x

          pages=[]
          for p in Path('.').glob('*.html'):
              if p.name.lower().startswith('google'): continue
              t=p.read_text(encoding='utf-8')
              for asset in ['navigation.js','global-ui.js','i18n-ui.js','voice-ai.js']:
                  assert asset in t,(p.name,asset)
              pages.append(p.name)
          assert len(pages)>=44
          print('R10 source validation:',len(profiles),'countries;',len(langs),'languages;',len(pages),'public pages;',len(required),'departments')
          PY

          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
          grep -Eq '"binding"[[:space:]]*:[[:space:]]*"AI"' wrangler.jsonc
          rm -rf .wrangler-dry-run .wrangler
          echo 'R10 WORLDWIDE SOURCE VALIDATION PASS'

      - name: Detect Cloudflare deployment credentials
        id: cf
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live R10 production A-Z
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          SITE='https://seekveraglobal.com'
          ok=0
          for i in $(seq 1 25); do
            curl -L -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE/?r10-live=$i" -o /tmp/home.html || true
            if grep -q 'navigation.js' /tmp/home.html 2>/dev/null && grep -q 'data-r8-departments="complete"' /tmp/home.html 2>/dev/null; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = '1'
          grep -q 'data-r8-grid="complete"' /tmp/home.html
          echo 'LIVE R10 HOME PASS'

          pages=(marketplace.html travel.html tourism.html property.html cars-auto.html jobs.html shopping.html restaurants-food.html local-services.html import-export.html shipping-logistics.html business-software.html software.html web-hosting.html solar.html education.html health.html money-insurance.html entertainment.html media.html games.html connectivity.html wifi.html deal-agent.html everyday.html scan.html post-ad.html seller-plans.html hub.html app.html)
          for p in "${pages[@]}"; do
            code="$(curl -L -sS -o /tmp/page.html -w '%{http_code}' --max-time 25 "$SITE/$p?r10-live=1")"
            test "$code" = '200'
            grep -q 'navigation.js' /tmp/page.html
            grep -q 'global-ui.js' /tmp/page.html
            grep -q 'i18n-ui.js' /tmp/page.html
            echo "PASS $p"
          done
          echo 'LIVE R10 DEPARTMENT PAGES PASS'

          curl -L -fsS --max-time 25 "$SITE/api/health?r10-live=1" -o /tmp/health.json
          grep -q '"centralSafetyGate":"enabled"' /tmp/health.json
          grep -q '"voiceInputFallback":"server-asr-v1"' /tmp/health.json
          echo 'LIVE R10 HEALTH + VOICE FALLBACK PASS'

          curl -L -fsS --max-time 20 "$SITE/api/locale?r10-live=1" -o /tmp/locale.json
          grep -q '"ok":true' /tmp/locale.json
          echo 'LIVE R10 COUNTRY DETECTION PASS'

          # Translation endpoint must be reachable; tolerate temporary model capacity limits but not broken routing.
          tr_code="$(curl -sS -o /tmp/tr.json -w '%{http_code}' --max-time 60 -X POST "$SITE/api/ui-translate" -H "Origin: $SITE" -H "Referer: $SITE/" -H 'Content-Type: application/json' --data '{"language":"Arabic","strings":["Jobs","Shopping","Health"]}')"
          test "$tr_code" = '200' -o "$tr_code" = '429' -o "$tr_code" = '503'
          echo "LIVE R10 UI TRANSLATION ROUTE PASS ($tr_code)"

      - name: Deployment architecture
        if: steps.cf.outputs.ready != 'true'
        shell: bash
        run: |
          echo 'Cloudflare deployment credentials are unavailable.'
          exit 1
