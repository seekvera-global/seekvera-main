name: Validate SEEKVERA Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-cloudflare-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Worker build and bindings
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
          grep -q '"binding": "AI"' wrangler.jsonc
          grep -q '@cf/meta/llama-3.1-8b-instruct-fast' worker.js
          grep -q '@cf/google/gemma-4-26b-a4b-it' worker.js
          echo 'SEEKVERA Worker source is valid.'

      - name: Deployment architecture
        shell: bash
        run: |
          echo 'Production deployment is handled by Cloudflare Workers Builds after the GitHub repository is connected in Cloudflare.'
          echo 'No Cloudflare API token is stored in GitHub.'
