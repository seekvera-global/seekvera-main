name: Deploy SEEKVERA to Cloudflare
# Final R10 production deployment: worldwide locale + voice hardening + AI country control + single departments section

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'voice-ai.js'
      - '*.html'
      - 'styles.css'
      - 'premium.css'
      - 'global-ui.css'
      - 'global-ui.js'
      - 'i18n-ui.js'
      - 'i18n-premium.css'
      - 'home-marketplace-r5.css'
      - 'navigation.js'
      - 'app.js'
      - 'superapp.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-cloudflare-production-r10
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate R10 worldwide source and backend
        shell: bash
        run: |
          set -euo pipefail
          for f in worker.js voice-ai.js i18n-ui.js global-ui.js superapp.js sw.js navigation.js; do node --check "$f"; done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert';
          const global=fs.readFileSync('global-ui.js','utf8');
          const nav=fs.readFileSync('navigation.js','utf8');
          const voice=fs.readFileSync('voice-ai.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const worker=fs.readFileSync('worker.js','utf8');
          const pm=global.match(/const COUNTRY_PROFILE=Object\.fromEntries\(`([^`]+)`\.split/s);
          assert(pm,'COUNTRY_PROFILE not found');
          const profiles=Object.fromEntries(pm[1].split(';').filter(Boolean).map(x=>{const [cc,v]=x.split(':');const [language,currency]=v.split(',');return [cc,{language,currency}]}));
          assert.equal(Object.keys(profiles).length,248,'expected 248 country/territory profiles');
          const lm=nav.match(/const WORLD_LANGS=\[([^\]]+)\]/s);
          assert(lm,'WORLD_LANGS not found');
          const langs=[...lm[1].matchAll(/'([^']+)'/g)].map(m=>m[1]);
          assert(langs.length>=90,`expected >=90 language choices, got ${langs.length}`);
          for(const [cc,p] of Object.entries(profiles)) assert(langs.includes(p.language),`${cc} default language ${p.language} missing from WORLD_LANGS`);
          assert(nav.includes('bindAICountryControl'),'AI country switching missing');
          assert(nav.includes('primeVoiceOnGesture'),'voice gesture primer missing');
          assert(voice.includes('/api/transcribe'),'server ASR route missing from voice runtime');
          assert(voice.includes('MediaRecorder'),'MediaRecorder fallback missing');
          assert(voice.includes('Android|iPhone|iPad|iPod'),'mobile recorder branch missing');
          assert(voice.includes('speechSynthesis'),'speaker/TTS runtime missing');
          assert(worker.includes("u.pathname==='/api/ui-translate'"),'UI translation endpoint missing');
          assert(worker.includes("u.pathname==='/api/locale'"),'locale endpoint missing');
          assert(worker.includes('/api/transcribe'),'transcription endpoint missing');
          assert(worker.includes('/api/visual-search'),'visual-search endpoint missing');
          assert(worker.includes('safetyGateVersion'),'safety gate missing');
          assert(sw.includes('seekvera-r10-worldwide-20260924'),'R10 cache version missing');
          console.log('R10 STATIC PASS:',Object.keys(profiles).length,'countries;',langs.length,'languages');
          NODE
          python - <<'PY'
          from pathlib import Path
          import re
          g=Path('global-ui.js').read_text(encoding='utf-8')
          s=Path('superapp.js').read_text(encoding='utf-8')
          n=Path('navigation.js').read_text(encoding='utf-8')
          m=re.search(r'const COUNTRY_PROFILE=Object\.fromEntries\(`([^`]+)`\.split',g,re.S)
          mm=re.search(r"const ISO='([^']+)'\.split",s)
          lm=re.search(r'const WORLD_LANGS=\[([^\]]+)\]',n,re.S)
          assert m and mm and lm
          profiles={x.split(':',1)[0]:x.split(':',1)[1] for x in m.group(1).split(';') if x}
          iso=set(mm.group(1).split())
          langs=set(re.findall(r"'([^']+)'",lm.group(1)))
          assert len(profiles)==len(iso)==248
          assert not (iso-set(profiles))
          assert len(langs)>=90
          for cc,v in profiles.items():
              language=v.split(',',1)[0]
              assert language in langs,(cc,language)
          required=['marketplace.html','travel.html','tourism.html','property.html','cars-auto.html','jobs.html','shopping.html','restaurants-food.html','local-services.html','import-export.html','shipping-logistics.html','business-software.html','software.html','web-hosting.html','solar.html','education.html','health.html','money-insurance.html','entertainment.html','media.html','games.html','connectivity.html','wifi.html','deal-agent.html','everyday.html','scan.html','post-ad.html','seller-plans.html']
          idx=Path('index.html').read_text(encoding='utf-8'); hub=Path('hub.html').read_text(encoding='utf-8')
          for x in required:
              assert x in idx and x in hub and Path(x).exists(),x
          assert idx.count('id="categories"')==1,'index must contain exactly one categories section'
          assert 'r8-department-strip' not in idx,'duplicate top department strip must not exist in source'
          assert 'class="r5-left"' not in idx,'duplicate left department list must not exist in source'
          assert 'grid-template-columns:none!important;grid-template-rows:repeat(2,108px)!important' in Path('home-marketplace-r5.css').read_text(encoding='utf-8'),'mobile categories grid reset missing'
          rtl=Path('i18n-ui.js').read_text(encoding='utf-8')
          assert "'dv'" in re.search(r"const RTL=new Set\(\[([^\]]*)\]\)",rtl).group(1),'Dhivehi RTL missing'
          pages=[]
          for p in Path('.').glob('*.html'):
              if p.name.lower().startswith('google'): continue
              t=p.read_text(encoding='utf-8')
              for asset in ['navigation.js','global-ui.js','i18n-ui.js','voice-ai.js']:
                  assert asset in t,(p.name,asset)
              pages.append(p.name)
          assert len(pages)>=44
          app=Path('app.html').read_text(encoding='utf-8')
          assert '<iframe' not in app
          assert 'location.replace' in app
          print('R10 SOURCE PASS:',len(profiles),'countries;',len(langs),'languages;',len(pages),'public pages;',len(required),'departments; single categories section')
          PY
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
          grep -q '"binding": "AI"' wrangler.jsonc
          rm -rf .wrangler-dry-run .wrangler
          echo 'R10 WORLDWIDE SOURCE VALIDATION PASS'

      - name: Detect Cloudflare deployment credentials
        id: cf
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live R10 production A-Z
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://seekveraglobal.com'
          ok=0
          for i in $(seq 1 25); do
            curl -L -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE/?r10-live=$i" -o /tmp/home.html || true
            if grep -q '20260924-az-r8' /tmp/home.html 2>/dev/null && grep -q 'data-r8-grid="complete"' /tmp/home.html 2>/dev/null; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = '1'
          grep -q 'navigation.js' /tmp/home.html
          ! grep -q 'r8-department-strip' /tmp/home.html
          ! grep -q 'class="r5-left"' /tmp/home.html
          test "$(grep -o 'id="categories"' /tmp/home.html | wc -l)" = '1'
          echo 'LIVE R10 HOME + SINGLE DEPARTMENTS SECTION PASS'

          pages=(marketplace.html travel.html tourism.html property.html cars-auto.html jobs.html shopping.html restaurants-food.html local-services.html import-export.html shipping-logistics.html business-software.html software.html web-hosting.html solar.html education.html health.html money-insurance.html entertainment.html media.html games.html connectivity.html wifi.html deal-agent.html everyday.html scan.html post-ad.html seller-plans.html hub.html app.html)
          for p in "${pages[@]}"; do
            code="$(curl -L -sS -o /tmp/page.html -w '%{http_code}' --max-time 25 "$SITE/$p?r10-live=1")"
            test "$code" = '200'
            grep -q 'navigation.js' /tmp/page.html
            grep -q 'global-ui.js' /tmp/page.html
            grep -q 'i18n-ui.js' /tmp/page.html
            echo "PASS $p"
          done
          echo 'LIVE R10 DEPARTMENT PAGES PASS'

          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          ai_code="$(curl -sS -o /tmp/ai.json -w '%{http_code}' --max-time 60 -X POST "$SITE/api/ai" -H "User-Agent: $UA" -H "Origin: $SITE" -H "Referer: $SITE/" -H 'Content-Type: application/json' --data '{"message":"mechanic","country":"France","language":"English","scope":"country","fast":true,"history":[{"role":"user","content":"I need a job in France"},{"role":"assistant","content":"What kind of job are you looking for?"}]}')"
          test "$ai_code" = '200'
          grep -q '"ok":true' /tmp/ai.json
          grep -q '"category":"jobs"' /tmp/ai.json
          grep -q '"route":"jobs.html"' /tmp/ai.json
          echo 'LIVE R10 AI CONVERSATION MEMORY + JOB ROUTE PASS'

          tr_code="$(curl -sS -o /tmp/tr.json -w '%{http_code}' --max-time 60 -X POST "$SITE/api/ui-translate" -H "User-Agent: $UA" -H "Origin: $SITE" -H "Referer: $SITE/" -H 'Content-Type: application/json' --data '{"language":"Arabic","strings":["Jobs","Shopping","Health"]}')"
          test "$tr_code" = '200'
          grep -q '"ok":true' /tmp/tr.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/tr.json'))
          a=d.get('translations') or []
          assert len(a)==3 and all(isinstance(x,str) and x.strip() for x in a)
          assert not all(x in {'Jobs','Shopping','Health'} for x in a)
          print('LIVE R10 DEDICATED UI TRANSLATION PASS',a)
          PY

          curl -L -fsS --max-time 25 "$SITE/api/health?r10-live=1" -o /tmp/health.json
          grep -q '20260924-az-r8' /tmp/health.json
          grep -q '"centralSafetyGate":"enabled"' /tmp/health.json
          grep -q '"voiceInputFallback":"server-asr-v1"' /tmp/health.json
          echo 'LIVE R10 HEALTH PASS'

          curl -L -fsS --max-time 20 "$SITE/api/locale?r10-live=1" -o /tmp/locale.json
          grep -q '"ok":true' /tmp/locale.json
          echo 'LIVE R10 COUNTRY DETECTION PASS'

      - name: Deployment architecture
        if: steps.cf.outputs.ready != 'true'
        shell: bash
        run: |
          echo 'Cloudflare deployment credentials are unavailable.'
          exit 1
