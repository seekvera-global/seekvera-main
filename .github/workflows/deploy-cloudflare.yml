name: Deploy SEEKVERA to Cloudflare
# Stable production deployment: restored 22 Sep Final R3 UI + current AI/Voice/Safety backend

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'voice-ai.js'
      - '*.html'
      - 'styles.css'
      - 'premium.css'
      - 'global-ui.css'
      - 'global-ui.js'
      - 'i18n-ui.js'
      - 'i18n-premium.css'
      - 'app.js'
      - 'superapp.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate restored public UI and current backend
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
          grep -q '"binding": "AI"' wrangler.jsonc
          grep -q '@cf/google/gemma-4-26b-a4b-it' worker.js
          grep -q '@cf/openai/whisper-large-v3-turbo' worker.js
          grep -q '/api/transcribe' worker.js
          grep -q "voiceInputFallback:'server-asr-v1'" worker.js
          grep -q 'safetyGateVersion' worker.js
          grep -q '/api/vision' worker.js
          grep -q '/api/marketplace-submit' worker.js
          for f in voice-ai.js i18n-ui.js global-ui.js superapp.js sw.js worker.js; do node --check "$f"; done
          grep -q 'serverVoice' voice-ai.js
          grep -q 'navigator.mediaDevices' voice-ai.js
          grep -q 'MediaRecorder' voice-ai.js
          grep -q '20260922-final-r3' index.html
          grep -q 'sv-unified-chat' index.html
          grep -q 'PREMIUM GLOBAL AI' index.html
          grep -q 'premium.css' index.html
          grep -q 'games.html' index.html
          grep -q 'seekvera-final-r3-20260922' sw.js
          rm -rf .wrangler-dry-run .wrangler
          echo 'RESTORED FINAL R3 + CURRENT BACKEND SOURCE VALIDATION PASS'

      - name: Detect Cloudflare deployment credentials
        id: cf
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live restored UI and current backend
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://seekveraglobal.com'
          WORKER='https://seekvera-main.seekvera-global.workers.dev'

          ui_ok=0
          for i in $(seq 1 24); do
            curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE/?stable-r3=$i" -o /tmp/home.html || true
            if grep -q '20260922-final-r3' /tmp/home.html 2>/dev/null && grep -q 'sv-unified-chat' /tmp/home.html 2>/dev/null && grep -q 'PREMIUM GLOBAL AI' /tmp/home.html 2>/dev/null; then
              ui_ok=1
              break
            fi
            sleep 5
          done
          test "$ui_ok" = '1'
          echo 'LIVE CUSTOM DOMAIN FINAL R3 UI PASS'

          curl -fsS --max-time 20 "$SITE/voice-ai.js?stable-r3=1" -o /tmp/voice.js
          grep -q 'serverVoice' /tmp/voice.js
          grep -q 'MediaRecorder' /tmp/voice.js
          curl -fsS --max-time 20 "$SITE/games.html?stable-r3=1" -o /tmp/games.html
          grep -qi 'game' /tmp/games.html
          echo 'LIVE CUSTOM DOMAIN ASSETS PASS'

          curl -fsS --max-time 20 "$WORKER/api/health?stable-r3=1" -o /tmp/health.json
          grep -q '"centralSafetyGate":"enabled"' /tmp/health.json
          grep -q '"failClosed":true' /tmp/health.json
          grep -q '"voiceInputFallback":"server-asr-v1"' /tmp/health.json
          echo 'LIVE WORKER HEALTH PASS'

          curl -fsS --max-time 45 -X POST "$WORKER/api/ai" -H 'Content-Type: application/json' --data '{"message":"Reply only with: Hello.","country":"Worldwide","language":"English","scope":"worldwide","fast":true}' -o /tmp/ai.json
          grep -q '"ok":true' /tmp/ai.json
          echo 'LIVE WORKER AI ROUTE PASS'

      - name: Deployment architecture
        if: steps.cf.outputs.ready != 'true'
        shell: bash
        run: |
          echo 'Cloudflare GitHub deployment credentials are unavailable.'
          exit 1
