name: Deploy SEEKVERA to Cloudflare
# Production deployment: Safety Gate + multilingual AI/Voice + R5 visual marketplace UI

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'voice-ai.js'
      - '*.html'
      - 'styles.css'
      - 'premium.css'
      - 'global-ui.css'
      - 'global-ui.js'
      - 'i18n-ui.js'
      - 'i18n-premium.css'
      - 'home-marketplace-r5.css'
      - 'app.js'
      - 'superapp.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Worker, Safety, AI, Worldwide and R5 UI
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
          grep -q '"binding": "AI"' wrangler.jsonc
          grep -q '@cf/google/gemma-4-26b-a4b-it' worker.js
          grep -q '@cf/zai-org/glm-4.7-flash' worker.js
          grep -q '@cf/meta/llama-3.1-8b-instruct-fast' worker.js
          grep -q '@cf/meta/llama-3.2-11b-vision-instruct' worker.js
          grep -q 'safetyGateVersion' worker.js
          grep -q '/api/vision' worker.js
          grep -q '/api/marketplace-submit' worker.js
          grep -q '/api/marketplace-review' worker.js
          grep -q "marketplaceProxy:'enabled'" worker.js
          grep -q '^\.wrangler$' .assetsignore
          grep -q '^worker.js$' .assetsignore
          grep -q '^wrangler.jsonc$' .assetsignore
          for f in voice-ai.js i18n-ui.js global-ui.js superapp.js sw.js; do node --check "$f"; done
          grep -q "HOST==='seekveraglobal.com'" i18n-ui.js
          grep -q "HOST==='seekveraglobal.com'" global-ui.js
          grep -q 'html\[dir="rtl"\]' i18n-premium.css
          grep -q 'data-release="20260923-market-r5"' index.html
          grep -q 'home-marketplace-r5.css?v=20260923-market-r5' index.html
          grep -q 'Worldwide' index.html
          grep -q 'class="r5-tile"' index.html
          grep -q 'href="media.html"' index.html
          grep -q 'href="games.html"' index.html
          grep -q 'location.replace' app.html
          if grep -q '<iframe' app.html; then echo 'R5 app shell must not use iframe'; exit 1; fi
          grep -q 'index.html?v=20260923-market-r5' manifest.webmanifest
          grep -q 'seekvera-market-r5-20260923' sw.js
          grep -q 'home-marketplace-r5.css' sw.js
          grep -q 'seekvera_worldwide_default_20260923_r4' superapp.js
          grep -q 'Worldwide · All countries' superapp.js
          grep -q 'syncInlineAssistantIntro' global-ui.js
          rm -rf .wrangler-dry-run .wrangler
          echo 'R5 source validation passed.'

      - name: Detect Cloudflare deployment credentials
        id: cf
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare credentials found.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare GitHub secrets are not configured.'
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live R5 production, AI and Safety
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://seekvera-main.seekvera-global.workers.dev'
          SITE='https://seekveraglobal.com'
          ok=0
          for i in $(seq 1 24); do
            curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$SITE/?market-r5=$i" -o /tmp/home.html || true
            curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$SITE/home-marketplace-r5.css?v=20260923-market-r5&n=$i" -o /tmp/r5.css || true
            curl -fsS --max-time 15 "$SITE/api/health?market-r5=$i" -o /tmp/site-health.json || true
            curl -fsS --max-time 15 "$BASE/api/health?market-r5=$i" -o /tmp/worker-health.json || true
            if grep -q 'data-release="20260923-market-r5"' /tmp/home.html 2>/dev/null && grep -q 'r5-market' /tmp/r5.css 2>/dev/null && grep -q '"centralSafetyGate":"enabled"' /tmp/site-health.json 2>/dev/null && grep -q '"marketplaceProxy":"enabled"' /tmp/worker-health.json 2>/dev/null; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = '1'
          grep -q 'home-marketplace-r5.css?v=20260923-market-r5' /tmp/home.html
          grep -q 'class="r5-tile"' /tmp/home.html
          grep -q 'href="media.html"' /tmp/home.html
          grep -q 'href="games.html"' /tmp/home.html
          grep -q '"failClosed":true' /tmp/site-health.json
          curl -fsS --max-time 15 "$SITE/app.html?market-r5=1" -o /tmp/app.html
          grep -q 'location.replace' /tmp/app.html
          if grep -q '<iframe' /tmp/app.html; then echo 'Live app.html still contains iframe'; exit 1; fi
          curl -fsS --max-time 15 "$SITE/manifest.webmanifest?market-r5=1" -o /tmp/manifest.json
          grep -q 'index.html?v=20260923-market-r5' /tmp/manifest.json
          curl -fsS --max-time 15 "$SITE/sw.js?market-r5=1" -o /tmp/sw.js
          grep -q 'seekvera-market-r5-20260923' /tmp/sw.js
          curl -fsS --max-time 35 -X POST "$SITE/api/ai" -H 'Content-Type: application/json' --data '{"message":"Reply only with: Hello.","country":"Worldwide","language":"English","scope":"worldwide","fast":true}' -o /tmp/site-ai.json
          grep -q '"ok":true' /tmp/site-ai.json
          grep -qi 'hello' /tmp/site-ai.json
          submit_code="$(curl -sS -o /tmp/submit.json -w '%{http_code}' --max-time 15 -X POST "$BASE/api/marketplace-submit" -H 'Origin: https://seekveraglobal.com' -H 'Content-Type: application/json' --data '{}')"
          test "$submit_code" = '400'
          grep -q 'Safety confirmations are required' /tmp/submit.json
          echo 'Live R5 production, direct app shell, AI and Safety checks passed.'

      - name: Deployment architecture
        if: steps.cf.outputs.ready != 'true'
        shell: bash
        run: |
          echo 'No GitHub Cloudflare credentials were found.'
          echo 'Production deployment must be completed by the connected Cloudflare Workers Build.'
