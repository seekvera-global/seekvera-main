name: Deploy SEEKVERA to Cloudflare
# Production deployment: Safety Gate v4 + AI Vision + global Voice AI + marketplace server routing
# 2026-09-22: final R3 multilingual UI + mobile audit alignment

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'voice-ai.js'
      - '*.html'
      - 'styles.css'
      - 'global-ui.css'
      - 'global-ui.js'
      - 'i18n-ui.js'
      - 'i18n-premium.css'
      - 'app.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Worker build, safety, multilingual UI and asset boundaries
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
          grep -q '"binding": "AI"' wrangler.jsonc
          grep -q '@cf/google/gemma-4-26b-a4b-it' worker.js
          grep -q '@cf/zai-org/glm-4.7-flash' worker.js
          grep -q '@cf/meta/llama-3.1-8b-instruct-fast' worker.js
          grep -q '@cf/meta/llama-3.2-11b-vision-instruct' worker.js
          grep -q 'safetyGateVersion' worker.js
          grep -q '/api/vision' worker.js
          grep -q '/api/marketplace-submit' worker.js
          grep -q '/api/marketplace-review' worker.js
          grep -q "marketplaceProxy:'enabled'" worker.js
          grep -q '^\.wrangler$' .assetsignore
          grep -q '^worker.js$' .assetsignore
          grep -q '^wrangler.jsonc$' .assetsignore
          test -s voice-ai.js
          test -s i18n-ui.js
          test -s i18n-premium.css
          node --check voice-ai.js
          node --check i18n-ui.js
          grep -q "'Country / Region':'الدولة / المنطقة'" i18n-ui.js
          grep -q 'html\[dir="rtl"\]' i18n-premium.css
          grep -q 'i18n-ui.js?v=20260922-final-r3' index.html
          grep -q 'i18n-premium.css?v=20260922-final-r3' index.html
          rm -rf .wrangler-dry-run .wrangler
          echo 'SEEKVERA Worker, Safety Gate, Voice AI, final R3 multilingual UI and asset boundaries are valid.'

      - name: Detect Cloudflare deployment credentials
        id: cf
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare credentials found; production deployment will run.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare GitHub secrets are not configured; native Cloudflare Workers Builds remains the deployment path.'
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live production security and health
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://seekvera-main.seekvera-global.workers.dev'
          SITE='https://seekveraglobal.com'

          for i in $(seq 1 12); do
            HEALTH="$(curl -fsS --max-time 12 "$BASE/api/health" || true)"
            HOME="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$SITE/?final-r3=$i" || true)"
            if echo "$HEALTH" | grep -q '"marketplaceProxy":"enabled"' && echo "$HEALTH" | grep -q '"centralSafetyGate":"enabled"' && echo "$HOME" | grep -q 'i18n-ui.js?v=20260922-final-r3'; then
              break
            fi
            sleep 5
          done
          echo "$HEALTH" | grep -q '"marketplaceProxy":"enabled"'
          echo "$HEALTH" | grep -q '"centralSafetyGate":"enabled"'
          echo "$HEALTH" | grep -q '"failClosed":true'
          echo "$HOME" | grep -q 'i18n-ui.js?v=20260922-final-r3'
          echo "$HOME" | grep -q 'i18n-premium.css?v=20260922-final-r3'
          curl -fsS --max-time 15 "$SITE/i18n-ui.js?v=20260922-final-r3" -o /tmp/i18n-ui.js
          grep -q 'full-app multilingual UI runtime' /tmp/i18n-ui.js
          curl -fsS --max-time 15 "$SITE/i18n-premium.css?v=20260922-final-r3" -o /tmp/i18n-premium.css
          grep -q 'premium multilingual/RTL overrides' /tmp/i18n-premium.css

          for path in worker.js wrangler.jsonc README.md README-FIRST.txt QA-REPORT.txt PAYMENTS-GLOBAL-NOTES.md package.json package-lock.json; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 "$BASE/$path")"
            if [ "$code" = '200' ]; then
              echo "Internal file unexpectedly public: $path"
              exit 1
            fi
          done

          submit_code="$(curl -sS -o /tmp/submit.json -w '%{http_code}' --max-time 15 -X POST "$BASE/api/marketplace-submit" -H 'Origin: https://seekveraglobal.com' -H 'Content-Type: application/json' --data '{}')"
          test "$submit_code" = '400'
          grep -q 'Safety confirmations are required' /tmp/submit.json

          review_code="$(curl -sS -o /tmp/review.json -w '%{http_code}' --max-time 15 -X POST "$BASE/api/marketplace-review" -H 'Origin: https://seekveraglobal.com' -H 'Content-Type: application/json' --data '{}')"
          test "$review_code" = '400'
          grep -Eqi 'reference|invalid' /tmp/review.json
          echo 'Live production final R3 multilingual UI, health, internal-file isolation and marketplace server routing passed.'

      - name: Deployment architecture
        if: steps.cf.outputs.ready != 'true'
        shell: bash
        run: |
          echo 'No GitHub Cloudflare credentials were found.'
          echo 'Production deployment must be completed by the connected Cloudflare Workers Build.'
