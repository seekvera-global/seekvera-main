name: Deploy SEEKVERA R17 to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'voice-ai.js'
      - '*.html'
      - 'styles.css'
      - 'premium.css'
      - 'global-ui.css'
      - 'global-ui.js'
      - 'i18n-ui.js'
      - 'i18n-premium.css'
      - 'home-marketplace-r5.css'
      - 'navigation.js'
      - 'app.js'
      - 'superapp.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-cloudflare-production-r17
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate R17 worldwide AI source
        shell: bash
        run: |
          set -euo pipefail
          for f in worker.js voice-ai.js i18n-ui.js global-ui.js superapp.js sw.js navigation.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re
          g=Path('global-ui.js').read_text(encoding='utf-8')
          n=Path('navigation.js').read_text(encoding='utf-8')
          i=Path('i18n-ui.js').read_text(encoding='utf-8')
          v=Path('voice-ai.js').read_text(encoding='utf-8')
          w=Path('worker.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          hub=Path('hub.html').read_text(encoding='utf-8')

          pm=re.search(r'const COUNTRY_PROFILE=Object\.fromEntries\(`([^`]+)`\.split',g,re.S)
          lm=re.search(r'const WORLD_LANGS=\[([^\]]+)\]',n,re.S)
          im=re.search(r'const SUPPORTED=\[([^\]]+)\]',i,re.S)
          assert pm and lm and im
          profiles={x.split(':',1)[0]:x.split(':',1)[1] for x in pm.group(1).split(';') if x}
          langs=re.findall(r"'([^']+)'",lm.group(1))
          i18n_langs=re.findall(r"'([^']+)'",im.group(1))
          assert len(profiles)==248,len(profiles)
          assert len(langs)==98,len(langs)
          assert len(i18n_langs)==98,len(i18n_langs)
          for cc,val in profiles.items(): assert val.split(',',1)[0] in langs,(cc,val)

          assert idx.count('id="categories"')==1
          assert 'r5-chips' not in idx and 'r8-department-strip' not in idx and 'class="r5-left"' not in idx
          assert 'navigation.js?v=20260924-r17' in idx
          assert 'voice-ai.js?v=20260924-r17' in idx
          assert 'global-ui.js?v=20260924-r17' in idx
          assert 'COUNTRY_COMMAND_ALIASES' in n and 'लेबनानी' in n
          assert 'overscroll-behavior:auto' in n and 'overflow-anchor:none' in n and 'touch-action:pan-y' in n
          assert "VOICE_SILENCE_MS=1250" in v
          assert "audio,language:'auto'" in v
          assert 'MediaRecorder' in v and '/api/transcribe' in v
          assert 'speechSynthesis' in v and 'function speakerAction' in v
          assert "language:'auto',scope:'worldwide'" in g
          assert 'async function aiChatRequest(payload)' in g
          assert "const RELEASE='20260924-ai-r17'" in w
          assert "const script=scriptLanguage(text);" in w
          assert "r17-message-language-auto-glm-first" in w
          assert 'daily_free_ai_limit' in w
          assert "const CACHE='seekvera-r17-worldwide-ai-20260924'" in sw
          for endpoint in ["/api/ai","/api/ui-translate","/api/locale","/api/transcribe","/api/visual-search"]: assert endpoint in w,endpoint
          assert 'safetyGateVersion' in w

          required=['marketplace.html','travel.html','tourism.html','property.html','cars-auto.html','jobs.html','shopping.html','restaurants-food.html','local-services.html','import-export.html','shipping-logistics.html','business-software.html','software.html','web-hosting.html','solar.html','education.html','health.html','money-insurance.html','entertainment.html','media.html','games.html','connectivity.html','wifi.html','deal-agent.html','everyday.html','scan.html','post-ad.html','seller-plans.html']
          for x in required:
              assert x in idx and x in hub and Path(x).exists(),x
          pages=[]
          for p in Path('.').glob('*.html'):
              if p.name.lower().startswith('google'): continue
              t=p.read_text(encoding='utf-8')
              for asset in ['navigation.js','global-ui.js','i18n-ui.js','voice-ai.js']: assert asset in t,(p.name,asset)
              pages.append(p.name)
          assert len(pages)>=44,len(pages)
          print('R17 SOURCE PASS:',len(profiles),'countries;',len(langs),'languages;',len(pages),'public pages')
          PY
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
          grep -q '"binding": "AI"' wrangler.jsonc
          rm -rf .wrangler-dry-run .wrangler

      - name: Detect Cloudflare deployment credentials
        id: cf
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live R17 production
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://seekveraglobal.com'
          UA='Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0 Mobile Safari/537.36'
          ok=0
          for i in $(seq 1 30); do
            curl -L -fsS --max-time 25 -A "$UA" -H 'Cache-Control: no-cache' "$SITE/?r17-live=$i" -o /tmp/home.html || true
            curl -L -fsS --max-time 25 -A "$UA" -H 'Cache-Control: no-cache' "$SITE/navigation.js?r17-live=$i" -o /tmp/nav.js || true
            curl -L -fsS --max-time 25 -A "$UA" -H 'Cache-Control: no-cache' "$SITE/voice-ai.js?r17-live=$i" -o /tmp/voice.js || true
            curl -L -fsS --max-time 25 -A "$UA" -H 'Cache-Control: no-cache' "$SITE/global-ui.js?r17-live=$i" -o /tmp/global.js || true
            if grep -q 'navigation.js?v=20260924-r17' /tmp/home.html 2>/dev/null && grep -q 'COUNTRY_COMMAND_ALIASES' /tmp/nav.js 2>/dev/null && grep -q "VOICE_SILENCE_MS=1250" /tmp/voice.js 2>/dev/null && grep -q "language:'auto',scope:'worldwide'" /tmp/global.js 2>/dev/null; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = '1'
          test "$(grep -o 'id=\"categories\"' /tmp/home.html | wc -l)" = '1'
          ! grep -q 'r8-department-strip' /tmp/home.html
          ! grep -q 'class="r5-left"' /tmp/home.html
          grep -q 'लेबनानी' /tmp/nav.js
          grep -q 'overscroll-behavior:auto' /tmp/nav.js
          grep -q "audio,language:'auto'" /tmp/voice.js
          grep -q 'async function aiChatRequest(payload)' /tmp/global.js

          curl -L -fsS --max-time 25 -A "$UA" "$SITE/api/health?r17-live=1" -o /tmp/health.json
          grep -q '20260924-ai-r17' /tmp/health.json
          echo 'LIVE R17 ASSETS + HEALTH PASS'

          ai_code="$(curl -sS -o /tmp/ai.json -w '%{http_code}' --max-time 70 -X POST "$SITE/api/ai" -A "$UA" -H "Origin: $SITE" -H "Referer: $SITE/" -H 'Content-Type: application/json' --data '{"message":"Hello. Please answer briefly in English: do you understand me?","country":"India","language":"auto","scope":"worldwide","fast":true}')"
          if [ "$ai_code" = '200' ]; then
            grep -q '"ok":true' /tmp/ai.json
            grep -q '"response"' /tmp/ai.json
            echo 'LIVE R17 AI PASS'
          elif [ "$ai_code" = '503' ] && grep -q 'daily_free_ai_limit' /tmp/ai.json; then
            echo '::error::Cloudflare Workers AI daily free allocation is exhausted. The UI/runtime is deployed, but real AI cannot be called perfect until quota resets or capacity is added.'
            cat /tmp/ai.json
            exit 1
          else
            echo "Unexpected AI HTTP $ai_code"; cat /tmp/ai.json; exit 1
          fi

      - name: Missing deployment credentials
        if: steps.cf.outputs.ready != 'true'
        run: |
          echo 'Cloudflare deployment credentials are unavailable.'
          exit 1
