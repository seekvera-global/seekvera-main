            const ar=await p.evaluate(()=>({dir:document.documentElement.dir,intro:document.querySelector('#aiMessages .ai-msg.bot')?.textContent||''}));
            if(ar.dir!=='rtl'||!/[\u0600-\u06FF]/.test(ar.intro)) throw Error(name+' Arabic/RTL failed '+JSON.stringify(ar));
            console.log(name,'PASS',r);
            await b.close();
