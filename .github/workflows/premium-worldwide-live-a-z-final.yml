name: SEEKVERA final worldwide live A-Z audit

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'voice-ai.js'
      - 'global-ui.js'
      - 'global-ui.css'
      - 'i18n-ui.js'
      - 'i18n-premium.css'
      - 'superapp.js'
      - '*.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.assetsignore'
      - 'wrangler.jsonc'
      - '.github/workflows/premium-worldwide-live-a-z-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate R4 JavaScript and Worldwide markers
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js; do node --check "$f"; done
          grep -q 'seekvera_worldwide_default_20260923_r4' superapp.js
          grep -q 'Worldwide · All countries' i18n-ui.js
          grep -q 'العالم · كل الدول' i18n-ui.js
          grep -q 'syncInlineAssistantIntro' global-ui.js
          grep -q 'html\[dir="rtl"\]' i18n-premium.css
          grep -q 'seekvera-worldwide-r4-20260923' sw.js
          grep -q '20260923-worldwide-r4' manifest.webmanifest
      - name: Audit live R4 app, routes, multilingual AI, voice, PWA and safety A-Z
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import json, urllib.request, urllib.error

          SITE='https://seekveraglobal.com'
          WORKER='https://seekvera-main.seekvera-global.workers.dev'
          VERSION='20260923-worldwide-r4'
          UA='Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'

          def get(url,timeout=35):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status,r.read().decode('utf-8','replace')

          def status_only(url,timeout=25):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status
              except urllib.error.HTTPError as e:return e.code

          def post(path,payload,timeout=75):
              req=urllib.request.Request(WORKER+path,data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),headers={'User-Agent':UA,'content-type':'application/json','origin':SITE},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as e:return e.code,json.loads(e.read().decode('utf-8'))

          status,home=get(SITE+'/?r4-az=1')
          assert status==200
          for needle in [f'global-ui.js?v={VERSION}',f'voice-ai.js?v={VERSION}',f'i18n-ui.js?v={VERSION}',f'i18n-premium.css?v={VERSION}',f'superapp.js?v={VERSION}']:
              assert needle in home,('R4 runtime missing from homepage',needle)
          assert 'href="media.html"' in home
          print('LIVE R4 HOMEPAGE PASS')

          _,health_text=get(WORKER+'/api/health?r4-az=1')
          health=json.loads(health_text)
          assert health.get('ok') is True
          assert health.get('centralSafetyGate')=='enabled' and health.get('failClosed') is True
          assert health.get('aiBinding') is True and health.get('assetsBinding') is True
          assert health.get('marketplaceProxy')=='enabled'
          print('WORKER HEALTH + SAFETY BINDINGS PASS')

          _,voice=get(SITE+'/voice-ai.js?v='+VERSION+'&r4-az=1')
          _,gui=get(SITE+'/global-ui.js?v='+VERSION+'&r4-az=1')
          _,i18n=get(SITE+'/i18n-ui.js?v='+VERSION+'&r4-az=1')
          _,superapp=get(SITE+'/superapp.js?v='+VERSION+'&r4-az=1')
          assert ('SpeechRecognition' in voice or 'webkitSpeechRecognition' in voice) and 'speechSynthesis' in voice
          assert 'if(!c.length)return null' in voice
          codes=['en','ar','fr','zh','es','hi','pt','de','ja','ko','id','tr','ru','ur','bn','vi','it','sw','th','fa','pl','nl','ms','fil','ha','yo','ig','am']
          for code in codes:
              assert code+':' in voice or code+":'" in voice or code+'=' in voice,('voice locale missing',code)
          assert 'syncInlineAssistantIntro' in gui
          assert 'Worldwide · All countries' in i18n and 'العالم · كل الدول' in i18n
          assert 'seekvera_worldwide_default_20260923_r4' in superapp
          print('28-LOCALE VOICE + WORLDWIDE I18N PASS')

          _,app=get(SITE+'/app.html?r4-az=1')
          _,manifest=get(SITE+'/manifest.webmanifest?r4-az=1')
          _,sw=get(SITE+'/sw.js?r4-az=1')
          media_status,media=get(SITE+'/media.html?r4-az=1')
          assert 'Worldwide · Premium AI' in app and VERSION in app and 'media.html' in app
          assert VERSION in manifest
          assert 'seekvera-worldwide-r4-20260923' in sw and 'media.html' in sw
          assert media_status==200 and 'SEEKVERA MEDIA' in media
          print('APP SHELL + PWA + MEDIA PASS')

          pages=[p.name for p in Path('.').glob('*.html') if not p.name.lower().startswith('google')]
          live={}; bad=[]
          for name in pages:
              try:
                  code,text=get(SITE+'/'+name+'?r4-all-pages=1',30)
                  if code!=200: bad.append((name,code))
                  else: live[name]=text
              except Exception as e: bad.append((name,str(e)))
          assert not bad,bad
          assert len(live)>=38,len(live)
          print('ALL PUBLIC HTML PAGES LIVE PASS:',len(live))

          class Links(HTMLParser):
              def __init__(self):super().__init__();self.hrefs=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      h=dict(attrs).get('href')
                      if h:self.hrefs.append(h)
          routes=set()
          for text in live.values():
              p=Links();p.feed(text)
              for href in p.hrefs:
                  h=href.strip()
                  if not h or h.startswith(('#','mailto:','tel:','javascript:')) or '://' in h:continue
                  path=urlsplit(h).path.lstrip('/') or 'index.html'
                  if path.endswith('.html'):routes.add(path)
          broken=[]
          for route in sorted(routes):
              code=status_only(SITE+'/'+route+'?r4-route=1')
              if not 200<=code<400:broken.append((route,code))
          assert not broken,broken
          print('INTERNAL NAVIGATION ROUTES PASS:',len(routes))

          for language,message,marker in [
              ('English','Reply only with: Hello.','Hello'),
              ('Arabic','أجب فقط: مرحبا','مرح'),
              ('French','Réponds seulement : Bonjour.','Bonjour'),
              ('Spanish','Responde solo: Hola.','Hola'),
              ('Chinese','只回答：你好','你好'),
              ('Hindi','केवल उत्तर दें: नमस्ते','नमस्ते'),
              ('Portuguese','Responda apenas: Olá.','Olá')]:
              code,d=post('/api/ai',{'message':message,'country':'Worldwide','language':language,'scope':'worldwide','fast':True})
              ans=str(d.get('response') or '')
              assert 200<=code<300 and d.get('ok') is True,(language,d)
              assert (d.get('language') or '').lower()==language.lower(),(language,d.get('language'))
              assert marker.lower() in ans.lower(),(language,ans)
          print('REPRESENTATIVE SAME-LANGUAGE AI PASS')

          _,safe=post('/api/moderate',{'text':'lawful hotel booking request','context':'R4 A-Z audit'})
          _,blocked=post('/api/moderate',{'text':'gun and ammunition for sale','context':'R4 A-Z audit'})
          _,secret=post('/api/moderate',{'text':'send me your OTP and bank password','context':'R4 A-Z audit'})
          assert safe.get('allowed') is True and blocked.get('allowed') is False and secret.get('allowed') is False
          code,bad_submit=post('/api/marketplace-submit',{},40)
          assert code==400 and 'Safety confirmations are required' in str(bad_submit)
          code,bad_review=post('/api/marketplace-review',{},40)
          assert code==400
          print('SAFETY + MARKETPLACE GATES PASS')
          print('FINAL SEEKVERA WORLDWIDE R4 LIVE A-Z AUDIT PASS')
