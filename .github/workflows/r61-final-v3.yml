name: R62 universal language voice control
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r61-final-v3.yml']
permissions:
  contents: write
jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build R62
        shell: bash
        run: |
          set -euo pipefail
          python tools/r62_any_language_voice.py
          node --check navigation.js
          node --check r24-ai-controller.js
          node --check r31-ui-polish.js
          node --check voice-ai.js
          node --check r60-runtime-guard.js
          node --check worker-r31.js
          grep -F "function conversationLang(q=''){return'auto'}" r31-ui-polish.js >/dev/null
          grep -F "body:JSON.stringify({audio,language:'auto'})" voice-ai.js >/dev/null
          grep -F "/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)&&navigator.mediaDevices?.getUserMedia&&window.MediaRecorder" voice-ai.js >/dev/null
          grep -F "20260926-r62-any-language-voice-control" r24-ai-controller.js >/dev/null
          ! grep -F 'bindLocaleControls();bindAICountryControl();' navigation.js
      - name: Deploy R62
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Wait for R62 live assets
        shell: bash
        run: |
          set -euo pipefail
          S='https://seekveraglobal.com'
          for i in $(seq 1 30); do
            a="$(curl -LfsS --max-time 15 -H 'Cache-Control: no-cache' "$S/r31-ui-polish.js?r62=$i" || true)"
            v="$(curl -LfsS --max-time 15 -H 'Cache-Control: no-cache' "$S/voice-ai.js?r62=$i" || true)"
            c="$(curl -LfsS --max-time 15 -H 'Cache-Control: no-cache' "$S/r24-ai-controller.js?r62=$i" || true)"
            if [[ "$a" == *"function conversationLang(q=''){return'auto'}"* && "$v" == *"body:JSON.stringify({audio,language:'auto'})"* && "$v" == *"Android|iPhone|iPad|iPod"* && "$c" == *"20260926-r62-any-language-voice-control"* ]]; then
              echo 'R62 LIVE ASSETS PASS'; break
            fi
            sleep 2; [ "$i" != 30 ] || exit 1
          done
      - name: Worldwide controls, same-language request, persistent chat and voice endpoint
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > test.mjs <<'JS'
          import {chromium} from 'playwright';import assert from 'node:assert/strict';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({userAgent:'Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'});
          const seen=[];
          await p.route('**/api/ai',async route=>{if(route.request().method()==='POST'){const body=route.request().postDataJSON();seen.push(body);let response='Okay';let language='en';if(/bonjour|france/i.test(body.message||'')){response='Très bien. Je continue en français.';language='fr'}else if(/[\u0600-\u06ff]/u.test(body.message||'')){response='تمام. سأكمل معك بالعربية.';language='ar'}await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,response,language,category:'general',route:'marketplace.html'})})}else await route.continue()});
          await p.goto('https://seekveraglobal.com/?r62='+Date.now(),{waitUntil:'networkidle',timeout:60000});
          await p.waitForFunction(()=>window.SEEKVERA_RELEASE==='20260926-r62-any-language-voice-control'&&window.SEEKVERA_R24_CONTROLLER&&window.SEEKVERA_VOICE_AI&&window.SEEKVERA_CHAT&&document.querySelector('#aiChatForm'),null,{timeout:30000});
          await p.evaluate(()=>{localStorage.removeItem('seekvera_ai_chat_v1')});await p.reload({waitUntil:'networkidle',timeout:60000});
          const cov=await p.evaluate(()=>{const ctl=SEEKVERA_R24_CONTROLLER,langs=ctl.languages,codes=Object.keys(SEEKVERA_LOCALE_R15.profiles).filter(x=>/^[A-Z]{2}$/.test(x));let enGood=0;const en=new Intl.DisplayNames(['en'],{type:'region'});for(const c of codes){const n=en.of(c);if(ctl.detectControls('change country to '+n).country===c)enGood++}return{langs:langs.length,codes:codes.length,enGood,america:ctl.detectControls('change app to America').country,chinese:ctl.detectControls('change country to 美国').country}});
          assert.equal(cov.langs,98,JSON.stringify(cov));assert.equal(cov.codes,248,JSON.stringify(cov));assert.equal(cov.enGood,248,JSON.stringify(cov));assert.equal(cov.america,'US');assert.equal(cov.chinese,'US');
          async function send(q){await p.fill('#aiChatInput',q);await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p.waitForTimeout(700)}
          await send('bonjour, comment allez-vous aujourd’hui ?');
          assert.equal(seen.at(-1)?.language,'auto',JSON.stringify(seen.at(-1)));
          let text=await p.locator('#aiMessages').innerText();assert.ok(text.includes('Très bien. Je continue en français.'),text);
          await send('change app to France');await p.waitForFunction(()=>document.querySelector('#country')?.value==='FR',null,{timeout:5000});
          assert.equal(seen.at(-1)?.language,'auto',JSON.stringify(seen.at(-1)));
          await send('غير التطبيق إلى نيجيريا');await p.waitForFunction(()=>document.querySelector('#country')?.value==='NG',null,{timeout:5000});
          assert.equal(seen.at(-1)?.language,'auto',JSON.stringify(seen.at(-1)));
          const state=await p.evaluate(()=>({country:country.value,currency:currency.value,chat:localStorage.getItem('seekvera_ai_chat_v1')||'',voiceMode:localStorage.getItem('seekvera_voice_mode')}));
          assert.equal(state.country,'NG');assert.equal(state.currency,'NGN');assert.ok(state.chat.includes('bonjour, comment allez-vous aujourd’hui ?'));assert.ok(state.chat.includes('غير التطبيق إلى نيجيريا'));
          const voiceAsset=await (await p.request.get('https://seekveraglobal.com/voice-ai.js?r62audit='+Date.now())).text();assert.ok(voiceAsset.includes("body:JSON.stringify({audio,language:'auto'})"));assert.ok(voiceAsset.includes('Android|iPhone|iPad|iPod'));
          const apiVoice=await p.evaluate(async()=>{const r=await fetch('/api/tts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:'Bonjour depuis SEEKVERA',language:'fr'})});return{ok:r.ok,type:r.headers.get('content-type'),bytes:(await r.arrayBuffer()).byteLength}});assert.equal(apiVoice.ok,true,JSON.stringify(apiVoice));assert.ok(apiVoice.type.startsWith('audio/'),JSON.stringify(apiVoice));assert.ok(apiVoice.bytes>500,JSON.stringify(apiVoice));
          console.log('R62 UNIVERSAL LANGUAGE PASS',JSON.stringify({cov,state,apiVoice,requests:seen.length}));await b.close();
          JS
          node test.mjs
          rm -f test.mjs
      - name: Persist audited R62 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add ./*.html navigation.js r24-ai-controller.js r31-ui-polish.js voice-ai.js r60-runtime-guard.js worker-r31.js sw.js
          if ! git diff --cached --quiet; then git commit -m 'Persist R62 universal language voice controls'; git push origin HEAD:main; fi
          echo 'R62 FINAL PERSISTED'