name: SEEKVERA live production smoke test

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'index.html'
      - '.github/workflows/live-ai-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-live-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate Worker source and bindings
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
          grep -q '"binding": "AI"' wrangler.jsonc
          grep -q '@cf/google/gemma-4-26b-a4b-it' worker.js
          grep -q '@cf/zai-org/glm-4.7-flash' worker.js
          grep -q 'requestStorage: "supabase"' worker.js
          echo 'Worker source validation passed.'

      - name: Wait for latest Worker deployment
        shell: bash
        run: |
          set -euo pipefail
          health='https://seekvera-main.seekvera-global.workers.dev/api/health'
          ready=0
          for i in $(seq 1 36); do
            if curl -fsS --max-time 20 "$health" -o /tmp/health.json; then
              if python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/health.json', encoding='utf-8'))
              assert d.get('ok') is True
              assert d.get('aiBinding') is True
              assert d.get('requestStorage') == 'supabase'
              assert d.get('requestStorageReady') is True
              print('Worker health:', d)
          except Exception as e:
              raise SystemExit(1)
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          test "$ready" -eq 1

      - name: Test live Workers AI response
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://seekvera-main.seekvera-global.workers.dev/api/ai'
          ok=0
          for i in $(seq 1 5); do
            if curl -fsS --max-time 75 "$endpoint" \
              -H 'content-type: application/json' \
              --data '{"message":"Reply with a short sentence confirming SEEKVERA AI is online.","country":"Worldwide","language":"English"}' \
              -o /tmp/ai.json; then
              if python - <<'PY'
          import json
          d=json.load(open('/tmp/ai.json', encoding='utf-8'))
          assert d.get('ok') is True, d
          assert isinstance(d.get('response'), str) and d['response'].strip(), d
          assert d.get('provider') == 'Cloudflare Workers AI', d
          print('AI model:', d.get('model'))
          print('AI response:', d['response'][:300])
          PY
              then
                ok=1
                break
              fi
            fi
            sleep 8
          done
          test "$ok" -eq 1

      - name: Test live request storage
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://seekvera-main.seekvera-global.workers.dev/api/request' \
            -H 'content-type: application/json' \
            --data '{"country":"Worldwide","city":"","type":"Other","budget":"","contact":"","description":"SEEKVERA automated live smoke test"}' \
            -o /tmp/request.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/request.json', encoding='utf-8'))
          assert d.get('ok') is True and d.get('id'), d
          print('Stored request test reference:', d['id'])
          PY

      - name: Test public pages and marketplace
        shell: bash
        run: |
          set -euo pipefail
          worker='https://seekvera-main.seekvera-global.workers.dev'
          pages='index.html marketplace.html post-ad.html seller-plans.html travel.html property.html cars-auto.html jobs.html shopping.html import-export.html business-software.html solar.html health.html education.html local-services.html privacy.html terms.html contact.html robots.txt sitemap.xml'
          for page in $pages; do
            curl -fsS --max-time 30 "$worker/$page" -o /dev/null
          done
          curl -fsS --max-time 30 "$worker/" -o /tmp/home.html
          grep -q 'SEEKVERA' /tmp/home.html
          grep -q 'Ask Anything' /tmp/home.html
          grep -q 'Marketplace Ads' /tmp/home.html
          echo 'Public Worker pages passed.'

      - name: Verify GitHub Pages mirror
        shell: bash
        run: |
          set -euo pipefail
          url='https://seekvera-global.github.io/seekvera-main/'
          curl -fsS --max-time 30 "$url" -o /tmp/gh-home.html
          grep -q 'SEEKVERA' /tmp/gh-home.html
          grep -q 'Marketplace Ads' /tmp/gh-home.html
          echo 'GitHub Pages mirror passed.'
