name: SEEKVERA live production smoke test

on:
  push:
    branches: [main]
    paths:
      - 'worker-r76.js'
      - 'wrangler.jsonc'
      - 'index.html'
      - 'global-ui.js'
      - 'i18n-ui.js'
      - 'superapp.js'
      - 'voice-ai.js'
      - 'i18n-r32/**'
      - '.github/workflows/live-ai-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-live-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate R76 source and bindings
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
          grep -q '"main": "./worker-r76.js"' wrangler.jsonc
          grep -q '"binding": "AI"' wrangler.jsonc
          grep -q '"run_worker_first": \["/api/\*"\]' wrangler.jsonc
          grep -q "20260926-r76-unified-global-ai" worker-r76.js
          grep -q "single-structured-multilingual-ai" worker-r76.js
          grep -q "browser-resilient-backup" r24-ai-controller.js
          node --check worker-r76.js
          node --check global-ui.js
          node --check i18n-ui.js
          node --check superapp.js
          node --check voice-ai.js
          echo R76_SOURCE_AND_BINDINGS_PASS

      - name: Verify live static R76 and 98 language packs
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 18); do
            code="$(curl -LsS --max-time 30 -o /tmp/home -w '%{http_code}' -H 'Cache-Control: no-cache' "https://seekveraglobal.com/?r76smoke=$i" || true)"
            if [ "$code" = 200 ] && grep -q '20260926-r76-complete-global-final' /tmp/home; then ready=1; break; fi
            sleep 10
          done
          test "$ready" -eq 1
          curl -fsS --max-time 30 "https://seekveraglobal.com/i18n-r32/manifest.json?r76=$(date +%s)" -o /tmp/manifest.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/manifest.json',encoding='utf-8'))
          assert d['version']=='20260926-r76-complete-global-final',d
          assert d['packs']==98 and len(d['languages'])==98,d
          assert d['sourceHash']=='b371f2422f8b5416',d
          print('R76_STATIC_AND_98_PACKS_PASS')
          PY

      - name: Record API health and test AI when quota is available
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -LsS --max-time 30 -o /tmp/health -w '%{http_code}' "https://seekveraglobal.com/api/health?r76=$(date +%s)" || true)"
          echo "R76_API_HEALTH_STATUS=$status"
          if [ "$status" = 200 ]; then
            python - <<'PY'
          import json
          d=json.load(open('/tmp/health',encoding='utf-8'))
          assert d.get('r76') is True,d
          assert d.get('r76Runtime')=='single-structured-multilingual-ai',d
          print('R76_API_HEALTHY')
          PY
            curl -fsS --max-time 90 "https://seekveraglobal.com/api/ai" -H 'content-type: application/json' --data '{"message":"شو فيك تساعدني اليوم؟","country":"WW","language":"auto","fast":true}' -o /tmp/ai.json
            python - <<'PY'
          import json
          d=json.load(open('/tmp/ai.json',encoding='utf-8'))
          assert d.get('ok') is True and str(d.get('response','')).strip(),d
          assert any('\u0600'<=c<='\u06ff' for c in d['response']),d
          print('R76_LIVE_AI_PASS')
          PY
          elif [ "$status" = 429 ]; then
            echo R76_API_QUOTA_EXHAUSTED_BROWSER_FALLBACK_ACTIVE
          else
            echo "Unexpected API health response: $(head -c 300 /tmp/health 2>/dev/null || true)"
            exit 1
          fi

      - name: Verify GitHub Pages mirror
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 12); do
            if curl -fsS --max-time 30 "https://seekvera-global.github.io/seekvera-main/?r76mirror=$i" -o /tmp/gh-home.html && grep -q '20260926-r76-complete-global-final' /tmp/gh-home.html; then ready=1; break; fi
            sleep 10
          done
          test "$ready" -eq 1
          echo R76_GITHUB_PAGES_MIRROR_PASS
