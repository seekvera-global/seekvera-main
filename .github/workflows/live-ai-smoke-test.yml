name: SEEKVERA live AI smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-ai-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Pages worldwide frontend
        shell: bash
        run: |
          set -euo pipefail
          base='https://seekvera-global.github.io/seekvera-main/'
          curl -fsS --max-time 30 "$base" -o /tmp/home.html
          grep -q 'SEEKVERA' /tmp/home.html
          grep -q 'Worldwide / Any country' /tmp/home.html
          grep -q 'cheap hotel anywhere in the world' /tmp/home.html
          if grep -q 'Popular in Nigeria' /tmp/home.html; then
            echo 'Nigeria-specific default detected'
            exit 1
          fi
          if grep -q '🇳🇬 Nigeria • NGN' /tmp/home.html; then
            echo 'Nigeria-specific badge detected'
            exit 1
          fi
          echo 'Worldwide frontend OK'

      - name: Check public backup AI endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 \
            'https://text.pollinations.ai/Reply%20with%20only%3A%20SEEKVERA%20AI%20OK?model=openai&private=true' \
            -o /tmp/ai.txt
          test -s /tmp/ai.txt
          echo 'AI fallback endpoint OK'
