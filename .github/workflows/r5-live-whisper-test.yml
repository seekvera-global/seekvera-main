name: SEEKVERA R5 live Whisper speech test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r5-live-whisper-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Generate spoken audio and test live browser-style transcription
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak >/dev/null
          espeak -s 120 -w /tmp/seekvera.wav 'hello seekvera' >/dev/null 2>&1
          python - <<'PY'
          import base64,json
          raw=open('/tmp/seekvera.wav','rb').read()
          payload={'audio':'data:audio/wav;base64,'+base64.b64encode(raw).decode(),'language':'en'}
          open('/tmp/payload.json','w').write(json.dumps(payload))
          print('AUDIO_BYTES',len(raw),'JSON_BYTES',len(json.dumps(payload)))
          PY
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          SITE_CODE="$(curl -sS -A "$UA" -H 'Origin: https://seekveraglobal.com' -H 'Referer: https://seekveraglobal.com/' -H 'Content-Type: application/json' --data-binary @/tmp/payload.json -o /tmp/site.json -w '%{http_code}' --max-time 90 https://seekveraglobal.com/api/transcribe)"
          echo "SITE_CODE=$SITE_CODE"; cat /tmp/site.json; echo
          WORKER_CODE="$(curl -sS -A "$UA" -H 'Origin: https://seekveraglobal.com' -H 'Referer: https://seekveraglobal.com/' -H 'Content-Type: application/json' --data-binary @/tmp/payload.json -o /tmp/worker.json -w '%{http_code}' --max-time 90 https://seekvera-main.seekvera-global.workers.dev/api/transcribe)"
          echo "WORKER_CODE=$WORKER_CODE"; cat /tmp/worker.json; echo
          export SITE_CODE WORKER_CODE
          python - <<'PY'
          import json,os
          def load(path):
              raw=open(path).read().strip()
              try:return json.loads(raw)
              except:return {'raw':raw[:500]}
          sc=int(os.environ['SITE_CODE']); wc=int(os.environ['WORKER_CODE'])
          site=load('/tmp/site.json'); worker=load('/tmp/worker.json')
          good=[]
          for label,code,d in [('site',sc,site),('worker',wc,worker)]:
              if 200 <= code < 300 and d.get('ok') and str(d.get('text') or '').strip() and 'whisper-large-v3-turbo' in str(d.get('model') or ''):
                  good.append(label)
          assert good, {'site_code':sc,'site':site,'worker_code':wc,'worker':worker}
          print('LIVE_WHISPER_REAL_AUDIO_PASS',good)
          PY
