name: Final SEEKVERA Universal Global polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/top-polish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polish-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate worldwide-neutral production configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SEEKVERA Universal Global' index.html
          grep -q 'Worldwide / Any country' index.html
          grep -q '🌍 Worldwide • Global' index.html
          grep -q 'Popular worldwide' index.html
          grep -q 'cheap hotel anywhere in the world' index.html
          grep -q 'في أي مكان في العالم' index.html
          grep -q '世界任何地方' index.html
          grep -q 'https://seekvera-global.github.io/seekvera-main/' index.html
          grep -q 'https://seekvera-global.github.io/seekvera-main/sitemap.xml' robots.txt
          grep -q 'cars-auto.html' sitemap.xml
          grep -q 'restaurants-food.html' sitemap.xml
          grep -q 'shipping-logistics.html' sitemap.xml
          grep -q 'local-services.html' sitemap.xml
          grep -q 'money-insurance.html' sitemap.xml
          if grep -q 'cheap hotel in Abuja' index.html; then
            echo 'Abuja-specific English default remains'
            exit 1
          fi
          if grep -q 'أبوجا' index.html; then
            echo 'Abuja-specific Arabic default remains'
            exit 1
          fi
          if grep -q '阿布贾' index.html; then
            echo 'Abuja-specific Chinese default remains'
            exit 1
          fi
          if grep -q 'Popular in Nigeria' index.html; then
            echo 'Nigeria-specific popular default remains'
            exit 1
          fi
          if grep -q '🇳🇬 Nigeria • NGN' index.html; then
            echo 'Nigeria-specific default badge remains'
            exit 1
          fi
          if grep -q '"countryPopular": {"NG"' index.html; then
            echo 'Nigeria-specific curated data remains'
            exit 1
          fi
          echo 'SEEKVERA worldwide-neutral polish validated in all checked languages.'
