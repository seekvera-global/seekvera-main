name: Quarantine marketplace images once

on:
  push:
    paths:
      - '.github/workflows/quarantine-marketplace-images-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move pending uploads to private quarantine bucket
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('post-ad.html')
          s=p.read_text(encoding='utf-8')
          old="const r=await fetch(SB+'/storage/v1/object/marketplace-images/'+encoded,{method:'POST',headers:{...H,'content-type':file.type,'x-upsert':'false'},body:file});if(!r.ok)throw new Error('Photo upload failed');return SB+'/storage/v1/object/public/marketplace-images/'+encoded"
          new="const r=await fetch(SB+'/storage/v1/object/marketplace-pending-images/'+encoded,{method:'POST',headers:{...H,'content-type':file.type,'x-upsert':'false'},body:file});if(!r.ok)throw new Error('Photo upload failed');return 'pending://'+path"
          if old not in s:
            if 'marketplace-pending-images' in s and "return 'pending://'+path" in s:
              print('Already patched')
            else:
              raise SystemExit('Expected upload marker not found')
          else:
            s=s.replace(old,new,1)
            p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'SEEKVERA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add post-ad.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Quarantine pending marketplace images privately'
            git push
          fi