name: Fix R6 Vision Parser V5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-r6-vision-parser-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden explicit Vision decision parsing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('worker.js')
          s=p.read_text(encoding='utf-8')
          parsed="function parsed(s,model,src='ai'){s=String(s||'').replace(/\\s+/g,' ').trim();const m=s.match(/(?:^|\\s)(ALLOW|REVIEW|BLOCK)\\s*\\|\\s*([^|]{1,300})/i);if(m){const d=m[1].toUpperCase(),reason=clean(m[2],160);if(d==='ALLOW')return{ok:true,allowed:true,reviewRequired:false,reason:'safe',model,source:src};if(d==='REVIEW')return{ok:true,allowed:true,reviewRequired:true,reason:reason||'review',model,source:src};if(d==='BLOCK')return{ok:true,allowed:false,reviewRequired:true,reason:reason||'blocked',model,source:src}}return{ok:true,allowed:false,reviewRequired:true,reason:'unrecognized_ai_result',source:'fail-closed',model}}"
          s,n=re.subn(r"function parsed\(s,model,src='ai'\)\{.*?\}\nasync function safety",parsed+'\nasync function safety',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('parsed patch failed')
          visual="""if(u.pathname==='/api/visual-search'){try{const b=await request.json(),v=await vision(env,b.image,[b.country,b.language,b.context].filter(Boolean).join(' | '));if(v.status!==200||!v.result.allowed||v.result.reviewRequired)return j(request,v.result,v.status);const p='After safety approval, classify the visible object/place for lawful search. Never identify a person. Choose one: marketplace, travel, connectivity, property, cars, jobs, business, restaurants, shopping, health, general. Include one explicit marker in this exact format: CATEGORY|category|short summary|short search query.';const r=await runVision(env,{messages:[{role:'system',content:p},{role:'user',content:'Classify this safe image and include the CATEGORY marker.'}],image:String(b.image),max_tokens:140,temperature:0}),raw=String(out(r)||'').replace(/\\s+/g,' ').trim(),m=raw.match(/CATEGORY\\s*\\|\\s*([^|]{1,80})\\s*\\|\\s*([^|]{1,250})\\s*\\|\\s*(.{1,250})/i);if(!m)return j(request,{ok:true,allowed:true,reviewRequired:true,reason:'visual_classification_uncertain'});const cat=clean(m[1],80).toLowerCase(),summary=clean(m[2],250),query=clean(m[3],250);return j(request,{ok:true,allowed:true,reviewRequired:false,category:cat,summary,suggestedQuery:query,guidance:'Open the matching section and compare verified live offers.',route:route(cat),model:VISION})}catch{return j(request,{ok:true,allowed:false,reviewRequired:true,reason:'visual_search_unavailable_hold',source:'fail-closed'})}}"""
          s,n=re.subn(r"if\(u\.pathname==='/api/visual-search'\)\{.*?\}\}\nif\(u\.pathname==='/api/marketplace-submit'",visual+"\nif(u.pathname==='/api/marketplace-submit'",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('visual-search patch failed')
          p.write_text(s,encoding='utf-8')
          PY
          node --check worker.js

      - name: Commit parser fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name seekvera-bot
          git config user.email actions@users.noreply.github.com
          git add worker.js
          if ! git diff --cached --quiet; then
            git commit -m 'Parse explicit Vision decisions robustly'
            git push origin main
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4 deploy

      - name: Require full live visual-search pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,struct,zlib,binascii,json,urllib.request,time
          w=h=96
          raw=b''.join(b'\x00'+b'\x22\x88\xdd\xff'*w for _ in range(h))
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',binascii.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          image='data:image/png;base64,'+base64.b64encode(png).decode()
          headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 19_0 like Mac OS X) AppleWebKit/605.1.15 Version/19.0 Mobile/15E148 Safari/604.1','Origin':'https://seekveraglobal.com','Referer':'https://seekveraglobal.com/'}
          body=json.dumps({'image':image,'country':'Worldwide','language':'English','context':'Plain safe blue test image'}).encode()
          last={}
          for n in range(6):
              req=urllib.request.Request('https://seekveraglobal.com/api/visual-search',data=body,headers=headers,method='POST')
              with urllib.request.urlopen(req,timeout=100) as r: d=json.loads(r.read().decode())
              last=d; print('TRY',n+1,json.dumps(d,ensure_ascii=False)[:650],flush=True)
              if d.get('ok') and d.get('allowed') is True and d.get('reviewRequired') is False and d.get('summary') and d.get('suggestedQuery'):
                  print('FULL VISUAL SEARCH PASS',d.get('category'),d.get('summary'))
                  break
              time.sleep(4)
          else: raise SystemExit('visual search did not fully pass: '+str(last)[:700])
          PY

      - name: Result
        run: echo 'R6 VISION PARSER FULL PASS'
