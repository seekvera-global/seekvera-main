name: R76 Google alternate endpoint probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-google-alt-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe alternate anonymous Google translation endpoints
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import json,re,urllib.parse,urllib.request
          text='Find jobs and hotels near me'
          uas=['Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36','Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36']
          for lang in ['kl','rm']:
            qs=urllib.parse.quote(text)
            urls=[
              f'https://translate.google.com/m?sl=en&tl={lang}&q={qs}',
              f'https://translate.google.com/translate_a/single?client=at&sl=en&tl={lang}&dt=t&q={qs}',
              f'https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=en&tl={lang}&q={qs}',
              f'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl={lang}&dt=t&q={qs}',
            ]
            for url in urls:
              try:
                req=urllib.request.Request(url,headers={'User-Agent':uas[0],'Accept-Language':'en-US,en;q=0.9'})
                with urllib.request.urlopen(req,timeout=15) as r:
                  raw=r.read().decode('utf-8','replace')
                  print('ALT',lang,r.status,url.split('?')[0],raw[:800].replace('\n',' '),flush=True)
              except Exception as e: print('ALT_ERROR',lang,url.split('?')[0],repr(e),flush=True)
          PY
