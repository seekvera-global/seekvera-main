name: R101 Whisper base browser evaluation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r101-whisper-base-eval.yml'
      - 'tools/r101_whisper_base_eval.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng >/dev/null
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Generate fixtures
        run: |
          espeak-ng -v en-us -s 125 -w /tmp/r101-en.wav 'hello seekvera how are you today I need a hotel in Beirut'
          espeak-ng -v ar -s 120 -w /tmp/r101-ar.wav 'مرحبا كيف حالك اليوم انا اتكلم معك بالعربي واريد فندق في بيروت'
      - name: Evaluate Whisper base
        run: node tools/r101_whisper_base_eval.mjs
