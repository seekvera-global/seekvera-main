name: Activate SEEKVERA direct request form

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-formsubmit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger first FormSubmit request
        shell: bash
        run: |
          set -euo pipefail
          curl --location --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -X POST 'https://formsubmit.co/ajax/seekvera.global@gmail.com' \
            --data '{"_subject":"SEEKVERA Request Anything activation","_template":"table","Country":"System test","Type":"Activation","Request":"Activate SEEKVERA direct request submissions","Source":"https://seekvera-global.github.io/seekvera-main/"}' \
            -o /tmp/formsubmit.json
          cat /tmp/formsubmit.json
