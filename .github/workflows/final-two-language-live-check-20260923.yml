name: Final SEEKVERA Filipino + Amharic live check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-two-language-live-check-20260923.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify final two languages on live r3
        shell: python
        run: |
          import json,time,urllib.request,urllib.error
          SITE='https://seekveraglobal.com'
          WORKER='https://seekvera-main.seekvera-global.workers.dev'
          UA='Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          def get(url,t=30):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=t) as r:return r.status,r.read().decode('utf-8','replace')
          def post(payload,t=75):
              req=urllib.request.Request(WORKER+'/api/ai',data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),headers={'User-Agent':UA,'content-type':'application/json','origin':SITE},method='POST')
              with urllib.request.urlopen(req,timeout=t) as r:return r.status,json.loads(r.read().decode('utf-8'))
          _,h=get(WORKER+'/api/health?final-two=1')
          health=json.loads(h)
          assert health.get('release')=='2026-09-23-ai-media-r3',health
          _,voice=get(SITE+'/voice-ai.js?final-two=1')
          _,gui=get(SITE+'/global-ui.js?final-two=1')
          for code in ['fil','am']:
              assert code+':' in gui,('welcome missing',code)
              assert (code+':' in voice or code+":'" in voice or code+'=' in voice),('voice missing',code)
          cases=[
            ('Filipino','Philippines','Sagutin lamang ang salitang ito: Kumusta.','Kumusta'),
            ('Amharic','Ethiopia','ይህን ቃል ብቻ መልስ፡ ሰላም','ሰላም')
          ]
          for label,country,message,marker in cases:
              started=time.monotonic(); status,d=post({'message':message,'country':country,'language':label,'scope':'worldwide','fast':True},75)
              elapsed=time.monotonic()-started; answer=str(d.get('response') or ''); language=str(d.get('language') or '')
              print(label,country,round(elapsed,2),'s','reported=',language,'answer=',answer[:160])
              assert 200<=status<300 and d.get('ok') is True,(label,status,d)
              assert language.lower()==label.lower(),(label,language,answer)
              assert marker.lower() in answer.lower(),(label,answer)
          print('FILIPINO + AMHARIC LIVE R3 PASS')
          print('COMBINED WITH FINAL R3 AUDIT: ALL 28 SEEKVERA UI LANGUAGES VERIFIED')
