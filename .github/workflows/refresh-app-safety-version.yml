name: Refresh SEEKVERA app safety version

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-app-safety-version.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh app cache tag
        shell: bash
        run: |
          echo 'Refreshing SEEKVERA safety build'
          python - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          old="const buildTag='20260921-scan1';"
          new="const buildTag='20260921-safety3';"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Expected buildTag not found')
          p.write_text(s)
          PY
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add app.html
          if git diff --cached --quiet; then
            echo 'No change needed.'
          else
            git commit -m 'Refresh app cache for safety version'
            git push
          fi
