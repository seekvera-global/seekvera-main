name: R92 live multilingual voice diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r92-live-voice-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and generate voice fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng >/dev/null
          espeak-ng -v en-us -s 125 -w /tmp/en.wav 'hello seekvera how are you today I need a hotel in Beirut'
          espeak-ng -v ar -s 120 -w /tmp/ar.wav 'مرحبا كيف حالك اليوم انا اتكلم معك بالعربي واريد فندق في بيروت'
      - name: Capture live ASR responses
        shell: bash
        run: |
          set +e
          AR=$(base64 -w0 /tmp/ar.wav)
          EN=$(base64 -w0 /tmp/en.wav)
          ar_code=$(curl -sS --max-time 30 -o /tmp/ar.json -w '%{http_code}' -H 'content-type: application/json' --data-binary "{\"audio\":\"data:audio/wav;base64,$AR\",\"language\":\"auto\"}" 'https://seekveraglobal.com/api/transcribe?r92=debug-ar')
          en_code=$(curl -sS --max-time 30 -o /tmp/en.json -w '%{http_code}' -H 'content-type: application/json' --data-binary "{\"audio\":\"data:audio/wav;base64,$EN\",\"language\":\"auto\"}" 'https://seekveraglobal.com/api/transcribe?r92=debug-en')
          {
            echo "R92 live ASR diagnostic"
            echo "Arabic HTTP: $ar_code"
            cat /tmp/ar.json 2>/dev/null || true
            echo
            echo "English HTTP: $en_code"
            cat /tmp/en.json 2>/dev/null || true
            echo
          } > r92-asr-debug.txt
          cat r92-asr-debug.txt
          exit 0
      - name: Save diagnostic result
        run: |
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add r92-asr-debug.txt
          git commit -m 'R92 capture live ASR diagnostic response' || exit 0
          git push origin HEAD:main
