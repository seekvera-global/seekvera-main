name: R32 global final audit v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r32-global-final-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seekvera-r32-global-final-v2
  cancel-in-progress: true

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply R32 final patch
        run: |
          set -euo pipefail
          python tools/r32_global_final.py
          node --check i18n-ui.js
          node --check worker-r31.js
          node --check locale-r15.js
          grep -q "20260925-r32-global-final" i18n-ui.js
          grep -q "r32Runtime" worker-r31.js
          grep -q "i18n-ui.js?v=20260925-r32-global-final" index.html

      - name: Deploy R32 to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Wait for R32 production
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            body="$(curl -LfsS --max-time 20 -H 'Cache-Control: no-cache' "https://seekveraglobal.com/api/health?r32v2=$i" || true)"
            if echo "$body" | grep -q '248-country-full-ui-language-lock-global-final'; then echo "$body"; exit 0; fi
            sleep 3
          done
          exit 1

      - name: Audit every country all supported languages all categories and dynamic text
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > r32-v2.mjs <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const BASE='https://seekveraglobal.com';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:390,height:844},locale:'en-US',serviceWorkers:'block'});
          const p=await ctx.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e)));
          await p.goto(BASE+'/?r32v2='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
          await p.waitForFunction(()=>window.SEEKVERA_I18N_R32&&window.SEEKVERA_LOCALE_R15&&document.querySelector('#country')&&document.querySelector('#lang')&&document.querySelector('#currency'),{timeout:20000});
          const meta=await p.evaluate(()=>({profiles:SEEKVERA_LOCALE_R15.profiles,languagePrimary:SEEKVERA_LOCALE_R15.languagePrimary,version:SEEKVERA_I18N_R32.version}));
          assert.equal(meta.version,'20260925-r32-global-final');
          assert.equal(Object.keys(meta.profiles).length,248,'country profile count');
          const countryLangs=[...new Set(Object.values(meta.profiles).map(x=>x.language))];
          const allLangs=Object.keys(meta.languagePrimary||{});
          assert(countryLangs.length>=70,'country-default language coverage '+countryLangs.length);
          assert(allLangs.length>=90,'all supported language coverage '+allLangs.length);

          // 248/248 country -> exact language + exact currency.
          const bad=[];
          for(const [cc,pr] of Object.entries(meta.profiles)){
            await p.evaluate(cc=>SEEKVERA_LOCALE_R15.setCountry(cc),cc);await p.waitForTimeout(8);
            const g=await p.evaluate(()=>({cc:document.querySelector('#country')?.value,lang:document.querySelector('#lang')?.value,cur:document.querySelector('#currency')?.value}));
            if(g.cc!==cc||g.lang!==pr.language||g.cur!==pr.currency)bad.push({cc,pr,g});
          }
          assert.equal(bad.length,0,'country sync '+JSON.stringify(bad.slice(0,5)));

          // Every supported language must translate the exact dynamic sentence reported by the user.
          const phrase='No approved live marketplace listings are available right now.';
          const dn=new Intl.DisplayNames(['en'],{type:'language'});
          async function one(code){if(code==='en')return {code,ok:true};for(let a=0;a<3;a++)try{const r=await fetch(BASE+'/api/ui-translate',{method:'POST',headers:{'content-type':'application/json','Origin':BASE},body:JSON.stringify({language:dn.of(code)||code,strings:[phrase]})});const d=await r.json();const v=String(d?.translations?.[0]||'').trim();if(r.ok&&v&&v!==phrase)return {code,ok:true}}catch{}return {code,ok:false}}
          const badLang=[];for(let i=0;i<allLangs.length;i+=6){const z=await Promise.all(allLangs.slice(i,i+6).map(one));badLang.push(...z.filter(x=>!x.ok))}
          assert.equal(badLang.length,0,'unsupported UI translations '+JSON.stringify(badLang));

          // Iraq is the exact screenshot case: no English before/after delayed marketplace mutation.
          await p.evaluate(()=>SEEKVERA_LOCALE_R15.setCountry('IQ'));
          await p.waitForFunction(()=>document.documentElement.dataset.seekveraI18nReady==='ar'&&document.documentElement.lang==='ar'&&document.documentElement.dir==='rtl',{timeout:20000});
          async function checkIQ(label){const x=await p.evaluate(()=>({body:document.body.innerText,live:document.querySelector('#liveListings')?.innerText||'',country:document.querySelector('#country')?.value,lang:document.querySelector('#lang')?.value,cur:document.querySelector('#currency')?.value,cards:document.querySelectorAll('#categories .r5-tile').length,thumbs:[...document.querySelectorAll('#categories .r5-thumb')].map(n=>(n.textContent||'').trim()),overflow:document.documentElement.scrollWidth-window.innerWidth}));assert.equal(x.country,'IQ');assert.equal(x.lang,'ar');assert.equal(x.cur,'IQD');for(const q of ['No approved live marketplace listings are available right now','SEEKVERA does not generate fake listings','Find, compare, choose — worldwide','Popular categories','Live marketplace','Request anything'])assert(!x.body.includes(q),label+' English leak '+q);assert.equal(x.cards,31);assert(!x.thumbs.some(t=>/[A-Za-z.]|seekvera/i.test(t)),label+' bad thumb '+JSON.stringify(x.thumbs));assert(x.overflow<=4,label+' horizontal overflow '+x.overflow);return x}
          await p.waitForTimeout(500);await checkIQ('0.5s');await p.waitForTimeout(2200);await checkIQ('2.7s');await p.waitForTimeout(3000);const iq=await checkIQ('5.7s');assert(!/No approved live marketplace/i.test(iq.live));

          // 31/31 category cards and routes.
          const hrefs=await p.evaluate(()=>[...new Set([...document.querySelectorAll('#categories .r5-tile')].map(a=>a.getAttribute('href')).filter(Boolean))]);
          assert.equal(hrefs.length,31,'category href count');
          const routeBad=[];for(let i=0;i<hrefs.length;i+=6){await Promise.all(hrefs.slice(i,i+6).map(async href=>{try{const r=await ctx.request.get(new URL(href,BASE).href,{timeout:20000});const t=await r.text();if(r.status()>=400||t.length<180)routeBad.push({href,status:r.status(),len:t.length})}catch(e){routeBad.push({href,error:String(e)})}}))}assert.equal(routeBad.length,0,'category routes '+JSON.stringify(routeBad));

          // Representative language families on actual UI.
          const reps=['FR','DE','ES','TR','IN','CN','JP','KR','RU','IR','KE','BR'];
          for(const cc of reps){await p.goto(BASE+'/?rep='+cc+'&t='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await p.waitForFunction(()=>window.SEEKVERA_I18N_R32&&window.SEEKVERA_LOCALE_R15,{timeout:15000});await p.evaluate(cc=>SEEKVERA_LOCALE_R15.setCountry(cc),cc);const l=meta.profiles[cc].language;await p.waitForFunction(l=>document.documentElement.dataset.seekveraI18nReady===l,l,{timeout:20000});await p.waitForTimeout(900);const x=await p.evaluate(()=>({h1:document.querySelector('h1')?.innerText||'',body:document.body.innerText,lang:document.querySelector('#lang')?.value,cur:document.querySelector('#currency')?.value}));assert.equal(x.lang,l,cc+' lang');assert.equal(x.cur,meta.profiles[cc].currency,cc+' currency');assert(!x.body.includes(phrase),cc+' dynamic English leak');if(l!=='en')assert.notEqual(x.h1.trim(),'Find it faster. Compare it better.',cc+' hero English leak')}

          // AI locale smoke across different scripts.
          const ai=[['IQ','ar','مرحبا'],['DE','de','Hallo'],['FR','fr','Bonjour'],['CN','zh','你好'],['IN','hi','नमस्ते'],['RU','ru','Привет'],['TR','tr','Merhaba']];
          for(const [cc,code,msg] of ai){const r=await fetch(BASE+'/api/ai',{method:'POST',headers:{'content-type':'application/json','Origin':BASE},body:JSON.stringify({message:msg,country:cc,language:code,fast:true})});const d=await r.json();assert(d.ok&&String(d.response||'').trim(),cc+' AI empty');assert.equal(String(d.language||'').toLowerCase(),String(dn.of(code)||code).toLowerCase(),cc+' AI language')}
          assert.equal(errors.length,0,'page errors '+errors.join(' | '));
          console.log('R32 V2 FINAL PASS',JSON.stringify({countries:248,countryDefaultLanguages:countryLangs.length,allSupportedLanguages:allLangs.length,categories:31,iraq:true,reps:reps.length}));
          await browser.close();
          JS
          node r32-v2.mjs

      - name: Commit audited R32 source
        run: |
          set -euo pipefail
          git config user.name 'SEEKVERA R32 Final'
          git config user.email 'actions@users.noreply.github.com'
          git add i18n-ui.js locale-r15.js worker-r31.js sw.js '*.html'
          if git diff --cached --quiet; then echo 'No generated changes'; else git commit -m 'R32: final 248-country full-language UI lock'; git push origin main; fi
