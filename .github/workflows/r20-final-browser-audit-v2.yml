name: SEEKVERA R20 final browser audit v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r20-final-browser-audit-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run final live mobile audit
        env:
          SITE: https://seekveraglobal.com
        run: |
          cat > r20-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert';
          const SITE=process.env.SITE;
          const browser=await chromium.launch({headless:true});
          let aiCalls=0;
          try{
            const context=await browser.newContext({viewport:{width:360,height:800},locale:'en-US'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('request',r=>{try{if(new URL(r.url()).pathname==='/api/ai')aiCalls++}catch{}});
            await page.goto(SITE+'/?r20audit2='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>window.SEEKVERA_LOCALE_R15&&window.SEEKVERA_R14_CATEGORIES&&window.SEEKVERA_R20_FINAL&&document.querySelectorAll('#country option').length>=248,null,{timeout:20000});
            await page.waitForTimeout(900);
            const data=await page.evaluate(()=>({profiles:SEEKVERA_LOCALE_R15.profiles,langs:Object.keys(SEEKVERA_LOCALE_R15.languagePrimary),catLangs:Object.keys(SEEKVERA_R14_CATEGORIES.data)}));
            assert.equal(Object.keys(data.profiles).length,248,'country profile count');
            assert.equal(data.langs.length,98,'language count');
            assert.equal(data.catLangs.length,98,'category language count');

            const snap=()=>page.evaluate(()=>{
              const s=SEEKVERA_LOCALE_R15.state();
              const chat=document.getElementById('aiChat'),msg=document.querySelector('#aiChat .sv-chat-messages'),form=document.getElementById('aiChatForm'),speaker=document.getElementById('aiChatSpeaker'),camera=document.getElementById('aiChatCamera'),mic=document.getElementById('aiChatMic'),send=form?.querySelector('.send');
              const rect=e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom,display:getComputedStyle(e).display,vis:getComputedStyle(e).visibility}};
              const cr=rect(chat),fr=rect(form),controls=[speaker,camera,mic,send].map(rect),inside=r=>r.x>=cr.x-2&&r.right<=cr.right+2&&r.y>=cr.y-2&&r.bottom<=cr.bottom+2;
              return{state:s,lang:document.documentElement.lang,dir:document.documentElement.dir,chat:cr,form:fr,controls,inside:controls.map(inside),msgH:msg?.getBoundingClientRect().height||0,desc:[...document.querySelectorAll('#categories .r5-tile-body>small')].filter(e=>!e.hidden&&getComputedStyle(e).display!=='none').map(e=>e.textContent.trim()),titles:[...document.querySelectorAll('#categories .r5-tile-body>b')].map(e=>e.textContent.trim()),tileOverflow:[...document.querySelectorAll('#categories .r5-tile')].map(e=>Math.max(0,e.scrollWidth-e.clientWidth)),pageOverflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),r20:document.documentElement.dataset.svR20||'',speakerIcon:getComputedStyle(speaker,'::before').content};
            });
            const layout=(q,label)=>{
              assert(q.chat.w>300,label+' chat width '+q.chat.w);
              assert(q.inside.every(Boolean),label+' AI control escaped card');
              assert(q.controls.every(r=>r.w>=30&&r.h>=30&&r.display!=='none'&&r.vis!=='hidden'),label+' hidden/small AI control');
              assert(q.msgH<=132,label+' chat too tall '+q.msgH);
              assert(Math.max(...q.tileOverflow,0)<=2,label+' category overflow '+Math.max(...q.tileOverflow));
              assert(q.pageOverflow<=2,label+' page horizontal overflow '+q.pageOverflow);
              assert.equal(q.r20,'ready',label+' R20 not ready');
              assert(q.speakerIcon.includes('🔊'),label+' speaker missing');
            };

            let countries=0;
            for(const [cc,p] of Object.entries(data.profiles)){
              await page.evaluate(cc=>SEEKVERA_LOCALE_R15.setCountry(cc),cc);
              const q=await snap();
              assert.deepEqual([q.state.country,q.state.language,q.state.currency],[cc,p.language,p.currency],cc+' locale state');
              assert.equal(q.lang,p.language,cc+' html lang');
              countries++;
            }
            assert.equal(countries,248);

            let languages=0;
            for(const lg of data.langs){
              await page.evaluate(lg=>SEEKVERA_LOCALE_R15.setLanguage(lg),lg);
              await page.waitForTimeout(30);
              await page.evaluate(()=>{SEEKVERA_R14_CATEGORIES.apply();SEEKVERA_R20_FINAL.apply()});
              const q=await snap();
              assert.equal(q.state.language,lg,lg+' language state');
              const expected=await page.evaluate(lg=>SEEKVERA_R14_CATEGORIES.data[lg],lg);
              assert.deepEqual(q.titles.slice(0,expected.length),expected,lg+' category titles');
              if(lg!=='en'){
                const leaked=await page.evaluate(()=>{const src=new Set(SEEKVERA_R20_FINAL.descriptions);return [...document.querySelectorAll('#categories .r5-tile-body>small')].filter(e=>!e.hidden&&getComputedStyle(e).display!=='none'&&src.has(e.textContent.trim())).map(e=>e.textContent.trim())});
                assert.equal(leaked.length,0,lg+' English description leak: '+leaked.join(' | '));
              }
              layout(q,'lang '+lg);languages++;
            }
            assert.equal(languages,98);

            const before=aiCalls;
            for(const cc of Object.keys(data.profiles)){
              await page.evaluate(()=>SEEKVERA_LOCALE_R15.setCountry('US'));
              const name=await page.evaluate(cc=>new Intl.DisplayNames(['en'],{type:'region'}).of(cc),cc);
              await page.evaluate(name=>{const i=document.getElementById('aiChatInput'),f=document.getElementById('aiChatForm');i.value='switch to '+name;f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))},name);
              const got=await page.evaluate(()=>SEEKVERA_LOCALE_R15.state().country);
              assert.equal(got,cc,'country command '+cc+' '+name);
            }
            assert.equal(aiCalls,before,'country commands leaked to /api/ai');

            for(const lg of ['hi','ar','fr','de','zh','ja','ru','ur','bn','fil','sw','am']){
              await page.evaluate(lg=>SEEKVERA_LOCALE_R15.setLanguage(lg),lg);
              await page.waitForTimeout(150);
              const series=[];
              for(let i=0;i<8;i++){
                await page.waitForTimeout(55);
                await page.evaluate(()=>{SEEKVERA_R14_CATEGORIES.apply();SEEKVERA_R20_FINAL.apply()});
                const q=await snap();layout(q,'stable '+lg);series.push([q.chat.x,q.chat.w,q.form.x,q.form.w,q.msgH].map(v=>Math.round(v)).join('|'));
              }
              assert.equal(new Set(series).size,1,'AI UI shifted in '+lg+': '+series.join(','));
            }
            if(errors.length)throw new Error('Page errors: '+errors.join(' | '));
            console.log(`R20 FINAL BROWSER PASS: ${countries} countries; ${languages} languages; 248 local country commands; no visible English category descriptions in non-English UI; cards contained; mobile AI stable`);
            await context.close();
          }finally{await browser.close()}
          JS
          node r20-audit.mjs
