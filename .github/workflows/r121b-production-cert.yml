name: R121B repaired global intent production

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/r121b_fix_syntax.py'
      - 'tools/r121b_cert.py'
      - 'tools/r121b_browser.mjs'
      - '.github/workflows/r121b-production-cert.yml'

permissions:
  contents: write

concurrency:
  group: seekvera-r121b-production
  cancel-in-progress: true

jobs:
  deploy-certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and validate
        run: |
          set -euo pipefail
          python tools/r121b_fix_syntax.py
          node --check worker-r76.js
          node --check worker-r31.js
          node --check voice-ai.js
          node --check r31-ui-polish.js
          grep -F '20260929-r121b-global-intent-language' worker-r76.js
          ! grep -F "\\n ['travel'" worker-r76.js
      - name: Persist repaired runtime
        run: |
          set -euo pipefail
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add worker-r76.js
          if ! git diff --cached --quiet; then
            git commit -m 'R121B repair global multilingual intent runtime'
            git push origin HEAD:main
          fi
      - name: Deploy R121B
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
      - name: Wait for live release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          for i in range(30):
              try:
                  q='https://seekveraglobal.com/api/health?r121b='+str(time.time())
                  req=urllib.request.Request(q,headers={'user-agent':'Mozilla/5.0','cache-control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=8) as r:d=json.loads(r.read())
                  if d.get('release')=='20260929-r121b-global-intent-language' and d.get('r121b'):
                      print('R121B_LIVE',d.get('release'));break
              except Exception as e: print('WAIT',i,str(e)[:100])
              time.sleep(3)
          else: raise AssertionError('R121B not live')
          PY
      - name: API multilingual certification
        run: python tools/r121b_cert.py
      - name: Android browser certification
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          node tools/r121b_browser.mjs
      - name: Stability hold
        run: |
          set -euo pipefail
          sleep 50
          python3 - <<'PY'
          import json,time,urllib.request
          for i in range(3):
              req=urllib.request.Request('https://seekveraglobal.com/api/health?stable='+str(time.time()),headers={'user-agent':'Mozilla/5.0','cache-control':'no-cache'})
              with urllib.request.urlopen(req,timeout=8) as r:d=json.loads(r.read())
              assert d.get('release')=='20260929-r121b-global-intent-language' and d.get('r121b'),d
              print('STABLE_PASS',i+1,d.get('release'));time.sleep(4)
          PY
