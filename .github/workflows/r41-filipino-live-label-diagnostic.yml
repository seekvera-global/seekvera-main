name: R41 Filipino live-label diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r41-filipino-live-label-diagnostic.yml'
  workflow_dispatch:

env:
  DIAGNOSTIC_REV: 'r41b'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Filipino label lifecycle and RTL states
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > r41-diagnostic.mjs <<'JS'
          import { chromium } from 'playwright';
          const B='https://seekveraglobal.com';
          const b=await chromium.launch({headless:true});
          const c=await b.newContext({viewport:{width:390,height:844},locale:'en-US',serviceWorkers:'block'});
          const p=await c.newPage();
          p.on('pageerror',e=>console.log('PAGEERROR',String(e)));
          await p.route('**/api/ui-translate',r=>r.abort());
          await p.route('https://text.pollinations.ai/**',r=>r.abort());
          const pack=await (await c.request.get(B+'/i18n-r32/fil.json?v='+Date.now())).json();
          for(const q of ['Live marketplace','Approved real listings only.','OPEN MARKETPLACE →','Loading approved listings…']) console.log('PACK',JSON.stringify(q),'->',JSON.stringify(pack.translations?.[q]));
          await p.goto(B+'/?r41='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
          await p.waitForFunction(()=>window.SEEKVERA_I18N_R32&&window.SEEKVERA_LOCALE_R15&&window.SEEKVERA_R22_CATEGORY_LOCK,{timeout:20000});
          const snap=async label=>{
            const x=await p.evaluate(()=>{
              const nodes=[];const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
              while((n=w.nextNode())){const t=String(n.nodeValue||'').trim();if(/Live marketplace/i.test(t)){const e=n.parentElement;nodes.push({text:t,tag:e?.tagName,id:e?.id||'',cls:e?.className||'',parent:e?.parentElement?.className||'',outer:(e?.outerHTML||'').slice(0,500)})}}
              const h=[...document.querySelectorAll('h1,h2,h3,b,strong')].find(e=>/marketplace/i.test(e.textContent||'')&&e.closest('.r5-section'));
              return {lang:document.getElementById('lang')?.value,htmlLang:document.documentElement.lang,dir:document.documentElement.dir,pack:document.documentElement.dataset.seekveraPackReady||'',ready:document.documentElement.dataset.seekveraI18nReady||'',heading:h?.textContent?.trim()||'',nodes};
            });
            console.log('SNAP',label,JSON.stringify(x));
          };
          await snap('initial');
          await p.evaluate(()=>SEEKVERA_LOCALE_R15.setLanguage('fil'));
          await p.evaluate(async()=>{await SEEKVERA_I18N_R32.loadPack('fil');await SEEKVERA_I18N_R32.apply();SEEKVERA_R22_CATEGORY_LOCK.lock()});
          await p.waitForFunction(()=>document.documentElement.dataset.seekveraPackReady==='fil'&&document.documentElement.dataset.seekveraI18nReady==='fil',{timeout:15000});
          for(const [label,ms] of [['fil-0',0],['fil-50',50],['fil-250',200],['fil-1000',750],['fil-3000',2000]]){if(ms)await p.waitForTimeout(ms);await snap(label)}
          for(const l of ['ar','ur','fa','he','ps','dv']){
            await p.evaluate(l=>SEEKVERA_LOCALE_R15.setLanguage(l),l);
            await p.evaluate(async l=>{await SEEKVERA_I18N_R32.loadPack(l);await SEEKVERA_I18N_R32.apply()},l);
            await p.waitForFunction(l=>document.documentElement.dataset.seekveraI18nReady===l,l,{timeout:15000});
            console.log('RTL',l,await p.evaluate(()=>({dir:document.documentElement.dir,lang:document.documentElement.lang,selected:document.getElementById('lang')?.value})));
          }
          await b.close();
          JS
          node r41-diagnostic.mjs
          rm -f r41-diagnostic.mjs