name: R41 live label diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r41-filipino-live-label-diagnostic.yml'
  workflow_dispatch:

env:
  DIAGNOSTIC_REV: 'r43-xh'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Xhosa label lifecycle
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > r41-diagnostic.mjs <<'JS'
          import { chromium } from 'playwright';
          const B='https://seekveraglobal.com';
          const b=await chromium.launch({headless:true});
          const c=await b.newContext({viewport:{width:390,height:844},locale:'en-US',serviceWorkers:'block'});
          const p=await c.newPage();
          p.on('pageerror',e=>console.log('PAGEERROR',String(e)));
          await p.route('**/api/ui-translate',r=>r.abort());
          await p.route('https://text.pollinations.ai/**',r=>r.abort());
          const pack=await (await c.request.get(B+'/i18n-r32/xh.json?v='+Date.now())).json();
          for(const q of ['Live marketplace','Approved real listings only.','OPEN MARKETPLACE →','No approved live marketplace listings are available right now. SEEKVERA does not generate fake listings.']) console.log('PACK_XH',JSON.stringify(q),'->',JSON.stringify(pack.translations?.[q]));
          await p.goto(B+'/?r43xh='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
          await p.waitForFunction(()=>window.SEEKVERA_I18N_R32&&window.SEEKVERA_LOCALE_R15,{timeout:20000});
          await p.evaluate(()=>SEEKVERA_LOCALE_R15.setLanguage('xh'));
          await p.evaluate(async()=>{await SEEKVERA_I18N_R32.loadPack('xh');await SEEKVERA_I18N_R32.apply()});
          await p.waitForFunction(()=>document.documentElement.dataset.seekveraI18nReady==='xh',{timeout:15000});
          for(const ms of [0,50,250,1000,3000]){
            if(ms)await p.waitForTimeout(ms);
            const x=await p.evaluate(()=>({
              lang:document.getElementById('lang')?.value,
              dir:document.documentElement.dir,
              heading:[...document.querySelectorAll('.r5-section h2')].map(x=>x.textContent.trim()),
              live:document.getElementById('liveListings')?.innerText||'',
              t:window.SEEKVERA_I18N?.t?.('Live marketplace')||'',
              options:document.getElementById('lang')?.options?.length||0
            }));
            console.log('XH_SNAP',ms,JSON.stringify(x));
          }
          await b.close();
          JS
          node r41-diagnostic.mjs
          rm -f r41-diagnostic.mjs