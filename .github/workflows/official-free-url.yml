name: Set official zero-cost SEEKVERA URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-free-url.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use the live zero-cost GitHub Pages URL everywhere public
        shell: python
        run: |
          from pathlib import Path

          official = 'https://seekvera-global.github.io/seekvera-main'
          old = 'https://seekveraglobal.com'

          for path in list(Path('.').glob('*.html')) + [Path('robots.txt'), Path('sitemap.xml')]:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              text = text.replace(old, official)
              path.write_text(text, encoding='utf-8')

          # The health check must validate the actual live free deployment.
          health = Path('.github/workflows/site-health.yml')
          text = health.read_text(encoding='utf-8')
          text = text.replace('https://seekveraglobal.com', official)
          text = text.replace("grep -q '<link rel=\"canonical\" href=\"https://seekvera-global.github.io/seekvera-main/\">' /tmp/home.html", "grep -q '<link rel=\"canonical\" href=\"https://seekvera-global.github.io/seekvera-main/\">' /tmp/home.html")
          # Remove the obsolete failure rule that treats the now-official GitHub URL as stale.
          old_block = '''          if grep -q 'seekvera-global.github.io/seekvera-main' /tmp/home.html; then
            echo 'Old GitHub Pages URL still present in live homepage'
            exit 1
          fi
'''
          text = text.replace(old_block, '')
          text = text.replace("echo 'Official-domain SEO signals are correct. Workers endpoint references are allowed for AI routing.'", "echo 'Official zero-cost GitHub Pages SEO signals are correct. Workers endpoint references are allowed for AI routing.'")
          health.write_text(text, encoding='utf-8')

      - name: Validate official URL consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://seekvera-global.github.io/seekvera-main/sitemap.xml' robots.txt
          grep -q 'https://seekvera-global.github.io/seekvera-main/' sitemap.xml
          grep -q '<link rel="canonical" href="https://seekvera-global.github.io/seekvera-main/">' index.html
          grep -q '<meta property="og:url" content="https://seekvera-global.github.io/seekvera-main/">' index.html
          if grep -R -n 'https://seekveraglobal.com' -- *.html robots.txt sitemap.xml .github/workflows/site-health.yml; then
            echo 'Inactive paid/custom domain reference remains'
            exit 1
          fi
          echo 'Official free URL validation passed.'

      - name: Commit official URL fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add '*.html' robots.txt sitemap.xml .github/workflows/site-health.yml
          git commit -m 'Use live GitHub Pages URL as official zero-cost site'
          git push
