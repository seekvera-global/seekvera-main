name: Keep official SEEKVERA domain consistent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-free-url.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use the official custom domain everywhere public
        shell: python
        run: |
          from pathlib import Path

          official = 'https://seekveraglobal.com'
          old = 'https://seekvera-global.github.io/seekvera-main'

          for path in list(Path('.').glob('*.html')) + [Path('robots.txt'), Path('sitemap.xml')]:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              path.write_text(text.replace(old, official), encoding='utf-8')

      - name: Validate official URL consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://seekveraglobal.com/sitemap.xml' robots.txt
          grep -q 'https://seekveraglobal.com/' sitemap.xml
          grep -q '<link rel="canonical" href="https://seekveraglobal.com/">' index.html
          grep -q '<meta property="og:url" content="https://seekveraglobal.com/">' index.html
          if grep -R -n 'https://seekvera-global.github.io/seekvera-main' -- *.html robots.txt sitemap.xml; then
            echo 'Legacy GitHub Pages URL remains'
            exit 1
          fi
          echo 'Official free URL validation passed.'

      - name: Commit official URL fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add '*.html' robots.txt sitemap.xml
          git commit -m 'Keep seekveraglobal.com as official site URL'
          git push
