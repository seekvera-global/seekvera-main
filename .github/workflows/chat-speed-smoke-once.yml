name: SEEKVERA visible chat and latency smoke once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat-speed-smoke-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live chat assets and AI latency
        shell: bash
        run: |
          set -euo pipefail
          site='https://seekveraglobal.com'
          worker='https://seekvera-main.seekvera-global.workers.dev'
          ua='Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'

          curl -fsS -A "$ua" --max-time 30 "$site/?chatfast=2" -o /tmp/index.html
          grep -q 'id="aiChatForm"' /tmp/index.html
          grep -q 'id="aiMessages"' /tmp/index.html
          curl -fsS -A "$ua" --max-time 30 "$site/superapp.js?v=20260922-chatfast2" -o /tmp/superapp.js
          grep -q 'function bindAIChat' /tmp/superapp.js
          grep -q 'fast:true' /tmp/superapp.js
          curl -fsS -A "$ua" --max-time 30 "$worker/api/health" -o /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('aiResilience')=='fast-chat-glm-first-v2', d
          print('Health fast path:',d.get('aiResilience'))
          PY

          printf '%s' '{"message":"Reply only: Hello from SEEKVERA.","country":"Worldwide","language":"English","fast":true}' >/tmp/payload.json
          result=$(curl -sS -A "$ua" --max-time 25 -o /tmp/ai.json -w '%{http_code} %{time_total}' "$worker/api/ai" -H 'content-type: application/json' -H 'origin: https://seekveraglobal.com' --data-binary @/tmp/payload.json)
          echo "AI HTTP/time: $result"
          cat /tmp/ai.json; echo
          HTTP_TIME="$result" python - <<'PY'
          import json,os
          d=json.load(open('/tmp/ai.json'))
          code,elapsed=os.environ['HTTP_TIME'].split()
          elapsed=float(elapsed)
          print('AI latency seconds:',round(elapsed,2),'model:',d.get('model'))
          assert code.startswith('2'), (code,d)
          assert d.get('ok') is True and d.get('response'), d
          assert elapsed < 18, f'AI response still too slow: {elapsed:.2f}s'
          PY
