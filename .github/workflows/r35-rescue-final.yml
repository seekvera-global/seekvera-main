name: R35 Romansh rescue final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r35-rescue-final.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: seekvera-r35-rescue-final
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  PRIOR_RUN_ID: '36185614760'

jobs:
  rescue-final:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare rescue builder
        run: |
          set -euo pipefail
          python -m pip install --quiet beautifulsoup4 Babel
          python -m py_compile tools/r35_rescue_rm.py tools/r35_build_pack.py
          python tools/r35_build_pack.py --source-only

      - name: Recover 97 already-passed language packs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: seekvera-global/seekvera-main
          run-id: ${{ env.PRIOR_RUN_ID }}
          pattern: pack-*
          path: i18n-r35
          merge-multiple: true

      - name: Build only missing Romansh pack with SEEKVERA AI
        shell: bash
        run: |
          set -euo pipefail
          find i18n-r35 -mindepth 2 -type f -name '*.json' -exec cp -f {} i18n-r35/ \; || true
          rm -f i18n-r35/rm.json
          before="$(find i18n-r35 -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "Recovered packs before Romansh: $before"
          test "$before" -ge 97
          python tools/r35_rescue_rm.py
          test -s i18n-r35/rm.json

      - name: Assemble and validate all 98 static packs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,glob,os,shutil
          src=json.load(open('i18n-r35-source.json',encoding='utf-8'))
          langs=json.load(open('i18n-r35-languages.json',encoding='utf-8'))
          files=glob.glob('i18n-r35/*.json')
          by={os.path.basename(p)[:-5]:p for p in files}
          missing=[l for l in langs if l not in by]
          assert len(langs)==98,(len(langs),missing)
          assert not missing,missing
          providers={};bad=[]
          for l in langs:
              d=json.load(open(by[l],encoding='utf-8'))
              assert d['sourceHash']==src['sourceHash'],(l,d.get('sourceHash'),src['sourceHash'])
              assert d['count']==src['count']==967,(l,d.get('count'),src['count'])
              assert len(d['translations'])==src['count'],(l,len(d['translations']))
              providers[d.get('provider','unknown')]=providers.get(d.get('provider','unknown'),0)+1
              if l!='en':
                  candidates=[s for s in src['strings'] if len(s)>=14 and 'SEEKVERA' not in s and re.search(r'[A-Za-z]',s) and ' ' in s]
                  same=[s for s in candidates if str(d['translations'].get(s,'')).strip()==s.strip()]
                  if len(same)>max(25,int(len(candidates)*.18)):bad.append((l,len(same),same[:5]))
          assert not bad,'too many untranslated strings '+repr(bad[:8])
          shutil.rmtree('i18n-r32',ignore_errors=True);os.makedirs('i18n-r32')
          for l in langs:shutil.copy2(by[l],f'i18n-r32/{l}.json')
          shutil.copy2('i18n-r35-source.json','i18n-r32-source.json')
          manifest={'version':'20260925-r35-static-v3','sourceHash':src['sourceHash'],'sourceCount':src['count'],'languages':langs,'packs':98,'providers':providers}
          open('i18n-r32/manifest.json','w',encoding='utf-8').write(json.dumps(manifest,ensure_ascii=False,separators=(',',':')))
          print('R35 RESCUE PACKS PASS',json.dumps(manifest,ensure_ascii=False))
          PY

      - name: Apply audited R35 runtime and AI failover
        shell: bash
        run: |
          set -euo pipefail
          python tools/r32_pack_runtime_patch.py
          python tools/r32_global_final.py
          python tools/r32_ai_failover_patch.py
          python tools/r32_translation_backend_fix.py
          python tools/r35_finalize.py
          node --check r32-i18n.js
          node --check i18n-ui.js
          node --check worker-r31.js
          node --check worker.js
          grep -q 'loadPack' i18n-ui.js
          grep -q 'r35-static-v3' i18n-ui.js
          grep -q 'r35Runtime' worker-r31.js
          grep -q 'i18n-ui.js?v=20260925-r35-global-final' index.html

      - name: Deploy R35 rescued candidate to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Wait for rescued R35 production
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            b="$(curl -LfsS --max-time 15 "https://seekveraglobal.com/api/health?r35rescue=$i" || true)"
            if echo "$b" | grep -q 'parallel-static-98-language-country-category-final'; then echo "$b"; exit 0; fi
            sleep 3
          done
          echo 'R35 health marker did not reach production' >&2
          exit 1

      - name: Final live audit - 248 countries, 98 languages, 31 categories, Iraq, voice, AI
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > /tmp/r35-rescue-audit.mjs <<'JS'
          import {chromium} from 'playwright';import assert from 'node:assert/strict';
          const B='https://seekveraglobal.com';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:390,height:844},locale:'en-US',serviceWorkers:'block'});
          const rq=ctx.request;
          const health=await (await rq.get(B+'/api/health?r='+Date.now())).json();
          assert.equal(health.r35,true,'health r35');assert.equal(health.aiBinding,true,'Workers AI binding');
          assert.equal(health.r35Runtime,'parallel-static-98-language-country-category-final');
          const manifest=await (await rq.get(B+'/i18n-r32/manifest.json?v='+Date.now())).json();
          const source=await (await rq.get(B+'/i18n-r32-source.json?v='+Date.now())).json();
          assert.equal(manifest.packs,98);assert.equal(manifest.languages.length,98);assert.equal(source.count,967);
          const packs={};for(let i=0;i<manifest.languages.length;i+=14){await Promise.all(manifest.languages.slice(i,i+14).map(async l=>{const r=await rq.get(B+'/i18n-r32/'+l+'.json?v='+manifest.sourceHash,{timeout:20000});assert.equal(r.status(),200,l+' pack');const d=await r.json();assert.equal(d.sourceHash,manifest.sourceHash,l+' hash');assert.equal(d.count,967,l+' count');assert.equal(Object.keys(d.translations).length,967,l+' map');packs[l]=d.translations}))}
          assert(packs.rm['Popular categories'] && packs.rm['Popular categories']!=='Popular categories','Romansh pack');

          const page=await ctx.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.route('**/api/ui-translate',r=>r.abort());await page.route('https://text.pollinations.ai/**',r=>r.abort());
          const homeResp=await page.goto(B+'/?r35rescue='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
          assert(homeResp);assert.equal(homeResp.headers()['x-seekvera-release'],'r35-global-final');
          await page.waitForFunction(()=>window.SEEKVERA_I18N_R32&&window.SEEKVERA_LOCALE_R15&&window.SEEKVERA_R14_CATEGORIES&&window.SEEKVERA_R22_CATEGORY_LOCK,{timeout:20000});
          const meta=await page.evaluate(()=>({profiles:SEEKVERA_LOCALE_R15.profiles,langs:Object.keys(SEEKVERA_R14_CATEGORIES.data)}));
          assert.equal(Object.keys(meta.profiles).length,248,'country profiles');assert.equal(meta.langs.length,98,'category languages');

          const badCountries=[];for(const [cc,pr] of Object.entries(meta.profiles)){await page.evaluate(cc=>SEEKVERA_LOCALE_R15.setCountry(cc),cc);const g=await page.evaluate(()=>({cc:country.value,l:lang.value,c:currency.value}));if(g.cc!==cc||g.l!==pr.language||g.c!==pr.currency)badCountries.push({cc,pr,g})}assert.equal(badCountries.length,0,'country mapping '+JSON.stringify(badCountries.slice(0,6)));

          await page.evaluate(()=>SEEKVERA_LOCALE_R15.setCountry('IQ'));
          await page.evaluate(async()=>{await SEEKVERA_I18N_R32.loadPack('ar');SEEKVERA_I18N_R32.schedule(0);SEEKVERA_R22_CATEGORY_LOCK.lock()});
          await page.waitForFunction(()=>document.documentElement.dataset.seekveraPackReady==='ar'&&document.documentElement.dataset.seekveraI18nReady==='ar'&&document.documentElement.dir==='rtl',{timeout:12000});
          await page.waitForTimeout(4200);
          const iq=await page.evaluate(()=>({body:document.body.innerText,cc:country.value,l:lang.value,c:currency.value,cards:document.querySelectorAll('#categories .r5-tile').length,overflow:document.documentElement.scrollWidth-innerWidth,mic:!!document.querySelector('#aiChatMic'),speaker:!!document.querySelector('#aiChatSpeaker')}));
          assert.deepEqual([iq.cc,iq.l,iq.c],['IQ','ar','IQD'],'Iraq atomic locale');assert.equal(iq.cards,31,'Iraq categories');assert(iq.overflow<=4,'Iraq mobile overflow');assert(iq.mic&&iq.speaker,'voice controls');
          const critical=['No approved live marketplace listings are available right now.','SEEKVERA does not generate fake listings.','Find, compare, choose — worldwide.','Popular categories','Live marketplace','Request anything'];for(const s of critical){if(packs.ar[s]&&packs.ar[s]!==s)assert(!iq.body.includes(s),'Arabic English leak '+s)}

          for(const l of manifest.languages){await page.evaluate(l=>SEEKVERA_LOCALE_R15.setLanguage(l),l);await page.evaluate(async l=>{await SEEKVERA_I18N_R32.loadPack(l);SEEKVERA_I18N_R32.schedule(0);SEEKVERA_R22_CATEGORY_LOCK.lock()},l);if(l!=='en')await page.waitForFunction(l=>document.documentElement.dataset.seekveraPackReady===l&&document.documentElement.dataset.seekveraI18nReady===l,l,{timeout:10000});await page.waitForTimeout(25);const x=await page.evaluate(()=>({l:lang.value,tiles:[...document.querySelectorAll('#categories .r5-tile-body b')].slice(0,31).map(n=>n.textContent.trim()),overflow:document.documentElement.scrollWidth-innerWidth}));assert.equal(x.l,l,l+' selected');assert(x.overflow<=4,l+' overflow');assert.equal(x.tiles.length,31,l+' categories');const expected=await page.evaluate(l=>SEEKVERA_R14_CATEGORIES.data[l],l);assert.deepEqual(x.tiles,expected,l+' category titles')}

          await page.evaluate(()=>SEEKVERA_LOCALE_R15.setLanguage('ar'));await page.evaluate(async()=>{await SEEKVERA_I18N_R32.loadPack('ar');SEEKVERA_I18N_R32.schedule(0);SEEKVERA_R22_CATEGORY_LOCK.lock()});await page.waitForTimeout(60);
          const hrefs=await page.evaluate(()=>[...new Set([...document.querySelectorAll('#categories .r5-tile')].map(a=>a.getAttribute('href')).filter(Boolean))]);assert.equal(hrefs.length,31,'31 category destinations');
          const routeBad=[];for(let i=0;i<hrefs.length;i+=8){await Promise.all(hrefs.slice(i,i+8).map(async h=>{try{const r=await rq.get(new URL(h,B).href,{timeout:15000});const t=await r.text();if(r.status()>=400||t.length<180)routeBad.push({h,s:r.status(),n:t.length})}catch(e){routeBad.push({h,e:String(e)})}}))}assert.equal(routeBad.length,0,'category routes '+JSON.stringify(routeBad));

          const deep=await ctx.newPage();const deepErrors=[];deep.on('pageerror',e=>deepErrors.push(String(e)));await deep.route('**/api/ui-translate',r=>r.abort());await deep.route('https://text.pollinations.ai/**',r=>r.abort());
          for(const h of hrefs){await deep.goto(new URL(h,B).href+'?deep='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await deep.waitForFunction(()=>window.SEEKVERA_I18N_R32&&window.SEEKVERA_LOCALE_R15,{timeout:15000});await deep.evaluate(()=>SEEKVERA_LOCALE_R15.setLanguage('ar'));await deep.evaluate(async()=>{await SEEKVERA_I18N_R32.loadPack('ar');SEEKVERA_I18N_R32.schedule(0)});await deep.waitForFunction(()=>document.documentElement.dataset.seekveraI18nReady==='ar',{timeout:10000});const d=await deep.evaluate(()=>({dir:document.documentElement.dir,overflow:document.documentElement.scrollWidth-innerWidth}));assert.equal(d.dir,'rtl',h+' RTL');assert(d.overflow<=4,h+' overflow')}
          assert.equal(deepErrors.length,0,'category JS errors '+JSON.stringify(deepErrors.slice(0,5)));

          const aiR=await rq.post(B+'/api/ai',{data:{fast:true,language:'ar',country:'IQ',message:'أريد فندقاً في بغداد، ساعدني للوصول إلى القسم المناسب.'},timeout:20000});assert.equal(aiR.status(),200,'AI HTTP');const ai=await aiR.json();assert(ai.ok&&ai.response,'AI response');assert(/[\u0600-\u06ff]/u.test(ai.response),'AI Arabic');assert.equal(ai.category,'travel','AI routing');
          const aiE=await rq.post(B+'/api/ai',{data:{fast:true,language:'en',country:'GB',message:'I need an apartment to rent in London under my budget.'},timeout:20000});assert.equal(aiE.status(),200,'AI English HTTP');const aie=await aiE.json();assert(aie.ok&&aie.response&&aie.category==='property','AI property routing');
          assert.equal(errors.length,0,'homepage JS errors '+JSON.stringify(errors.slice(0,5)));
          await browser.close();console.log('R35 RESCUE FINAL LIVE AUDIT PASS',JSON.stringify({countries:248,languages:98,categories:31,source:967,iraq:'ar/IQD/rtl',voice:true,ai:true,romansh:true}));
          JS
          node /tmp/r35-rescue-audit.mjs

      - name: Commit only fully audited R35 release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf i18n-r35 i18n-r35-source.json i18n-r35-languages.json
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No audited file changes to commit'
          else
            git commit -m 'Publish fully audited R35 98-language global release'
            git push origin HEAD:main
          fi
          echo 'R35 RESCUE RELEASE COMMITTED AFTER LIVE PASS'
