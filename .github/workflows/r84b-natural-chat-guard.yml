name: R84b natural chat guard deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r84b-natural-chat-guard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/r84_patch.py
      - name: Verify source
        run: |
          node --check worker-r76.js
          grep -F '20260927-r84-natural-chat-guard' worker-r76.js
          grep -F 'function metaConversation(message)' worker-r76.js
      - name: Commit source
        run: |
          git config user.name seekvera-global
          git config user.email seekvera.global@gmail.com
          git add worker-r76.js
          git commit -m 'R84 keep language talk in conversation'
          git push origin HEAD:main
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify live
        run: |
          set -e
          for i in $(seq 1 10); do
            T=$(date +%s)-$i
            curl -LsS --max-time 25 -H 'content-type: application/json' -d '{"message":"صرت بتحكي عربي هون","country":"Lebanon","history":[{"role":"user","content":"change to Lebanon app"}]}' "https://seekveraglobal.com/api/ai?r84=$T" -o /tmp/a.json
            curl -LsS --max-time 25 -H 'content-type: application/json' -d '{"message":"I am speaking Arabic now","country":"Lebanon","history":[]}' "https://seekveraglobal.com/api/ai?r84=$T" -o /tmp/e.json
            curl -LsS --max-time 25 -H 'content-type: application/json' -d '{"message":"I need a job in Germany","country":"Worldwide","history":[]}' "https://seekveraglobal.com/api/ai?r84=$T" -o /tmp/j.json
            curl -LsS --max-time 25 -H 'content-type: application/json' -d '{"message":"بدي فندق ببيروت","country":"Lebanon","history":[]}' "https://seekveraglobal.com/api/ai?r84=$T" -o /tmp/h.json
            if jq -e '.category=="general" and .language=="ar"' /tmp/a.json >/dev/null && jq -e '.category=="general"' /tmp/e.json >/dev/null && jq -e '.category=="jobs"' /tmp/j.json >/dev/null && jq -e '.category=="travel"' /tmp/h.json >/dev/null; then
              echo R84_LIVE_PASS
              cat /tmp/a.json
              exit 0
            fi
            sleep 3
          done
          echo R84_LIVE_FAIL
          cat /tmp/a.json || true
          cat /tmp/e.json || true
          cat /tmp/j.json || true
          cat /tmp/h.json || true
          exit 1
