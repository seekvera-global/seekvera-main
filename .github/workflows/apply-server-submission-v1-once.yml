name: Apply SEEKVERA secure server submission once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-server-submission-v1-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch post-ad secure submission
        run: python tools/patch_server_submission_v1.py
      - name: Validate
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'marketplace-submit' post-ad.html
          grep -q 'secure server gate' post-ad.html
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          t=Path('post-ad.html').read_text()
          for i,s in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',t,re.S|re.I),1):
              p=Path('/tmp')/f'post-ad-{i}.js'; p.write_text(s); subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add post-ad.html
          git commit -m 'Route marketplace submissions through secure server gate'
          git push origin HEAD:main
