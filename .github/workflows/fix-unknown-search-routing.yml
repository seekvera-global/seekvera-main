name: Fix unknown search routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-unknown-search-routing.yml'

permissions:
  contents: write

jobs:
  fix-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch unknown-query handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_best = 'const q=normalize(query); let best=cats[0],bestScore=0;'
          new_best = 'const q=normalize(query); let best=null,bestScore=0;'
          if old_best not in text:
              raise SystemExit('Expected category default was not found; refusing unsafe patch')
          text = text.replace(old_best, new_best, 1)

          marker = ' document.getElementById("results").classList.add("show");\n document.getElementById("resultTitle").textContent=(c.id==="travel"&&normalize(q).includes("hotel"))?"✈️ Travel → Hotels":c.icon+" "+c.name;'
          replacement = ' document.getElementById("results").classList.add("show");\n if(!c){\n  document.getElementById("resultTitle").textContent="🌍 Request anything";\n  document.getElementById("resultSummary").textContent=`${tr.countryText}: ${countryName}. We do not have a verified route for this request yet.`;\n  document.getElementById("resultGrid").innerHTML=card("Tell SEEKVERA what you need","Add your city, budget and details so the request can be classified.","No payment required.","REQUEST","#request-anything");\n  document.getElementById("results").scrollIntoView({behavior:"smooth",block:"start"});\n  return;\n }\n document.getElementById("resultTitle").textContent=(c.id==="travel"&&normalize(q).includes("hotel"))?"✈️ Travel → Hotels":c.icon+" "+c.name;'
          if marker not in text:
              raise SystemExit('Expected search result block was not found; refusing unsafe patch')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit search fix
        shell: bash
        run: |
          git config user.name "seekvera-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Route unknown searches to request form"
          git push
