name: R65B final AI control language
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r65b-final.yml']
permissions:
  contents: write
jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build R65B
        run: |
          set -euo pipefail
          python tools/r65b_fast_message_language.py
          node --check r24-ai-controller.js
          node --check r31-ui-polish.js
          node --check voice-ai.js
          node --check worker-r31.js
          grep -F "20260926-r65b-worldwide-chat-language" r24-ai-controller.js >/dev/null
          grep -F "WW:['worldwide'" r24-ai-controller.js >/dev/null
          grep -F "seekvera_chat_voice_lang" voice-ai.js >/dev/null
          grep -F "selected market must NEVER decide the reply language" worker-r31.js >/dev/null
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Wait for live assets
        run: |
          set -euo pipefail
          S=https://seekveraglobal.com
          for i in $(seq 1 35); do
            C="$(curl -LfsS --max-time 15 "$S/r24-ai-controller.js?r65b=$i" || true)"
            U="$(curl -LfsS --max-time 15 "$S/r31-ui-polish.js?r65b=$i" || true)"
            V="$(curl -LfsS --max-time 15 "$S/voice-ai.js?r65b=$i" || true)"
            W="$(curl -LfsS --max-time 15 "$S/worker-r31.js?r65b=$i" || true)"
            [[ "$C" == *"20260926-r65b-worldwide-chat-language"* && "$C" == *"WW:['worldwide'"* && "$U" == *"setTimeout(()=>c.abort(),7500)"* && "$V" == *"seekvera_chat_voice_lang"* && "$W" == *"Latest-message language"* || "$W" == *"selected market must NEVER decide the reply language"* ]] && exit 0
            sleep 2
          done
          exit 1
      - name: Real API language independent of country
        run: |
          python3 - <<'PY'
          import urllib.request,json
          S='https://seekveraglobal.com';H={'User-Agent':'Mozilla/5.0 R65B','content-type':'application/json'}
          cases=[('ar','NG','شو فيك تساعدني اليوم؟'),('fr','NG','Bonjour, peux-tu m’aider aujourd’hui ?'),('zh','US','你好，你今天可以怎么帮助我？'),('hi','FR','नमस्ते, आज आप मेरी कैसे मदद कर सकते हैं?')]
          for code,country,msg in cases:
            q=urllib.request.Request(S+'/api/ai',data=json.dumps({'message':msg,'country':country,'language':'auto','browserLanguage':'en-US','fast':True},ensure_ascii=False).encode(),headers=H,method='POST')
            with urllib.request.urlopen(q,timeout=35) as r:d=json.loads(r.read())
            print(code,country,d);assert d.get('ok') and d.get('response')
            x=d['response']
            if code=='ar':assert any('\u0600'<=c<='\u06ff' for c in x)
            if code=='zh':assert any('\u4e00'<=c<='\u9fff' for c in x)
            if code=='hi':assert any('\u0900'<=c<='\u097f' for c in x)
            if code=='fr':assert any(w in x.lower() for w in ('bonjour','vous','aide','besoin','assistant','pouvez'))
          print('R65B API LANGUAGE PASS')
          PY
      - name: Exact screenshot scenario in browser
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > test.mjs <<'JS'
          import {chromium} from 'playwright';import assert from 'node:assert/strict';
          const b=await chromium.launch({headless:true});const p=await b.newPage({userAgent:'Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'});
          await p.goto('https://seekveraglobal.com/?r65b='+Date.now(),{waitUntil:'networkidle',timeout:60000});await p.waitForFunction(()=>window.SEEKVERA_R24_CONTROLLER&&window.SEEKVERA_LOCALE_R15&&document.querySelector('#aiChatForm'));
          const ctl=await p.evaluate(()=>({ww:SEEKVERA_R24_CONTROLLER.detectControls('Change the app to Worldwide'),wwAr:SEEKVERA_R24_CONTROLLER.detectControls('غير التطبيق للعالمي'),tr:SEEKVERA_R24_CONTROLLER.detectControls('حطني تركيا'),lang:SEEKVERA_R24_CONTROLLER.detectControls('حطلي تركي')}));assert.equal(ctl.ww.country,'WW');assert.equal(ctl.wwAr.country,'WW');assert.equal(ctl.tr.country,'TR');assert.equal(ctl.lang.language,'tr');
          await p.evaluate(()=>{SEEKVERA_LOCALE_R15.setCountry('NG');sessionStorage.setItem('seekvera_ai_intent','jobs')});await p.fill('#aiChatInput','Change the app to Worldwide');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p.waitForFunction(()=>country.value==='WW',null,{timeout:5000});const a=await p.evaluate(()=>({country:country.value,currency:currency.value,intent:sessionStorage.getItem('seekvera_ai_intent'),text:aiMessages.innerText}));assert.equal(a.country,'WW');assert.equal(a.currency,'USD');assert.equal(a.intent,null);assert.ok(a.text.includes('✓ 🌐 Worldwide'));assert.ok(!/taking you directly to Jobs/i.test(a.text.split('Change the app to Worldwide').at(-1)||''));
          await p.evaluate(()=>SEEKVERA_LOCALE_R15.setCountry('NG'));await p.fill('#aiChatInput','شو فيك تساعدني اليوم؟');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p.waitForFunction(()=>{const z=(aiMessages.innerText.split('شو فيك تساعدني اليوم؟').at(-1)||'');return /[\u0600-\u06ff]/u.test(z)&&!/تعذّر الاتصال/.test(z)},null,{timeout:18000});
          await p.fill('#aiChatInput','Bonjour, peux-tu m’aider aujourd’hui ?');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p.waitForFunction(()=>{const z=(aiMessages.innerText.split('Bonjour, peux-tu m’aider aujourd’hui ?').at(-1)||'').toLowerCase();return /bonjour|vous|aide|besoin|assistant|pouvez/.test(z)},null,{timeout:18000});
          console.log('R65B BROWSER PASS',JSON.stringify({ctl,a}));await b.close();
          JS
          node test.mjs
          rm -f test.mjs
      - name: Voice country independence
        run: |
          set -euo pipefail
          cat > voice.mjs <<'JS'
          import {chromium} from 'playwright';import assert from 'node:assert/strict';const b=await chromium.launch({headless:true});const ctx=await b.newContext({locale:'ar-LB',userAgent:'Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'});await ctx.addInitScript(()=>{localStorage.setItem('seekvera_country','NG');localStorage.setItem('seekvera_country_explicit','1');localStorage.removeItem('seekvera_language_explicit');localStorage.removeItem('seekvera_chat_voice_lang');class SR{constructor(){this.lang=''}start(){window.__sr=this.lang;this.onstart?.()}stop(){this.onend?.()}abort(){this.onend?.()}}window.SpeechRecognition=SR;window.webkitSpeechRecognition=SR});const p=await ctx.newPage();await p.goto('https://seekveraglobal.com/?r65bvoice='+Date.now(),{waitUntil:'networkidle',timeout:60000});await p.waitForFunction(()=>window.SEEKVERA_VOICE_AI&&country.value==='NG');await p.click('#aiChatMic');await p.waitForFunction(()=>window.__sr);const s=await p.evaluate(()=>({sr:window.__sr,c:country.value,l:lang.value}));console.log('VOICE',s);assert.equal(s.c,'NG');assert.equal(s.l,'en');assert.ok(/^ar(?:-|$)/i.test(s.sr));await b.close();
          JS
          node voice.mjs
          rm -f voice.mjs
      - name: Persist audited R65B
        run: |
          set -euo pipefail
          git config user.name seekvera-global
          git config user.email seekvera.global@gmail.com
          git add ./*.html r24-ai-controller.js r31-ui-polish.js voice-ai.js worker-r31.js superapp.js r60-runtime-guard.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Persist R65B final AI control language fix'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo R65B_FINAL_PERSISTED
