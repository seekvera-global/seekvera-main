name: Boost SEEKVERA chat response speed once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boost-chat-fast-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Prioritize fast multilingual model for normal chat
        shell: python
        run: |
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text(encoding='utf-8')
          old="const PRIMARY='@cf/google/gemma-4-26b-a4b-it',FALLBACK='@cf/zai-org/glm-4.7-flash',LIGHT='@cf/qwen/qwen3-30b-a3b-fp8',VISION='@cf/meta/llama-3.2-11b-vision-instruct';"
          new="const PRIMARY='@cf/google/gemma-4-26b-a4b-it',FALLBACK='@cf/zai-org/glm-4.7-flash',LIGHT='@cf/qwen/qwen3-30b-a3b-fp8',FASTCHAT='@cf/meta/llama-3.1-8b-instruct-fast',VISION='@cf/meta/llama-3.2-11b-vision-instruct';"
          if old in s: s=s.replace(old,new,1)
          elif "FASTCHAT='@cf/meta/llama-3.1-8b-instruct-fast'" not in s: raise SystemExit('model constants not found')

          old="const order=/Safety Gate|moderation|safety review/i.test(first)?[PRIMARY,FALLBACK,LIGHT]:[FALLBACK,LIGHT,PRIMARY];for(const model of order){try{const input={messages,temperature:temp};if(model===LIGHT)input.max_tokens=Math.min(max,360);else input.max_completion_tokens=max;"
          new="const order=/Safety Gate|moderation|safety review/i.test(first)?[PRIMARY,FALLBACK,LIGHT]:[FASTCHAT,FALLBACK,LIGHT,PRIMARY];for(const model of order){try{const input={messages,temperature:temp};if(model===LIGHT||model===FASTCHAT)input.max_tokens=Math.min(max,360);else input.max_completion_tokens=max;"
          if old in s: s=s.replace(old,new,1)
          elif '[FASTCHAT,FALLBACK,LIGHT,PRIMARY]' not in s: raise SystemExit('AI order block not found')

          s=s.replace("lightModel:LIGHT,visionModel:VISION,aiResilience:'fast-chat-glm-first-v2'","lightModel:LIGHT,fastChatModel:FASTCHAT,visionModel:VISION,aiResilience:'fast-chat-8b-first-v3'",1)
          p.write_text(s,encoding='utf-8')
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          grep -q "@cf/meta/llama-3.1-8b-instruct-fast" worker.js
          grep -q "fast-chat-8b-first-v3" worker.js
          grep -q "FASTCHAT,FALLBACK,LIGHT,PRIMARY" worker.js
      - name: Commit speed repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- worker.js; then echo 'Already applied'; exit 0; fi
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add worker.js
          git commit -m 'Prioritize fast multilingual model for AI chat'
          git push
