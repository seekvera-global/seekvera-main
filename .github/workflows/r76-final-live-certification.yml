name: R76 final live certification

on:
  push:
    branches: [main]
    paths: ['tools/r76_final_live_certification.mjs', '.github/workflows/r76-final-live-certification.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Certify live R76
        shell: bash
        run: |
          set -euo pipefail
          node tools/r76_final_live_certification.mjs
          echo R76_VERIFIED_FINAL
