name: SEEKVERA scan share patch

on:
  push:
    paths:
      - ".github/workflows/seekvera-scan-share-once.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app and scan page
        run: python tools/patch_scan_share.py
      - name: Commit changes
        run: |
          git config user.name "SEEKVERA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.html scan.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add in-app QR sharing and install flow"
            git push
          fi
