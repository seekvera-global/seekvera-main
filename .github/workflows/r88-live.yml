name: R90 local multilingual voice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r88-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply R90
        run: python tools/r90_local_multilingual_voice.py
      - name: Verify source
        run: |
          set -e
          node --check voice-ai.js
          node --check worker-r76.js
          node --check sw.js
          grep -F "mod.env.remoteHost='https://huggingface.co/'" voice-ai.js
          grep -F "local multilingual ASR timeout" voice-ai.js
          grep -F "localWhisperEngine().catch(()=>{});" voice-ai.js
          grep -F 'voice-ai.js?v=20260927-r90-local-multilingual-voice' index.html
          ! grep -q 'js.puter.com' voice-ai.js
      - name: Commit R90 if needed
        run: |
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add voice-ai.js index.html sw.js
          if ! git diff --cached --quiet; then git commit -m 'R90 use local multilingual Whisper and native speech output'; git push origin HEAD:main; fi
      - name: Deploy R90
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify live R90 assets and voice output
        shell: bash
        run: |
          set -e
          BASE='https://seekveraglobal.com'
          stamp=$(date +%s)
          curl -LsS --max-time 20 -H 'cache-control: no-cache' "$BASE/?r90=$stamp" -o /tmp/home
          curl -LsS --max-time 20 -H 'cache-control: no-cache' "$BASE/voice-ai.js?r90=$stamp" -o /tmp/voice
          curl -LsS --max-time 20 -I 'https://huggingface.co/Xenova/whisper-tiny/resolve/main/config.json' -o /tmp/hf
          curl -LsS --max-time 25 -H 'content-type: application/json' -d '{"text":"مرحبا، كيف حالك؟","language":"ar"}' "$BASE/api/tts?r90=$stamp" -o /tmp/tts
          grep -q 'voice-ai.js?v=20260927-r90-local-multilingual-voice' /tmp/home
          grep -q "mod.env.remoteHost='https://huggingface.co/'" /tmp/voice
          grep -q 'local multilingual ASR timeout' /tmp/voice
          ! grep -q 'js.puter.com' /tmp/voice
          test $(wc -c < /tmp/tts) -gt 500
          echo R90_LIVE_ASSETS_PASS

# trigger-r90-corrected
