name: R89 deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r88-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/r89_voice_core_fix.py
      - name: Check files
        run: |
          node --check voice-ai.js
          node --check worker-r76.js
          node --check sw.js
          grep -F '20260927-r89-native-multilingual-voice' worker-r76.js
          grep -F 'voice-ai.js?v=20260927-r89-native-multilingual-voice' index.html
      - name: Commit files
        run: |
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add worker-r76.js voice-ai.js index.html sw.js
          git commit -m 'R89 fix multilingual voice core'
          git push origin HEAD:main
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

# trigger-r89-idempotent
