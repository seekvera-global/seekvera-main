name: R68 patched Whisper language detect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r68-patched-whisper-diagnostic.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build patched Transformers.js
        run: |
          set -euo pipefail
          git clone -q https://github.com/jhlee111/transformers.js.git /tmp/tjs
          cd /tmp/tjs
          git checkout -q 937ea0ad3422835f2f3f3bd09e7d2593117910
          corepack enable
          pnpm install --frozen-lockfile --silent
          cd packages/transformers
          node scripts/build.mjs
          test -s dist/transformers.web.js
          cp dist/transformers.web.js "$GITHUB_WORKSPACE/patched-transformers.web.js"
          ORT=$(find /tmp/tjs -type d -path '*/node_modules/onnxruntime-web/dist' | head -1)
          test -n "$ORT"
          cp -r "$ORT" "$GITHUB_WORKSPACE/ort"
          ls -lh "$GITHUB_WORKSPACE/patched-transformers.web.js"
          ls "$GITHUB_WORKSPACE/ort" | head -30
          grep -oE 'onnxruntime-web(/[a-z]+)?' "$GITHUB_WORKSPACE/patched-transformers.web.js" | sort -u || true
      - name: Test Arabic auto detection
        run: |
          set -euo pipefail
          cat > patched-test.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <script type="importmap">{"imports":{"onnxruntime-web":"/ort/ort.min.mjs","onnxruntime-web/wasm":"/ort/ort.wasm.min.mjs","onnxruntime-web/webgpu":"/ort/ort.webgpu.min.mjs"}}</script>
          <div>test</div>
          HTML
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > test-patched.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'node:fs';
          const b=await chromium.launch({headless:true});const p=await b.newPage();
          await p.goto('https://seekveraglobal.com/?patched='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          const bytes=await p.evaluate(async()=>{const r=await fetch('/api/tts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:'مرحبا أريد أن أبحث عن عمل في أمريكا',language:'ar'})});if(!r.ok)throw Error('tts '+r.status);return Array.from(new Uint8Array(await r.arrayBuffer()))});
          fs.writeFileSync('arabic.mp3',Buffer.from(bytes));
          await p.goto('http://127.0.0.1:8765/patched-test.html',{waitUntil:'domcontentloaded'});
          const t=Date.now();
          const out=await p.evaluate(async()=>{
            const {pipeline,env}=await import('/patched-transformers.web.js');
            env.backends.onnx.wasm.wasmPaths='/ort/';
            const transcriber=await pipeline('automatic-speech-recognition','Xenova/whisper-tiny',{dtype:'q8',device:'wasm'});
            return await transcriber('/arabic.mp3',{task:'transcribe'});
          });
          console.log('PATCHED_TINY_MS',Date.now()-t,'RESULT',JSON.stringify(out));
          if(!/[\u0600-\u06ff]/u.test(String(out?.text||'')))throw Error('Arabic not auto-transcribed');
          await b.close();
          JS
          node test-patched.mjs
