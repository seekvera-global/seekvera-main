name: R30 leak locate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r30-leak-locate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat >x.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844},locale:'en-US'});
          await p.goto('https://seekveraglobal.com/?leakloc=1',{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForFunction(()=>window.SEEKVERA_LOCALE_R15&&window.SEEKVERA_R30,{timeout:30000});
          await p.evaluate(()=>SEEKVERA_LOCALE_R15.setCountry('LB'));await p.waitForTimeout(2500);
          const a=await p.evaluate(()=>{
            const needle='Find, compare, choose — worldwide';const out=[];
            const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if((n.nodeValue||'').includes(needle)){const e=n.parentElement;out.push({node:n.nodeValue,parent:e?.tagName,cls:e?.className,id:e?.id,html:e?.outerHTML?.slice(0,900),hidden:e?getComputedStyle(e).display==='none':null})}}
            return {lang:document.documentElement.lang,dir:document.documentElement.dir,r30:window.SEEKVERA_R30?.version,r9:window.SEEKVERA_LOCALE_GUARD_R9?.version||'',matches:out};
          });
          console.log(JSON.stringify(a,null,2));await b.close();
          JS
          node x.mjs
