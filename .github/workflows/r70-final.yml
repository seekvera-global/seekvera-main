name: R70 true multilingual voice
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r70-final.yml']
permissions:
  contents: write
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Build multilingual browser ASR fallback
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch feat/whisper-language-detection https://github.com/jhlee111/transformers.js.git /tmp/tjs
          cd /tmp/tjs
          corepack enable
          pnpm install --frozen-lockfile --silent
          cd packages/transformers
          node scripts/build.mjs
          test -s dist/transformers.js
          cp dist/transformers.js "$GITHUB_WORKSPACE/patched-transformers.js"
          cd "$GITHUB_WORKSPACE"
          python tools/r70_final_multilingual_voice.py
          node --check voice-ai.js
          node --check worker-r31.js
          node --check r66-final-controller.js
          test -s patched-transformers.js
          grep -F "automaticMultilingualTranscribe" voice-ai.js >/dev/null
          grep -F "localWhisperTranscribe" voice-ai.js >/dev/null
          grep -F "await sleep(1400)" worker-r31.js >/dev/null
      - name: Deploy R70
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Wait for R70 live
        run: |
          set -euo pipefail
          S=https://seekveraglobal.com
          for i in $(seq 1 40); do
            H="$(curl -LfsS --max-time 15 "$S/?r70=$i" || true)"
            V="$(curl -LfsS --max-time 15 "$S/voice-ai.js?r70=$i" || true)"
            M="$(curl -LfsS --max-time 15 "$S/patched-transformers.js?r70=$i" || true)"
            W="$(curl -LfsS --max-time 15 "$S/worker-r31.js?r70=$i" || true)"
            if [[ "$H" == *"20260926-r70-true-multilingual-voice"* && "$V" == *"automaticMultilingualTranscribe"* && "$V" == *"localWhisperTranscribe"* && "$M" == *"WhisperForConditionalGeneration"* && "$W" == *"await sleep(1400)"* ]]; then echo R70_LIVE; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify country commands stay correct
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > command.mjs <<'JS'
          import{chromium}from'playwright';import assert from'node:assert/strict';
          const b=await chromium.launch({headless:true});const p=await b.newPage({locale:'en-US',userAgent:'Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'});
          await p.goto('https://seekveraglobal.com/?r70cmd='+Date.now(),{waitUntil:'networkidle',timeout:60000});await p.waitForFunction(()=>SEEKVERA_R66_FINAL&&SEEKVERA_LOCALE_R15);
          await p.evaluate(()=>SEEKVERA_LOCALE_R15.setCountry('NG'));await p.fill('#aiChatInput','Change the app to Worldwide');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p.waitForFunction(()=>country.value==='WW'&&currency.value==='USD');
          await p.fill('#aiChatInput','حطني تركيا');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p.waitForFunction(()=>country.value==='TR');
          console.log('R70 COMMAND PASS',await p.evaluate(()=>({country:country.value,lang:lang.value,currency:currency.value})));
          await b.close();
          JS
          node command.mjs
      - name: Verify multilingual text independent of country
        run: |
          python3 - <<'PY'
          import urllib.request,json
          S='https://seekveraglobal.com';H={'content-type':'application/json','User-Agent':'Mozilla/5.0 R70'}
          cases=[('ar','NG','كيف فيك تساعدني اليوم؟'),('fr','NG','Bonjour, comment pouvez-vous m’aider aujourd’hui ?'),('zh','US','你好，你今天可以怎么帮助我？'),('hi','FR','नमस्ते, आज आप मेरी कैसे मदद कर सकते हैं?')]
          for code,country,msg in cases:
            q=urllib.request.Request(S+'/api/ai',data=json.dumps({'message':msg,'country':country,'language':'auto','browserLanguage':'en-US','fast':True},ensure_ascii=False).encode(),headers=H,method='POST')
            with urllib.request.urlopen(q,timeout=35) as r:d=json.loads(r.read())
            x=d.get('response','');print(code,d.get('model'),x[:160]);assert d.get('ok') and x
            if code=='ar':assert any('\u0600'<=c<='\u06ff' for c in x)
            if code=='zh':assert any('\u4e00'<=c<='\u9fff' for c in x)
            if code=='hi':assert any('\u0900'<=c<='\u097f' for c in x)
            if code=='fr':assert any(w in x.lower() for w in ('vous','aide','besoin','pouvez','peux','bonjour'))
          print('R70 MULTILINGUAL TEXT PASS')
          PY
      - name: Verify real Arabic audio through local automatic ASR fallback
        run: |
          cat > voice.mjs <<'JS'
          import{chromium}from'playwright';import assert from'node:assert/strict';
          const b=await chromium.launch({headless:true});const p=await b.newPage({locale:'en-US',userAgent:'Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'});
          await p.goto('https://seekveraglobal.com/?r70voice='+Date.now(),{waitUntil:'networkidle',timeout:60000});await p.waitForFunction(()=>SEEKVERA_VOICE_AI?.localWhisperTranscribe);
          const result=await p.evaluate(async()=>{const a=await fetch('/api/tts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:'مرحبا أريد أن أبحث عن عمل في أمريكا',language:'ar'})});if(!a.ok)throw Error('tts '+a.status);const blob=await a.blob();const t=Date.now();const r=await SEEKVERA_VOICE_AI.localWhisperTranscribe(blob);return{...r,ms:Date.now()-t}});
          console.log('R70 REAL ARABIC ASR',result);assert.ok(/[\u0600-\u06ff]/u.test(result.text),result.text);assert.equal(result.engine,'local-whisper-auto');
          await p.evaluate(()=>{localStorage.setItem('seekvera_ai_chat_v1',JSON.stringify([{role:'user',text:'مرحبا كيفك اليوم'}]));localStorage.removeItem('seekvera_chat_voice_lang');SEEKVERA_VOICE_AI.seedLanguage()});const loc=await p.evaluate(()=>SEEKVERA_VOICE_AI.inputLocale());assert.ok(/^ar/i.test(loc),loc);
          await b.close();console.log('R70 ARABIC VOICE FALLBACK PASS');
          JS
          node voice.mjs
      - name: Persist R70
        run: |
          set -euo pipefail
          git config user.name seekvera-global
          git config user.email seekvera.global@gmail.com
          git add patched-transformers.js ./*.html voice-ai.js worker-r31.js r24-ai-controller.js r31-ui-polish.js superapp.js r60-runtime-guard.js navigation.js r66-final-controller.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Persist R70 true multilingual voice AI'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo R70_PERSISTED
