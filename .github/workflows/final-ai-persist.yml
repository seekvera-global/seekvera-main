name: Persist verified final AI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-ai-persist.yml']
permissions:
  contents: write
jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build verified final
        run: |
          set -euo pipefail
          python tools/r65c_first_voice_auto.py
          node --check voice-ai.js
          node --check r24-ai-controller.js
          node --check r31-ui-polish.js
          node --check worker-r31.js
      - name: Deploy verified final
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify live behavior assets
        run: |
          set -euo pipefail
          S=https://seekveraglobal.com
          for i in $(seq 1 20); do
            V="$(curl -LfsS --max-time 15 "$S/voice-ai.js?persist=$i" || true)"
            C="$(curl -LfsS --max-time 15 "$S/r24-ai-controller.js?persist=$i" || true)"
            if [[ "$V" == *"serverVoice(targetId,activeButton,true)"* && "$V" == *"start(targetId,button,true)"* && "$C" == *"WW:['worldwide'"* ]]; then echo LIVE_BEHAVIOR_VERIFIED; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify exact controls and multilingual text
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > verify.mjs <<'JS'
          import {chromium} from 'playwright';import assert from 'node:assert/strict';
          const b=await chromium.launch({headless:true});const p=await b.newPage({locale:'en-US',userAgent:'Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'});
          await p.goto('https://seekveraglobal.com/?persist='+Date.now(),{waitUntil:'networkidle',timeout:60000});await p.waitForFunction(()=>SEEKVERA_R24_CONTROLLER&&SEEKVERA_LOCALE_R15&&document.querySelector('#aiChatForm'));
          const ctl=await p.evaluate(()=>({ww:SEEKVERA_R24_CONTROLLER.detectControls('Change the app to Worldwide'),wwa:SEEKVERA_R24_CONTROLLER.detectControls('غير التطبيق للعالمي'),tr:SEEKVERA_R24_CONTROLLER.detectControls('حطني تركيا'),tl:SEEKVERA_R24_CONTROLLER.detectControls('حطلي تركي')}));assert.equal(ctl.ww.country,'WW');assert.equal(ctl.wwa.country,'WW');assert.equal(ctl.tr.country,'TR');assert.equal(ctl.tl.language,'tr');
          await p.evaluate(()=>{SEEKVERA_LOCALE_R15.setCountry('NG');sessionStorage.setItem('seekvera_ai_intent','jobs')});await p.fill('#aiChatInput','Change the app to Worldwide');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p.waitForFunction(()=>country.value==='WW',null,{timeout:5000});const x=await p.evaluate(()=>({c:country.value,cur:currency.value,intent:sessionStorage.getItem('seekvera_ai_intent'),text:aiMessages.innerText}));assert.equal(x.c,'WW');assert.equal(x.cur,'USD');assert.equal(x.intent,null);assert.ok(x.text.includes('✓ 🌐 Worldwide'));assert.ok(!/taking you directly to Jobs/i.test(x.text.split('Change the app to Worldwide').at(-1)||''));
          await p.evaluate(()=>SEEKVERA_LOCALE_R15.setCountry('NG'));await p.fill('#aiChatInput','شو فيك تساعدني اليوم؟');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p.waitForFunction(()=>/[\u0600-\u06ff]/u.test((aiMessages.innerText.split('شو فيك تساعدني اليوم؟').at(-1)||'')),null,{timeout:18000});await p.fill('#aiChatInput','Bonjour, peux-tu m’aider aujourd’hui ?');await p.locator('#aiChatForm').evaluate(f=>f.requestSubmit());await p.waitForFunction(()=>/bonjour|vous|aide|besoin|assistant|pouvez/.test((aiMessages.innerText.split('Bonjour, peux-tu m’aider aujourd’hui ?').at(-1)||'').toLowerCase()),null,{timeout:18000});console.log('FINAL VERIFIED',x);await b.close();
          JS
          node verify.mjs
          rm -f verify.mjs
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name seekvera-global
          git config user.email seekvera.global@gmail.com
          git add ./*.html voice-ai.js r24-ai-controller.js r31-ui-polish.js worker-r31.js superapp.js r60-runtime-guard.js sw.js
          if ! git diff --cached --quiet; then git commit -m 'Persist verified final AI voice controls'; git pull --rebase origin main; git push origin HEAD:main; fi
          echo FINAL_VERIFIED_PERSISTED
