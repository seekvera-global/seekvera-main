name: SEEKVERA Worldwide Country Language Currency Jobs R7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worldwide-country-language-jobs-r7.yml'
      - '.github/scripts/worldwide_r7.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seekvera-worldwide-country-language-r7
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply R7 upgrade
        run: python3 .github/scripts/worldwide_r7.py

      - name: Keep deployment workflow unchanged and compatible
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/deploy-cloudflare.yml
          if ! grep -q '20260923-final-market-r6' index.html; then
            sed -i '1i<!-- 20260923-final-market-r6 compatibility marker -->' index.html
          fi

      - name: Validate R7 source
        shell: bash
        run: |
          set -euo pipefail
          node --check global-ui.js
          node --check superapp.js
          node --check i18n-ui.js
          node --check worker.js
          grep -q "const COUNTRY_PROFILE=" global-ui.js
          grep -q "u.pathname==='/api/locale'" worker.js
          grep -q "Open jobs now" global-ui.js
          grep -q "LinkedIn jobs in" superapp.js
          grep -q 'id="jobRole"' jobs.html
          grep -q '20260924-country-sync-r7' index.html
          grep -q '20260923-final-market-r6' index.html
          grep -q 'SEEKVERA R7 AMAZON-LIKE COMPACT HOME' home-marketplace-r5.css

      - name: Commit R7 upgrade
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'R7 upgrade already applied.'
            exit 0
          fi
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add -A
          git commit -m 'Upgrade worldwide country locale, jobs and direct AI actions R7'
          git push
