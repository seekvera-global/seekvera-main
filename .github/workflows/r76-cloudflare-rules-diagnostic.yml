name: R76 Cloudflare rules diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-cloudflare-rules-diagnostic.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Cloudflare token and zone rules
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          api(){ curl -sS --max-time 20 -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' "$1"; }
          echo '=== TOKEN VERIFY ==='
          api 'https://api.cloudflare.com/client/v4/user/tokens/verify' | python3 -m json.tool || true
          echo '=== ZONE LOOKUP ==='
          Z="$(api 'https://api.cloudflare.com/client/v4/zones?name=seekveraglobal.com')"
          echo "$Z" | python3 -m json.tool || true
          ZID="$(echo "$Z" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or [{}])[0].get('id',''))" 2>/dev/null)"
          echo "ZONE_ID_PRESENT=$([ -n "$ZID" ] && echo yes || echo no)"
          if [ -n "$ZID" ]; then
            echo '=== RULESETS ==='
            api "https://api.cloudflare.com/client/v4/zones/$ZID/rulesets" | python3 -m json.tool || true
            for phase in http_ratelimit http_request_firewall_custom http_request_firewall_managed; do
              echo "=== PHASE $phase ==="
              api "https://api.cloudflare.com/client/v4/zones/$ZID/rulesets/phases/$phase/entrypoint" | python3 -m json.tool || true
            done
          fi
