name: R68 local Whisper diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r68-local-whisper-diagnostic.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json
          q=urllib.request.Request('https://seekveraglobal.com/api/tts',data=json.dumps({'text':'مرحبا أريد أن أبحث عن عمل في أمريكا','language':'ar'},ensure_ascii=False).encode(),headers={'content-type':'application/json'},method='POST')
          with urllib.request.urlopen(q,timeout=40) as r: open('arabic.mp3','wb').write(r.read())
          PY
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cat > /tmp/test.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true});const p=await b.newPage();
          await p.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
          const t=Date.now();
          const out=await p.evaluate(async()=>{
            const {pipeline}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');
            const transcriber=await pipeline('automatic-speech-recognition','Xenova/whisper-tiny',{quantized:true});
            const r=await transcriber('http://127.0.0.1:8765/arabic.mp3',{task:'transcribe'});
            return r;
          });
          console.log('LOCAL_WHISPER_MS',Date.now()-t,'RESULT',JSON.stringify(out));
          if(!/[\u0600-\u06ff]/u.test(String(out?.text||'')))throw Error('Arabic not transcribed');
          await b.close();
          JS
          node /tmp/test.mjs
