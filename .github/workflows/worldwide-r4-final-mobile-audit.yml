name: SEEKVERA Worldwide R4 final mobile audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worldwide-r4-final-mobile-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium audit runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live Worldwide R4 on Android
        shell: bash
        run: |
          cat > audit.js <<'JS'
          const {chromium}=require('playwright');
          const SITE='https://seekveraglobal.com';
          const CODES=['en','ar','fr','zh','es','hi','pt','de','ja','ko','id','tr','ru','ur','bn','vi','it','sw','th','fa','pl','nl','ms','fil','ha','yo','ig','am'];
          const ok=(v,m)=>{if(!v)throw Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:360,height:800},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 11; SM-A225F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'});
            await context.addInitScript(()=>{
              localStorage.setItem('seekvera_country','PT');
              localStorage.setItem('seekvera_scope','local');
              localStorage.setItem('seekvera_lang','en');
              localStorage.removeItem('seekvera_worldwide_default_20260923_r4');
            });
            const page=await context.newPage();
            await page.goto(SITE+'/?r4-final-mobile=2',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#country')?.options?.length>240&&document.querySelector('#lang')?.options?.length>=29,null,{timeout:60000});
            await page.waitForFunction(()=>localStorage.getItem('seekvera_worldwide_default_20260923_r4')==='1',null,{timeout:30000});
            await page.waitForTimeout(600);
            let s=await page.evaluate(()=>({country:country.value,countryText:country.selectedOptions[0].textContent.trim(),countryCount:country.options.length,langCount:lang.options.length,scope:localStorage.getItem('seekvera_scope'),saved:localStorage.getItem('seekvera_country'),intro:document.querySelector('#aiMessages .ai-msg.bot')?.textContent||'',media:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='media.html'),overflow:document.documentElement.scrollWidth-innerWidth}));
            console.log('WORLDWIDE_EN',s);
            ok(s.country==='WW'&&s.saved==='WW'&&s.scope==='worldwide','stale Portugal/local state not migrated to Worldwide');
            ok(/Worldwide/i.test(s.countryText),'English selector does not visibly say Worldwide: '+s.countryText);
            ok(s.countryCount>240,'country list incomplete');
            ok(s.langCount===29,'expected Auto + 28 languages');
            ok(/SEEKVERA AI assistant/i.test(s.intro),'English inline AI intro missing');
            ok(s.media,'Media not visible'); ok(s.overflow<=2,'English mobile horizontal overflow');

            await page.selectOption('#country','PT'); await page.dispatchEvent('#country','change'); await page.waitForTimeout(200);
            ok(await page.evaluate(()=>localStorage.getItem('seekvera_country'))==='PT','intentional Portugal selection did not save');
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#country')?.value==='PT',null,{timeout:30000});
            console.log('COUNTRY_PERSISTENCE_PASS');

            await page.selectOption('#country','WW'); await page.dispatchEvent('#country','change');
            await page.selectOption('#lang','ar'); await page.dispatchEvent('#lang','change');
            await page.waitForFunction(()=>document.documentElement.dir==='rtl'&&/\p{Script=Arabic}/u.test(document.querySelector('#aiMessages .ai-msg.bot')?.textContent||''),null,{timeout:30000});
            await page.waitForTimeout(300);
            const ar=await page.evaluate(()=>({country:country.value,text:country.selectedOptions[0].textContent.trim(),intro:document.querySelector('#aiMessages .ai-msg.bot')?.textContent||'',dir:document.documentElement.dir,overflow:document.documentElement.scrollWidth-innerWidth}));
            console.log('WORLDWIDE_AR',ar);
            ok(ar.country==='WW'&&/العالم/.test(ar.text),'Arabic Worldwide label/selection failed');
            ok(ar.dir==='rtl'&&/\p{Script=Arabic}/u.test(ar.intro),'Arabic RTL/AI intro failed');
            ok(ar.overflow<=2,'Arabic mobile horizontal overflow');

            const voice=await (await page.request.get(SITE+'/voice-ai.js?v=20260923-worldwide-r4&r4audit=2')).text();
            ok(/SpeechRecognition|webkitSpeechRecognition/.test(voice)&&voice.includes('speechSynthesis'),'voice runtime missing');
            ok(voice.includes('if(!c.length)return null'),'wrong-language voice fallback protection missing');
            for(const c of CODES)ok(voice.includes(c+':')||voice.includes(c+"='")||voice.includes(c+'='),'voice locale missing '+c);
            console.log('VOICE_28_PASS');

            const [app,manifest,sw,media]=await Promise.all([
              page.request.get(SITE+'/app.html?r4audit=2').then(r=>r.text()),
              page.request.get(SITE+'/manifest.webmanifest?r4audit=2').then(r=>r.text()),
              page.request.get(SITE+'/sw.js?r4audit=2').then(r=>r.text()),
              page.request.get(SITE+'/media.html?r4audit=2').then(async r=>({status:r.status(),text:await r.text()}))
            ]);
            ok(app.includes('20260923-worldwide-r4')&&app.includes('Worldwide · Premium AI')&&app.includes('media.html'),'app shell not R4/Worldwide/Media');
            ok(manifest.includes('20260923-worldwide-r4'),'manifest stale');
            ok(sw.includes('seekvera-worldwide-r4-20260923')&&sw.includes('media.html'),'service worker stale');
            ok(media.status===200&&/SEEKVERA MEDIA/i.test(media.text),'Media page failed');
            console.log('PWA_MEDIA_PASS');

            async function ai(data){const r=await page.request.post(SITE+'/api/ai',{data,timeout:75000});return [r.status(),await r.json()]}
            let [st,d]=await ai({message:'Reply only with: Hello.',country:'Worldwide',language:'English',scope:'worldwide',fast:true});
            ok(st<300&&d.ok===true&&(d.language||'').toLowerCase()==='english'&&/hello/i.test(d.response||''),'English AI lock failed');
            [st,d]=await ai({message:'أجب فقط: مرحبا',country:'Worldwide',language:'Arabic',scope:'worldwide',fast:true});
            ok(st<300&&d.ok===true&&(d.language||'').toLowerCase()==='arabic'&&/\p{Script=Arabic}/u.test(d.response||''),'Arabic AI lock failed');
            console.log('AI_EN_AR_PASS');

            let r=await page.request.post(SITE+'/api/moderate',{data:{text:'lawful hotel booking request',context:'R4 final audit'},timeout:50000}); let md=await r.json(); ok(md.allowed===true,'safe moderation failed');
            r=await page.request.post(SITE+'/api/moderate',{data:{text:'gun and ammunition for sale',context:'R4 final audit'},timeout:50000}); md=await r.json(); ok(md.allowed===false,'Safety Gate block failed');
            console.log('SAFETY_PASS');

            await page.selectOption('#lang','en'); await page.dispatchEvent('#lang','change');
            await page.waitForFunction(()=>document.documentElement.dir==='ltr'&&/SEEKVERA AI assistant/i.test(document.querySelector('#aiMessages .ai-msg.bot')?.textContent||''),null,{timeout:30000});
            await page.screenshot({path:'seekvera-worldwide-r4-mobile.png',fullPage:false});
            await browser.close();
            console.log('SEEKVERA WORLDWIDE R4 FINAL MOBILE AUDIT PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node audit.js
      - uses: actions/upload-artifact@v4
        with:
          name: seekvera-worldwide-r4-mobile-proof
          path: seekvera-worldwide-r4-mobile.png
          if-no-files-found: error
