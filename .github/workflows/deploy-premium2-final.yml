name: SEEKVERA final R3 Cloudflare deploy

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'voice-ai.js'
      - 'global-ui.js'
      - 'global-ui.css'
      - 'i18n-ui.js'
      - 'i18n-premium.css'
      - '*.html'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy-premium2-final.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-final-r3-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate final R3 app runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check voice-ai.js
          node --check global-ui.js
          node --check i18n-ui.js
          grep -q '20260922-final-r3' index.html
          grep -q 'body.sv-home-global .sv-global-dock{display:none!important}' i18n-premium.css
          grep -q "'Country / Region':'الدولة / المنطقة'" i18n-ui.js
          grep -q 'safetyGateVersion' worker.js
          grep -q '/api/marketplace-submit' worker.js
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
          rm -rf .wrangler-dry-run .wrangler
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify final R3 is live
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://seekveraglobal.com'
          BASE='https://seekvera-main.seekvera-global.workers.dev'
          for i in $(seq 1 18); do
            curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$SITE/?finalr3=$i" -o /tmp/home || true
            if grep -q 'i18n-premium.css?v=20260922-final-r3' /tmp/home 2>/dev/null && grep -q 'i18n-ui.js?v=20260922-final-r3' /tmp/home 2>/dev/null; then break; fi
            sleep 4
          done
          grep -q 'i18n-premium.css?v=20260922-final-r3' /tmp/home
          grep -q 'i18n-ui.js?v=20260922-final-r3' /tmp/home
          curl -fsS --max-time 15 "$SITE/i18n-premium.css?v=20260922-final-r3" -o /tmp/css
          grep -q 'body.sv-home-global .sv-global-dock{display:none!important}' /tmp/css
          curl -fsS --max-time 15 "$SITE/i18n-ui.js?v=20260922-final-r3" -o /tmp/i18n
          grep -q "'Country / Region':'الدولة / المنطقة'" /tmp/i18n
          curl -fsS --max-time 15 "$BASE/api/health" -o /tmp/health
          grep -q '"centralSafetyGate":"enabled"' /tmp/health
          grep -q '"failClosed":true' /tmp/health
          grep -q '"marketplaceProxy":"enabled"' /tmp/health
          echo 'FINAL R3 PRODUCTION DEPLOY PASS'
