name: SEEKVERA R30 Cloudflare deploy

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'worker-r30.js'
      - 'r30-runtime.js'
      - 'voice-ai.js'
      - 'global-ui.js'
      - 'global-ui.css'
      - 'i18n-ui.js'
      - 'i18n-premium.css'
      - '*.html'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy-premium2-final.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-r30-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate R30 runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          node --check worker-r30.js
          node --check r30-runtime.js
          node --check voice-ai.js
          node --check global-ui.js
          node --check i18n-ui.js
          grep -q "main.*worker-r30.js" wrangler.jsonc
          grep -q 'r30Runtime' worker-r30.js
          grep -q 'SEEKVERA_LOCALE_GUARD_R9' r30-runtime.js
          grep -q 'speechSynthesis' r30-runtime.js
          grep -q 'safetyGateVersion' worker.js
          grep -q '/api/marketplace-submit' worker.js
          npx -y wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
          rm -rf .wrangler-dry-run .wrangler
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify R30 is live
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://seekveraglobal.com'
          BASE='https://seekvera-main.seekvera-global.workers.dev'
          ok=0
          for i in $(seq 1 24); do
            curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$BASE/api/health?r30=$i" -o /tmp/health || true
            if grep -q '"r30":true' /tmp/health 2>/dev/null; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          grep -q '"centralSafetyGate":"enabled"' /tmp/health
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SITE/?r30=1" -o /tmp/home
          grep -q 'r30-runtime.js?v=20260925-r30' /tmp/home
          echo 'R30 PRODUCTION DEPLOY PASS'
      - name: Verify live fast multilingual AI
        shell: python
        run: |
          import json,time,urllib.request
          site='https://seekveraglobal.com'
          def ask(message,language,country):
              payload={'message':message,'language':language,'country':country,'scope':'country','fast':True,'history':[]}
              req=urllib.request.Request(site+'/api/ai',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'content-type':'application/json','Origin':site,'User-Agent':'SEEKVERA-R30-LIVE'},method='POST')
              t=time.time()
              with urllib.request.urlopen(req,timeout=30) as r:d=json.loads(r.read().decode('utf-8','replace'))
              return time.time()-t,d
          tests=[('Arabic','Lebanon','مرحبا، ساعدني أجد فندقاً'),('French','France','Bonjour, aide-moi à trouver un hôtel'),('Hindi','India','नमस्ते, होटल खोजने में मेरी मदद करें')]
          for language,country,message in tests:
              elapsed,d=ask(message,language,country)
              assert d.get('ok') is True and d.get('response'),(language,d)
              assert d.get('fastPath')=='r30-one-call',(language,d)
              assert elapsed < 20,(language,elapsed,d)
              print(language,'FAST PASS',round(elapsed,2),'s',d.get('model'))
