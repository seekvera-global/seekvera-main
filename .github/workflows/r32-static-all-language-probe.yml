name: R32 static all-language probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r32-static-all-language-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe all language codes
        shell: python
        run: |
          import re,json,urllib.parse,urllib.request,concurrent.futures
          s=open('locale-r14-categories.js',encoding='utf-8').read()
          langs=[]
          for x in re.findall(r'(?:^|\n)([a-z]{2,3}):\[',s):
              if x not in langs: langs.append(x)
          print('LANGS',len(langs),langs)
          assert len(langs)==98,(len(langs),langs)
          text='No approved live marketplace listings are available right now.'
          aliases={'fil':'tl','he':'iw'}
          def one(code):
              if code=='en': return code,True,'English'
              tl=aliases.get(code,code)
              url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl='+urllib.parse.quote(tl)+'&dt=t&q='+urllib.parse.quote(text)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=15) as r:data=json.loads(r.read().decode())
                  out=''.join(x[0] for x in data[0] if x and x[0]).strip()
                  return code,bool(out and out!=text),out
              except Exception as e:return code,False,repr(e)
          out=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for r in ex.map(one,langs): out.append(r); print(r[0],r[1],repr(r[2])[:180])
          bad=[c for c,ok,_ in out if not ok]
          print('SUPPORTED',len(langs)-len(bad),'BAD',len(bad),bad)
          open('/tmp/result.json','w').write(json.dumps({'langs':langs,'bad':bad},ensure_ascii=False))
          assert len(bad)<=15,bad
