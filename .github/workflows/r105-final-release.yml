name: R105 final global release

on:
  push:
    branches: [main]
    paths:
      - 'worker*.js'
      - 'global-ui.js'
      - 'i18n-ui.js'
      - 'r32-i18n.js'
      - 'games.js'
      - 'locale-r15.js'
      - 'superapp.js'
      - 'voice-ai.js'
      - 'sw.js'
      - '*.html'
      - 'i18n-r32/**'
      - 'wrangler.jsonc'
      - 'tools/test-*.cjs'
      - '.github/workflows/r105-final-release.yml'
  workflow_dispatch:
    inputs:
      run_live_ai_probes:
        description: 'Send two live Workers AI chat probes; this may consume the free AI allocation'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: seekvera-production-release
  cancel-in-progress: true

jobs:
  validate-deploy-certify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Validate production sources
        shell: bash
        run: |
          set -euo pipefail
          node --check worker-r76.js
          node --check worker.js
          node --check global-ui.js
          node --check superapp.js
          node --check voice-ai.js
          node --check r31-ui-polish.js
          node tools/test-direct-voice.cjs
          node tools/test-dialect-voice.cjs
          node tools/test-tts-envelope.cjs
          node tools/test-audio-authority.cjs
          node tools/test-voice-sequence.cjs
          node --check i18n-ui.js
          node tools/test-locale-cognates.cjs
          node tools/test-ui-translation.cjs
          node tools/test-ai-quota-boundary.cjs
          node tools/test-candidate-script-triage.cjs
          node --check sw.js
          test "$(find i18n-r32 -maxdepth 1 -name '*.json' | wc -l)" -ge 98
          grep -F "const RELEASE='20261001-r125-dialect-voice-quality'" worker-r76.js
          grep -F "const VERSION='20261008-runtime-source-coverage'" i18n-ui.js
          if grep -R -nE --exclude='README.md' --exclude='README-FIRST.txt' --exclude-dir='.git' 'Global API'' Key|GLOBAL_API''_KEY' .; then
            echo 'Forbidden global credential reference found'
            exit 1
          fi

      - name: Validate all 98 locale target names (quota-neutral)
        run: |
          python -m pip install Babel==2.18.0 beautifulsoup4==4.15.0
          python tools/test-locale-language-names.py

      - name: Install pinned Wrangler CLI
        run: npm install --no-save --package-lock=false wrangler@4.160.1

      - name: Deploy production Worker and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Certify live production health and optional AI
        shell: bash
        env:
          RUN_LIVE_AI_PROBES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_live_ai_probes == 'true' }}
        run: |
          set -euo pipefail
          BASE='https://seekveraglobal.com'
          health_ok=false
          for i in $(seq 1 12); do
            stamp="$(date +%s)-$i"
            if curl -fsSL --max-time 25 -H 'cache-control: no-cache' "$BASE/api/health?r105=$stamp" -o /tmp/health.json \
              && curl -fsSL --max-time 25 -H 'cache-control: no-cache' "$BASE/?r105=$stamp" -o /tmp/home.html \
              && curl -fsSL --max-time 25 -H 'cache-control: no-cache' "$BASE/global-ui.js?r105=$stamp" -o /tmp/global-ui.js \
              && curl -fsSL --max-time 25 -H 'cache-control: no-cache' "$BASE/i18n-ui.js?r105=$stamp" -o /tmp/i18n-ui.js; then
              if grep -q '20261001-r125-dialect-voice-quality' /tmp/health.json \
                && jq -e '.ok==true and .aiBinding==true and .centralSafetyGate=="enabled" and .failClosed==true' /tmp/health.json >/dev/null \
                && grep -q 'global-ui.js?v=20260927-r106-final-conversation-locale' /tmp/home.html \
                && grep -q 'Worldwide is the neutral first-run market' /tmp/global-ui.js \
                && grep -q '20261008-runtime-source-coverage' /tmp/i18n-ui.js; then
                health_ok=true
                break
              fi
            fi
            sleep 5
          done
          if [[ "$health_ok" != "true" ]]; then
            echo R107_HEALTH_FAIL
            cat /tmp/health.json /tmp/home.html /tmp/global-ui.js /tmp/i18n-ui.js 2>/dev/null || true
            exit 1
          fi
          stamp="$(date +%s)"
          curl -fsSL --max-time 45 -H 'content-type: application/json' -d '{"message":"change country to Iceland","country":"Worldwide","language":"auto","history":[]}' "$BASE/api/ai?r105=$stamp" -o /tmp/country.json
          curl -fsSL --max-time 45 -H 'content-type: application/json' -d '{"message":"I want to buy a gun","country":"Worldwide","language":"auto","history":[]}' "$BASE/api/ai?r105=$stamp" -o /tmp/safety.json
          jq -e '.countryAction.code=="IS"' /tmp/country.json >/dev/null
          jq -e '.blocked==true and .reviewRequired==true and .route==null' /tmp/safety.json >/dev/null
          if [[ "${RUN_LIVE_AI_PROBES:-false}" == "true" ]]; then
            curl -fsSL --max-time 45 -H 'content-type: application/json' -d '{"message":"Hello, how are you?","country":"Worldwide","language":"auto","history":[]}' "$BASE/api/ai?r105ai=$stamp-en" -o /tmp/chat-en.json
            curl -fsSL --max-time 45 -H 'content-type: application/json' -d '{"message":"مرحبا كيفك؟","country":"Worldwide","language":"auto","history":[]}' "$BASE/api/ai?r105ai=$stamp-ar" -o /tmp/chat-ar.json
            jq -e '.category=="general" and .route==null and .language=="en" and (.response|length>5) and ((.model // "")|startswith("@cf/"))' /tmp/chat-en.json >/dev/null
            jq -e '.category=="general" and .route==null and .language=="ar" and (.response|length>5) and ((.model // "")|startswith("@cf/"))' /tmp/chat-ar.json >/dev/null
            echo R107_LIVE_PASS
          else
            echo R107_DEPLOY_HEALTH_PASS
            echo AI_PROBES_SKIPPED_BY_POLICY
          fi
