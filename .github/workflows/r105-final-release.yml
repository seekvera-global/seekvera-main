          grep -F "'පිටු සංචාලනය'" i18n-ui.js
          grep -F "'හඬ පිළිතුර'" i18n-ui.js
          grep -F "'හඬ'" i18n-ui.js
          grep -F "'திரும்பு'" i18n-ui.js
          grep -F "'பக்க வழிசெலுத்தல்'" i18n-ui.js
          grep -F "'குரல் பதில்'" i18n-ui.js
