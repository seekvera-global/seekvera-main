name: R105 final global release

on:
  push:
    branches: [main]
    paths:
      - 'worker*.js'
      - 'global-ui.js'
      - 'navigation.js'
      - 'i18n-ui.js'
      - 'r32-i18n.js'
      - 'games.js'
      - 'locale-r15.js'
      - 'superapp.js'
      - 'voice-ai.js'
      - 'sw.js'
      - '*.html'
      - 'i18n-r32/**'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'tools/test-*.cjs'
      - '.github/workflows/r105-final-release.yml'
  workflow_dispatch:
    inputs:
      run_live_ai_probes:
        description: 'Send two live Workers AI chat probes; this may consume the free AI allocation'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: seekvera-production-release
  cancel-in-progress: true

jobs:
  validate-deploy-certify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Validate production sources
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'docs/' .assetsignore
          grep -Fxq 'tools/' .assetsignore
          grep -Fxq '**/__pycache__/' .assetsignore
          grep -Fxq '*.py[cod]' .assetsignore
          node --check worker-r76.js
          node --check worker.js
          node --check global-ui.js
          node --check games.js
          node --check superapp.js
          node --check voice-ai.js
          node --check r31-ui-polish.js
          node tools/test-direct-voice.cjs
          node tools/test-dialect-voice.cjs
          node tools/test-tts-envelope.cjs
          node tools/test-audio-authority.cjs
          node tools/test-voice-sequence.cjs
          node --check i18n-ui.js
          node --check navigation.js
          node tools/test-locale-cognates.cjs
          node tools/test-ui-translation.cjs
          node tools/test-ui-translation-quota-session-guard.cjs
          node tools/test-ai-quota-boundary.cjs
          node tools/test-candidate-script-triage.cjs
          python tools/test-repair-candidate-reserved-identifiers.py
          node --check sw.js
          test "$(find i18n-r32 -maxdepth 1 -name '*.json' | wc -l)" -ge 98
          grep -F "const RELEASE='20261001-r125-dialect-voice-quality'" worker-r76.js
          grep -F "const VERSION='20261118-r125-global-quick-v15'" i18n-ui.js
          if grep -R -nE --exclude='README.md' --exclude='README-FIRST.txt' --exclude-dir='.git' 'Global API'' Key|GLOBAL_API''_KEY' .; then
            echo 'Forbidden global credential reference found'
            exit 1
          fi

      - name: Validate all 98 locale target names (quota-neutral)
        run: |
          python -m pip install Babel==2.18.0 beautifulsoup4==4.15.0
          python tools/test-locale-language-names.py

      - name: Install pinned Wrangler CLI
        run: npm install --no-save --package-lock=false wrangler@4.160.1

      - name: Deploy production Worker and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Certify live production health and optional AI
        shell: bash
        env:
          RUN_LIVE_AI_PROBES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_live_ai_probes == 'true' }}
        run: |
          set -euo pipefail
          BASE='https://seekveraglobal.com'
          health_ok=false
          for i in $(seq 1 12); do
            stamp="$(date +%s)-$i"
            if curl -fsSL --max-time 25 -H 'cache-control: no-cache' "$BASE/api/health?r105=$stamp" -o /tmp/health.json \
              && curl -fsSL --max-time 25 -H 'cache-control: no-cache' "$BASE/?r105=$stamp" -o /tmp/home.html \
              && curl -fsSL --max-time 25 -H 'cache-control: no-cache' "$BASE/global-ui.js?r105=$stamp" -o /tmp/global-ui.js \
              && curl -fsSL --max-time 25 -H 'cache-control: no-cache' "$BASE/i18n-ui.js?r105=$stamp" -o /tmp/i18n-ui.js; then
              if grep -q '20261001-r125-dialect-voice-quality' /tmp/health.json \
                && jq -e '.ok==true and .aiBinding==true and .centralSafetyGate=="enabled" and .failClosed==true' /tmp/health.json >/dev/null \
                && grep -q 'global-ui.js?v=20261117-r125-source-caption-i18n-v2' /tmp/home.html \
                && grep -q 'sv-control-caption-label' /tmp/global-ui.js \
                && grep -q 'Worldwide is the neutral first-run market' /tmp/global-ui.js \
                && grep -q '20261118-r125-global-quick-v15' /tmp/i18n-ui.js \
                && grep -q 'Quay lại' /tmp/i18n-ui.js \
                && grep -q 'Điều hướng trang' /tmp/i18n-ui.js \
                && grep -q 'Trả lời bằng giọng nói' /tmp/i18n-ui.js \
                && grep -q 'Giọng nói' /tmp/i18n-ui.js \
                && grep -q 'Indietro' /tmp/i18n-ui.js \
                && grep -q 'Navigazione tra le pagine' /tmp/i18n-ui.js \
                && grep -q 'Risposta vocale' /tmp/i18n-ui.js \
                && grep -q 'Voce' /tmp/i18n-ui.js \
                && grep -q 'Bumalik' /tmp/i18n-ui.js \
                && grep -q 'Pag-navigate sa pahina' /tmp/i18n-ui.js \
                && grep -q 'Sagot sa boses' /tmp/i18n-ui.js \
                && grep -q 'Boses' /tmp/i18n-ui.js \
                && grep -q 'Atgal' /tmp/i18n-ui.js \
                && grep -q 'Puslapių naršymas' /tmp/i18n-ui.js \
                && grep -q 'Atsakymas balsu' /tmp/i18n-ui.js \
                && grep -q 'Balsas' /tmp/i18n-ui.js \
                && grep -q 'Nazaj' /tmp/i18n-ui.js \
                && grep -q 'Navigacija po straneh' /tmp/i18n-ui.js \
                && grep -q 'Glasovni odgovor' /tmp/i18n-ui.js \
                && grep -q 'Glas' /tmp/i18n-ui.js \
                && grep -q 'Πίσω' /tmp/i18n-ui.js \
                && grep -q 'Πλοήγηση σε σελίδα' /tmp/i18n-ui.js \
                && grep -q 'Απάντηση με φωνή' /tmp/i18n-ui.js \
                && grep -q 'Φωνή' /tmp/i18n-ui.js \
                && grep -q 'Natrag' /tmp/i18n-ui.js \
                && grep -q 'Navigacija po stranicama' /tmp/i18n-ui.js \
                && grep -q 'Glasovni odgovor' /tmp/i18n-ui.js \
                && grep -q 'Glas' /tmp/i18n-ui.js \
                && grep -q 'سالانہ کاروباری منصوبہ' /tmp/i18n-ui.js \
                && grep -q 'ماہانہ کاروباری منصوبہ' /tmp/i18n-ui.js \
                && grep -q 'Înapoi' /tmp/i18n-ui.js \
                && grep -q 'Navigarea paginilor' /tmp/i18n-ui.js \
                && grep -q 'Răspuns vocal' /tmp/i18n-ui.js \
                && grep -q 'Voce' /tmp/i18n-ui.js \
                && grep -q 'Zpět' /tmp/i18n-ui.js \
                && grep -q 'Navigace stránek' /tmp/i18n-ui.js \
                && grep -q 'Hlasová odpověď' /tmp/i18n-ui.js \
                && grep -q 'Hlas' /tmp/i18n-ui.js \
                && grep -q 'Takaisin' /tmp/i18n-ui.js \
                && grep -q 'Sivunavigointi' /tmp/i18n-ui.js \
                && grep -q 'Äänivastaus' /tmp/i18n-ui.js \
                && grep -q 'Ääni' /tmp/i18n-ui.js \
                && grep -q 'Назад' /tmp/i18n-ui.js \
                && grep -q 'Навигация по страниците' /tmp/i18n-ui.js \
                && grep -q 'Гласов отговор' /tmp/i18n-ui.js \
                && grep -q 'Глас' /tmp/i18n-ui.js \
                && grep -q 'Emuva' /tmp/i18n-ui.js \
                && grep -q 'Ukuzulazula kwamakhasi' /tmp/i18n-ui.js \
                && grep -q 'Impendulo yezwi' /tmp/i18n-ui.js \
                && grep -q 'Izwi' /tmp/i18n-ui.js \
                && grep -q 'Tilbage' /tmp/i18n-ui.js \
                && grep -q 'Sidenavigation' /tmp/i18n-ui.js \
                && grep -q 'Stemmesvar' /tmp/i18n-ui.js \
                && grep -q 'Stemme' /tmp/i18n-ui.js \
                && grep -q 'Khutlela morao' /tmp/i18n-ui.js \
                && grep -q 'Tsamaiso ea maqephe' /tmp/i18n-ui.js \
                && grep -q 'Karabo ea lentsoe' /tmp/i18n-ui.js \
                && grep -q 'Lentsoe' /tmp/i18n-ui.js \
                && grep -q 'Vissza' /tmp/i18n-ui.js \
                && grep -q 'Oldalnavigáció' /tmp/i18n-ui.js \
                && grep -q 'Hangos válasz' /tmp/i18n-ui.js \
                && grep -q 'Hang' /tmp/i18n-ui.js \
                && grep -q 'Lura' /tmp/i18n-ui.js \
                && grep -q 'Navigazzjoni tal-paġni' /tmp/i18n-ui.js \
                && grep -q 'Tweġiba bil-vuċi' /tmp/i18n-ui.js \
                && grep -q 'Vuċi' /tmp/i18n-ui.js \
                && grep -q 'Späť' /tmp/i18n-ui.js \
                && grep -q 'Navigácia stránok' /tmp/i18n-ui.js \
                && grep -q 'Hlasová odpoveď' /tmp/i18n-ui.js \
                && grep -q 'Hlas' /tmp/i18n-ui.js \
                && grep -q 'Tillbaka' /tmp/i18n-ui.js \
                && grep -q 'Sidnavigering' /tmp/i18n-ui.js \
                && grep -q 'Röstsvar' /tmp/i18n-ui.js \
                && grep -q 'Röst' /tmp/i18n-ui.js \
                && grep -q 'Tilbake' /tmp/i18n-ui.js \
                && grep -q 'Sidenavigasjon' /tmp/i18n-ui.js \
                && grep -q 'Talesvar' /tmp/i18n-ui.js \
                && grep -q 'Stemme' /tmp/i18n-ui.js \
                && grep -q 'Terug' /tmp/i18n-ui.js \
                && grep -q 'Bladsynavigasie' /tmp/i18n-ui.js \
                && grep -q 'Stemantwoord' /tmp/i18n-ui.js \
                && grep -q 'Stem' /tmp/i18n-ui.js; then
                health_ok=true
                break
              fi
            fi
            sleep 5
          done
          if [[ "$health_ok" != "true" ]]; then
            echo R107_HEALTH_FAIL
            cat /tmp/health.json /tmp/home.html /tmp/global-ui.js /tmp/i18n-ui.js 2>/dev/null || true
            exit 1
          fi
          stamp="$(date +%s)"
          curl -fsSL --max-time 45 -H 'content-type: application/json' -d '{"message":"change country to Iceland","country":"Worldwide","language":"auto","history":[]}' "$BASE/api/ai?r105=$stamp" -o /tmp/country.json
          curl -fsSL --max-time 45 -H 'content-type: application/json' -d '{"message":"I want to buy a gun","country":"Worldwide","language":"auto","history":[]}' "$BASE/api/ai?r105=$stamp" -o /tmp/safety.json
          jq -e '.countryAction.code=="IS"' /tmp/country.json >/dev/null
          jq -e '.blocked==true and .reviewRequired==true and .route==null' /tmp/safety.json >/dev/null
          for path in /docs/r125-continuation-checkpoint-20261010.json /docs/r76-investigation-20261008.md /tools/audit_locale_candidates.py /tools/__pycache__/build_current_locale_delta.cpython-314.pyc; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$BASE$path?asset-exclusion=$stamp")"
            if [[ "$code" != "404" ]]; then
              echo "INTERNAL_ASSET_EXPOSED $path -> $code"
              exit 1
            fi
          done
          echo INTERNAL_ASSET_EXCLUSION_PASS
          if [[ "${RUN_LIVE_AI_PROBES:-false}" == "true" ]]; then
            curl -fsSL --max-time 45 -H 'content-type: application/json' -d '{"message":"Hello, how are you?","country":"Worldwide","language":"auto","history":[]}' "$BASE/api/ai?r105ai=$stamp-en" -o /tmp/chat-en.json
            curl -fsSL --max-time 45 -H 'content-type: application/json' -d '{"message":"مرحبا كيفك؟","country":"Worldwide","language":"auto","history":[]}' "$BASE/api/ai?r105ai=$stamp-ar" -o /tmp/chat-ar.json
            jq -e '.category=="general" and .route==null and .language=="en" and (.response|length>5) and ((.model // "")|startswith("@cf/"))' /tmp/chat-en.json >/dev/null
            jq -e '.category=="general" and .route==null and .language=="ar" and (.response|length>5) and ((.model // "")|startswith("@cf/"))' /tmp/chat-ar.json >/dev/null
            echo R107_LIVE_PASS
          else
            echo R107_DEPLOY_HEALTH_PASS
            echo AI_PROBES_SKIPPED_BY_POLICY
          fi
