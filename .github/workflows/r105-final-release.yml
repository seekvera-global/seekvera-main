name: R105 final global release

on:
  push:
    branches: [main]
    paths:
      - 'worker*.js'
      - 'global-ui.js'
      - 'navigation.js'
      - 'i18n-ui.js'
      - 'r32-i18n.js'
      - 'games.js'
      - 'locale-r15.js'
      - 'superapp.js'
      - 'voice-ai.js'
      - 'sw.js'
      - '*.html'
      - 'i18n-r32/**'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'tools/test-*.cjs'
      - '.github/workflows/r105-final-release.yml'
  workflow_dispatch:
    inputs:
      run_live_ai_probes:
        description: 'Send country-intent plus English/Arabic Workers AI probes; this may consume the free AI allocation'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: seekvera-production-release
  cancel-in-progress: true

jobs:
  validate-deploy-certify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Validate production sources
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'docs/' .assetsignore
          grep -Fxq 'tools/' .assetsignore
          grep -Fxq '**/__pycache__/' .assetsignore
          grep -Fxq '*.py[cod]' .assetsignore
          node --check worker-r76.js
          node --check worker.js
          node --check global-ui.js
          node --check games.js
          node --check superapp.js
          node --check voice-ai.js
          node --check r31-ui-polish.js
          node tools/test-direct-voice.cjs
          node tools/test-dialect-voice.cjs
          node tools/test-tts-envelope.cjs
          node tools/test-audio-authority.cjs
          node tools/test-voice-sequence.cjs
          node --check i18n-ui.js
          node --check navigation.js
          node tools/test-locale-cognates.cjs
          node tools/test-ui-translation.cjs
          node tools/test-ui-translation-quota-session-guard.cjs
          node tools/test-ai-quota-boundary.cjs
          node tools/test-candidate-script-triage.cjs
          python tools/test-repair-candidate-reserved-identifiers.py
          node --check sw.js
          test "$(find i18n-r32 -maxdepth 1 -name '*.json' | wc -l)" -ge 98
          grep -F "const RELEASE='20261001-r125-dialect-voice-quality'" worker-r76.js
          grep -F "const VERSION='20261119-r125-global-quick-v53'" i18n-ui.js
          grep -F "'వెనక్కి'" i18n-ui.js
          grep -F "'పేజీ నావిగేషన్'" i18n-ui.js
          grep -F "'స్వరం సమాధానం'" i18n-ui.js
          grep -F "'స్వరం'" i18n-ui.js
          grep -F "'പിന്നോക്കം'" i18n-ui.js
          grep -F "'പേജ് നിയന്ത്രണം'" i18n-ui.js
          grep -F "'വോയിസ് മറുപടി'" i18n-ui.js
          grep -F "'വോയിസ്'" i18n-ui.js
          grep -F "'Назад'" i18n-ui.js
          grep -F "'Навигација на страна'" i18n-ui.js
