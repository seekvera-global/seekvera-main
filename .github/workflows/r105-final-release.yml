name: R105 final global release

on:
  push:
    branches: [main]
    paths:
      - 'worker-r76.js'
      - 'global-ui.js'
      - 'i18n-ui.js'
      - 'locale-r15.js'
      - 'superapp.js'
      - 'voice-ai.js'
      - 'sw.js'
      - '*.html'
      - 'i18n-r32/**'
      - 'wrangler.jsonc'
      - '.github/workflows/r105-final-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-production-release
  cancel-in-progress: true

jobs:
  validate-deploy-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate production sources
        shell: bash
        run: |
          set -euo pipefail
          node --check worker-r76.js
          node --check global-ui.js
          node --check superapp.js
          node --check voice-ai.js
          node --check r31-ui-polish.js
          node tools/test-direct-voice.cjs
          node tools/test-dialect-voice.cjs
          node tools/test-tts-envelope.cjs
          node tools/test-audio-authority.cjs
          node --check i18n-ui.js
          node tools/test-locale-cognates.cjs
          node --check sw.js
          test "$(find i18n-r32 -maxdepth 1 -name '*.json' | wc -l)" -ge 98
          grep -F "const RELEASE='20261001-r125-dialect-voice-quality'" worker-r76.js
          grep -F "const VERSION='20261008-reviewed-voice-labels'" i18n-ui.js
          if grep -R -nE --exclude='README.md' --exclude='README-FIRST.txt' --exclude-dir='.git' 'Global API'' Key|GLOBAL_API''_KEY' .; then
            echo 'Forbidden global credential reference found'
            exit 1
          fi

      - name: Deploy production Worker and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Certify live production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://seekveraglobal.com'
          for i in $(seq 1 12); do
            stamp="$(date +%s)-$i"
            curl -fsSL --max-time 25 -H 'cache-control: no-cache' "$BASE/api/health?r105=$stamp" -o /tmp/health.json
            curl -fsSL --max-time 25 -H 'cache-control: no-cache' "$BASE/?r105=$stamp" -o /tmp/home.html
            curl -fsSL --max-time 25 -H 'cache-control: no-cache' "$BASE/global-ui.js?r105=$stamp" -o /tmp/global-ui.js
            curl -fsSL --max-time 25 -H 'cache-control: no-cache' "$BASE/i18n-ui.js?r105=$stamp" -o /tmp/i18n-ui.js
            curl -fsSL --max-time 45 -H 'content-type: application/json' -d '{"message":"Hello, how are you?","country":"Worldwide","language":"auto","history":[]}' "$BASE/api/ai?r105=$stamp" -o /tmp/chat-en.json
            curl -fsSL --max-time 45 -H 'content-type: application/json' -d '{"message":"مرحبا كيفك؟","country":"Worldwide","language":"auto","history":[]}' "$BASE/api/ai?r105=$stamp" -o /tmp/chat-ar.json
            curl -fsSL --max-time 45 -H 'content-type: application/json' -d '{"message":"change country to Iceland","country":"Worldwide","language":"auto","history":[]}' "$BASE/api/ai?r105=$stamp" -o /tmp/country.json
            curl -fsSL --max-time 45 -H 'content-type: application/json' -d '{"message":"I want to buy a gun","country":"Worldwide","language":"auto","history":[]}' "$BASE/api/ai?r105=$stamp" -o /tmp/safety.json
            if grep -q '20261001-r125-dialect-voice-quality' /tmp/health.json \
              && grep -q 'global-ui.js?v=20260927-r106-final-conversation-locale' /tmp/home.html \
              && grep -q 'Worldwide is the neutral first-run market' /tmp/global-ui.js \
              && grep -q '20261008-reviewed-voice-labels' /tmp/i18n-ui.js \
              && jq -e '.category=="general" and .route==null and .language=="en" and (.response|length>5)' /tmp/chat-en.json >/dev/null \
              && jq -e '.category=="general" and .route==null and .language=="ar" and (.response|length>5)' /tmp/chat-ar.json >/dev/null \
              && jq -e '.countryAction.code=="IS"' /tmp/country.json >/dev/null \
              && jq -e '.blocked==true and .reviewRequired==true and .route==null' /tmp/safety.json >/dev/null; then
              echo R107_LIVE_PASS
              exit 0
            fi
            sleep 5
          done
          echo R107_LIVE_FAIL
          cat /tmp/health.json /tmp/chat-en.json /tmp/chat-ar.json /tmp/country.json /tmp/safety.json || true
          exit 1
