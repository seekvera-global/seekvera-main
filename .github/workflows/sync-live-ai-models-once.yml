name: Sync SEEKVERA current AI models once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-live-ai-models-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve current live text AI models
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          s=s.replace('const PRIMARY_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast";', 'const PRIMARY_AI_MODEL = "@cf/google/gemma-4-26b-a4b-it";')
          s=s.replace('const FALLBACK_AI_MODEL = "@cf/google/gemma-4-26b-a4b-it";', 'const FALLBACK_AI_MODEL = "@cf/zai-org/glm-4.7-flash";')
          p.write_text(s)
          PY
          node --check worker.js
          grep -q '@cf/google/gemma-4-26b-a4b-it' worker.js
          grep -q '@cf/zai-org/glm-4.7-flash' worker.js
          grep -q '@cf/meta/llama-3.2-11b-vision-instruct' worker.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- worker.js; then exit 0; fi
          git add worker.js
          git commit -m 'Preserve current AI models with Safety Gate v2'
          git push origin HEAD:main
