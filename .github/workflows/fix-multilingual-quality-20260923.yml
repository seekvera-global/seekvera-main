name: Fix SEEKVERA multilingual language lock quality

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-multilingual-quality-20260923.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Improve difficult-language routing and exact-answer compliance
        shell: python
        run: |
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const RELEASE='2026-09-23-ai-media-r2'","const RELEASE='2026-09-23-ai-media-r3'",1)
          old="quality=/LANGUAGE LOCK:.*\\b(Japanese|Urdu|Persian|Yoruba|Hausa|Igbo|Amharic|Bengali|Thai|Swahili|Filipino)\\b/i.test(all);const order=/Safety Gate|moderation|safety review/i.test(first)?[PRIMARY,FALLBACK,LIGHT,FASTCHAT]:quality?[PRIMARY,LIGHT,FALLBACK,FASTCHAT]:[FASTCHAT,FALLBACK,LIGHT,PRIMARY]"
          new="quality=/LANGUAGE LOCK:.*\\b(Japanese|Urdu|Persian|Yoruba|Hausa|Igbo|Amharic|Bengali|Thai|Swahili|Filipino)\\b/i.test(all);const order=/Safety Gate|moderation|safety review/i.test(first)?[PRIMARY,FALLBACK,LIGHT,FASTCHAT]:quality?[FALLBACK,PRIMARY,LIGHT,FASTCHAT]:[FASTCHAT,FALLBACK,LIGHT,PRIMARY]"
          if old not in s: raise SystemExit('quality routing anchor missing')
          s=s.replace(old,new,1)
          old="Do not translate into English or any third language. If the user explicitly asks inside the message for a different reply language, follow that explicit request instead."
          new="Do not translate into English or any third language. If the user asks for an exact word, phrase or format, reproduce it exactly without adding unrelated text. If the user explicitly asks inside the message for a different reply language, follow that explicit request instead."
          if old not in s: raise SystemExit('language lock exact-answer anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate patched runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          grep -q "2026-09-23-ai-media-r3" worker.js
          grep -Fq "quality?[FALLBACK,PRIMARY,LIGHT,FASTCHAT]" worker.js
          grep -q "reproduce it exactly" worker.js
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SEEKVERA automation'
          git config user.email 'actions@users.noreply.github.com'
          git add worker.js
          if ! git diff --cached --quiet; then
            git commit -m 'Improve difficult-language AI quality and exact answers'
            git push origin HEAD:main
          fi
