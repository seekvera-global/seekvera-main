name: R76 final static-first deploy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r76-bridge-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate R76 static-first production config
        run: |
          set -euo pipefail
          node --check worker-r76.js
          grep -F '"main": "./worker-r76.js"' wrangler.jsonc
          grep -F '"run_worker_first": ["/api/*"]' wrangler.jsonc
          grep -F 'single-structured-multilingual-ai' worker-r76.js
          echo R76_STATIC_FIRST_CONFIG_PASS
      - name: Deploy R76 static-first production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify static homepage bypasses Worker quota
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code="$(curl -L -sS --max-time 15 -o /tmp/home -w '%{http_code}' -A 'Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' "https://seekveraglobal.com/?r76static=$i" || true)"
            echo "STATIC_PROBE $i status=$code bytes=$(wc -c </tmp/home 2>/dev/null || echo 0)"
            if [ "$code" = "200" ] && grep -qi 'SEEKVERA' /tmp/home; then
              echo R76_STATIC_HOMEPAGE_PASS
              exit 0
            fi
            sleep 2
          done
          echo R76_STATIC_HOMEPAGE_NOT_READY
          exit 1
