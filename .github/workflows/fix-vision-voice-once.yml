name: Fix SEEKVERA Vision and voice once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vision-voice-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Vision runtime and voice clarity
        shell: python
        run: |
          from pathlib import Path

          p=Path('worker.js')
          s=p.read_text(encoding='utf-8')

          old="async function vision(env,image,ctx=''){const im=img(image);if(im.error)return{status:400,result:{ok:false,error:im.error}};if(!env.AI)return{status:200,result:{ok:true,allowed:false,reviewRequired:true,reason:'vision_ai_unavailable_hold',source:'fail-closed'}};try{const p='You are SEEKVERA image Safety Gate. BLOCK prohibited goods, weapons/explosives, explicit sexual imagery, controlled drugs, fake identity/payment documents, extremist material, exposed credentials or clearly illegal content. REVIEW ambiguous, suspicious or privacy-sensitive images. Do not identify private people. ALLOW ordinary lawful products, places, property, vehicles, hotels, food and services. Return exactly ALLOW|safe, REVIEW|reason or BLOCK|reason.';const r=await env.AI.run(VISION,{messages:[{role:'system',content:p},{role:'user',content:clean(ctx,1500)||'Review this image.'}],image:im.value,max_tokens:100,temperature:0},{rejectIfBusy:true});return{status:200,result:parsed(out(r),VISION,'ai-vision')}}catch{return{status:200,result:{ok:true,allowed:false,reviewRequired:true,reason:'vision_moderation_unavailable_hold',source:'fail-closed'}}}}"
          new="async function runVision(env,input){try{return await env.AI.run(VISION,input)}catch(e){const m=clean(e?.message||e,500);if(/5016|agreement|license|acceptable use/i.test(m)){await env.AI.run(VISION,{prompt:'agree'});return await env.AI.run(VISION,input)}throw e}}\nasync function vision(env,image,ctx=''){const im=img(image);if(im.error)return{status:400,result:{ok:false,error:im.error}};if(!env.AI)return{status:200,result:{ok:true,allowed:false,reviewRequired:true,reason:'vision_ai_unavailable_hold',source:'fail-closed'}};try{const p='You are SEEKVERA image Safety Gate. BLOCK prohibited goods, weapons/explosives, explicit sexual imagery, controlled drugs, fake identity/payment documents, extremist material, exposed credentials or clearly illegal content. REVIEW ambiguous, suspicious or privacy-sensitive images. Do not identify private people. ALLOW ordinary lawful products, places, property, vehicles, hotels, food and services. Return exactly ALLOW|safe, REVIEW|reason or BLOCK|reason.';const r=await runVision(env,{messages:[{role:'system',content:p},{role:'user',content:clean(ctx,1500)||'Review this image.'}],image:im.value,max_tokens:100,temperature:0});return{status:200,result:parsed(out(r),VISION,'ai-vision')}}catch(e){const m=clean(e?.message||e,500);return{status:200,result:{ok:true,allowed:false,reviewRequired:true,reason:/3036|daily free allocation/i.test(m)?'vision_daily_free_ai_limit':/3040|capacity temporarily exceeded/i.test(m)?'vision_capacity_busy':/5016|agreement|license/i.test(m)?'vision_model_agreement_required':'vision_moderation_unavailable_hold',source:'fail-closed'}}}}"
          if old not in s:
              raise SystemExit('Expected vision() function not found; refusing unsafe patch')
          s=s.replace(old,new,1)

          old2="const r=await env.AI.run(VISION,{messages:[{role:'system',content:p},{role:'user',content:'Classify this safe image.'}],image:String(b.image),max_tokens:110,temperature:0},{rejectIfBusy:true}),a=out(r).split('|').map(x=>clean(x,250));"
          new2="const r=await runVision(env,{messages:[{role:'system',content:p},{role:'user',content:'Classify this safe image.'}],image:String(b.image),max_tokens:110,temperature:0}),a=out(r).split('|').map(x=>clean(x,250));"
          if old2 not in s:
              raise SystemExit('Expected visual-search model call not found; refusing unsafe patch')
          s=s.replace(old2,new2,1)

          oldp="const c=category(m),p='You are SEEKVERA AI in a premium worldwide marketplace, travel, connectivity and business platform. Reply in the user language. Understand cross-border intent. Help search, compare, translate and route. Never invent live prices, availability, inventory, bookings, jobs, verification, Wi-Fi access, eSIM coverage, phone compatibility, affiliate relationships, company replies or deal status. Travel eSIM is mobile data, not Wi-Fi. For visa/legal/medical/current rules tell users to check official current sources. Never request passwords, OTP, PIN or CVV. Paid actions need owner notice; payment, bank changes, guarantees and binding contracts need owner approval.';"
          newp="const c=category(m),p='You are SEEKVERA AI in a premium worldwide marketplace, travel, connectivity and business platform. Reply in the user language. Understand cross-border intent. Help search, compare, translate and route. Never invent live prices, availability, inventory, bookings, jobs, verification, Wi-Fi access, eSIM coverage, phone compatibility, affiliate relationships, company replies or deal status. Travel eSIM is mobile data, not Wi-Fi. For visa/legal/medical/current rules tell users to check official current sources. Never request passwords, OTP, PIN or CVV. Paid actions need owner notice; payment, bank changes, guarantees and binding contracts need owner approval.'+(b.voice?' Voice mode: answer as short natural spoken sentences in the requested language. Do not use markdown, bullet symbols, tables, raw URLs or hard-to-pronounce abbreviations.':'');"
          if oldp not in s:
              raise SystemExit('Expected AI system prompt not found; refusing unsafe patch')
          s=s.replace(oldp,newp,1)

          s=s.replace("aiResilience:'queued-three-model-v1',safetyGateVersion:'2026-09-22-v3'","aiResilience:'queued-three-model-v1',visionRuntime:'license-aware-v2',voiceRuntime:'plain-speech-v2',safetyGateVersion:'2026-09-22-v3'",1)
          p.write_text(s,encoding='utf-8')

          v=Path('voice-ai.js')
          t=v.read_text(encoding='utf-8')
          t=t.replace("body:JSON.stringify({message:clean,country:currentCountry(),language:languageName()})","body:JSON.stringify({message:clean,country:currentCountry(),language:languageName(),voice:true})",1)

          old_detect="function detectSpeechLocale(text){\n  const t=String(text||'');\n  if(/[\\u0600-\\u06FF]/.test(t))return /[\\u0750-\\u077F]/.test(t)?'ur-PK':'ar-SA';"
          new_detect="function detectSpeechLocale(text){\n  const t=String(text||'');\n  const selected=currentLocale();\n  if(/[\\u0600-\\u06FF]/.test(t)){const b=selected.split('-')[0].toLowerCase();return ['ar','fa','ur'].includes(b)?selected:'ar-SA';}"
          if old_detect not in t:
              raise SystemExit('Expected speech locale detector not found')
          t=t.replace(old_detect,new_detect,1)

          old_speak="function speak(text,locale){\n  lastAnswer=String(text||''); lastLang=locale||detectSpeechLocale(text); if(muted||!lastAnswer||!('speechSynthesis'in window))return;\n  stopSpeech();\n  const u=new SpeechSynthesisUtterance(lastAnswer.replace(/https?:\\/\\/\\S+/g,'').slice(0,2200));\n  u.lang=lastLang; const v=pickVoice(lastLang); if(v)u.voice=v; u.rate=1; u.pitch=1;\n  speechSynthesis.speak(u);\n}"
          new_speak="function spokenText(text){return String(text||'').replace(/```[\\s\\S]*?```/g,' ').replace(/https?:\\/\\/\\S+/g,' ').replace(/[*_#>`~|]/g,' ').replace(/(?:^|\\s)[•▪◦◆◇▶►]+/g,' ').replace(/\\s+/g,' ').trim()}\nfunction speechChunks(text,max=220){const s=spokenText(text);if(!s)return[];const parts=s.split(/(?<=[.!?؟。！？])\\s+/);const out=[];let cur='';for(const part of parts){if((cur+' '+part).trim().length<=max)cur=(cur+' '+part).trim();else{if(cur)out.push(cur);if(part.length<=max)cur=part;else{for(let i=0;i<part.length;i+=max)out.push(part.slice(i,i+max));cur=''}}}if(cur)out.push(cur);return out}\nfunction speak(text,locale){\n  lastAnswer=String(text||''); lastLang=locale||detectSpeechLocale(text); if(muted||!lastAnswer||!('speechSynthesis'in window))return;\n  stopSpeech();\n  const chunks=speechChunks(lastAnswer).slice(0,12);let i=0;\n  const next=()=>{if(muted||i>=chunks.length)return;const u=new SpeechSynthesisUtterance(chunks[i++]);u.lang=lastLang;const v=pickVoice(lastLang);if(v)u.voice=v;u.rate=/^(ar|fa|ur)(-|$)/i.test(lastLang)?.90:.94;u.pitch=1;u.onend=next;u.onerror=()=>{};speechSynthesis.speak(u)};\n  next();\n}"
          if old_speak not in t:
              raise SystemExit('Expected speak() function not found')
          t=t.replace(old_speak,new_speak,1)
          v.write_text(t,encoding='utf-8')

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          node --check voice-ai.js
          grep -q "visionRuntime:'license-aware-v2'" worker.js
          grep -q "voiceRuntime:'plain-speech-v2'" worker.js
          grep -q "prompt:'agree'" worker.js
          grep -q "voice:true" voice-ai.js
          grep -q "function speechChunks" voice-ai.js

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- worker.js voice-ai.js; then
            echo 'Vision and voice repair already applied.'
            exit 0
          fi
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add worker.js voice-ai.js
          git commit -m 'Fix Vision runtime and improve voice clarity'
          git push
