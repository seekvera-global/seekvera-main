name: Fix visible AI chat and response speed once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-chat-speed-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Patch visible chat and fast path
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='<div class="sv-search-note">AI does not invent live prices, availability, verification, jobs, Wi‑Fi access or company replies. Use provider/source links for live confirmation.</div><div class="sv-ai-panel" id="aiResult"><h3>SEEKVERA AI</h3><div class="sv-ai-answer" id="aiAnswer"></div><div class="sv-ai-actions" id="aiActions"></div></div>'
          new='<div class="sv-search-note">AI does not invent live prices, availability, verification, jobs, Wi‑Fi access or company replies. Use provider/source links for live confirmation.</div>\n<div class="sv-chat-card" id="aiChat" aria-label="SEEKVERA AI Chat"><div class="sv-chat-head"><b>✨ SEEKVERA AI Chat</b><span>● Online</span></div><div class="sv-chat-messages" id="aiMessages" aria-live="polite"><div class="ai-msg bot">Hi. Ask me anything, type below, or use the microphone.</div></div><form class="sv-chat-form" id="aiChatForm"><input id="aiChatInput" autocomplete="off" maxlength="1800" placeholder="Chat with SEEKVERA AI…" aria-label="Chat with SEEKVERA AI"><button id="aiChatMic" type="button" aria-label="Speak to SEEKVERA AI">🎤</button><button class="send" type="submit">Send</button></form><div class="sv-ai-actions" id="aiActions"></div></div>\n<div class="sv-ai-panel" id="aiResult" hidden><div class="sv-ai-answer" id="aiAnswer"></div></div>'
          if old in s: s=s.replace(old,new,1)
          elif 'id="aiChatForm"' not in s: raise SystemExit('home AI block not found')
          s=s.replace('premium.css?v=20260922-premium-r1','premium.css?v=20260922-chatfast2').replace('superapp.js?v=20260922-premium-r1','superapp.js?v=20260922-chatfast2').replace('voice-ai.js?v=20260922-premium-r1','voice-ai.js?v=20260922-chatfast2')
          p.write_text(s,encoding='utf-8')

          p=Path('premium.css'); s=p.read_text(encoding='utf-8'); marker='/* SEEKVERA visible AI chat fast v2 */'
          css='\n\n'+marker+'\n.sv-chat-card{margin-top:14px;background:#fff;color:#142033;border:1px solid #dfe5eb;border-radius:20px;box-shadow:0 12px 35px rgba(0,0,0,.14);overflow:hidden}.sv-chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;background:#10243e;color:#fff}.sv-chat-head span{font-size:12px;color:#72e1b5;font-weight:800}.sv-chat-messages{display:flex;flex-direction:column;gap:9px;max-height:310px;min-height:104px;overflow:auto;padding:14px;background:#f7f9fb;scroll-behavior:smooth}.sv-chat-messages .ai-msg{max-width:88%;padding:10px 12px;border-radius:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.sv-chat-messages .ai-msg.bot{align-self:flex-start;background:#fff;border:1px solid #e0e7ef}.sv-chat-messages .ai-msg.user{align-self:flex-end;background:#dff7ec}.sv-chat-messages .ai-msg.thinking{opacity:.7}.sv-chat-form{display:grid;grid-template-columns:minmax(0,1fr) 48px auto;gap:8px;padding:11px;background:#fff;border-top:1px solid #e6ebf0}.sv-chat-form input{min-width:0;border:1px solid #cfd8e3;border-radius:12px;padding:12px;font:inherit;color:#142033;background:#fff}.sv-chat-form button{border:0;border-radius:12px;padding:0 14px;font-weight:800;cursor:pointer}.sv-chat-form #aiChatMic{font-size:20px;background:#eef3f8}.sv-chat-form .send{background:#16b978;color:#fff}.sv-chat-card .sv-ai-actions{padding:0 11px 11px;display:flex;gap:7px;flex-wrap:wrap}.sv-chat-card .sv-ai-actions a{font-size:12px;text-decoration:none;border-radius:9px;padding:7px 9px;background:#eef3f8;color:#142033;font-weight:700}@media(max-width:560px){.sv-chat-card{border-radius:16px}.sv-chat-messages{max-height:280px}.sv-chat-form{grid-template-columns:minmax(0,1fr) 44px auto;padding:9px}.sv-chat-form button{padding:0 11px}}\n'
          if marker not in s: s+=css
          p.write_text(s,encoding='utf-8')

          p=Path('superapp.js'); s=p.read_text(encoding='utf-8')
          old="async function askAI(q){q=clean(q,1800);if(!q)return;const panel=$('#aiResult'),ans=$('#aiAnswer'),actions=$('#aiActions');panel?.classList.add('open');if(ans)ans.textContent=tr('thinking');if(actions)actions.innerHTML='';const cat=categoryFor(q),country=selectedCountryName();try{const r=await fetch(api('/api/ai'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:q,country,language:lang(),scope:scope()})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.response)throw new Error(d.error||'AI unavailable');if(ans)ans.textContent=d.response;if(actions)actions.innerHTML=actionLinks(d.category||cat,q)}catch(e){if(ans)ans.textContent='SEEKVERA AI is temporarily unavailable. You can still open the matching section below.';if(actions)actions.innerHTML=actionLinks(cat,q)}}"
          new="function chatAdd(role,text,extra=''){const msgs=$('#aiMessages');if(!msgs)return null;const m=document.createElement('div');m.className=`ai-msg ${role}${extra?' '+extra:''}`;m.textContent=String(text||'');msgs.appendChild(m);msgs.scrollTop=msgs.scrollHeight;return m}\nasync function askAI(q){q=clean(q,1800);if(!q)return;const ans=$('#aiAnswer'),actions=$('#aiActions');if(actions)actions.innerHTML='';chatAdd('user',q);const pending=chatAdd('bot',tr('thinking'),'thinking');const cat=categoryFor(q),country=selectedCountryName();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),22000);try{const r=await fetch(api('/api/ai'),{method:'POST',headers:{'content-type':'application/json'},signal:controller.signal,body:JSON.stringify({message:q,country,language:lang(),scope:scope(),fast:true})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.response)throw new Error(d.error||'AI unavailable');if(pending){pending.textContent=d.response;pending.classList.remove('thinking')}if(ans)ans.textContent=d.response;if(actions)actions.innerHTML=actionLinks(d.category||cat,q)}catch(e){const msg=e?.name==='AbortError'?'SEEKVERA AI is taking too long. Please try again.':'SEEKVERA AI is temporarily unavailable. Please try again.';if(pending){pending.textContent=msg;pending.classList.remove('thinking')}if(ans)ans.textContent=msg;if(actions)actions.innerHTML=actionLinks(cat,q)}finally{clearTimeout(timer)}}"
          if old in s: s=s.replace(old,new,1)
          elif 'function chatAdd(' not in s: raise SystemExit('askAI not found')
          anchor="function bindVoiceButton(){const b=$('#heroVoice');if(!b)return;b.addEventListener('click',()=>{const fab=$('#svVoiceFab');if(fab)fab.click();else window.dispatchEvent(new CustomEvent('seekvera:voice'))})}\n"
          bind="function bindAIChat(){const f=$('#aiChatForm'),i=$('#aiChatInput');if(f&&i)f.addEventListener('submit',e=>{e.preventDefault();const q=i.value.trim();if(!q)return;i.value='';askAI(q)});$('#aiChatMic')?.addEventListener('click',()=>{const fab=$('#svVoiceFab');if(fab)fab.click();else $('#heroVoice')?.click()})}\n"
          if 'function bindAIChat()' not in s:
              if anchor not in s: raise SystemExit('voice anchor not found')
              s=s.replace(anchor,anchor+bind,1)
          s=s.replace('bindSearch();bindVoiceButton();bindVisual();','bindSearch();bindVoiceButton();bindAIChat();bindVisual();',1)
          p.write_text(s,encoding='utf-8')

          p=Path('voice-ai.js'); s=p.read_text(encoding='utf-8').replace('for(let attempt=1;attempt<=3;attempt++){','for(let attempt=1;attempt<=2;attempt++){',1).replace('700*attempt','250*attempt',1).replace('language:languageName(),voice:true','language:languageName(),voice:true,fast:true',1); p.write_text(s,encoding='utf-8')

          p=Path('worker.js'); s=p.read_text(encoding='utf-8')
          old="async function ai(env,messages,max=320,temp=.2){const errors=[];for(const model of [PRIMARY,FALLBACK,LIGHT]){"
          new="async function ai(env,messages,max=320,temp=.2){const errors=[];const first=String(messages?.[0]?.content||'');const order=/Safety Gate|moderation|safety review/i.test(first)?[PRIMARY,FALLBACK,LIGHT]:[FALLBACK,LIGHT,PRIMARY];for(const model of order){"
          if old in s: s=s.replace(old,new,1)
          elif 'const order=/Safety Gate|moderation|safety review/i' not in s: raise SystemExit('AI order not found')
          s=s.replace("aiResilience:'queued-three-model-v1'","aiResilience:'fast-chat-glm-first-v2'",1)
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r"const CACHE='[^']+';","const CACHE='seekvera-chatfast-v2-20260922';",s,count=1); p.write_text(s,encoding='utf-8')

      - name: Validate repaired app
        shell: bash
        run: |
          set -euo pipefail
          node --check superapp.js
          node --check voice-ai.js
          node --check worker.js
          grep -q 'id="aiChatForm"' index.html
          grep -q 'id="aiMessages"' index.html
          grep -q 'function bindAIChat' superapp.js
          grep -q 'fast-chat-glm-first-v2' worker.js
          grep -q 'seekvera-chatfast-v2-20260922' sw.js
          grep -q 'SEEKVERA visible AI chat fast v2' premium.css

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html premium.css superapp.js voice-ai.js worker.js sw.js; then echo 'Already applied'; exit 0; fi
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add index.html premium.css superapp.js voice-ai.js worker.js sw.js
          git commit -m 'Show AI chat and prioritize faster responses'
          git push
