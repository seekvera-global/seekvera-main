name: R10 one-shot source cleanup hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r10-source-cleanup-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final R10 source fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # Physically keep only one complete departments/categories section.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<nav class="r8-department-strip"[^>]*>.*?</nav>\s*','',s,count=1,flags=re.S)
          s=re.sub(r'<aside class="r5-left"[^>]*>.*?</aside>\s*','',s,count=1,flags=re.S)
          if s.count('id="categories"') != 1: raise SystemExit('home must contain exactly one categories section')
          if 'r8-department-strip' in s or 'class="r5-left"' in s: raise SystemExit('duplicate category source still present')

          # Keep business onboarding visible inside that same single grid, not in a new row/section.
          if 'href="seller-plans.html"' not in s:
              promo='<a class="r5-tile" href="seller-plans.html"><div class="r5-thumb">🚀</div><div class="r5-tile-body"><b>Promote / Business</b><small>Business plans and promotion</small></div></a>'
              m=re.search(r'(<a class="r5-tile" href="scan\.html">.*?</a>)(</div>\s*</section>)',s,re.S)
              if not m: raise SystemExit('home categories closing anchor missing')
              s=s[:m.end(1)]+promo+s[m.end(1):]
          p.write_text(s,encoding='utf-8')

          # Mobile categories carousel: reset old explicit columns before column auto-flow.
          p=Path('home-marketplace-r5.css')
          s=p.read_text(encoding='utf-8')
          old='body.sv-home-global .r5-grid{display:grid!important;grid-template-rows:repeat(2,108px)!important;grid-auto-flow:column;grid-auto-columns:minmax(132px,42vw);'
          new='body.sv-home-global .r5-grid{display:grid!important;grid-template-columns:none!important;grid-template-rows:repeat(2,108px)!important;grid-auto-flow:column;grid-auto-columns:minmax(132px,42vw);'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('mobile grid anchor missing')
          p.write_text(s,encoding='utf-8')

          # Dhivehi must be RTL in the dynamic UI translation layer too.
          p=Path('i18n-ui.js')
          s=p.read_text(encoding='utf-8')
          m=re.search(r"const RTL=new Set\(\[([^\]]*)\]\)",s)
          if not m: raise SystemExit('i18n RTL set missing')
          vals=[x.strip().strip("'\"") for x in m.group(1).split(',') if x.strip()]
          if 'dv' not in vals:
              vals.append('dv')
              repl="const RTL=new Set(["+','.join(repr(x) for x in vals)+'])'
              s=s[:m.start()]+repl+s[m.end():]
          p.write_text(s,encoding='utf-8')

          idx=Path('index.html').read_text(encoding='utf-8')
          css=Path('home-marketplace-r5.css').read_text(encoding='utf-8')
          ii=Path('i18n-ui.js').read_text(encoding='utf-8')
          assert idx.count('id="categories"')==1
          assert 'r8-department-strip' not in idx and 'class="r5-left"' not in idx
          assert 'href="seller-plans.html"' in idx
          assert 'grid-template-columns:none!important;grid-template-rows:repeat(2,108px)!important' in css
          assert "'dv'" in re.search(r"const RTL=new Set\(\[([^\]]*)\]\)",ii).group(1)
          print('R10 final source cleanup + business route PASS')
          PY
          node --check i18n-ui.js
          git diff --check
      - name: Commit site source fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html home-marketplace-r5.css i18n-ui.js
          git commit -m 'R10: add business promotion route to single departments grid'
          git push origin HEAD:main
