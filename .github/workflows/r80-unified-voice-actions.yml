name: R82 reply-before-navigation release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r80-unified-voice-actions.yml'
      - 'worker-r76.js'
      - 'wrangler.jsonc'
      - 'index.html'
      - 'r24-ai-controller.js'
      - 'voice-ai.js'
      - 'superapp.js'
      - 'r31-ui-polish.js'
      - 'sw.js'
  workflow_dispatch:

concurrency:
  group: seekvera-r82-production
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify R82 source
        shell: bash
        run: |
          set -euo pipefail
          node --check worker-r76.js
          node --check r24-ai-controller.js
          node --check voice-ai.js
          node --check superapp.js
          node --check r31-ui-polish.js
          grep -F '20260927-r82-reply-before-navigation' index.html
          grep -F "let best = \"general\"" superapp.js
          grep -F 'conversationOnly' worker-r76.js
          grep -F 'VOICE_MAX_MS=30000' voice-ai.js
          grep -F 'mergeTranscript' voice-ai.js
          grep -F 'compactScript' r24-ai-controller.js
          grep -F 'navigateAfterReply' superapp.js
          grep -F 'explicitNavigationRequest' superapp.js
          grep -F 'ANY country in the world' worker-r76.js

      - name: Deploy R82 to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live R82
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            stamp="$(date +%s)-$i"
            curl -LsS --max-time 20 -H 'Cache-Control: no-cache' "https://seekveraglobal.com/?r82=$stamp" -o /tmp/home
            curl -LsS --max-time 20 -H 'Cache-Control: no-cache' "https://seekveraglobal.com/voice-ai.js?r82=$stamp" -o /tmp/voice
            curl -LsS --max-time 20 -H 'Cache-Control: no-cache' "https://seekveraglobal.com/r24-ai-controller.js?r82=$stamp" -o /tmp/control
            curl -LsS --max-time 20 -H 'Cache-Control: no-cache' "https://seekveraglobal.com/superapp.js?r82=$stamp" -o /tmp/app
            curl -LsS --max-time 20 -H 'Cache-Control: no-cache' "https://seekveraglobal.com/api/health?r82=$stamp" -o /tmp/health
            curl -LsS --max-time 25 -H 'Content-Type: application/json' -d '{"message":"how are you","country":"Worldwide","history":[]}' "https://seekveraglobal.com/api/ai?r82=$stamp" -o /tmp/chat
            curl -LsS --max-time 25 -H 'Content-Type: application/json' -d '{"message":"把应用切换到巴西","country":"Worldwide","history":[],"clientControls":{"country":"BR"}}' "https://seekveraglobal.com/api/ai?r82=$stamp" -o /tmp/country
            if grep -q '20260927-r82-reply-before-navigation' /tmp/home \
              && grep -q 'VOICE_MAX_MS=30000' /tmp/voice \
              && grep -q 'compactScript' /tmp/control \
              && grep -q 'explicitNavigationRequest' /tmp/app \
              && jq -e '.r81 == true and .r81Routing == "explicit-intent-only"' /tmp/health >/dev/null \
              && jq -e '.category == "general" and (.response | length > 2)' /tmp/chat >/dev/null \
              && jq -e '.countryAction.code == "BR"' /tmp/country >/dev/null; then
              echo R82_LIVE_PASS
              exit 0
            fi
            sleep 3
          done
          echo R82_LIVE_FAIL
          exit 1
