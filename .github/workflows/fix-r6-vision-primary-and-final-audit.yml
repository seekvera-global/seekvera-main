name: Fix R6 Vision and Final Device Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-r6-vision-primary-and-final-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seekvera-r6-vision-final
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch Vision to licensed Gemma with multimodal fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('worker.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("VISION='@cf/meta/llama-3.2-11b-vision-instruct'","VISION='@cf/google/gemma-4-26b-a4b-it',VISION_FALLBACK='@cf/qwen/qwen3.8-27b'",1)
          pat=r"async function runVision\(env,input\)\{.*?\}\nasync function vision"
          replacement="""async function runVision(env,input){
 const errors=[],image=input?.image,messages=Array.isArray(input?.messages)?input.messages:[];
 const multimodal=(model)=>{const mm=messages.map(m=>({...m}));let i=-1;for(let n=mm.length-1;n>=0;n--)if(mm[n]?.role==='user'){i=n;break}if(i<0){mm.push({role:'user',content:'Review this image.'});i=mm.length-1}const text=typeof mm[i].content==='string'?mm[i].content:'Review this image.';mm[i]={...mm[i],content:[{type:'text',text},{type:'image_url',image_url:{url:image}}]};return env.AI.run(model,{messages:mm,max_completion_tokens:Math.min(Number(input?.max_tokens)||140,220),temperature:Number(input?.temperature)||0})};
 if(image){
  try{return await multimodal(VISION)}catch(e){errors.push(VISION+':multimodal:'+clean(e?.message||e,220))}
  try{return await env.AI.run(VISION,{messages,image,max_completion_tokens:Math.min(Number(input?.max_tokens)||140,220),temperature:Number(input?.temperature)||0})}catch(e){errors.push(VISION+':image:'+clean(e?.message||e,220))}
  try{return await multimodal(VISION_FALLBACK)}catch(e){errors.push(VISION_FALLBACK+':multimodal:'+clean(e?.message||e,220))}
 }
 try{return await env.AI.run(VISION,{...input,max_completion_tokens:Math.min(Number(input?.max_tokens)||140,220)})}catch(e){errors.push(VISION+':plain:'+clean(e?.message||e,220))}
 throw Error(errors.join(' | '))
}
async function vision"""
          s2,n=re.subn(pat,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('runVision patch target not found')
          p.write_text(s2,encoding='utf-8')
          PY
          node --check worker.js
          grep -q "VISION='@cf/google/gemma-4-26b-a4b-it'" worker.js
          grep -q "VISION_FALLBACK='@cf/qwen/qwen3.8-27b'" worker.js

      - name: Commit worker Vision fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'seekvera-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add worker.js
          git diff --cached --quiet || git commit -m 'Use Gemma Vision with Qwen multimodal fallback'
          git push origin main

      - name: Deploy fixed Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx -y wrangler@4 deploy

      - name: Verify live Visual Search actually clears a safe image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,struct,zlib,binascii,json,urllib.request,time
          w=h=96
          # Solid blue RGBA test image, clearly ordinary/safe.
          raw=b''.join(b'\x00'+b'\x22\x88\xdd\xff'*w for _ in range(h))
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',binascii.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          image='data:image/png;base64,'+base64.b64encode(png).decode()
          H={'Content-Type':'application/json','User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 19_0 like Mac OS X) AppleWebKit/605.1.15 Version/19.0 Mobile/15E148 Safari/604.1','Origin':'https://seekveraglobal.com','Referer':'https://seekveraglobal.com/'}
          body=json.dumps({'image':image,'country':'Worldwide','language':'English','context':'A plain safe blue test image. Describe it briefly.'}).encode()
          last={}
          for attempt in range(5):
            try:
              req=urllib.request.Request('https://seekveraglobal.com/api/visual-search',data=body,headers=H,method='POST')
              with urllib.request.urlopen(req,timeout=100) as r: d=json.loads(r.read().decode())
              last=d; print('VISUAL TRY',attempt+1,json.dumps(d,ensure_ascii=False)[:500],flush=True)
              if d.get('ok') and d.get('allowed') is True and d.get('reviewRequired') is False and d.get('summary'):
                print('LIVE VISUAL SEARCH FULL PASS',d.get('model'),d.get('summary')[:120]); break
            except Exception as e: last={'error':repr(e)}; print(last,flush=True)
            time.sleep(5)
          else: raise SystemExit('Visual Search still not fully usable: '+str(last)[:700])
          PY

      - name: Verify real server speech recognition
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq espeak >/dev/null
          espeak -w /tmp/seekvera.wav 'hello seekvera' >/dev/null 2>&1
          python3 - <<'PY'
          import base64,json,urllib.request
          audio='data:audio/wav;base64,'+base64.b64encode(open('/tmp/seekvera.wav','rb').read()).decode()
          H={'Content-Type':'application/json','User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36','Origin':'https://seekveraglobal.com','Referer':'https://seekveraglobal.com/'}
          req=urllib.request.Request('https://seekveraglobal.com/api/transcribe',data=json.dumps({'audio':audio,'language':'English'}).encode(),headers=H,method='POST')
          with urllib.request.urlopen(req,timeout=100) as r: d=json.loads(r.read().decode())
          text=str(d.get('text','')).strip()
          if not d.get('ok') or not text: raise SystemExit('ASR failed '+str(d)[:300])
          print('REAL SERVER ASR PASS:',text)
          PY

      - name: Cross-device Android iPhone iPad Chrome Firefox audit
        shell: bash
        run: |
          set -euo pipefail
          npm i --no-save playwright@1.58.2 >/dev/null 2>&1
          npx playwright install chromium webkit firefox >/dev/null 2>&1
          cat > /tmp/audit.cjs <<'JS'
          const {chromium,webkit,firefox}=require('playwright');
          (async()=>{
           const profiles=[['Android Chrome',chromium,{viewport:{width:360,height:800}}],['iPhone Safari',webkit,{viewport:{width:390,height:844}}],['iPad Safari',webkit,{viewport:{width:820,height:1180}}],['Desktop Chrome Edge',chromium,{viewport:{width:1366,height:768}}],['Desktop Firefox',firefox,{viewport:{width:1366,height:768}}]];
           for(const [name,engine,opt] of profiles){
            const b=await engine.launch({headless:true}),c=await b.newContext(opt),p=await c.newPage();
            await p.goto('https://seekveraglobal.com/?r6-final-device=1',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1800);
            const base=await p.evaluate(()=>({release:document.body.dataset.release||'',countries:document.querySelector('#country')?.options.length||0,languages:document.querySelector('#lang')?.options.length||0,tiles:document.querySelectorAll('.r5-tile').length,media:!!document.querySelector('a[href="media.html"]'),chat:!!document.querySelector('#aiChat'),mic:!!document.querySelector('#aiChatMic'),camera:!!document.querySelector('#aiChatCamera'),speaker:!!document.querySelector('#aiChatSpeaker'),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
            if(base.release!=='20260923-final-market-r6'||base.countries<249||base.languages!==29||base.tiles<16||!base.media||!base.chat||!base.mic||!base.camera||!base.speaker||base.overflow>4) throw Error(name+' base '+JSON.stringify(base));
            await p.selectOption('#lang','pt');await p.waitForTimeout(4600);const pt=await p.evaluate(()=>({intro:document.querySelector('#aiMessages .ai-msg.bot')?.textContent||'',toggle:document.querySelector('.sv-request-toggle')?.textContent||'',dir:document.documentElement.dir}));if(!/assistente/i.test(pt.intro)||/[\u0600-\u06ff]/.test(pt.toggle)||pt.dir==='rtl')throw Error(name+' pt '+JSON.stringify(pt));
            await p.selectOption('#lang','en');await p.waitForTimeout(900);const en=await p.evaluate(()=>({intro:document.querySelector('#aiMessages .ai-msg.bot')?.textContent||'',toggle:document.querySelector('.sv-request-toggle')?.textContent||'',dir:document.documentElement.dir}));if(/[\u0600-\u06ff]/.test(en.toggle)||!/SEEKVERA AI assistant/i.test(en.intro)||en.dir==='rtl')throw Error(name+' en '+JSON.stringify(en));
            await p.selectOption('#lang','ar');await p.waitForTimeout(900);const ar=await p.evaluate(()=>({intro:document.querySelector('#aiMessages .ai-msg.bot')?.textContent||'',dir:document.documentElement.dir}));if(ar.dir!=='rtl'||!/[\u0600-\u06ff]/.test(ar.intro))throw Error(name+' ar '+JSON.stringify(ar));
            console.log(name,'PASS',JSON.stringify(base));await b.close();
           }
           console.log('ALL CROSS DEVICE PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/audit.cjs

      - name: Final result
        run: echo 'R6 VISION + REAL VOICE + CROSS DEVICE FINAL PASS'
