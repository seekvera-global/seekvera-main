name: Apply robust same-language AI lock v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-language-lock-v4.yml'
      - '.github/scripts/fix_language_lock.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Worker language detection and lock
        run: python .github/scripts/fix_language_lock.py
      - name: Validate Worker
        run: |
          set -euo pipefail
          node --check worker.js
          grep -q 'async function detectedLanguage' worker.js
          grep -q 'LANGUAGE LOCK' worker.js
          grep -q "fast-chat-language-lock-v4" worker.js
      - name: Commit language lock
        run: |
          set -euo pipefail
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add worker.js
          if git diff --cached --quiet; then
            echo 'No Worker change required.'
          else
            git commit -m 'Lock AI replies to the user message language'
            git push origin main
          fi
