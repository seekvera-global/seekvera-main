name: SEEKVERA AI Vision runtime smoke once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vision-runtime-smoke-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build safe test image payload
        shell: python
        run: |
          import base64, json, struct, zlib
          w=h=32
          raw=b''.join(b'\x00'+b'\xff\xff\xff'*w for _ in range(h))
          def chunk(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          image='data:image/png;base64,'+base64.b64encode(png).decode()
          open('/tmp/vision.json','w').write(json.dumps({'image':image,'context':'plain white test image for runtime health only'}))

      - name: Diagnose live image moderation runtime
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 90 -o /tmp/vision-response.json -w '%{http_code}' \
            'https://seekvera-main.seekvera-global.workers.dev/api/vision' \
            -H 'content-type: application/json' \
            --data-binary @/tmp/vision.json)
          echo "Vision HTTP status: $code"
          cat /tmp/vision-response.json
          echo
          test "$code" = 200
          python - <<'PY'
          import json
          d=json.load(open('/tmp/vision-response.json'))
          assert d.get('ok') is True, d
          assert d.get('source') == 'ai-vision', d
          assert d.get('model') == '@cf/meta/llama-3.2-11b-vision-instruct', d
          PY
