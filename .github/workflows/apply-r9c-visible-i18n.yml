name: Apply SEEKVERA R9c visible translation fix

on:
  push:
    paths:
      - '.github/scripts/fix_r9c_visible_i18n.py'
      - '.github/workflows/apply-r9c-visible-i18n.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply R9c visible translation unification
        run: python .github/scripts/fix_r9c_visible_i18n.py
      - name: Validate R9c
        run: |
          set -euo pipefail
          node --check i18n-ui.js
          grep -q 'window.__SEEKVERA_R9_QUICK=QUICK' i18n-ui.js
          grep -q 'window.__SEEKVERA_R9_QUICK?.\[l\]' i18n-ui.js
          grep -q 'i18n-ui.js?v=20260924-final-r9c' index.html
          grep -q 'voice-ai.js?v=20260924-final-r9c' index.html
          grep -q 'seekvera-final-r9c-20260924' sw.js
          python - <<'PY'
          from pathlib import Path
          pages=[p for p in Path('.').glob('*.html') if 'i18n-ui.js' in p.read_text(encoding='utf-8') and not p.name.lower().startswith('google')]
          assert len(pages)>=44, len(pages)
          for p in pages:
              s=p.read_text(encoding='utf-8')
              assert 'i18n-ui.js?v=20260924-final-r9c' in s,p.name
          print('R9c localized page coverage:',len(pages))
          PY
      - name: Commit R9c app files
        run: |
          set -euo pipefail
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add i18n-ui.js sw.js ./*.html
          if git diff --cached --quiet; then
            echo 'No R9c app changes'
          else
            git commit -m 'Unify visible translations with primary i18n runtime R9c'
            git push origin HEAD:main
          fi
