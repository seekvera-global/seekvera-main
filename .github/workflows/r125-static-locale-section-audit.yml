name: R125 quota-neutral locale section audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r125-static-locale-section-audit.yml'
      - 'tools/r125_static_locale_section_audit.mjs'
      - 'tools/test-r125-static-locale-audit-exclusions.cjs'
      - 'tools/test-ui-translation-quota-session-guard.cjs'
      - 'i18n-r32/**'
      - 'i18n-r32-source.json'
      - 'locale-r15.js'
      - 'r32-i18n.js'
      - 'global-ui.js'
      - 'games.js'
      - 'superapp.js'
      - 'i18n-ui.js'
      - 'r85-visible-i18n.js'
      - 'locale-r14.js'
      - 'locale-r14-categories.js'
      - 'r20-final-guard.js'
      - 'r22-category-lock.js'
      - 'r24-ai-controller.js'
      - 'navigation.js'
      - 'voice-ai.js'
      - '*.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-r125-static-locale-audit
  cancel-in-progress: false

jobs:
  static-locale-section-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Wait for Pages to serve the audited locale assets
        env:
          SEEKVERA_BASE_URL: https://seekveraglobal.com
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl -fsSL --max-time 10 "$SEEKVERA_BASE_URL/index.html?locale_audit=20261117" -o /tmp/r125-index.html \
              && curl -fsSL --max-time 10 "$SEEKVERA_BASE_URL/games.html?locale_audit=20261117" -o /tmp/r125-games.html \
              && curl -fsSL --max-time 10 "$SEEKVERA_BASE_URL/global-ui.js?v=20261117-r125-source-caption-i18n-v2" -o /tmp/r125-global-ui.js \
              && curl -fsSL --max-time 10 "$SEEKVERA_BASE_URL/games.js?v=20261117-r125-game-title-i18n" -o /tmp/r125-games.js \
              && curl -fsSL --max-time 10 "$SEEKVERA_BASE_URL/i18n-ui.js?v=20261118-r125-global-quick-v15" -o /tmp/r125-i18n-ui.js \
              && grep -Fq 'global-ui.js?v=20261117-r125-source-caption-i18n' /tmp/r125-index.html \
              && grep -Fq 'games.js?v=20261117-r125-game-title-i18n' /tmp/r125-games.html \
              && grep -Fq 'i18n-ui.js?v=20261118-r125-global-quick-v15' /tmp/r125-index.html \
              && grep -Fq 'sv-control-caption-label' /tmp/r125-global-ui.js \
              && grep -Fq 'alreadyLocalizedValue' /tmp/r125-i18n-ui.js \
              && grep -Fq "'Sprachantwort'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Kembali'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Pamilihang pandaigdig na pinapagana ng AI'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'AI-stemmeassistent'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Sesebelisoa sa ho fumana Wi-Fi ea mahala kapa ea sechaba'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Sayfa gezintisi'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Назад'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Навигация по страницам'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Голосовой ответ'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Голос'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'واپس'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'صفحات پر نیویگیشن'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'صوتی جواب'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'آواز'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'سالانہ کاروباری منصوبہ'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'ماہانہ کاروباری منصوبہ'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'পেছনে'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'পৃষ্ঠা নেভিগেশন'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'কণ্ঠে উত্তর'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Quay lại'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Điều hướng trang'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Trả lời bằng giọng nói'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Giọng nói'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'ভয়েস'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Indietro'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Navigazione tra le pagine'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Risposta vocale'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Voce'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Rudi nyuma'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'بازگشت'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Wstecz'" /tmp/r125-i18n-ui.js \
