              && grep -Fq "'การตอบกลับด้วยเสียง'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'เสียง'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Bumalik'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Pag-navigate sa pahina'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Sagot sa boses'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Boses'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Πίσω'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Πλοήγηση σε σελίδα'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Απάντηση με φωνή'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Φωνή'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Înapoi'" /tmp/r125-i18n-ui.js \
