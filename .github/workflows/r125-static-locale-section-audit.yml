name: R125 quota-neutral locale section audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r125-static-locale-section-audit.yml'
      - 'tools/r125_static_locale_section_audit.mjs'
      - 'tools/test-r125-static-locale-audit-exclusions.cjs'
      - 'tools/test-ui-translation-quota-session-guard.cjs'
      - 'i18n-r32/**'
      - 'i18n-r32-source.json'
      - 'locale-r15.js'
      - 'r32-i18n.js'
      - 'global-ui.js'
      - 'games.js'
      - 'superapp.js'
      - 'i18n-ui.js'
      - 'r85-visible-i18n.js'
      - 'locale-r14.js'
      - 'locale-r14-categories.js'
      - 'r20-final-guard.js'
      - 'r22-category-lock.js'
      - 'r24-ai-controller.js'
      - 'navigation.js'
      - 'voice-ai.js'
      - '*.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekvera-r125-static-locale-audit-v5
  cancel-in-progress: false

jobs:
  static-locale-section-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Wait for Pages to serve the audited locale assets
        env:
          SEEKVERA_BASE_URL: https://seekveraglobal.com
        run: |
          set -euo pipefail
          GLOBAL_UI_REF=$(grep -oE 'global-ui\.js\?v=[^" ]+' index.html | head -n 1)
          GAMES_JS_REF=$(grep -oE 'games\.js\?v=[^" ]+' games.html | head -n 1)
          I18N_UI_REF=$(grep -oE 'i18n-ui\.js\?v=[^" ]+' index.html | head -n 1)
          for ref in "$GLOBAL_UI_REF" "$GAMES_JS_REF" "$I18N_UI_REF"; do
            if [[ -z "$ref" ]]; then echo R125_EXPECTED_ASSET_REF_MISSING; exit 1; fi
          done
          export R125_GLOBAL_UI_REF="$GLOBAL_UI_REF" R125_GAMES_JS_REF="$GAMES_JS_REF" R125_I18N_UI_REF="$I18N_UI_REF"
          fetch_assets() {
            node --input-type=module <<'NODE'
              import { chromium } from 'playwright';
              import { writeFile } from 'node:fs/promises';
              const base = process.env.SEEKVERA_BASE_URL || 'https://seekveraglobal.com';
              const browser = await chromium.launch({ headless: true });
              try {
                const context = await browser.newContext({
                  viewport: { width: 390, height: 844 },
                  locale: 'en-US',
                  serviceWorkers: 'block',
                  userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
                });
                await context.route('**/api/ai**', route => route.fulfill({ status: 503, contentType: 'application/json', body: '{"ok":false,"audit":"quota-neutral"}' }));
                await context.route('**/api/ui-translate**', route => route.fulfill({ status: 503, contentType: 'application/json', body: '{"ok":false,"audit":"quota-neutral"}' }));
                await context.route('https://text.pollinations.ai/**', route => route.fulfill({ status: 503, contentType: 'text/plain', body: 'quota-neutral static audit' }));
                const page = await context.newPage();
                const auditNonce = Date.now();
                await page.setExtraHTTPHeaders({ 'cache-control': 'no-cache', pragma: 'no-cache' });
                const home = await page.goto(base + `/index.html?locale_audit=20261120-r125-${auditNonce}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                if (!home) throw new Error('homepage response missing');
                const homeBody = await home.text();
                console.log('R125_BROWSER_HTTP index', home.status(), 'bytes=' + homeBody.length, 'cf-ray=' + (home.headers()['cf-ray'] || ''));
                if (home.status() !== 200) { console.error('R125_BROWSER_BODY index', homeBody.slice(0, 400)); throw new Error('homepage HTTP ' + home.status()); }
                await writeFile('/tmp/r125-index.html', homeBody, 'utf8');
                const assets = [
                  ['games_html', `/games.html?locale_audit=20261120-r125-${auditNonce}`, '/tmp/r125-games.html'],
                  ['seller_plans', `/seller-plans.html?locale_audit=20261120-plan-source-map&r125=${auditNonce}`, '/tmp/r125-seller-plans.html'],
                  ['global_ui', `/${process.env.R125_GLOBAL_UI_REF}&r125=${auditNonce}`, '/tmp/r125-global-ui.js'],
                  ['games_js', `/${process.env.R125_GAMES_JS_REF}&r125=${auditNonce}`, '/tmp/r125-games.js'],
                  ['i18n_ui', `/${process.env.R125_I18N_UI_REF}&r125=${auditNonce}`, '/tmp/r125-i18n-ui.js']
                ];
                for (const [name, path, file] of assets) {
                  const result = await page.evaluate(async target => {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 15000);
                    try {
                      const response = await fetch(target, { cache: 'no-store', credentials: 'same-origin', signal: controller.signal });
                      return { status: response.status, body: await response.text(), cfRay: response.headers.get('cf-ray') || '', server: response.headers.get('server') || '' };
                    } finally { clearTimeout(timeout); }
                  }, path);
                  console.log('R125_BROWSER_HTTP', name, result.status, 'bytes=' + result.body.length, 'cf-ray=' + result.cfRay, 'server=' + result.server);
                  if (result.status !== 200) { console.error('R125_BROWSER_BODY', name, result.body.slice(0, 400)); throw new Error(name + ' HTTP ' + result.status); }
                  await writeFile(file, result.body, 'utf8');
                }
                await context.close();
              } finally { await browser.close(); }
          NODE
          }
          for attempt in $(seq 1 36); do
            if fetch_assets \
              && grep -Fq "$GLOBAL_UI_REF" /tmp/r125-index.html \
              && grep -Fq "$GAMES_JS_REF" /tmp/r125-games.html \
              && grep -Fq "$I18N_UI_REF" /tmp/r125-index.html \
              && grep -Fq 'PLAN_NAME_SOURCE' /tmp/r125-seller-plans.html \
