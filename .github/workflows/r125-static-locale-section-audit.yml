              echo R125_LATEST_PAGES_ASSETS_READY
              exit 0
            fi
            sleep 5
          done
          echo R125_BROWSER_ASSET_READINESS_TIMEOUT >&2
          echo "R125_EXPECTED_GLOBAL_UI_REF=$GLOBAL_UI_REF" >&2
          echo "R125_EXPECTED_GAMES_JS_REF=$GAMES_JS_REF" >&2
          echo "R125_EXPECTED_I18N_UI_REF=$I18N_UI_REF" >&2
          for item in \
            "/tmp/r125-index.html|$GLOBAL_UI_REF" \
            "/tmp/r125-index.html|$I18N_UI_REF" \
            "/tmp/r125-games.html|$GAMES_JS_REF" \
            "/tmp/r125-seller-plans.html|PLAN_NAME_SOURCE" \
            "/tmp/r125-seller-plans.html|BILLING_PERIOD_SOURCE" \
            "/tmp/r125-global-ui.js|sv-control-caption-label" \
            "/tmp/r125-i18n-ui.js|alreadyLocalizedValue" \
            "/tmp/r125-games.js|<b><span data-no-translate>\${g.name}</span></b>"; do
            file="${item%%|*}"
            marker="${item#*|}"
            if [[ -f "$file" ]] && grep -Fq "$marker" "$file"; then
              echo "R125_ASSET_MARKER_PRESENT $file $marker" >&2
            else
              echo "R125_ASSET_MARKER_MISSING $file $marker" >&2
            fi
          done
          exit 1

