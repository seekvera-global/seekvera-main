              && grep -Fq "'Навигација по страницама'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Гласовни одговор'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Emuva'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Ukuzulazula kwamakhasi'" /tmp/r125-i18n-ui.js \
