              && grep -Fq "'Izwi'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Tilbage'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Sidenavigation'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Stemmesvar'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Stemme'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Khutlela morao'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Tsamaiso ea maqephe'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Karabo ea lentsoe'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Lentsoe'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Vissza'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Oldalnavigáció'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Hangos válasz'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Hang'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Lura'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Navigazzjoni tal-paġni'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Tweġiba bil-vuċi'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Vuċi'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Späť'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Navigácia stránok'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Hlasová odpoveď'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Hlas'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Tillbaka'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Sidnavigering'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Röstsvar'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Röst'" /tmp/r125-i18n-ui.js \
