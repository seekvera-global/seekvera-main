              && grep -Fq "'Sidenavigasjon'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Talesvar'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Stemme'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Terug'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Bladsynavigasie'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Stemantwoord'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Stem'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Geschäftssoftware'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Business Software'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Atgal'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Puslapių naršymas'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Atsakymas balsu'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Balsas'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Nazaj'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Navigacija po straneh'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Glasovni odgovor'" /tmp/r125-i18n-ui.js \
              && grep -Fq "'Glas'" /tmp/r125-i18n-ui.js \
              && grep -Fq '<b>${g.name}</b>' /tmp/r125-games.js \
              && ! grep -Fq 'data-no-translate>${g.name}' /tmp/r125-games.js; then
              echo R125_LATEST_PAGES_ASSETS_READY
              exit 0
            fi
            sleep 5
          done
          echo R125_LATEST_PAGES_ASSETS_TIMEOUT >&2
          exit 1

      - name: Syntax check quota-neutral audit
        run: |
          node --check tools/r125_static_locale_section_audit.mjs
          node --check i18n-ui.js

      - name: Verify quota guard and local quick labels
        run: node tools/test-ui-translation-quota-session-guard.cjs

      - name: Verify explicit no-translate audit triage
        run: node tools/test-r125-static-locale-audit-exclusions.cjs

      - name: Verify all locale packs, countries and sections without AI requests
        env:
          SEEKVERA_BASE_URL: https://seekveraglobal.com
        run: node tools/r125_static_locale_section_audit.mjs
