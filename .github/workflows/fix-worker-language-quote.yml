name: Fix worker multilingual prompt syntax

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-worker-language-quote.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix JavaScript apostrophe and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text(encoding='utf-8')
          bad="language of the user's latest message"
          good="language of the user\\'s latest message"
          if bad not in s:
              raise SystemExit('bad multilingual prompt text not found')
          p.write_text(s.replace(bad,good,1),encoding='utf-8')
          PY
          node --check worker.js
      - name: Commit fix
        run: |
          git config user.name 'seekvera-global'
          git config user.email 'seekvera.global@gmail.com'
          git add worker.js
          git commit -m 'Fix multilingual Worker prompt syntax'
          git push origin main
