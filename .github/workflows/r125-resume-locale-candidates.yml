name: R125 resume locale candidates safely

on:
  push:
    branches:
      - work/r125-locale-candidates-20261008
    paths:
      - docs/r125-resume-trigger.txt

permissions:
  contents: write

concurrency:
  group: r125-locale-candidate-resume
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/r125-locale-candidates-20261008
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local build dependencies
        run: python -m pip install --disable-pip-version-check Babel beautifulsoup4
      - name: Resume unpublished candidates and retain diagnostics
        shell: bash
        run: |
          set +e
          python tools/build_current_locale_delta.py --stage docs/locale-candidates-20261008 2>&1 | tee docs/locale-candidates-20261008/resume-latest.log
          code=${PIPESTATUS[0]}
          echo "$code" > docs/locale-candidates-20261008/resume-exit.txt
          exit 0
      - name: Save durable candidate checkpoint
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          root=pathlib.Path('docs/locale-candidates-20261008')
          progress=root/'progress.json'
          data=json.loads(progress.read_text()) if progress.exists() else {}
          data['checkpointUtc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          data['published']=False
          data['finalApproval']=False
          exit_file=root/'resume-exit.txt'
          if exit_file.exists(): data['resumeExitCode']=int(exit_file.read_text().strip())
          progress.write_text(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          git config user.name seekvera-global
          git config user.email 330572673+seekvera-global@users.noreply.github.com
          git add docs/locale-candidates-20261008
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint R125 locale candidate resume [skip ci]"
            git push origin HEAD:work/r125-locale-candidates-20261008
          fi
