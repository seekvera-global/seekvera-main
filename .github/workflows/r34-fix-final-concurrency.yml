name: R34 fix final audit concurrency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r34-fix-final-concurrency.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable cancel-in-progress for final audit
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/cancel-in-progress: true/cancel-in-progress: false/' .github/workflows/r32-static-final-audit.yml
          grep -q 'cancel-in-progress: false' .github/workflows/r32-static-final-audit.yml
          git config user.name 'SEEKVERA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/r32-static-final-audit.yml
          git commit -m 'CI: keep final audit running when duplicate dispatches occur'
          git push origin main
